name: TH03 OpenFOAM full-mesh qualification diagnostics

on:
  pull_request:
    branches:
      - feat/bfs-convergence-petsc-openfoam
    paths:
      - '.github/workflows/th03-openfoam-full-mesh.yml'
      - 'scripts/generate_th03_openfoam_blockmesh.py'
      - 'scripts/audit_th03_openfoam_mesh.py'
      - 'src/cfdx/**'
      - 'apps/production_solver/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: th03-openfoam-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      BUILD: build-th03-openfoam-full
      OUT: build-th03-openfoam-full/results
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-dev
          python -m pip install --upgrade pip
          python -m pip install -e . numpy

      - name: Build production solver
        run: |
          mkdir -p "$OUT"
          cmake -S . -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=ON \
            -DCFDX_ENABLE_MPI=OFF 2>&1 | tee "$OUT/configure.log"
          cmake --build "$BUILD" --target cfdx_production_solver --parallel 2 \
            2>&1 | tee "$OUT/build.log"

      - name: Generate OpenFOAM six-block full mesh and audit it
        run: |
          python scripts/generate_th03_openfoam_blockmesh.py \
            --resolution full \
            --max-iterations 300 \
            --output "$OUT/th03-openfoam-full.cfdx.h5" \
            2>&1 | tee "$OUT/mesh-generation.log"
          python scripts/audit_th03_openfoam_mesh.py \
            "$OUT/th03-openfoam-full.cfdx.h5" \
            --output "$OUT/mesh-audit.json" \
            2>&1 | tee "$OUT/mesh-audit.log"
          python - <<'PY'
          import h5py, json, os
          p=os.path.join(os.environ["OUT"],"th03-openfoam-full.cfdx.h5")
          with h5py.File(p,"r") as f:
              print(json.dumps({"n_cells":int(f.attrs["n_cells"]),
                                "n_faces":int(f.attrs["n_faces"]),
                                "mesh_source":str(f.attrs.get("mesh_source",""))},indent=2))
          PY

      - name: Run full-mesh SST calculation
        continue-on-error: true
        run: |
          set +e
          timeout 5400 "$BUILD/cfdx_production_solver" \
            --mesh "$OUT/th03-openfoam-full.cfdx.h5" \
            --output-dir "$OUT/full-sst" \
            --iterations 300 \
            --experimental-sst \
            --benchmark-export \
            2>&1 | tee "$OUT/full-sst.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$OUT/full-sst.exit-code"
          exit 0

      - name: Capture physical observables and convergence verdict
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["OUT"])
          run=root/"full-sst"
          report={"classification":"OPENFOAM_FULL_MESH_DIAGNOSTIC_NOT_QUALIFIED",
                  "mesh_cells":20540,"mesh_faces":82493,
                  "reference_xr_over_h":6.26,"reference_uncertainty":0.10,
                  "run_exit_code":(root/"full-sst.exit-code").read_text().strip()
                    if (root/"full-sst.exit-code").exists() else None}
          for name in ("convergence.json","benchmark_observables/summary.json",
                       "benchmark_observables/wall_shear.csv",
                       "benchmark_observables/cell_fields.csv"):
              p=run/name
              report[name]={"exists":p.exists(),"size":p.stat().st_size if p.exists() else 0}
              if p.exists() and p.suffix==".json":
                  try: report[name]["data"]=json.loads(p.read_text())
                  except Exception as e: report[name]["parse_error"]=str(e)
          (root/"physical-observables-index.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload full-mesh evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: th03-openfoam-full-mesh-${{ github.sha }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## TH-03 OpenFOAM full-mesh run" >> "$GITHUB_STEP_SUMMARY"
          echo "20,540-cell six-block OpenFOAM geometry reconstruction; diagnostic only." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$OUT/physical-observables-index.json" ]; then
            cat "$OUT/physical-observables-index.json" >> "$GITHUB_STEP_SUMMARY"
          fi
