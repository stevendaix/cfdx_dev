name: P0 diagnostics v2

on:
  push:
    branches: [ci/p0-diagnostic]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: p0-diagnostics
  cancel-in-progress: true

jobs:
  fix-branch:
    name: Diagnose fix branch (full fast CTest + focused)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ ccache zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-diag2-${{ runner.os }}-fix-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-Release-
      - name: Configure compiler cache
        run: |
          ccache --zero-stats
          ccache --max-size=1G
      - name: Install Python mesh/I/O stack (same as cfdx-ci)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -c "import yaml; print('pyyaml present', yaml.__version__)" 2>&1 || true
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF \
            -DPython3_EXECUTABLE=$PWD/.venv/bin/python \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --parallel 8 2>&1 | tee build.log
      - name: Run fast CTest
        id: ctest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --test-dir build -LE long --output-on-failure --no-tests=error --parallel 4 2>&1 | tee ctest.log
      - name: Focused reruns of failing tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          awk '/The following tests FAILED:/{flag=1;next} flag&&/^[[:space:]]*[0-9]+ - /{print;next} flag{exit}' ctest.log \
            | sed -E 's/^[[:space:]]*[0-9]+ - //; s/ \(.*//' \
            | while IFS= read -r name; do
                safe="${name//[^A-Za-z0-9_-.]/_}"
                ctest --test-dir build -R "^${name}$" --output-on-failure -V 2>&1 | tee "focused_${safe}.log" || true
              done
      - name: Post summary comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## P0 diagnostics v2 - fix branch `fix/t2-plug-carrier-viscosity`"
            echo ""
            echo "Commit: $GITHUB_SHA"
            if [[ -f build.log ]]; then grep -c "error:" build.log || true; fi
            if [[ -f ctest.log ]]; then
              echo ""
              echo "### ctest result"
              echo "```"
              tail -n 40 ctest.log
              echo "```"
            fi
          } > body.md
          gh pr comment 892 --repo stevendaix/cfdx_dev --body-file body.md
      - name: Post focused comments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in focused_*.log; do
            [[ -s "$f" ]] || continue
            name="${f#focused_}"; name="${name%.log}"
            {
              echo "## P0 diagnostics v2 - focused: `$name` (fix branch)"
              echo ""
              echo "### tail 320"
              echo "```"
              tail -n 320 "$f"
              echo "```"
            } > body.md
            gh pr comment 892 --repo stevendaix/cfdx_dev --body-file body.md
          done
  master-control:
    name: Diagnose master control (focused T2 + n10)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ ccache zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-diag2-${{ runner.os }}-master-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-Release-
      - name: Configure compiler cache
        run: |
          ccache --zero-stats
          ccache --max-size=1G
      - name: Install Python mesh/I/O stack (same as cfdx-ci)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -c "import yaml; print('pyyaml present', yaml.__version__)" 2>&1 || true
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF \
            -DPython3_EXECUTABLE=$PWD/.venv/bin/python \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --parallel 8 2>&1 | tee build.log
      - name: Focused T2 (master)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --test-dir build -R "^test_production_energy_stage_vv$" --output-on-failure -V 2>&1 | tee focused_t2_master.log || true
      - name: Focused n10 (master)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --test-dir build -R "^test_n10_qualification$" --output-on-failure -V 2>&1 | tee focused_n10_master.log || true
      - name: Post control comments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in focused_t2_master.log focused_n10_master.log; do
            [[ -s "$f" ]] || continue
            {
              echo "## P0 diagnostics v2 - control on master HEAD: `$f`"
              echo ""
              echo "### tail 250"
              echo "```"
              tail -n 250 "$f"
              echo "```"
            } > body.md
            gh pr comment 892 --repo stevendaix/cfdx_dev --body-file body.md
          done
