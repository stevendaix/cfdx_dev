name: Temporary Ruff autofix for PR 1193

on:
  push:
    branches:
      - physics/bfs-v6-hilo-rhie-chow-production

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.1
      - name: Apply safe lint fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          mapfile -t files < <(git diff --name-only origin/master...HEAD -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files."
            exit 0
          fi
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            git commit -m "style: apply Ruff fixes to PR Python files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
