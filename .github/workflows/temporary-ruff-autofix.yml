name: Temporary Ruff autofix for PR 1193

on:
  push:
    branches:
      - physics/bfs-v6-hilo-rhie-chow-production

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply safe Ruff fixes and formatting to PR Python changes
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.5
          git fetch origin master
          mapfile -d '' files < <(git diff --name-only -z origin/master...HEAD -- '*.py')
          if (("${#files[@]}" == 0)); then
            echo "No changed Python files"
            exit 0
          fi
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
          if git diff --quiet; then
            echo "No automatic Ruff changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: apply safe Ruff autofixes [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
