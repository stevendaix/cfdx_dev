name: Temporary PR1190 Ruff verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'fix/naca-bc-coupled-qualification-portfolio-2026-11-08' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Verify Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade ruff
          git fetch origin master
          mapfile -t files < <(git diff --name-only origin/master...HEAD -- '*.py')
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
