name: CFDX CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: cfdx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configure-build-test:
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'validation-total') &&
          '["Release"]' || '["Release", "DebugSanitizers"]'
          ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Install Python mesh I/O stack
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py pytest gmsh
          .venv/bin/python -c "import gmsh; print(\"Gmsh Python binding:\", gmsh.__version__)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCFDX_ENABLE_LONG_VALIDATION=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 4 --verbose 2>&1 | tee build.log

      - name: Diagnose compilation failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "=== Compiler/linker diagnostics ==="
          grep -E -B2 -A4 'error:|fatal error:|undefined reference|collect2: error|FAILED:' build.log | tail -n 250 || true
          echo
          echo "=== Failed build commands ==="
          grep -E 'FAILED:|ninja: build stopped|g\+\+|c\+\+|clang\+\+|nvcc' build.log | tail -n 120 || true

      - name: Run CTest (collect all failures; fail only at final gate)
        id: ctest
        continue-on-error: true
        run: |
          set +e
          ctest --test-dir build -LE long --output-on-failure --no-tests=error
          rc=$?
          echo "CTEST_EXIT_CODE=$rc" | tee ctest.exitcode
          exit $rc
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1

      - name: Test validation report generator
        id: validation_report_test
        if: matrix.build_type == 'Release'
        continue-on-error: true
        run: python -m pytest -q tests/python/test_validation_report.py

      - name: Print validation diagnostics before final decision
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "=== Validation diagnostic summary ==="
          if [[ -f ctest.exitcode ]]; then cat ctest.exitcode; fi
          if [[ -f build/Testing/Temporary/LastTest.log ]]; then
            echo "=== LastTest.log (tail) ==="
            tail -n 500 build/Testing/Temporary/LastTest.log
          fi
          echo "=== Poiseuille diagnostic marker ==="
          grep -R -E 'POISEUILLE_VALIDATION:|FAILURES \\(complete list\\):|Poiseuille observed order' build/Testing build 2>/dev/null | tail -n 250 || true

      - name: Upload test logs on failure
        if: ${{ !cancelled() && (steps.build.outcome != 'success' || steps.ctest.outcome != 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.build_type }}-logs
          path: |
            build/Testing/
            build/**/*.log
          if-no-files-found: ignore

      - name: Upload compile database
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: build/compile_commands.json
          if-no-files-found: error

      - name: Final CI gate (fail only after diagnostics/artifacts)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          build_outcome='${{ steps.build.outcome }}'
          ctest_outcome='${{ steps.ctest.outcome }}'
          validation_report_outcome='${{ steps.validation_report_test.outcome }}'
          echo "build outcome: $build_outcome"
          echo "ctest outcome: $ctest_outcome"
          echo "validation report test outcome: $validation_report_outcome"
          if [[ "$build_outcome" != "success" || "$ctest_outcome" != "success" ]]; then
            echo "CFDX CI FINAL DECISION: FAIL"
            exit 1
          fi
          if [[ '${{ matrix.build_type }}' == 'Release' &&
                "$validation_report_outcome" != "success" ]]; then
            echo "CFDX CI FINAL DECISION: FAIL"
            exit 1
          fi
          echo "CFDX CI FINAL DECISION: PASS"
