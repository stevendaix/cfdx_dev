name: PR1124 CI oracle (ruff precommit + Release fast ctest) (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/pr1124_ci_oracle_marker.txt'
      - '.github/workflows/pr1124-ci-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ruff-oracle:
    name: ruff-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVID: diag-evidence/logs
      PR_HEAD: 8d1bf4bcc1e18629857647946e3b31895dc44338
      STAMP: 2026-10-25-c1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned PR refs and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add "$RUNNER_TEMP/ref" "$PR_HEAD"
          cd "$RUNNER_TEMP/ref"
          PR_BASE=$(git merge-base origin/master "$PR_HEAD")
          echo "PR_BASE=$PR_BASE" | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_base_$STAMP.txt"
          git log -1 --format='%H %s' | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_head_$STAMP.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff (same as CI Pre-commit job)
        run: |
          python -m pip install --upgrade pre-commit ruff
          {
            echo "ruff: $(ruff --version)"
            echo "pre-commit: $(pre-commit --version)"
          } | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_versions_$STAMP.txt"

      - name: Changed Python files in PR range (same as CI)
        run: |
          cd "$RUNNER_TEMP/ref"
          PR_BASE=$(git merge-base origin/master "$PR_HEAD")
          git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py' | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_files_$STAMP.txt"

      - name: Run exact CI pre-commit command (verbatim capture)
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ref"
          PR_BASE=$(git merge-base origin/master "$PR_HEAD")
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          {
            echo "files: $python_files"
            pre-commit run --files $python_files --show-diff-on-failure
            echo "pre-commit exit code: $?"
          } > "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_precommitrun_$STAMP.log" 2>&1

      - name: Diagnose ruff findings on pinned PR head (no fix)
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ref"
          PR_BASE=$(git merge-base origin/master "$PR_HEAD")
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          ruff check --no-cache $python_files > "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_ruffcheck_$STAMP.log" 2>&1
          echo "ruff check exit code: $?" >> "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_ruffcheck_$STAMP.log"
          ruff format --check --no-cache $python_files > "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_ruffformatcheck_$STAMP.log" 2>&1
          echo "ruff format exit code: $?" >> "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_ruffformatcheck_$STAMP.log"

      - name: Apply ruff check --fix then ruff format (canonicalize)
        run: |
          cd "$RUNNER_TEMP/ref"
          PR_BASE=$(git merge-base origin/master "$PR_HEAD")
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          ruff check --fix --no-cache $python_files 2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_rufffix_$STAMP.log" || true
          ruff format --no-cache $python_files 2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_ruffformatwrite_$STAMP.log" || true

      - name: Capture canonical fixed files and applied diff
        run: |
          cd "$RUNNER_TEMP/ref"
          git --no-pager diff | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_applieddiff_$STAMP.patch"
          PR_BASE=$(git merge-base origin/master "$PR_HEAD")
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          for f in $python_files; do
            cp "$f" "$GITHUB_WORKSPACE/$EVID/pr1124_fixed_$(basename "$f" | tr '/' '_')"
          done

      - name: Verify canonical content passes all Pre-commit hooks
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ref"
          PR_BASE=$(git merge-base origin/master "$PR_HEAD")
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          {
            echo "== ruff check (after fix) =="
            ruff check --no-cache $python_files 2>&1 && echo "RUFF_CHECK_GREEN" || echo "RUFF_CHECK_RED"
            echo "== ruff format --check (after fix) =="
            ruff format --check --no-cache $python_files 2>&1 && echo "RUFF_FORMAT_GREEN" || echo "RUFF_FORMAT_RED"
            echo "== full pre-commit run (after fix) =="
            pre-commit run --files $python_files 2>&1 && echo "PRECOMMIT_GREEN" || echo "PRECOMMIT_RED"
          } | tee "$GITHUB_WORKSPACE/$EVID/pr1124_oracle_postfix_verify_$STAMP.log"

      - name: Write meta
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "pr=1124"
            echo "pr_head=$PR_HEAD"
            echo "job=ruff-oracle"
          } > "$E/pr1124_oracle_meta_$STAMP.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: PR 1124 ruff precommit oracle evidence (2026-10-25 c1) [ci skip]"
            (git push || (git pull --rebase && git push))
          fi

  release-oracle:
    name: release-fast-ctest-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EVID: diag-evidence/logs
      PR_HEAD: 8d1bf4bcc1e18629857647946e3b31895dc44338
      STAMP: 2026-10-25-c1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned PR head into worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add "$RUNNER_TEMP/ref" "$PR_HEAD"
          cd "$RUNNER_TEMP/ref"
          git log -1 --format='%H %s' | tee "$GITHUB_WORKSPACE/$EVID/pr1124_release_head_$STAMP.txt"

      - name: Install dependencies (same as CI Release job)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ ccache zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Configure (same flags as CI Release)
        run: |
          cd "$RUNNER_TEMP/ref"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr1124_release_configure_$STAMP.log"

      - name: Build (same as CI)
        run: |
          cd "$RUNNER_TEMP/ref"
          set -o pipefail
          cmake --build build --parallel 8 2>&1 | tee build.log
          {
            echo "== build errors if any =="
            grep -E -B2 -A4 'error:|fatal error:|undefined reference|collect2: error|FAILED:' build.log | tail -n 120 || echo "no build errors"
          } > "$GITHUB_WORKSPACE/$EVID/pr1124_release_builderrors_$STAMP.log"

      - name: CTest inventory (count tests)
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ref"
          {
            echo "== ctest -N (all tests) =="
            ctest --test-dir build -N 2>&1 | tail -n 15
            echo "== ctest -N -LE long =="
            ctest --test-dir build -N -LE long 2>&1 | tail -n 15
          } | tee "$GITHUB_WORKSPACE/$EVID/pr1124_release_ctestinventory_$STAMP.log"

      - name: Run exact CI fast CTest command
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ref"
          {
            ctest --test-dir build -LE long --output-on-failure --no-tests=error --parallel 4
            echo "ctest exit code: $?"
          } > "$GITHUB_WORKSPACE/$EVID/pr1124_release_fastctest_$STAMP.log" 2>&1

      - name: LastTest.log diagnostics
        if: always()
        run: |
          cd "$RUNNER_TEMP/ref"
          if [ -f build/Testing/Temporary/LastTest.log ]; then
            tail -n 600 build/Testing/Temporary/LastTest.log > "$GITHUB_WORKSPACE/$EVID/pr1124_release_lasttest_$STAMP.log"
          else
            echo "NO LastTest.log" > "$GITHUB_WORKSPACE/$EVID/pr1124_release_lasttest_$STAMP.log"
          fi
          ls -la build/Testing/Temporary/ >> "$GITHUB_WORKSPACE/$EVID/pr1124_release_lasttest_$STAMP.log" 2>&1 || true

      - name: Write meta
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "pr=1124"
            echo "pr_head=$PR_HEAD"
            echo "job=release-oracle"
          } > "$E/pr1124_release_meta_$STAMP.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: PR 1124 release fast ctest oracle evidence (2026-10-25 c1) [ci skip]"
            (git push || (git pull --rebase && git push))
          fi
