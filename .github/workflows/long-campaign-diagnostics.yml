name: Long-campaign diagnostics

# Diagnostic-only workflow (pattern #894/#901): the branch that carries this
# file is NEVER merged. It rebuilds the validation suite exactly like the
# `prepare` job of cfdx-validation.yml, runs every label-long test one by one
# with its own log, and publishes the failure evidence three ways:
#   1. committed to the branch under diag-evidence/ (readable via the API,
#      immune to any posting failure — paths-ignore prevents re-trigger),
#   2. as a workflow artifact (if: always()),
#   3. as a best-effort issue comment on #870 (never fails the job).
# Run #1 (3b248a1) lost its evidence: the compose step failed with exit 2
# before any channel survived. This hardening guarantees the evidence exists.

on:
  push:
    branches:
      - ci/long-campaign-diagnostics
    # diag-evidence/** : the bot's evidence commits never re-trigger. Workflow-only
    # pushes (e.g. the n9-negative-trace measurement workflow, #913) must not
    # launch the full multi-hour campaign.
    paths-ignore:
      - 'diag-evidence/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: long-campaign-diagnostics
  cancel-in-progress: true

env:
  BUILD_DIR: build-diag
  VENV_DIR: .venv-diag

jobs:
  long-diagnostics:
    name: Rebuild and capture long-campaign failures
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ jq curl \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python dependencies
        run: |
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml
          "$VENV_DIR/bin/python" -m pip install -e .

      - name: Configure validation build
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/$VENV_DIR/bin/python"

      - name: Build validation suite
        run: cmake --build "$BUILD_DIR" --parallel 2

      - name: Generate long-validation mesh fixtures
        run: |
          "$VENV_DIR/bin/python" scripts/generate_2d_validation_meshes.py all --output-dir "$BUILD_DIR/validation_meshes"
          for mesh in \
            channel_n16.h5 channel_n32.h5 channel_n64.h5 \
            bfs_re200_n16.h5 bfs_re200_n32.h5 bfs_re200_n64.h5 \
            naca0012_laminar_n64.h5 naca0012_laminar_n128.h5 naca0012_laminar_n256.h5; do
            test -s "$BUILD_DIR/validation_meshes/$mesh" || {
              echo "::error::required validation mesh missing after generation: $mesh"
              exit 1
            }
          done

      - name: Enumerate label-long tests (known failures first)
        run: |
          ctest --test-dir "$BUILD_DIR" -N -L long > /tmp/long-list.txt 2>&1 || true
          cat /tmp/long-list.txt
          sed -E 's/^ *Test #[0-9]+: *//' /tmp/long-list.txt \
            | grep -vE '^$|^Total' | sort -u > /tmp/all-tests.txt
          {
            printf '%s\n' \
              test_n12_coupled_pressure_velocity_mms \
              test_channel_qualification \
              test_naca0012_qualification \
              test_bfs_qualification \
              test_vmfl036_axisymmetric \
              test_ghia_cavity_n8_pcd \
              test_n11_conservation_boundedness
            cat /tmp/all-tests.txt
          } | awk '!seen[$0]++' > /tmp/long-tests.txt
          echo "--- tests a jouer ($(wc -l < /tmp/long-tests.txt)) ---"
          cat /tmp/long-tests.txt

      - name: Run each long test individually and capture evidence
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diag-logs
          : > diag-summary.tsv
          : > /tmp/failing.txt
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            safe=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_')
            echo "=== running $name ==="
            if ctest --test-dir "$BUILD_DIR" -L long -R "^$name$" -V > "diag-logs/$safe.log" 2>&1; then
              status=PASS
            else
              status=FAIL
              printf '%s\t%s\n' "$name" "$safe" >> /tmp/failing.txt
            fi
            printf '%s\t%s\n' "$name" "$status" >> diag-summary.tsv
          done < /tmp/long-tests.txt
          echo "--- summary ---"
          cat diag-summary.tsv

      - name: Commit evidence to the diagnostic branch (primary channel)
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diag-evidence/logs
          cp diag-summary.tsv diag-evidence/ 2>/dev/null || true
          cp diag-logs/*.log diag-evidence/logs/ 2>/dev/null || true
          RUNID="$GITHUB_RUN_ID"
          {
            echo "# Long-campaign diagnostics evidence — run $RUNID"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- config: MPI ON, LONG_VALIDATION ON, parallel HDF5, Release"
            echo
            echo "## Summary (diag-summary.tsv)"
            echo
            echo '| test | verdict |'
            echo '|---|---|'
            awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' diag-summary.tsv 2>/dev/null || true
            echo
            while IFS=$'\t' read -r name safe; do
              [ -n "$name" ] || continue
              log="diag-logs/$safe.log"
              [ -s "$log" ] || continue
              echo "## $name"
              echo
              echo '~~~'
              grep -nE 'FAIL|Failed|failed|Error|error|Exit Code|exit code|mismatch|gate|tolerance|worst|exceed|Exceed|assert' "$log" 2>/dev/null | head -n 35 || true
              echo "---- (30 dernieres lignes du log) ----"
              tail -n 30 "$log" 2>/dev/null || true
              echo '~~~'
              echo
            done < /tmp/failing.txt 2>/dev/null || true
          } > "diag-evidence/run-$RUNID.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-evidence 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no evidence change to commit"
          else
            git commit -m "diag(evidence): run $RUNID [ci skip]" 2>/dev/null || true
            git push origin "HEAD:$GITHUB_REF_NAME" 2>&1 || echo "::warning::evidence push failed (artifact/comment remain)"
          fi
          exit 0

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-campaign-diag-logs
          path: |
            diag-logs/
            diag-summary.tsv
          if-no-files-found: warn
          retention-days: 30

      - name: Compose and post evidence to issue #870 (best effort)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          {
            echo "## Long-campaign diagnostics — preuves (pattern #894/#901, branche de diagnostic, jamais merger)"
            echo
            echo "Run : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "HEAD diagnostic : $GITHUB_SHA (contenu = master aa806657 + PR #902)"
            echo "Preuve complete : diag-evidence/run-$GITHUB_RUN_ID.md sur la branche ci/long-campaign-diagnostics + artefact long-campaign-diag-logs"
            echo
            echo "| test | verdict |"
            echo "|---|---|"
            awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' diag-summary.tsv 2>/dev/null || true
            echo
            while IFS=$'\t' read -r name safe; do
              [ -n "$name" ] || continue
              log="diag-logs/$safe.log"
              [ -s "$log" ] || continue
              echo "### $name"
              echo '~~~'
              grep -nE 'FAIL|Failed|failed|Error|error|Exit Code|exit code|mismatch|gate|tolerance|worst|exceed|Exceed|assert' "$log" 2>/dev/null | head -n 35 || true
              echo "---- (30 dernieres lignes du log) ----"
              tail -n 30 "$log" 2>/dev/null || true
              echo '~~~'
              echo
            done < /tmp/failing.txt 2>/dev/null || true
          } > /tmp/comment.md 2>/dev/null || true
          cp /tmp/comment.md /tmp/comment-final.md 2>/dev/null || echo "(no evidence composed)" > /tmp/comment-final.md
          size=$(wc -c < /tmp/comment.md 2>/dev/null || echo 58000)
          if [ "$size" -gt 58000 ]; then
            head -c 58000 /tmp/comment.md > /tmp/comment-final.md 2>/dev/null || true
            echo '(commentaire tronque a 58000 caracteres)' >> /tmp/comment-final.md
          fi
          jq -n --rawfile body /tmp/comment-final.md '{body: $body}' > /tmp/payload.json 2>/dev/null || true
          http=$(curl -sS --fail-with-body -o /tmp/curl-out.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/870/comments" \
            -d @/tmp/payload.json) 2>/tmp/curl-err.txt
          if [ "$http" = "201" ]; then
            echo "POST to #870: 201 created"
          else
            echo "::warning::POST to #870 returned '$http' — falling back to gh api"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/870/comments" \
              -F body="$(cat /tmp/comment-final.md)" 2>&1 | head -c 300 || true
          fi
          head -c 300 /tmp/curl-err.txt 2>/dev/null || true
          exit 0
