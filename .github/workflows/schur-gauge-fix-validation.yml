name: Schur pressure gauge fix validation

# Production fix branch for issue #663 (not a diag/* branch): the
# repository's standing workflows only trigger on master/main/develop,
# so this branch carries its own validation gate. It builds and runs the
# Schur/coupled-qualification subset affected by the gauge correction,
# including the extended test_n9_common_schur_qualification (blocking
# catastrophe guards, unit falsification of the row+column gauge
# semantics, end-to-end LSC/BFBt interior-reference and fixed-pressure
# cases). Evidence is committed back to the branch; paths-ignore keeps
# the evidence commit from re-triggering this workflow.
#
# The build step now also captures its full output: the first two runs
# of this workflow failed inside the build step with no retained log
# (job logs require admin rights on this repository), so the committed
# build log is the only way to diagnose a compile error from outside.
#
# v2 (build-config fix, NO solver/test change): run 3's committed build
# log shows a DETERMINISTIC failure at [19/64] in hdf5_writer.cpp:
# /usr/include/hdf5/openmpi/H5public.h includes <mpi.h>, but this
# workflow configured CFDX_ENABLE_MPI=OFF while the runner has the
# openmpi-flavoured HDF5 dev package installed. FindHDF5 therefore
# resolves the openmpi headers without any MPI include path. The
# configure now mirrors the flags proven to build in the fix4b/fix4c
# workflows (MPI ON + parallel HDF5 ON + openmpi dev packages): the
# earlier "transient runner failure" hypothesis is refuted.
#
# v3 (gate-honesty fix, NO solver/test/threshold change): run #4 exposed
# a false green. The ctest step piped into tee WITHOUT pipefail, so the
# step exit code was tee's (0), steps.tests.outcome == 'success', and
# the Final gate passed vacuously while the committed output log showed
# 175 - test_n9_common_schur_qualification FAILED. The build step
# already had 'set -o pipefail' for exactly this reason; the ctest step
# now sets it too, so the gate actually fails when ctest fails.

on:
  workflow_dispatch:
  push:
    branches: [fix/schur-pressure-gauge]
    paths-ignore:
      - 'schur-gauge-fix-output.log'
      - 'schur-gauge-fix-build.log'

permissions:
  contents: write

jobs:
  validate:
    name: Schur gauge validation subset
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build affected test targets
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            test_n9_common_schur_qualification \
            test_n9_s10_pressure_reference_policies \
            test_n9_s9_rhie_chow_consistency \
            test_n9_negative_diagnostics \
            test_n9_physical_matrix \
            test_n9_schur_oracle \
            test_exact_schur \
            test_simplerc_schur \
            test_lsc_bfbt_schur \
            test_lsc_bfbt_schur_null_space \
            test_pcd_schur \
            test_schur_approximation_comparison \
            test_schur_quantitative_qualification \
            test_coupled_schur_selection \
            test_coupled_block_schur_amg \
            test_n8_schur_production_benchmark \
            test_n8_schur_representative_cfd \
            test_n8_schur_complete_krylov \
            test_steady_incompressible_solver \
            2>&1 | tee schur-gauge-fix-build.log

      - name: Run Schur gauge validation subset
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R 'test_n9_common_schur_qualification|test_n9_s10_pressure_reference_policies|test_n9_s9_rhie_chow_consistency|test_n9_negative_diagnostics|test_n9_physical_matrix|test_n9_schur_oracle|test_exact_schur|test_simplerc_schur|test_lsc_bfbt_schur|test_lsc_bfbt_schur_null_space|test_pcd_schur|test_schur_approximation_comparison|test_schur_quantitative_qualification|test_coupled_schur_selection|test_coupled_block_schur_amg|test_n8_schur_production_benchmark|test_n8_schur_representative_cfd|test_n8_schur_complete_krylov|test_steady_incompressible_solver' \
            2>&1 | tee schur-gauge-fix-output.log

      - name: Commit evidence to fix branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch schur-gauge-fix-build.log schur-gauge-fix-output.log
          git add schur-gauge-fix-build.log schur-gauge-fix-output.log
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci(schur-gauge): capture validation subset logs [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Final gate
        if: always()
        run: |
          [[ "${{ steps.build.outcome }}" == "success" ]] || exit 1
          [[ "${{ steps.tests.outcome }}" == "success" ]] || exit 1
