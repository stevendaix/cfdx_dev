name: NACA0012 SIMPLEC operator-consistency fix

# DIAG (temporary branch, never merged): first SIMPLEC repair round, driven
# by the variants-matrix verdicts (naca-algos-variants-output.log):
#   1. Frozen continuity floor 4.33475e-05 (SIMPLEC 0.6/0.25 n64, 8000
#      iterations, momentum_residual 8e-12, machine-zero state changes):
#      the prescribed-pressure (farfield) Dirichlet rows of the pressure
#      correction equation used the plain rAU operator while the
#      authoritative Rhie-Chow flux is rebuilt with the SIMPLEC consistent
#      rAtU. At the fixed point the audit carries, per farfield Dirichlet
#      face, rho*V*(rAU_e - rAtU_e)*(p_b - p_o)*(Sf.e)/d. Fix: the
#      Dirichlet row now uses the same algorithm-consistent coefficient.
#   2. simplec_consistent_diagonal threw at alpha_u=1 on
#      diffusion-dominated rows (A_P == sum(a_PN) exactly). Fix: bounded
#      variant floors the denominator at kappa*A_P (kappa=0.1, i.e.
#      rAtU <= 10*rAU) and audits how often the floor binds per iteration.
#   3. The pressure-solve failure message truncated the residual to six
#      fixed decimals ("residual=0.000000"); scientific notation now.
# Gates unchanged. New workflow filename guarantees the push triggers it.

on:
  workflow_dispatch:
  push:
    branches: [diag/naca-simplec-fix1]

permissions:
  contents: write

jobs:
  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: simple-anchor-control, model: SIMPLE,  au: "0.6", ap: "0.25", levels: "1", trace: "5" }
          - { name: simplec-baseline-fix,   model: SIMPLEC, au: "0.6", ap: "0.25", levels: "1", trace: "5" }
          - { name: simplec-3level,         model: SIMPLEC, au: "0.6", ap: "0.25", levels: "3", trace: "5" }
          - { name: simplec-canonical-fix,  model: SIMPLEC, au: "1.0", ap: "1.0",  levels: "1", trace: "5" }
          - { name: simplec-ap1-fix,        model: SIMPLEC, au: "0.6", ap: "1.0",  levels: "1", trace: "5" }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-naca
          .venv-naca/bin/python -m pip install --upgrade pip
          .venv-naca/bin/python -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh

      - name: Generate NACA0012 O-grid meshes (n64/n128/n256)
        run: |
          mkdir -p build-naca/validation_meshes
          .venv-naca/bin/python scripts/generate_2d_validation_meshes.py naca0012 \
            --output-dir build-naca/validation_meshes

      - name: Configure (Release, long validation ON)
        run: |
          cmake -S . -B build-naca -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/.venv-naca/bin/python"

      - name: Build test_naca0012_qualification
        run: cmake --build build-naca --target test_naca0012_qualification --parallel 2

      - name: Run variant ${{ matrix.name }}
        run: |
          set -o pipefail
          ./build-naca/test_naca0012_qualification \
            --model ${{ matrix.model }} \
            --alphau ${{ matrix.au }} \
            --alphap ${{ matrix.ap }} \
            --levels ${{ matrix.levels }} \
            --trace ${{ matrix.trace }} \
            --coupleddiag 0 \
            build-naca/validation_meshes/naca0012_laminar_n64.h5 \
            build-naca/validation_meshes/naca0012_laminar_n128.h5 \
            build-naca/validation_meshes/naca0012_laminar_n256.h5 \
            2>&1 | tee naca-variant-${{ matrix.name }}.log

      - name: Upload variant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naca-variant-logs-${{ matrix.name }}
          path: naca-variant-${{ matrix.name }}.log
          if-no-files-found: warn

  aggregate:
    name: Aggregate and commit combined log
    needs: [variant]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all variant logs
        uses: actions/download-artifact@v4
        with:
          path: variant-logs
          pattern: naca-variant-logs-*
          merge-multiple: true

      - name: Assemble combined log
        run: |
          : > naca-simplec-fix1-output.log
          for v in simple-anchor-control simplec-baseline-fix simplec-3level simplec-canonical-fix simplec-ap1-fix; do
            if [ -f "variant-logs/naca-variant-$v.log" ]; then
              echo "NACA_VARIANT_BEGIN $v" >> naca-simplec-fix1-output.log
              cat "variant-logs/naca-variant-$v.log" >> naca-simplec-fix1-output.log
              echo "NACA_VARIANT_END $v" >> naca-simplec-fix1-output.log
            else
              echo "NACA_VARIANT_MISSING variant=$v" >> naca-simplec-fix1-output.log
            fi
          done

      - name: Commit combined log to diagnostic branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naca-simplec-fix1-output.log
          git commit -m "diag(naca0012): capture SIMPLEC fix1 matrix log [skip ci]"
          git pull --rebase --autostash || true
          git push
