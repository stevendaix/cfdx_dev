name: Debug precommit range

on:
  pull_request

jobs:
  debug:
    name: Debug precommit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: python -m pip install --upgrade pre-commit ruff

      - name: Diagnose
        shell: bash
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}
        run: |
          set -uo pipefail
          echo "::error::RUFFVER $(ruff --version)"
          echo "::error::RANGE $CFDX_PRECOMMIT_RANGE"
          mapfile -t python_files < <(git diff --name-only "$CFDX_PRECOMMIT_RANGE" -- '*.py')
          echo "::error::PYFILES(${#python_files[@]}) $(printf '%s ' "${python_files[@]}")"
          mapfile -t all_files < <(git diff --name-only "$CFDX_PRECOMMIT_RANGE")
          all_list=$(printf '%s ' "${all_files[@]}")
          echo "::error::ALLFILES(${#all_files[@]}) ${all_list:0:400}"
          for f in "${python_files[@]}"; do
            if ruff format --check "$f" >/dev/null 2>&1; then
              echo "::error::FMT_OK $f"
            else
              d=$(ruff format --diff "$f" 2>&1 || true)
              d=$(printf '%s' "$d" | tr '\n' '~')
              echo "::error::FMT_DIFF $f: ${d:0:400}"
            fi
            c=$(ruff check "$f" 2>&1 || true)
            case "$c" in
              *"All checks passed"*) ;;
              *) c=$(printf '%s' "$c" | tr '\n' '~'); echo "::error::CHK $f: ${c:0:300}";;
            esac
          done
          pc=$(pre-commit run --files "${python_files[@]}" 2>&1 || true)
          pcs=$(printf '%s' "$pc" | tr '\n' '~')
          echo "::error::PRECOMMIT ${pcs:0:450}"
          {
            echo "## Pre-commit diagnostic"
            echo
            echo "- ruff: $(ruff --version)"
            echo "- range: $CFDX_PRECOMMIT_RANGE"
            echo
            echo "### pre-commit output"
            echo '~~~'
            printf '%s\n' "$pc"
            echo '~~~'
            for f in "${python_files[@]}"; do
              echo
              echo "### ruff format --diff $f"
              echo '~~~diff'
              ruff format --diff "$f" 2>&1 || true
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"
