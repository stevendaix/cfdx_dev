name: PR 1146 round4 repair (diag)

# DIAG-ONLY - branche ci/long-campaign-diagnostics (PR #903, JAMAIS merger).
# Round 4 : idem round 3 (restaurer les 3 fichiers python corrompus par des
# placeholders MSL depuis les canonicals round 1, commit 9ffb69b2) avec :
# evidence commitee TOT (apres checkout) et a chaque etape (chaque push [ci skip]),
# ruff auto-reparant (check --fix + format), gate sur l'etat final.
on:
  push:
    branches: [ci/long-campaign-diagnostics]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1146-diag
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs/pr1146
  PR1146_HEAD: e41f7cfce20681540a914ffe07341e3ed24c9a19
  CANON_COMMIT: 9ffb69b21148c02e0935154322eea9362b132035
  PR_BRANCH: fix/p0-p1-physical-guards-wall-forces

jobs:
  repair:
    name: round4 restore canonical python files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WDIR: /tmp/pr1146_wt4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evidence 0 - early commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "purpose=round4 repair, early evidence"
            echo "pr1146_head=$PR1146_HEAD"
            echo "canonical_source=$CANON_COMMIT"
            date -u
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_round4_meta_run$GITHUB_RUN_ID.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          git commit -m "diag: pr1146 round4 meta run $GITHUB_RUN_ID [ci skip]"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Resolve pins and worktree
        run: |
          git cat-file -e "$PR1146_HEAD^{commit}" || { echo "::error::PR head unresolvable"; exit 1; }
          git cat-file -e "$CANON_COMMIT^{commit}" || { echo "::error::canonical commit unresolvable"; exit 1; }
          git worktree add "$WDIR" "$PR1146_HEAD"
          {
            echo "worktree ok on $PR1146_HEAD"
            git -C "$WDIR" log --oneline -2
          } >> "$GITHUB_WORKSPACE/$EVID/pr1146_round4_meta_run$GITHUB_RUN_ID.txt"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Restore canonicals and heal
        run: |
          cd "$WDIR"
          FILES="scripts/generate_naca_radial_family.py scripts/qualify_naca_grid.py tests/python/test_qualify_naca_grid.py"
          git checkout "$CANON_COMMIT" -- diag-evidence/logs/pr1146/canonical/
          {
            echo "=== before (corrupted) ==="
            for f in $FILES; do echo "--- $f"; git show "$PR1146_HEAD:$f"; done
            echo "=== canonical git hash-object ==="
            for f in $FILES; do git hash-object "diag-evidence/logs/pr1146/canonical/$f"; done
            echo "=== restore ==="
            for f in $FILES; do cp "diag-evidence/logs/pr1146/canonical/$f" "$f"; echo "restored $f"; done
            echo "=== ruff version ==="; ruff --version
            echo "=== heal: ruff check --fix ==="
            ruff check --fix $FILES; echo "checkfix_exit=$?"
            echo "=== heal: ruff format ==="
            ruff format $FILES; echo "format_exit=$?"
            echo "=== verify ==="
            ruff check $FILES; echo "check_exit=$?"
            ruff format --check $FILES; echo "formatcheck_exit=$?"
            python3 -m compileall -q $FILES; echo "compile_exit=$?"
            echo "=== git hash-object (final) ==="; git hash-object $FILES
            echo "=== first lines ==="; for f in $FILES; do echo "--- $f"; head -3 "$f"; done
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_round4_restore_run$GITHUB_RUN_ID.txt" 2>&1
          cat "$GITHUB_WORKSPACE/$EVID/pr1146_round4_restore_run$GITHUB_RUN_ID.txt"
          ruff check $FILES && ruff format --check $FILES && python3 -m compileall -q $FILES
          if [ $? -ne 0 ]; then echo "::error::restored files failed verification"; exit 1; fi

      - name: Push repair to PR branch
        run: |
          cd "$WDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_naca_radial_family.py scripts/qualify_naca_grid.py tests/python/test_qualify_naca_grid.py
          if git diff --cached --quiet; then
            echo "nothing to repair (already clean)"
            exit 0
          fi
          git commit -m "fix: restore canonical ruff-formatted python files (PR #1146)"
          git push origin "HEAD:$PR_BRANCH"
          {
            echo "pushed_commit=$(git rev-parse HEAD)"
            git hash-object scripts/generate_naca_radial_family.py scripts/qualify_naca_grid.py tests/python/test_qualify_naca_grid.py
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_round4_pushed_commit_run$GITHUB_RUN_ID.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: pr1146 round4 run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Final gate
        if: always()
        run: |
          ls "$GITHUB_WORKSPACE/$EVID" | grep "round4" || { echo "::error::no round4 evidence"; exit 1; }
          echo "round4 repair executed for run $GITHUB_RUN_ID"
