name: PR 1146 pre-commit replica round2 (diag)

# DIAG-ONLY - branche ci/long-campaign-diagnostics (PR #903, JAMAIS merger).
# Round 2 : replique EXACTE de l'etape faillante de precommit.yml sur le head
# final e41f7cfc (apres canonicals ruff) pour capturer la sortie complete.
on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - '.github/workflows/pr1146_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1146-diag
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs/pr1146
  PR1146_HEAD: e41f7cfce20681540a914ffe07341e3ed24c9a19
  PR1146_BASE: ecf1d02287b71ee69f118955b31b966e0d3888fe

jobs:
  oracle:
    name: pre-commit replica round2 on PR1146 head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WDIR: /tmp/pr1146_wt2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pins and worktree PR head
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "pr1146_head=$PR1146_HEAD"
            echo "pr1146_base=$PR1146_BASE"
            echo "purpose=round2 exact pre-commit failure output on head e41f7cfc"
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_round2_meta_run$GITHUB_RUN_ID.txt"
          git cat-file -e "$PR1146_HEAD^{commit}" || { echo "::error::PR1146 head unresolvable"; exit 1; }
          git worktree add "$WDIR" "$PR1146_HEAD"

      - name: Set up Python 3.10 (replica precommit.yml)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff
        run: python -m pip install --upgrade pre-commit ruff

      - name: Exact precommit.yml replica on PR head
        run: |
          cd "$WDIR"
          export CFDX_PRECOMMIT_RANGE="$PR1146_BASE...$PR1146_HEAD"
          set +e
          {
            echo "=== env ==="
            echo "CFDX_PRECOMMIT_RANGE=$CFDX_PRECOMMIT_RANGE"
            echo "=== git diff name-only (py) ==="
            git diff --name-only "$CFDX_PRECOMMIT_RANGE" -- '*.py'
            echo "=== ruff version ==="
            ruff --version
            echo "=== pre-commit run --files (EXACT replica) ==="
            mapfile -t python_files < <(git diff --name-only "$CFDX_PRECOMMIT_RANGE" -- '*.py')
            pre-commit run --files "${python_files[@]}" --show-diff-on-failure
            echo "precommit_run_exit=$?"
            echo "=== pre-commit run cfdx-fast --all-files ==="
            pre-commit run cfdx-fast --all-files
            echo "cfdx_fast_exit=$?"
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_round2_replica_run$GITHUB_RUN_ID.txt" 2>&1
          cat "$GITHUB_WORKSPACE/$EVID/pr1146_round2_replica_run$GITHUB_RUN_ID.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: pr1146 precommit replica round2 run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Final gate
        if: always()
        run: |
          ls "$GITHUB_WORKSPACE/$EVID" | grep "round2.*run$GITHUB_RUN_ID|run$GITHUB_RUN_ID" || { echo "::error::no evidence recorded"; exit 1; }
          echo "diag evidence committed for run $GITHUB_RUN_ID"
