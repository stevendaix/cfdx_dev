name: PR 1146 repair corrupted python files (diag)

# DIAG-ONLY - branche ci/long-campaign-diagnostics (PR #903, JAMAIS merger).
# Round 3 : REPARATION. Les 3 fichiers python de la branche PR contiennent des
# placeholders MSL (1 ligne) poussees par erreur. Ce workflow restaure le
# canonical ruff-format du round 1 (commit 9ffb69b2, issu d'un cp de worktree
# git reel) et pousse la reparation sur la branche PR depuis un worktree.
on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - '.github/workflows/pr1146_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1146-diag
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs/pr1146
  PR1146_HEAD: e41f7cfce20681540a914ffe07341e3ed24c9a19
  CANON_COMMIT: 9ffb69b21148c02e0935154322eea9362b132035
  PR_BRANCH: fix/p0-p1-physical-guards-wall-forces

jobs:
  repair:
    name: restore canonical python files on PR branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WDIR: /tmp/pr1146_wt3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pins and worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "purpose=round3 repair placeholder-corrupted python files"
            echo "pr1146_head=$PR1146_HEAD"
            echo "canonical_source=$CANON_COMMIT"
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_round3_meta_run$GITHUB_RUN_ID.txt"
          git cat-file -e "$PR1146_HEAD^{commit}" || { echo "::error::PR head unresolvable"; exit 1; }
          git cat-file -e "$CANON_COMMIT^{commit}" || { echo "::error::canonical commit unresolvable"; exit 1; }
          git worktree add "$WDIR" "$PR1146_HEAD"

      - name: Restore canonicals from round-1 evidence
        run: |
          cd "$WDIR"
          FILES="scripts/generate_naca_radial_family.py scripts/qualify_naca_grid.py tests/python/test_qualify_naca_grid.py"
          git checkout "$CANON_COMMIT" -- diag-evidence/logs/pr1146/canonical/
          {
            echo "=== before (corrupted) ==="
            for f in $FILES; do echo "--- $f"; git show "$PR1146_HEAD:$f"; done
            echo "=== restore ==="
            for f in $FILES; do
              cp "diag-evidence/logs/pr1146/canonical/$f" "$f"
              echo "restored $f"
            done
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_round3_restore_run$GITHUB_RUN_ID.txt"

      - name: Set up Python 3.10 and verify
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Verify restored files (ruff + syntax + hashes)
        run: |
          cd "$WDIR"
          FILES="scripts/generate_naca_radial_family.py scripts/qualify_naca_grid.py tests/python/test_qualify_naca_grid.py"
          set +e
          {
            echo "=== ruff version ==="; ruff --version
            echo "=== ruff check ==="; ruff check $FILES; echo "check_exit=$?"
            echo "=== ruff format --check ==="; ruff format --check $FILES; echo "format_exit=$?"
            echo "=== compileall ==="; python3 -m compileall -q $FILES; echo "compile_exit=$?"
            echo "=== git hash-object (restored) ==="; git hash-object $FILES
            echo "=== first lines ==="; for f in $FILES; do echo "--- $f"; head -2 "$f"; done
          } >> "$GITHUB_WORKSPACE/$EVID/pr1146_round3_restore_run$GITHUB_RUN_ID.txt" 2>&1
          ruff check $FILES && ruff format --check $FILES && python3 -m compileall -q $FILES
          if [ $? -ne 0 ]; then echo "::error::restored files failed verification"; exit 1; fi

      - name: Push repair to PR branch
        run: |
          cd "$WDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_naca_radial_family.py scripts/qualify_naca_grid.py tests/python/test_qualify_naca_grid.py
          if git diff --cached --quiet; then
            echo "nothing to repair" >> "$GITHUB_WORKSPACE/$EVID/pr1146_round3_restore_run$GITHUB_RUN_ID.txt"
          else
            git commit -m "fix: restore canonical ruff-formatted python files (PR #1146)

Repair: the three changed python files were corrupted to one-line
placeholders by a faulty fetch channel. Restored byte-exact from the
diag round-1 canonical (ruff 0.17.3 format, ruff check clean,
compileall clean) produced from a real git worktree at PR head
015c5097 and verified again in this run (see diag-evidence/logs/pr1146/
pr1146_round3_restore_run*)."
            git push origin "HEAD:$PR_BRANCH"
            git rev-parse HEAD > "$GITHUB_WORKSPACE/$EVID/pr1146_round3_pushed_commit_run$GITHUB_RUN_ID.txt"
            git hash-object scripts/generate_naca_radial_family.py scripts/qualify_naca_grid.py tests/python/test_qualify_naca_grid.py >> "$GITHUB_WORKSPACE/$EVID/pr1146_round3_pushed_commit_run$GITHUB_RUN_ID.txt"
          fi

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: pr1146 round3 repair run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Final gate
        if: always()
        run: |
          ls "$GITHUB_WORKSPACE/$EVID" | grep "round3" || { echo "::error::no round3 evidence"; exit 1; }
          echo "round3 repair executed for run $GITHUB_RUN_ID"
