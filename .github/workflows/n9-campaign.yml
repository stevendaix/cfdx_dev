name: N9 diagnostic campaign (manual)

# Diagnostic-only complete N9 campaign, launched explicitly on a chosen ref.
# The regular physical qualification gate resides in cfdx-validation.yml.
# This workflow is never triggered automatically by a PR label or push.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n9-campaign-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build-n9-campaign

jobs:
  n9-campaign:
    name: N9 manual diagnosis
    # Manual reproducer; never a substitute for the total-validation gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev

      - name: Configure N9 campaign build
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build N9 campaign test targets
        run: |
          cmake --build "$BUILD_DIR" \
            --target \
              test_n9_physical_matrix \
              test_n9_negative_diagnostics \
              test_n9_s9_rhie_chow_consistency \
              test_n9_s10_pressure_reference_policies \
              test_n9_common_schur_qualification \
              test_poiseuille_diagnostics \
              test_ghia_cavity \
              test_phase9_acceptance \
              test_steady_incompressible_solver \
            --parallel 2

      - name: Build optional MPI equivalence target
        continue-on-error: true
        run: |
          cmake --build "$BUILD_DIR" \
            --target test_n13_mpi_equivalence \
            --parallel 2 \
          || echo "::warning::test_n13_mpi_equivalence is not buildable in this configuration; the campaign driver will record it as absent (declared optional evidence, not a silent skip)"

      - name: Run N9 qualification campaign
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/n9_physical_campaign.py \
            --build-dir "$BUILD_DIR" \
            --expected-git-sha "$GITHUB_SHA" \
            2>&1 | tee "$BUILD_DIR/n9-campaign.log"

      - name: Upload N9 campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: n9-campaign-manual-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/n9-campaign.log
            ${{ env.BUILD_DIR }}/n9_physical_campaign.json
            ${{ env.BUILD_DIR }}/Testing/
          if-no-files-found: warn
          retention-days: 30
