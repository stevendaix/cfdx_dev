name: S2S PR diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  report-failed-fast-ctest:
    name: Report failed fast-ctest tests (Release)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 999
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Install Python mesh/I/O stack
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic ansys-fluent-core
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF

      - name: Build
        run: |
          cmake --build build --parallel 8

      - name: Run fast CTest (CI-identical: parallel 4)
        run: |
          set +e
          ctest --test-dir build -LE long --output-on-failure --no-tests=error --parallel 4 > ctest.log 2>&1
          rc=$?
          set -e
          echo "CTEST_RC=$rc" | tee rc.txt

      - name: Build failure report with per-test rerun output
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import subprocess
          out = []
          if os.path.exists('rc.txt'):
              out.append(open('rc.txt').read().strip())
          if not os.path.exists('ctest.log'):
              out.append('ctest.log missing')
          else:
              text = open('ctest.log', errors='replace').read()
              for line in text.splitlines():
                  if re.search(r'\d+% tests passed', line):
                      out.append(line)
              marker = text.find('The following tests FAILED:')
              failed = []
              if marker >= 0:
                  for line in text[marker:].splitlines()[1:]:
                      m = re.match(r'\s*\d+ - (\S+) \(([^)]*)\)', line)
                      if m:
                          failed.append((m.group(1), m.group(2)))
                      elif line.strip() == '':
                          continue
                      else:
                          break
              out.append('FAILED COUNT: %d' % len(failed))
              for name, kind in failed[:10]:
                  out.append('=' * 70)
                  out.append('FAILED: %s (%s)' % (name, kind))
                  out.append('---- individual rerun output (tail) ----')
                  try:
                      rerun = subprocess.run(
                          ['ctest', '--test-dir', 'build', '-R', '^%s$' % name,
                           '--output-on-failure', '--no-tests=error'],
                          capture_output=True, text=True, timeout=600)
                      block = rerun.stdout + rerun.stderr
                      lines = block.rstrip().splitlines()
                      out.extend(lines[-150:])
                  except Exception as exc:
                      out.append('rerun failed: %s' % exc)
          open('report.txt', 'w').write('\n'.join(out))
          print('\n'.join(out))
          PYEOF

      - name: Post report as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### S2S diagnostic v4: fast-ctest failures with CI-identical env (Release, commit ${GITHUB_SHA})"
            echo ""
            echo '```'
            cat report.txt 2>/dev/null || echo "report.txt missing"
            echo '```'
          } > report.md
          gh pr comment "$PR_NUMBER" --body-file report.md
