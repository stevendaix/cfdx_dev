name: S2S PR diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  report-failed-fast-ctest:
    name: Report failed fast-ctest tests (Release)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 999
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF

      - name: Build
        run: |
          cmake --build build --parallel 8

      - name: Run fast CTest (sequential, output captured)
        run: |
          set +e
          ctest --test-dir build -LE long --output-on-failure --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          echo "ctest exit code: $rc"

      - name: Report failed tests
        if: always()
        run: |
          echo "===== ctest summary ====="
          tail -n 40 ctest.log || true
          echo "===== per-test failure report ====="
          python3 - <<'PYEOF'
          import re
          text = open('ctest.log', errors='replace').read()
          m = re.search(r"The following tests FAILED:\n(.*?)\n\s*\n", text, re.S)
          failed = re.findall(r"\d+ - (\S+) \(([^)]*)\)", m.group(1)) if m else []
          if not failed:
              print("NO FAILED TESTS FOUND IN SUMMARY")
          blocks = re.split(r"(?m)^(?=\s*(Start\s+\d+:|\d+/\d+ Test\s*#?\d+))", text)
          for name, kind in failed:
              print("=" * 70)
              print("FAILED: %s (%s)" % (name, kind))
              for b in blocks:
                  if re.search(r"(Start\s+\d+:\s*|#\d+:\s*)%s\b" % re.escape(name), b):
                      lines = b.rstrip().splitlines()
                      print("---- first lines ----")
                      print("\n".join(lines[:3]))
                      print("---- last lines ----")
                      print("\n".join(lines[-100:]))
                      break
          PYEOF
