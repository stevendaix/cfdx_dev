name: Post-merge-wave fix overlay + bisect (diag)

# DIAG-ONLY - branche ci/long-campaign-diagnostics (PR #903, JAMAIS merger).
# (a) bisect : dater les echecs fast-ctest du run diag 40279566464 sur les
#     refs de la vague (post-#1096, post-#1125, post-#1126+fixes).
# (b) overlay : verifier fix1/fix2/fix3 en replica exacte du job Release
#     (fast CTest -LE long + pyreg complete) AVANT tout push master.
# CYCLE 2 - fix1/fix2/fix3 sont deja dans master (run #7 40318353208 :
#     verdict VERIFIED, 3 commits pousses, master head 57d951d6).
# fix4 steady_incompressible_solver.h : le gradient LS de
#     momentum_transpose_diffusion_face_fluxes utilisait la politique par
#     defaut ZERO_GRADIENT_GHOST - les fantomes miroir contredisent la CL mur
#     FIXED_VALUE et le champ affine du test (bug ne dans #1125, diff 0.147447)
#     -> EXCLUDE_BOUNDARY (1 ligne, occurrence unique).
# fix5 finite_volume_transport.h : #1126 a remplace le residu RELATIF H04 du
#     chemin 1x1 par un residu ABSOLU ; CHT (1 cellule/région, tol 1e-12,
#     |rhs|~6e4 a dt=0.01/0.1) -> plancher d'arrondi ~1e-11 > tol ->
#     MAX_ITER_REACHED -> throw CHT. Restaurer le bloc 1x1 pre-#1126
#     byte-exact depuis b82797f1 (tolerance relative H04 + diagnostics
#     apparies #1088 + garde DIVERGED + rejet qui n'ecrase pas solution).
# Push master (2 commits) uniquement si push_to_master=true ET verdict
# VERIFIED (fail-closed) : zero echec fast-ctest attendu (cht_time et
# transpose_stress doivent PASSER), pyreg 100% verte.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/postwave_fix_push_flag.txt'
      - '.github/workflows/postwave_fix_overlay_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postwave-fix-overlay
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs
  HEAD_PIN: 57d951d6f20dd9880aeb1d30b6096318c773c320
  WAVE2_PIN: b82797f14ff1242a28bd73888c9bf379a8974248

jobs:
  bisect:
    name: 'bisect ${{ matrix.label }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: post1096
            ref: 655abec6c97ca9707f707457ce9b93c4d5de0332
          - label: post1125
            ref: b82797f14ff1242a28bd73888c9bf379a8974248
          - label: post1126
            ref: 140d1e5a183d4dcc7c3194f9a10588163dcfc4dd
    env:
      BREF: '${{ matrix.ref }}'
      BLABEL: '${{ matrix.label }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ref and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git cat-file -e "$BREF^{commit}" || { echo "::error::unresolvable $BREF"; exit 1; }
          git worktree add "$RUNNER_TEMP/head" "$BREF"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "ref=$BREF"
            echo "label=$BLABEL"
            echo "purpose=date the 4 post-wave fast-ctest failures at wave merge refs"
          } > "$GITHUB_WORKSPACE/$EVID/postwave_fix_bisect_meta_${BLABEL}_run$GITHUB_RUN_ID.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Configure (Release)
        run: cmake -S "$RUNNER_TEMP/head" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_LONG_VALIDATION=OFF -DCMAKE_UNITY_BUILD=OFF

      - name: Build
        run: |
          set +e
          cmake --build build --parallel 8 > /tmp/build_raw.log 2>&1
          rc=$?
          {
            echo "build_exit=$rc"
            tail -n 100 /tmp/build_raw.log
            grep -E -B2 -A6 'error:|fatal error:|undefined reference|collect2: error|FAILED:' /tmp/build_raw.log | tail -n 150 || true
          } > "$GITHUB_WORKSPACE/$EVID/postwave_fix_bisect_build_${BLABEL}_run$GITHUB_RUN_ID.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::build failed at $BREF - see evidence"
            exit 1
          fi

      - name: Run target tests
        run: |
          set +e
          ctest --test-dir build -R '^(test_audit_cht_time|test_audit_energy_boundary_metric|test_variable_viscosity_transpose_stress|test_finite_volume_transport)$' --output-on-failure --no-tests=ignore > "$GITHUB_WORKSPACE/$EVID/postwave_fix_bisect_ctest_${BLABEL}_run$GITHUB_RUN_ID.log" 2>&1
          rc=$?
          set -e
          echo "ctest_exit=$rc" > "$GITHUB_WORKSPACE/$EVID/postwave_fix_bisect_status_${BLABEL}_run$GITHUB_RUN_ID.txt"
          echo "ctest_exit=$rc"
          grep -E 'tests passed|tests failed|The following tests FAILED' "$GITHUB_WORKSPACE/$EVID/postwave_fix_bisect_ctest_${BLABEL}_run$GITHUB_RUN_ID.log" || true

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: postwave bisect $BLABEL run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Final gate
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/$EVID/postwave_fix_bisect_status_${BLABEL}_run$GITHUB_RUN_ID.txt"
          if [ ! -f "$f" ]; then
            echo "::error::bisect $BLABEL produced no status - read build/ctest evidence"
            exit 1
          fi
          cat "$f"

  overlay:
    name: overlay (fix4+fix5 verify, gated master push)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      WDIR: /tmp/postwave_head_wt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pins, read push flag, create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin master
          MASTER_SHA=$(git rev-parse origin/master)
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "head_pin=$HEAD_PIN"
            echo "master_sha=$MASTER_SHA"
            echo "expected_remaining_failures=none (wave 2 tests must pass with fix4/fix5)"
          } > "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_meta_run$GITHUB_RUN_ID.txt"
          if [ "$MASTER_SHA" != "$HEAD_PIN" ]; then
            echo "::error::master has moved (master_sha=$MASTER_SHA vs pinned $HEAD_PIN) - abort, evidence-only"
            echo "master_moved=true" >> "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_status_run$GITHUB_RUN_ID.txt"
            exit 1
          fi
          git cat-file -e "$WAVE2_PIN^{commit}" || { echo "::error::wave2 pin unresolvable"; exit 1; }
          git worktree add "$WDIR" "$HEAD_PIN"
          PUSH_FLAG=$(sed -n 's/^push_to_master=//p' diag-tools/postwave_fix_push_flag.txt | head -n 1)
          echo "PUSH_FLAG=$PUSH_FLAG" >> "$GITHUB_ENV"
          {
            echo "push_to_master=$PUSH_FLAG"
            echo "wave2_pin=$WAVE2_PIN"
          } >> "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_meta_run$GITHUB_RUN_ID.txt"
          echo "push_to_master=$PUSH_FLAG" >> "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_status_run$GITHUB_RUN_ID.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Install Python stack
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "meshio[all]" h5py pytest gmsh pydantic ansys-fluent-core
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Apply candidate patches (fail-closed, exact occurrence counts)
        run: |
          python3 - <<'PY'
          import os, subprocess, sys

          WT = os.environ["WDIR"]
          EVID = os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["EVID"])
          WAVE2 = os.environ["WAVE2_PIN"]
          RUN = os.environ["GITHUB_RUN_ID"]
          report = []

          def rd(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()

          def wr(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)

          def one(hay, needle, what):
              n = hay.count(needle)
              if n != 1:
                  print("PATCH-FAIL: %s: expected 1 occurrence, got %d" % (what, n))
                  print("--- needle (first 400 chars) ---")
                  print(needle[:400])
                  sys.exit(3)

          # ---- fix 4: transpose-flux LS gradient must not use boundary ghosts ----
          p4 = os.path.join(WT, "src/cfdx/physics/steady_incompressible_solver.h")
          s = rd(p4)
          old4 = "        const auto grad_ls = cfdx::core::compute_gradient_least_squares(scalar, mesh);\n"
          new4 = "        const auto grad_ls = cfdx::core::compute_gradient_least_squares(scalar, mesh, cfdx::core::BoundaryGradientPolicy::EXCLUDE_BOUNDARY);\n"
          one(s, old4, "fix4 transpose-flux LS gradient call")
          wr(p4, s.replace(old4, new4, 1))
          report.append("fix4 applied (steady_incompressible_solver.h transpose LS gradient: EXCLUDE_BOUNDARY)")

          # ---- fix 5: restore the pre-#1126 relative-tolerance 1x1 path ----
          p5 = os.path.join(WT, "src/cfdx/physics/finite_volume_transport.h")
          s = rd(p5)
          show = subprocess.run(["git", "-C", WT, "show", WAVE2 + ":src/cfdx/physics/finite_volume_transport.h"], capture_output=True, text=True)
          if show.returncode != 0:
              print("PATCH-FAIL: git show of wave2 file failed:", show.stderr[:400])
              sys.exit(3)
          wtext = show.stdout
          start_marker = "        // H04: the tolerance is relative, as on the Krylov paths. Keep the"
          if wtext.count(start_marker) != 1:
              print("PATCH-FAIL: wave2 H04 comment: expected 1 occurrence, got %d" % wtext.count(start_marker))
              sys.exit(3)
          end_marker = ("        result.residual_relative_after_relaxation = result.residual_relative;\n"
                        "        return result;\n")
          if wtext.count(end_marker) != 1:
              print("PATCH-FAIL: wave2 1x1 tail marker: expected 1 occurrence, got %d" % wtext.count(end_marker))
              sys.exit(3)
          start = wtext.index(start_marker)
          end = wtext.find(end_marker, start)
          if end < 0:
              print("PATCH-FAIL: wave2 segment end marker not found after the H04 comment")
              sys.exit(3)
          segment = wtext[start:end + len(end_marker)]
          for marker in ("rhs_scale", "relative <= controls.tolerance",
                         "SolverStatus::DIVERGED", "residual_before_relaxation",
                         "A rejected predictor must not replace the accepted iterate"):
              if marker not in segment:
                  print("PATCH-FAIL: wave2 1x1 segment missing marker:", marker)
                  sys.exit(3)
          if "if (solution.size() == 1)" in segment:
              print("PATCH-FAIL: wave2 1x1 segment must not contain the block opener")
              sys.exit(3)
          seg_open = segment.count("{")
          seg_close = segment.count("}")
          if seg_open != seg_close:
              print("PATCH-FAIL: wave2 1x1 segment braces unbalanced: %d open vs %d close" % (seg_open, seg_close))
              sys.exit(3)
          if not segment.startswith(start_marker):
              print("PATCH-FAIL: wave2 1x1 segment does not start with the H04 comment")
              sys.exit(3)
          with open(os.path.join(EVID, "postwave_fix_overlay_wave2_segment_run" + RUN + ".txt"), "w") as f:
              f.write(segment)

          old5 = (
              "        if (candidate_residual <= controls.tolerance) {\n"
              "            // A scalar 1x1 system has an exact closed-form solution. Do not\n"
              "            // under-relax an already converged linear solve: doing so makes\n"
              "            // the returned state fail the requested residual even though the\n"
              "            // reported linear residual is zero.\n"
              "            solution(0) = candidate_value;\n"
              "            return {\n"
              "                cfdx::core::SolverStatus::CONVERGED,\n"
              "                1, candidate_residual, candidate_residual\n"
              "            };\n"
              "        }\n"
              "        solution(0) += controls.relaxation * (candidate_value - solution(0));\n"
              "        const double residual =\n"
              "            std::abs(diagonal * solution(0) - equation.rhs(0));\n"
              "        return {\n"
              "            cfdx::core::SolverStatus::MAX_ITER_REACHED,\n"
              "            controls.max_iterations, residual, residual\n"
              "        };\n")
          one(s, old5, "fix5 absolute-tolerance 1x1 tail")
          open_before = s.count("{")
          close_before = s.count("}")
          old_open = old5.count("{")
          old_close = old5.count("}")
          s = s.replace(old5, segment, 1)
          if old5 in s:
              print("PATCH-FAIL: absolute-tolerance 1x1 tail still present after splice")
              sys.exit(3)
          if start_marker not in s:
              print("PATCH-FAIL: restored H04 comment not present after splice")
              sys.exit(3)
          if s.count("{") != open_before - old_open + seg_open or s.count("}") != close_before - old_close + seg_close:
              print("PATCH-FAIL: post-splice brace counts unexpected")
              sys.exit(3)
          if s.count("{") != s.count("}"):
              print("PATCH-FAIL: post-splice file braces unbalanced")
              sys.exit(3)
          wr(p5, s)
          report.append("fix5 applied (finite_volume_transport.h): 1x1 relative-tolerance block restored byte-for-byte from " + WAVE2)

          diff = subprocess.run(["git", "-C", WT, "diff"], capture_output=True, text=True).stdout
          with open(os.path.join(EVID, "postwave_fix_overlay_patchdiff_run" + RUN + ".patch"), "w") as f:
              f.write(diff)
          for line in report:
              print("PATCH:", line)
          print("PATCH-OK fix4=ls-exclude-boundary fix5=1x1-segment-splice segment_lines=%d" % segment.count("\n"))
          PY

      - name: Configure (Release replica)
        run: cmake -S "$WDIR" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_LONG_VALIDATION=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_UNITY_BUILD=OFF

      - name: Build
        run: |
          set +e
          cmake --build build --parallel 8 > /tmp/build_raw.log 2>&1
          rc=$?
          {
            echo "build_exit=$rc"
            tail -n 100 /tmp/build_raw.log
            grep -E -B2 -A4 'error:|fatal error:|undefined reference|collect2: error|FAILED:' /tmp/build_raw.log | tail -n 120 || true
          } > "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_build_run$GITHUB_RUN_ID.log"
          echo "build_exit=$rc" >> "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_status_run$GITHUB_RUN_ID.txt"
          if [ "$rc" -ne 0 ]; then
            echo "::error::patched build failed - see evidence log"
            exit 1
          fi

      - name: Run fast CTest (replica of the CI step)
        run: |
          set +e
          ctest --test-dir build -LE long --output-on-failure --no-tests=error --parallel 4 > "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_ctest_run$GITHUB_RUN_ID.log" 2>&1
          rc=$?
          set -e
          echo "ctest_exit=$rc" >> "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_status_run$GITHUB_RUN_ID.txt"
          echo "ctest_exit=$rc"
          tail -n 40 "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_ctest_run$GITHUB_RUN_ID.log"

      - name: Run Python regression replica
        run: |
          set +e
          cd "$WDIR"
          export CFDX_PRODUCTION_SOLVER="$GITHUB_WORKSPACE/build/cfdx_production_solver"
          export CFDX_THERMAL_SOLVER="$GITHUB_WORKSPACE/build/cfdx_thermal_solver"
          export PYTHONPATH="$WDIR/src/cfdx/python"
          python -m pytest -q tests/python --tb=short > "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_pyreg_run$GITHUB_RUN_ID.log" 2>&1
          rc=$?
          set -e
          echo "pyreg_exit=$rc" >> "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_status_run$GITHUB_RUN_ID.txt"
          {
            grep -E '^(FAILED|ERROR) ' "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_pyreg_run$GITHUB_RUN_ID.log" || true
            tail -n 5 "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_pyreg_run$GITHUB_RUN_ID.log"
          } > "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_pyreg_failed_run$GITHUB_RUN_ID.txt"
          cat "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_pyreg_failed_run$GITHUB_RUN_ID.txt"

      - name: Analyze and classify
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, sys

          evid = os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["EVID"])
          run = os.environ["GITHUB_RUN_ID"]
          def p(kind, ext):
              return os.path.join(evid, "postwave_fix_overlay_%s_run%s.%s" % (kind, run, ext))

          expected = set()
          targeted = ["test_audit_cht_time", "test_variable_viscosity_transpose_stress"]
          lines = []

          def write(v):
              with open(p("verdict", "txt"), "w") as f:
                  f.write("verdict=" + v + "\n")
                  for l in lines:
                      f.write(l + "\n")
              print("verdict=" + v)

          status = {}
          if os.path.exists(p("status", "txt")):
              for l in open(p("status", "txt")):
                  if "=" in l:
                      k, v = l.split("=", 1)
                      status[k.strip()] = v.strip()

          if status.get("master_moved") == "true":
              lines.append("master moved away from the pinned head; nothing verified")
              write("MASTER_MOVED")
              sys.exit(0)
          if not os.path.exists(p("patchdiff", "patch")):
              lines.append("patch step failed or did not run - see job log / evidence")
              write("PATCH_FAILED")
              sys.exit(0)
          if status.get("build_exit") != "0":
              lines.append("build_exit=" + str(status.get("build_exit")))
              write("INCONCLUSIVE_BUILD")
              sys.exit(0)

          ctest_log = p("ctest", "log")
          if not os.path.exists(ctest_log):
              lines.append("no ctest log - run did not reach tests")
              write("INCONCLUSIVE_NO_CTEST")
              sys.exit(0)
          text = open(ctest_log, errors="replace").read()
          failed = []
          idx = text.find("The following tests FAILED:")
          if idx >= 0:
              for line in text[idx:].splitlines()[1:]:
                  st = line.strip()
                  if not st:
                      break
                  m = re.match(r"(\d+)\s*-\s*(\S+)", st)
                  if not m:
                      break
                  failed.append(m.group(2))
          with open(p("failedlist", "txt"), "w") as f:
              for t in failed:
                  f.write(t + "\n")

          pyreg_failed = []
          if os.path.exists(p("pyreg", "log")):
              pt = open(p("pyreg", "log"), errors="replace").read()
              pyreg_failed = [l for l in pt.splitlines() if l.startswith("FAILED ") or l.startswith("ERROR ")]

          unexpected = [t for t in failed if t not in expected]
          not_run = [t for t in targeted if t not in text]
          still_failing = [t for t in targeted if t in failed]
          ok = (not unexpected) and (not not_run) and (not still_failing) and (not pyreg_failed)

          lines.append("ctest_exit=" + str(status.get("ctest_exit")))
          lines.append("failed_tests=" + str(len(failed)))
          lines += failed
          lines.append("targeted_not_seen=" + str(not_run))
          lines.append("unexpected_failures=" + str(unexpected))
          lines.append("pyreg_exit=" + str(status.get("pyreg_exit")))
          lines.append("pyreg_failed=" + str(len(pyreg_failed)))
          lines += pyreg_failed[:20]
          lines.append("push_to_master=" + str(status.get("push_to_master")))
          write("VERIFIED" if ok else "FAILED")
          PY

      - name: Push fixes to master (gated)
        if: always()
        run: |
          v=$(head -n 1 "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_verdict_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo verdict=MISSING)
          echo "verdict: $v"
          if [ "$v" != "verdict=VERIFIED" ]; then
            echo "no push: verdict is not VERIFIED"
            exit 0
          fi
          if [ "$PUSH_FLAG" != "true" ]; then
            echo "no push: diag-tools/postwave_fix_push_flag.txt is not push_to_master=true"
            exit 0
          fi
          cd "$WDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cfdx/physics/steady_incompressible_solver.h
          git commit -m "fix(coupled): exclude boundary ghosts from the transpose-flux least-squares gradient" -m "momentum_transpose_diffusion_face_fluxes evaluated its least-squares gradient with the default ZERO_GRADIENT_GHOST policy, so boundary cells received mirror ghosts carrying the cell value. Those ghosts contradict a wall FIXED_VALUE condition and any field with a non-zero normal gradient, biasing corner-cell gradients and the transposed viscous face fluxes (reproduced as the 0.147447 diff of test_variable_viscosity_transpose_stress since #1125). Request EXCLUDE_BOUNDARY so boundary ghosts never enter the LS stencil; cells with fewer than three internal neighbours keep the boundary-aware Green-Gauss values unchanged, matching the documented intent. Verified by the postwave fix overlay diag run (evidence in diag-evidence/logs on ci/long-campaign-diagnostics)."
          git add src/cfdx/physics/finite_volume_transport.h
          git commit -m "fix(transport): restore the relative-tolerance H04 one-cell solve" -m "The #1126 merge replaced the relative H04 convergence test of the one-cell solve path with an absolute residual test. For the CHT one-cell regions (tolerance 1e-12, |rhs| ~ 6e4 at dt=0.01/0.1) the rounding floor of the closed-form solve (~1e-11) exceeds the absolute tolerance, so converged solves returned MAX_ITER_REACHED and the CHT driver aborted with the region energy solve did not converge. Restore the pre-#1126 block byte-for-byte from b82797f1: relative tolerance as on the Krylov paths, the #1088 paired residual diagnostics, the DIVERGED finite guards, and the rejected-predictor contract that never overwrites the accepted iterate. Verified by the postwave fix overlay diag run."
          if git push origin HEAD:master > /tmp/master_push.log 2>&1; then
            echo "master_push=success"
            echo "master_pushed=true" >> "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_status_run$GITHUB_RUN_ID.txt"
          else
            echo "master_push=FAILED - see evidence"
            cat /tmp/master_push.log
            cp /tmp/master_push.log "$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_pushfail_run$GITHUB_RUN_ID.log" || true
            exit 1
          fi

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: postwave fix overlay run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Final gate
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/$EVID/postwave_fix_overlay_verdict_run$GITHUB_RUN_ID.txt"
          if [ ! -f "$f" ]; then
            echo "::error::no verdict recorded - read overlay evidence"
            exit 1
          fi
          cat "$f"
          v=$(head -n 1 "$f")
          case "$v" in
            verdict=VERIFIED|verdict=FAILED)
              echo "overlay run concluded with a recorded verdict" ;;
            *)
              echo "::error::$v - inconclusive or failed overlay run"
              exit 1 ;;
          esac
