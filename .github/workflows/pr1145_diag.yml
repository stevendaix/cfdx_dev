name: PR 1145 pre-commit + numerical build oracle (diag)

# DIAG-ONLY - branche ci/long-campaign-diagnostics (PR #903, JAMAIS merger).
# Evidence-only : relever les findings Ruff/pre-commit exacts sur le head
# PR #1145 d75adaac (run 2 : apres fixes ruff round 1).
on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - '.github/workflows/pr1145_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1145-diag
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs
  PR1145_HEAD: d75adaac6275739c2348364970e6e7b6e66ce16d
  PR1145_BASE: 940635ee1ab7853002030680548525be692d2b97

jobs:
  oracle:
    name: pre-commit replica on PR1145 head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WDIR: /tmp/pr1145_wt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pins and worktree PR head
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "pr1145_head=$PR1145_HEAD"
            echo "pr1145_base=$PR1145_BASE"
            echo "purpose=round2 exact ruff/precommit findings on PR1145 head d75adaac"
          } > "$GITHUB_WORKSPACE/$EVID/pr1145_diag_meta_run$GITHUB_RUN_ID.txt"
          git cat-file -e "$PR1145_HEAD^{commit}" || { echo "::error::PR1145 head unresolvable"; exit 1; }
          git worktree add "$WDIR" "$PR1145_HEAD"

      - name: Set up Python 3.10 (replica precommit.yml)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff
        run: python -m pip install --upgrade pre-commit ruff

      - name: Pre-commit replica (exact precommit.yml guard)
        run: |
          cd "$WDIR"
          FILES="scripts/generate_2d_validation_meshes.py tests/python/test_naca_mesh_symmetry_extrusion.py"
          set +e
          {
            echo "=== ruff version ==="
            ruff --version
            echo "=== ruff check ==="
            ruff check $FILES
            echo "ruff_check_exit=$?"
            echo "=== ruff format --diff (full) ==="
            ruff format --diff $FILES
            echo "ruff_format_exit=$?"
            echo "=== pre-commit run --files ==="
            pre-commit run --files $FILES --show-diff-on-failure
            echo "precommit_exit=$?"
            echo "=== pre-commit run cfdx-fast --all-files ==="
            CFDX_PRECOMMIT_RANGE="$PR1145_BASE...$PR1145_HEAD" pre-commit run cfdx-fast --all-files
            echo "cfdx_fast_exit=$?"
          } > "$GITHUB_WORKSPACE/$EVID/pr1145_precommit_replica_run$GITHUB_RUN_ID.txt" 2>&1
          cat "$GITHUB_WORKSPACE/$EVID/pr1145_precommit_replica_run$GITHUB_RUN_ID.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: pr1145 precommit oracle round2 run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Final gate
        if: always()
        run: |
          ls "$GITHUB_WORKSPACE/$EVID" | grep "run$GITHUB_RUN_ID" || { echo "::error::no evidence recorded"; exit 1; }
          echo "diag evidence committed for run $GITHUB_RUN_ID"
