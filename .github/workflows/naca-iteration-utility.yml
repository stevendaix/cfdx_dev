name: NACA0012 iteration utility matrix (cost vs precision)

# DIAG (temporary branch, never merged): cost/precision campaign for the
# NACA0012 Re=1000 alpha=0 qualification case. The fix4c matrix (run
# 38213173171) QUALIFIED the COUPLED tol 1e-12 campaign on n64/n128/n256
# (all levels CONVERGED, mesh gate |d12|<=d01 satisfied). This branch now
# measures the iteration-UTILITY question: how much of the outer iteration
# budget actually moves the quantities of interest? The harness on this
# branch adds --convtol X (sets BOTH outer stopping criteria to X) and an
# ITER_UTILITY line (iterations, wall time, Cd/Cd_pressure/Cd_viscous/Cl/
# continuity at the stopping point).
#   * n64 sweep: SIMPLE / SIMPLEC / COUPLED_BLOCKLOCAL at convtol 1e-4..1e-10
#     (the harness default 1e-8 is the qualified reference point; COUPLED
#     keeps the qualified linear tolerance 1e-12 so only the outer loop varies).
#   * n128 subset: SIMPLE / COUPLED_BLOCKLOCAL at 1e-6/1e-8/1e-10 to check
#     that the stopping-criterion conclusions survive mesh refinement.
# A stopping-tolerance sweep is a MEASUREMENT, not a gate change: the
# qualified fix4b/fix4c gates and thresholds are untouched, and every variant
# must still reach CONVERGED at its own tolerance. Evidence logs are
# committed back to this branch (paths-ignore prevents re-triggering).

on:
  workflow_dispatch:
  push:
    branches: [diag/naca-iteration-utility]
    paths-ignore:
      - 'naca-utility-output.log'
      - 'naca-utility-summary.log'

permissions:
  contents: write

jobs:
  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: n64-simple-ct1e-4, model: SIMPLE, ct: "1e-4", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simple-ct1e-5, model: SIMPLE, ct: "1e-5", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simple-ct1e-6, model: SIMPLE, ct: "1e-6", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simple-ct1e-8, model: SIMPLE, ct: "1e-8", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simple-ct1e-10, model: SIMPLE, ct: "1e-10", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simplec-ct1e-4, model: SIMPLEC, ct: "1e-4", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simplec-ct1e-5, model: SIMPLEC, ct: "1e-5", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simplec-ct1e-6, model: SIMPLEC, ct: "1e-6", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simplec-ct1e-8, model: SIMPLEC, ct: "1e-8", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-simplec-ct1e-10, model: SIMPLEC, ct: "1e-10", cdt: "0", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-coupled-ct1e-4, model: COUPLED_BLOCKLOCAL, ct: "1e-4", cdt: "1e-12", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-coupled-ct1e-5, model: COUPLED_BLOCKLOCAL, ct: "1e-5", cdt: "1e-12", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-coupled-ct1e-6, model: COUPLED_BLOCKLOCAL, ct: "1e-6", cdt: "1e-12", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-coupled-ct1e-8, model: COUPLED_BLOCKLOCAL, ct: "1e-8", cdt: "1e-12", mesh: naca0012_laminar_n64.h5 }
          - { name: n64-coupled-ct1e-10, model: COUPLED_BLOCKLOCAL, ct: "1e-10", cdt: "1e-12", mesh: naca0012_laminar_n64.h5 }
          - { name: n128-simple-ct1e-6, model: SIMPLE, ct: "1e-6", cdt: "0", mesh: naca0012_laminar_n128.h5 }
          - { name: n128-simple-ct1e-8, model: SIMPLE, ct: "1e-8", cdt: "0", mesh: naca0012_laminar_n128.h5 }
          - { name: n128-simple-ct1e-10, model: SIMPLE, ct: "1e-10", cdt: "0", mesh: naca0012_laminar_n128.h5 }
          - { name: n128-coupled-ct1e-6, model: COUPLED_BLOCKLOCAL, ct: "1e-6", cdt: "1e-12", mesh: naca0012_laminar_n128.h5 }
          - { name: n128-coupled-ct1e-8, model: COUPLED_BLOCKLOCAL, ct: "1e-8", cdt: "1e-12", mesh: naca0012_laminar_n128.h5 }
          - { name: n128-coupled-ct1e-10, model: COUPLED_BLOCKLOCAL, ct: "1e-10", cdt: "1e-12", mesh: naca0012_laminar_n128.h5 }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-naca
          .venv-naca/bin/python -m pip install --upgrade pip
          .venv-naca/bin/python -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh

      - name: Generate NACA0012 O-grid meshes (n64/n128/n256)
        run: |
          mkdir -p build-naca/validation_meshes
          .venv-naca/bin/python scripts/generate_2d_validation_meshes.py naca0012 \
            --output-dir build-naca/validation_meshes

      - name: Configure (Release, long validation ON)
        run: |
          cmake -S . -B build-naca -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/.venv-naca/bin/python"

      - name: Build test_naca0012_qualification
        run: |
          set -o pipefail
          cmake --build build-naca --target test_naca0012_qualification --parallel 2

      - name: Run variant ${{ matrix.name }}
        run: |
          set -o pipefail
          ./build-naca/test_naca0012_qualification \
            --model ${{ matrix.model }} \
            --alphau 0.6 --alphap 0.25 \
            --levels 1 --trace 10 \
            --convtol ${{ matrix.ct }} \
            --coupledtol ${{ matrix.cdt }} \
            build-naca/validation_meshes/${{ matrix.mesh }} \
            2>&1 | tee naca-utility-${{ matrix.name }}.log

      - name: Enforce convergence gates
        if: success()
        env:
          VARIANT_LOG: naca-utility-${{ matrix.name }}.log
        run: |
          set -euo pipefail
          awk '
            /NACA_DIAG status=/ {
              count++
              if ($0 !~ /NACA_DIAG status=CONVERGED converged=1/) {
                print "NUMERICAL_GATE_FAIL: " $0 > "/dev/stderr"
                bad=1
              }
            }
            END {
              if (count != 1) {
                printf "NUMERICAL_GATE_FAIL: expected 1 level verdict, found %d\n", count > "/dev/stderr"
                bad=1
              }
              exit bad
            }
          ' "$VARIANT_LOG"

      - name: Upload variant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naca-utility-logs-${{ matrix.name }}
          path: naca-utility-${{ matrix.name }}.log
          if-no-files-found: warn

  aggregate:
    name: Aggregate utility matrix logs and commit evidence
    needs: [variant]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all variant logs
        uses: actions/download-artifact@v4
        with:
          path: variant-logs
          pattern: naca-utility-logs-*
          merge-multiple: true

      - name: Assemble combined log
        run: |
          : > naca-utility-output.log
          for v in n64-simple-ct1e-4 n64-simple-ct1e-5 n64-simple-ct1e-6 n64-simple-ct1e-8 n64-simple-ct1e-10 n64-simplec-ct1e-4 n64-simplec-ct1e-5 n64-simplec-ct1e-6 n64-simplec-ct1e-8 n64-simplec-ct1e-10 n64-coupled-ct1e-4 n64-coupled-ct1e-5 n64-coupled-ct1e-6 n64-coupled-ct1e-8 n64-coupled-ct1e-10 n128-simple-ct1e-6 n128-simple-ct1e-8 n128-simple-ct1e-10 n128-coupled-ct1e-6 n128-coupled-ct1e-8 n128-coupled-ct1e-10; do
            if [ -f "variant-logs/naca-utility-$v.log" ]; then
              echo "NACA_VARIANT_BEGIN $v" >> naca-utility-output.log
              cat "variant-logs/naca-utility-$v.log" >> naca-utility-output.log
              echo "NACA_VARIANT_END $v" >> naca-utility-output.log
            else
              echo "NACA_VARIANT_MISSING variant=$v" >> naca-utility-output.log
            fi
          done
          echo "AGGREGATE_SECTIONS=$(grep -c 'NACA_VARIANT_BEGIN' naca-utility-output.log)/21" >> naca-utility-output.log

      - name: Extract compact summary
        run: |
          set -euo pipefail
          : > naca-utility-summary.log
          for v in n64-simple-ct1e-4 n64-simple-ct1e-5 n64-simple-ct1e-6 n64-simple-ct1e-8 n64-simple-ct1e-10 n64-simplec-ct1e-4 n64-simplec-ct1e-5 n64-simplec-ct1e-6 n64-simplec-ct1e-8 n64-simplec-ct1e-10 n64-coupled-ct1e-4 n64-coupled-ct1e-5 n64-coupled-ct1e-6 n64-coupled-ct1e-8 n64-coupled-ct1e-10 n128-simple-ct1e-6 n128-simple-ct1e-8 n128-simple-ct1e-10 n128-coupled-ct1e-6 n128-coupled-ct1e-8 n128-coupled-ct1e-10; do
            sed -n "/^NACA_VARIANT_BEGIN $v$/,/^NACA_VARIANT_END $v$/p" naca-utility-output.log > /tmp/variant.log
            if [ -s /tmp/variant.log ]; then
              awk '/NACA_CONFIG|NACA_DIAG status=|NACA0012_RE1000_A0|ITER_UTILITY|rejected|EXCEPTION/' /tmp/variant.log >> naca-utility-summary.log
              awk '/INCOMPRESSIBLE_ITER/' /tmp/variant.log | tail -n 4 >> naca-utility-summary.log
            else
              echo "SUMMARY_VARIANT_MISSING $v" >> naca-utility-summary.log
            fi
          done
          awk '/NACA_VARIANT_MISSING|AGGREGATE_SECTIONS/' naca-utility-output.log >> naca-utility-summary.log
          test -s naca-utility-summary.log

      - name: Commit combined and summary logs to diagnostic branch (fail loudly)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naca-utility-output.log naca-utility-summary.log
          if git diff --cached --quiet; then
            echo "AGGREGATE_ERROR: nothing staged to commit" >&2
            exit 1
          fi
          git commit -m "diag(naca0012): capture iteration-utility matrix logs [skip ci]"
          git pull --rebase --autostash
          git push
          echo "AGGREGATE_OK: logs committed on $(git rev-parse HEAD)"
