name: N9 Schur diagnostics (manual)

# Focused manual Schur-model diagnostics on a selected ref.
# The exact same five models are already in the full validation workflow;
# automatic PR triggers here would duplicate their compilation and runs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n9-physical-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build-n9-validation

jobs:
  n9-physical-validation:
    name: Manual Schur diagnosis (${{ matrix.schur_model }})
    # Manual reproducer; the same Schur models are in total-validation.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        schur_model: [pcd, lsc, bfbt, simple, simplec]

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev

      - name: Configure N9 validation build
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build N9 physical qualification test
        run: |
          cmake --build "$BUILD_DIR" \
            --target test_n9_physical_matrix \
            --parallel 2

      - name: Run N9-S7 physical qualification
        id: n9_test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir "$BUILD_DIR" \
            --output-on-failure \
            --verbose \
            -R '^test_n9_physical_matrix_${{ matrix.schur_model }}$' \
            2>&1 | tee "$BUILD_DIR/n9-physical-validation.log"

      - name: Upload N9 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: n9-s7-diagnostic-${{ matrix.schur_model }}-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/n9-physical-validation.log
            ${{ env.BUILD_DIR }}/Testing/
          if-no-files-found: warn
          retention-days: 30
