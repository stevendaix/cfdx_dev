name: NACA0012 COUPLED operator hardening (fix2)

# DIAG (temporary branch, never merged): second COUPLED round, hardening the
# fix1 operator per the code audit of commit 17b1838:
#   * a non-positive signed orthogonal area Sa = Sf.e is now REJECTED with the
#     face id and full face geometry (internal + boundary Dirichlet faces)
#     instead of being assembled silently;
#   * coupled_rc_nonpositive_sa_faces now counts UNIQUE physical faces
#     (owner-side visit only for internal faces);
#   * new per-face audit rc_flux_identity_linf: the ASSEMBLED coupled pressure
#     operator (implicit 2-point D + deferred non-orthogonal remainder,
#     evaluated on p_old) is compared on every internal and Dirichlet face
#     against the AUTHORITATIVE rhie_chow_pressure_flux_internal() / boundary
#     correction built from the same p_old, the same boundary Gauss gradient
#     and the same 1/A_P diagonals. This proves the operator identity on the
#     real campaign meshes (orthogonal near the airfoil, skewed farfield),
#     not merely a legacy delta;
#   * the aggregate job no longer masks a failed rebase (no "|| true") and
#     verifies after push that the log actually reached HEAD.
# Matrix unchanged from fix1: COUPLED_BLOCKLOCAL baseline/undamped/3-level,
# COUPLED_LSC, COUPLED_PCD, SIMPLE and SIMPLEC controls. Gates unchanged.

on:
  workflow_dispatch:
  push:
    branches: [diag/naca-coupled-fix2]

permissions:
  contents: write

jobs:
  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: coupled-baseline-fix,  model: COUPLED_BLOCKLOCAL, au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "1" }
          - { name: coupled-undamped-fix,  model: COUPLED_BLOCKLOCAL, au: "1.0", ap: "1.0",  levels: "1", trace: "5", cd: "1" }
          - { name: coupled-3level,        model: COUPLED_BLOCKLOCAL, au: "0.6", ap: "0.25", levels: "3", trace: "5", cd: "1" }
          - { name: coupled-lsc-fix,       model: COUPLED_LSC,        au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "1" }
          - { name: coupled-pcd-fix,       model: COUPLED_PCD,        au: "1.0", ap: "1.0",  levels: "1", trace: "5", cd: "1" }
          - { name: simple-anchor-control, model: SIMPLE,             au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "0" }
          - { name: simplec-control,       model: SIMPLEC,            au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "0" }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-naca
          .venv-naca/bin/python -m pip install --upgrade pip
          .venv-naca/bin/python -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh

      - name: Generate NACA0012 O-grid meshes (n64/n128/n256)
        run: |
          mkdir -p build-naca/validation_meshes
          .venv-naca/bin/python scripts/generate_2d_validation_meshes.py naca0012 \
            --output-dir build-naca/validation_meshes

      - name: Configure (Release, long validation ON)
        run: |
          cmake -S . -B build-naca -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/.venv-naca/bin/python"

      - name: Build test_naca0012_qualification
        run: cmake --build build-naca --target test_naca0012_qualification --parallel 2

      - name: Run variant ${{ matrix.name }}
        run: |
          set -o pipefail
          ./build-naca/test_naca0012_qualification \
            --model ${{ matrix.model }} \
            --alphau ${{ matrix.au }} \
            --alphap ${{ matrix.ap }} \
            --levels ${{ matrix.levels }} \
            --trace ${{ matrix.trace }} \
            --coupleddiag ${{ matrix.cd }} \
            build-naca/validation_meshes/naca0012_laminar_n64.h5 \
            build-naca/validation_meshes/naca0012_laminar_n128.h5 \
            build-naca/validation_meshes/naca0012_laminar_n256.h5 \
            2>&1 | tee naca-variant-${{ matrix.name }}.log

      - name: Enforce convergence gates
        if: success()
        env:
          EXPECTED_LEVELS: ${{ matrix.levels }}
          VARIANT_LOG: naca-variant-${{ matrix.name }}.log
        run: |
          set -euo pipefail
          awk -v expected="$EXPECTED_LEVELS" '
            /NACA_DIAG status=/ {
              count++
              if ($0 !~ /NACA_DIAG status=CONVERGED converged=1/) {
                print "NUMERICAL_GATE_FAIL: " $0 > "/dev/stderr"
                bad=1
              }
            }
            END {
              if (count != expected) {
                printf "NUMERICAL_GATE_FAIL: expected %d level verdicts, found %d\\n", expected, count > "/dev/stderr"
                bad=1
              }
              exit bad
            }
          ' "$VARIANT_LOG"

      - name: Upload variant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naca-variant-logs-${{ matrix.name }}
          path: naca-variant-${{ matrix.name }}.log
          if-no-files-found: warn

  aggregate:
    name: Aggregate and commit combined log
    needs: [variant]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all variant logs
        uses: actions/download-artifact@v4
        with:
          path: variant-logs
          pattern: naca-variant-logs-*
          merge-multiple: true

      - name: Assemble combined log
        run: |
          : > naca-coupled-fix2-output.log
          for v in coupled-baseline-fix coupled-undamped-fix coupled-3level coupled-lsc-fix coupled-pcd-fix simple-anchor-control simplec-control; do
            if [ -f "variant-logs/naca-variant-$v.log" ]; then
              echo "NACA_VARIANT_BEGIN $v" >> naca-coupled-fix2-output.log
              cat "variant-logs/naca-variant-$v.log" >> naca-coupled-fix2-output.log
              echo "NACA_VARIANT_END $v" >> naca-coupled-fix2-output.log
            else
              echo "NACA_VARIANT_MISSING variant=$v" >> naca-coupled-fix2-output.log
            fi
          done
          echo "AGGREGATE_SECTIONS=$(grep -c 'NACA_VARIANT_BEGIN' naca-coupled-fix2-output.log)/7" >> naca-coupled-fix2-output.log

      - name: Commit combined log to diagnostic branch (fail loudly)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naca-coupled-fix2-output.log
          if git diff --cached --quiet; then
            echo "AGGREGATE_ERROR: nothing staged to commit" >&2
            exit 1
          fi
          git commit -m "diag(naca0012): capture COUPLED fix2 matrix log [skip ci]"
          git pull --rebase --autostash
          git push
          git show HEAD:naca-coupled-fix2-output.log > /dev/null
          echo "AGGREGATE_OK: log committed on $(git rev-parse HEAD)"
