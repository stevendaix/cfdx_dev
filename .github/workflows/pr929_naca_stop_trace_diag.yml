name: PR929 NACA0012 stop-reason diagnostic v2 (diag)

# DIAG-ONLY — branche ci/long-campaign-diagnostics (PR #903 fermee, JAMAIS merger).
# Objectif (P1-b v2 demande par Steven, 2026-10-17 ~20:27Z) : rejouer le
#   diagnostic NACA sur le head ACTUEL en captant EXPLICITEMENT
#   convergence_status, convergence_reason (statuts OFFICIELS du solveur),
#   les rejets de transactions non lineaires (NonlinearRetryableFailure) et
#   la derniere iteration reellement executee — pour distinguer stagnation,
#   divergence, rejet de tentative et autre sortie prematuree. La v1
#   (capture-only, run 39060532348, head e1cbefee) avait borne l'arret du
#   solve N128 entre les iterations 1 et 200 (granularite de trace 200 trop
#   grossiere) et sa classification EARLY_STOP_RISING_RESIDUAL n'etait PAS
#   demontreee (comparaison inter-solves, pas intra-solve).
# INSTRUMENTATION ENV-GATED : patch fail-closed a 5 ancres uniques du solveur
#   du head epingle (aucune semantique modifiee ; no-op total sans la variable
#   d'environnement CFDX_NACA_STOP_DUMP_DIR). Dump TSV par solve :
#   kind=START / ITER (chaque tentative, tous les champs d'iteration) /
#   REJECTED (transaction non lineaire rejetee) / STOP (statut + raison
#   officiels). Un STOP ABSENT = sortie du solveur par exception (throw).
# Ref epinglee : head #929 5a680640b1229e115a19f4e980bac850f4031837.
# Verdicts fail-closed : EVIDENCE_COMPLETE (seul vert — diagnostic, PAS un
#   PASS/FAIL numerique), INCONCLUSIVE_PATCH_FAILED / BUILD / TEST_RUN /
#   NO_DUMP / NO_STOP_ROW, INCONCLUSIVE_ANALYZER_CRASH.
# Evidence suffixee $GITHUB_RUN_ID, commitee sur la branche diag par le bot.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/pr929_naca_stop_marker.txt'
      - '.github/workflows/pr929_naca_stop_trace_diag.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pr929-naca-stop-trace
  cancel-in-progress: false

env:
  HEAD_SHA_PIN: 5a680640b1229e115a19f4e980bac850f4031837
  EVID: diag-evidence/logs

jobs:
  naca-stop-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned ref and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin integration/numerics-2026-10
          # Fail-closed : le SHA pinné doit exister et être sur la branche
          # d'intégration (jamais un master mobile).
          git cat-file -e "$HEAD_SHA_PIN^{commit}" \
            || { echo "::error::pinned head SHA not resolvable: $HEAD_SHA_PIN"; exit 1; }
          git merge-base --is-ancestor "$HEAD_SHA_PIN" origin/integration/numerics-2026-10 \
            || { echo "::error::pinned head is not on integration branch: $HEAD_SHA_PIN"; exit 1; }
          git worktree add "$RUNNER_TEMP/head" "$HEAD_SHA_PIN"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "head_sha=$HEAD_SHA_PIN (pinned head of PR #929, env-gated diag instrumentation, solver semantics UNCHANGED)"
            echo "scope: instrumented run of test_naca0012_qualification (expected FAIL ~31 s) + best-effort test_naca0012_wall_shear_audit"
            echo "target: OFFICIAL convergence_status + convergence_reason + nonlinear transaction rejections + last executed iteration"
            echo "rule: EVIDENCE_COMPLETE is a diagnostic evidence verdict, never a numerical PASS/FAIL"
          } > "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_meta_run$GITHUB_RUN_ID.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python tooling
        id: pip
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip > /dev/null 2>&1
          "$RUNNER_TEMP/venv/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml > "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_pip_run$GITHUB_RUN_ID.log" 2>&1

      - name: Generate validation meshes (all, incl. NACA n64/128/256)
        id: meshgen
        continue-on-error: true
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/head/scripts/generate_2d_validation_meshes.py" all \
            --output-dir "$RUNNER_TEMP/validation_meshes" 2>&1 \
            | tee "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_meshgen_run$GITHUB_RUN_ID.log"
          for n in 64 128 256; do
            test -f "$RUNNER_TEMP/validation_meshes/naca0012_laminar_n$n.h5" \
              || { echo "::error::missing mesh naca0012_laminar_n$n.h5"; exit 1; }
          done

      - name: Apply diag instrumentation patch (fail-closed anchors, env-gated)
        run: |
          python3 - <<'PY'
          import hashlib, os, sys

          run_id = os.environ["GITHUB_RUN_ID"]
          evid = os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["EVID"])
          status_path = os.path.join(evid, "pr929x_nacastop_patch_status_run" + run_id + ".txt")
          solver = os.path.join(os.environ["RUNNER_TEMP"], "head", "src", "cfdx",
                                "physics", "steady_incompressible_solver.h")

          def fail(reason):
              with open(status_path, "w") as fh:
                  fh.write("patch_exit=1\nreason=" + reason + "\n")
              print("::error::instrumentation patch failed: " + reason)
              sys.exit(1)

          if not os.path.exists(solver):
              fail("solver file not found in worktree: " + solver)
          with open(solver, "r", encoding="utf-8") as fh:
              text = fh.read()
          sha_before = hashlib.sha256(text.encode("utf-8")).hexdigest()

          # Ancres fail-closed, verifiees UNIQUES sur le head epingle 5a680640
          # (fichier extrait du distant a ce SHA exact).
          A1 = "#include <functional>"
          A3 = "    validate_incompressible_controls(controls, mesh.n_cells());"
          A2 = "        result.history.push_back(h);"
          A4 = "                retry_controller.reject();"
          A5 = ("    if (pressure_context)\n"
                "        result.pressure_linear_context = pressure_context->stats();\n"
                "    return result;")
          for name, anchor in (("A1", A1), ("A3", A3), ("A2", A2), ("A4", A4), ("A5", A5)):
              n = text.count(anchor)
              if n != 1:
                  fail("anchor %s count=%d (expected 1)" % (name, n))

          # Insertions : instrumentation no-op sans CFDX_NACA_STOP_DUMP_DIR.
          # PIEGE : r-strings pour garder les \n du C++ LITERAUX (backslash-n),
          # pas des sauts de ligne Python. Les espaces dans reason/what sont
          # remplaces par '_' pour que chaque ligne du dump reste un TSV
          # tokennable (cle=valeur separees par des espaces).
          I1 = "#include <functional>\n#include <cstdlib>\n#include <fstream>\n"

          I3 = A3 + r"""
              static std::size_t cfdx_diag_solve_seq = 0;
              ++cfdx_diag_solve_seq;
              auto cfdx_diag_sanitize = [](std::string s) {
                  for (char& c : s) {
                      if (c == '\t' || c == '\n' || c == '\r' || c == ' ')
                          c = '_';
                  }
                  return s;
              };
              if (const char* cfdx_diag_dir = std::getenv("CFDX_NACA_STOP_DUMP_DIR")) {
                  std::ofstream cfdx_dump_out(std::string(cfdx_diag_dir) + "/naca_stop_dumps.tsv",
                                              std::ios::app);
                  cfdx_dump_out << "kind=START solve=" << cfdx_diag_solve_seq
                                << " n_cells=" << mesh.n_cells() << "\n";
              }
              """

          I2 = A2 + r"""
                  if (const char* cfdx_diag_dir = std::getenv("CFDX_NACA_STOP_DUMP_DIR")) {
                      std::ofstream cfdx_dump_out(std::string(cfdx_diag_dir) + "/naca_stop_dumps.tsv",
                                                  std::ios::app);
                      cfdx_dump_out << "kind=ITER solve=" << cfdx_diag_solve_seq
                                    << " iteration=" << h.iteration
                                    << " momentum_residual=" << h.momentum_residual
                                    << " pressure_residual=" << h.pressure_residual
                                    << " continuity_l1=" << h.continuity_l1
                                    << " continuity_linf=" << h.continuity_linf
                                    << " continuity_normalized=" << h.continuity_normalized
                                    << " momentum_rhs_scale=" << h.momentum_rhs_scale
                                    << " momentum_equation_residual_reference=" << h.momentum_equation_residual_reference
                                    << " momentum_equation_residual_rhs_relative=" << h.momentum_equation_residual_rhs_relative
                                    << " momentum_equation_residual=" << h.momentum_equation_residual
                                    << " momentum_equation_residual_relative=" << h.momentum_equation_residual_relative
                                    << " velocity_change_inf=" << h.velocity_change_inf
                                    << " pressure_change_inf=" << h.pressure_change_inf
                                    << " effective_alpha_u=" << h.effective_alpha_u
                                    << " effective_alpha_p=" << h.effective_alpha_p
                                    << " nonlinear_convergence_metric=" << h.nonlinear_convergence_metric
                                    << " momentum_linear_iterations=" << h.momentum_linear_iterations
                                    << " pressure_linear_iterations=" << h.pressure_linear_iterations
                                    << " pressure_correctors_used=" << h.pressure_correctors_used
                                    << " corrected_flux_continuity_linf=" << h.corrected_flux_continuity_linf
                                    << " reconstructed_velocity_continuity_linf=" << h.reconstructed_velocity_continuity_linf
                                    << " flux_velocity_mismatch_linf=" << h.flux_velocity_mismatch_linf
                                    << " momentum_residual_cell=" << h.momentum_residual_cell
                                    << " momentum_residual_patch=" << cfdx_diag_sanitize(h.momentum_residual_patch)
                                    << " mass_normalized_imbalance=" << h.mass_normalized_imbalance
                                    << " boundedness_nonfinite_velocity=" << h.boundedness_nonfinite_velocity
                                    << "\n";
                  }
                  """

          I4 = A4 + r"""
                          if (const char* cfdx_diag_dir = std::getenv("CFDX_NACA_STOP_DUMP_DIR")) {
                              std::ofstream cfdx_dump_out(std::string(cfdx_diag_dir) + "/naca_stop_dumps.tsv",
                                                          std::ios::app);
                              cfdx_dump_out << "kind=REJECTED solve=" << cfdx_diag_solve_seq
                                            << " iteration=" << iter
                                            << " retries=" << retry_controller.retries()
                                            << " reason=" << cfdx_diag_sanitize(error.what())
                                            << "\n";
                          }
                          """

          I5 = r"""    if (pressure_context)
                  result.pressure_linear_context = pressure_context->stats();
              if (const char* cfdx_diag_dir = std::getenv("CFDX_NACA_STOP_DUMP_DIR")) {
                  std::ofstream cfdx_dump_out(std::string(cfdx_diag_dir) + "/naca_stop_dumps.tsv",
                                              std::ios::app);
                  cfdx_dump_out << "kind=STOP solve=" << cfdx_diag_solve_seq
                                << " iterations=" << result.iterations
                                << " converged=" << (result.converged ? 1 : 0)
                                << " status=" << cfdx::core::to_string(result.convergence_status)
                                << " reason=" << cfdx_diag_sanitize(result.convergence_reason)
                                << "\n";
              }
              return result;"""

          new = text.replace(A1, I1, 1).replace(A3, I3, 1).replace(A2, I2, 1) \
                    .replace(A4, I4, 1).replace(A5, I5, 1)

          # Post-conditions fail-closed : chaque bloc insere exactement une fois.
          post = [
              ("A1_present", new.count(A1), 1),
              ("A3_present", new.count(A3), 1),
              ("A2_present", new.count(A2), 1),
              ("A4_present", new.count(A4), 1),
              # PIEGE : A5 est CONSOMMEE par l'insertion — le bloc STOP s'insere
              # ENTRE le prefixe 2 lignes et le "return result;", donc la sequence
              # A5 complete n'existe plus apres le patch. On verifie le prefixe.
              ("A5_prefix_present", new.count(A5.split("\n")[0] + "\n" + A5.split("\n")[1]), 1),
              ("solve_seq_count", new.count("cfdx_diag_solve_seq"), 6),
              ("getenv_count", new.count('std::getenv("CFDX_NACA_STOP_DUMP_DIR")'), 4),
              ("sanitize_count", new.count("cfdx_diag_sanitize"), 4),
              ("start_rows", new.count('"kind=START'), 1),
              ("iter_rows", new.count('"kind=ITER'), 1),
              ("rejected_rows", new.count('"kind=REJECTED'), 1),
              ("stop_rows", new.count('"kind=STOP'), 1),
          ]
          for name, got, want in post:
              if got != want:
                  fail("post-condition %s=%d (expected %d)" % (name, got, want))

          with open(solver, "w", encoding="utf-8") as fh:
              fh.write(new)
          sha_after = hashlib.sha256(new.encode("utf-8")).hexdigest()
          with open(status_path, "w") as fh:
              fh.write("patch_exit=0\n")
              fh.write("sha256_before=" + sha_before + "\n")
              fh.write("sha256_after=" + sha_after + "\n")
              for name, got, want in post:
                  fh.write("%s=%d\n" % (name, got))
          print("instrumentation patch applied: " + sha_before[:12] + " -> " + sha_after[:12])
          PY

      - name: Configure and build (pinned head + env-gated diag instrumentation)
        id: build_head
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -S "$RUNNER_TEMP/head" -B "$RUNNER_TEMP/head/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON -DCFDX_BUILD_PYTHON=OFF -DCFDX_USE_HDF5_SERIAL=OFF -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_configure_run$GITHUB_RUN_ID.log"
          TARGETS="test_naca0012_qualification"
          AUDIT="test_naca0012_wall_shear_audit"
          # PIEGE DURABLE : la sortie de `ninja -t targets all` est au format
          # "target: rule" -> retirer le ':' final avant comparaison exacte.
          if ! avail_raw="$(ninja -C "$RUNNER_TEMP/head/build" -t targets all 2>&1)"; then
            echo "::error::ninja -t targets failed — build system error, not a missing target"
            exit 1
          fi
          avail="$(printf '%s\n' "$avail_raw" | awk '{sub(/:$/, "", $1); print $1}' | sort -u)"
          for t in $TARGETS; do
            printf '%s\n' "$avail" | grep -qx "$t" || { echo "::error::missing CMake target: $t"; exit 1; }
          done
          if printf '%s\n' "$avail" | grep -qx "$AUDIT"; then
            echo "$AUDIT available" > "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_audit_target_run$GITHUB_RUN_ID.txt"
            TARGETS="$TARGETS $AUDIT"
          else
            echo "$AUDIT MISSING (capture best-effort, non bloquant)" > "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_audit_target_run$GITHUB_RUN_ID.txt"
          fi
          cmake --build "$RUNNER_TEMP/head/build" --target $TARGETS --parallel 2 \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_build_run$GITHUB_RUN_ID.log"
          cp -r "$RUNNER_TEMP/validation_meshes" "$RUNNER_TEMP/head/build/validation_meshes"
          test -f "$RUNNER_TEMP/head/build/validation_meshes/naca0012_laminar_n64.h5" \
            || { echo "::error::meshes not in place in build dir"; exit 1; }
          echo "build_head_exit=0" > "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_build_status_run$GITHUB_RUN_ID.txt"

      - name: Record build failure status
        if: always() && steps.build_head.outcome == 'failure'
        run: |
          echo "build_head_exit=nonzero" > "$GITHUB_WORKSPACE/$EVID/pr929x_nacastop_build_status_run$GITHUB_RUN_ID.txt"

      - name: Run NACA0012 qualification (capture full output + diag dump)
        id: naca_run
        continue-on-error: true
        env:
          CFDX_NACA_STOP_DUMP_DIR: ${{ github.workspace }}/diag-evidence/logs
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          ctest --test-dir "$RUNNER_TEMP/head/build" -R '^test_naca0012_qualification$' -N > "$E/pr929x_nacastop_testlist_run$GITHUB_RUN_ID.log" 2>&1
          grep -q "test_naca0012_qualification" "$E/pr929x_nacastop_testlist_run$GITHUB_RUN_ID.log" \
            || { echo "naca_discovery=MISSING" > "$E/pr929x_nacastop_test_status_run$GITHUB_RUN_ID.txt"; echo "::error::test not discovered"; exit 1; }
          # PIEGE DURABLE : steps run: = bash -e par defaut. Le test est attendu
          # en ECHEC (defaut pre-existant documente) — set +e + capture rc.
          set +e
          ctest --test-dir "$RUNNER_TEMP/head/build" -R '^test_naca0012_qualification$' --output-on-failure \
            --output-junit "$E/pr929x_nacastop_junit_run$GITHUB_RUN_ID.xml" \
            2>&1 | tee "$E/pr929x_nacastop_qualification_run$GITHUB_RUN_ID.log"
          rc=${PIPESTATUS[0]}
          echo "naca_test_exit=$rc" > "$E/pr929x_nacastop_test_status_run$GITHUB_RUN_ID.txt"
          # Audit cisaillement pariétal : capture best-effort (echec en cascade attendu).
          if grep -q "available" "$E/pr929x_nacastop_audit_target_run$GITHUB_RUN_ID.txt" 2>/dev/null; then
            ctest --test-dir "$RUNNER_TEMP/head/build" -R '^test_naca0012_wall_shear_audit$' --output-on-failure \
              2>&1 | tee "$E/pr929x_nacastop_wallshear_run$GITHUB_RUN_ID.log"
            rca=${PIPESTATUS[0]}
            echo "wallshear_test_exit=$rca" >> "$E/pr929x_nacastop_test_status_run$GITHUB_RUN_ID.txt"
          fi
          # Le dump TSV de l'instrumentation (START/ITER/REJECTED/STOP par
          # solve) a atterri dans diag-evidence/logs via la variable d'env.
          # Renommage suffixe run_id : pas d'ecrasement entre runs successifs.
          if [ -f "$E/naca_stop_dumps.tsv" ]; then
            mv "$E/naca_stop_dumps.tsv" "$E/pr929x_nacastop_dumps_run$GITHUB_RUN_ID.tsv"
            echo "naca_dump=present" >> "$E/pr929x_nacastop_test_status_run$GITHUB_RUN_ID.txt"
          else
            echo "naca_dump=MISSING" >> "$E/pr929x_nacastop_test_status_run$GITHUB_RUN_ID.txt"
          fi
          echo "naca_test_exit=$rc (echec ATTENDU : defaut pre-existant documente)"
          exit 0

      - name: Structured fail-closed verdict and stop-reason analysis
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, sys, traceback

          run_id = os.environ["GITHUB_RUN_ID"]
          evid = os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["EVID"])
          verdict_path = os.path.join(evid, "pr929x_nacastop_verdict_run" + run_id + ".txt")
          report_path = os.path.join(evid, "pr929x_nacastop_analysis_run" + run_id + ".txt")
          qual_log = os.path.join(evid, "pr929x_nacastop_qualification_run" + run_id + ".log")
          shear_log = os.path.join(evid, "pr929x_nacastop_wallshear_run" + run_id + ".log")
          build_path = os.path.join(evid, "pr929x_nacastop_build_status_run" + run_id + ".txt")
          test_status = os.path.join(evid, "pr929x_nacastop_test_status_run" + run_id + ".txt")
          patch_path = os.path.join(evid, "pr929x_nacastop_patch_status_run" + run_id + ".txt")
          dumps_path = os.path.join(evid, "pr929x_nacastop_dumps_run" + run_id + ".txt")

          EXCEPTION = "NACA0012 solver did not converge"
          TRACE_PREFIX = "INCOMPRESSIBLE_ITER"
          STDERR_REJECT = "CFDX nonlinear iteration"

          rep = []
          def emit(line=""):
              rep.append(line)

          def write_all(verdict, extra=()):
              try:
                  with open(verdict_path, "w") as fh:
                      fh.write("VERDICT: " + verdict + "\n")
                      for l in extra:
                          fh.write(l + "\n")
              except Exception:
                  pass
              try:
                  with open(report_path, "w") as fh:
                      fh.write("\n".join(rep) + "\n")
              except Exception:
                  pass

          # ctest (-V / --output-on-failure) prefixes output lines with the test
          # number "NN: " — le piege du parseur N11 (#907). On le retire.
          CTEST_PREFIX = re.compile(r"^\s*\d+:\s?(.*)$")
          def strip_prefix(line):
              m = CTEST_PREFIX.match(line)
              return m.group(1) if m else line

          KV = re.compile(r"([A-Za-z_][A-Za-z0-9_]*)=(-?[0-9]+\.?[0-9]*(?:[eE][-+]?[0-9]+)?)")
          def parse_kv(text):
              return dict(KV.findall(text))

          def read_stripped_lines(path):
              if not os.path.exists(path):
                  return None
              with open(path, errors="replace") as fh:
                  return [strip_prefix(l.rstrip("\n")) for l in fh]

          # ---- parse du dump TSV de l'instrumentation (k=v separes par espaces) ----
          def parse_dump_rows(path):
              rows = []
              with open(path, errors="replace") as fh:
                  for raw in fh:
                      line = raw.rstrip("\n").strip()
                      if not line:
                          continue
                      d = {}
                      for tok in line.split():
                          if "=" in tok:
                              k, v = tok.split("=", 1)
                              d[k] = v
                      if d.get("kind"):
                          rows.append(d)
              return rows

          def group_solves(rows):
              solves = []
              cur = None
              for d in rows:
                  kind = d.get("kind")
                  if kind == "START":
                      cur = {"solve": d.get("solve", "?"), "n_cells": d.get("n_cells", "?"),
                             "iters": [], "rejected": [], "stop": None}
                      solves.append(cur)
                  elif cur is None:
                      continue
                  elif kind == "ITER":
                      cur["iters"].append(d)
                  elif kind == "REJECTED":
                      cur["rejected"].append(d)
                  elif kind == "STOP":
                      cur["stop"] = d
              return solves

          def last_exec(dicts):
              last = None
              for d in dicts:
                  v = d.get("iteration")
                  if v is not None:
                      last = int(float(v))
              return last

          try:
              # ---- gate 0 : instrumentation patch (fail-closed) --------------
              patch_lines = []
              if os.path.exists(patch_path):
                  patch_lines = open(patch_path, errors="replace").read().splitlines()
              if not any(l.startswith("patch_exit=0") for l in patch_lines):
                  emit("== Instrumentation patch ==")
                  for l in patch_lines[:20]:
                      emit("  " + l)
                  if not patch_lines:
                      emit("  (fichier de statut absent : le step de patch n'a pas abouti)")
                  write_all("INCONCLUSIVE_PATCH_FAILED",
                            patch_lines[:5] or ["patch status file missing"])
                  sys.exit(0)

              # ---- gate 1 : build (INCONCLUSIVE != PASS) ---------------------
              if os.path.exists(build_path):
                  bs = open(build_path).read().strip()
              else:
                  bs = "build_status_missing"
              if not bs.endswith("exit=0"):
                  emit("build_status=" + bs)
                  emit("compiler output in pr929x_nacastop_build_run" + run_id + ".log")
                  write_all("INCONCLUSIVE_BUILD", ["build_status=" + bs])
                  sys.exit(0)

              # ---- gate 2 : qualification log --------------------------------
              if not os.path.exists(qual_log):
                  write_all("INCONCLUSIVE_TEST_RUN", ["no qualification log produced"])
                  sys.exit(0)

              lines = read_stripped_lines(qual_log)
              exc_idx = [i for i, l in enumerate(lines) if EXCEPTION in l]

              # ---- gate 3 : dump d'instrumentation ---------------------------
              if not os.path.exists(dumps_path):
                  emit("dump absent : pr929x_nacastop_dumps_run" + run_id + ".txt")
                  if os.path.exists(test_status):
                      emit(open(test_status).read())
                  write_all("INCONCLUSIVE_NO_DUMP", ["no naca_stop_dumps.tsv captured"])
                  sys.exit(0)
              rows = parse_dump_rows(dumps_path)
              solves = group_solves(rows)
              if not solves:
                  write_all("INCONCLUSIVE_NO_DUMP", ["dump present but no kind=START row"])
                  sys.exit(0)

              # ---- rapport par solve : statuts OFFICIELS, aucune inference ---
              emit("== NACA0012 stop-reason diagnostic v2 — head epingle + instrumentation env-gated ==")
              emit("regle de lecture : ITER = tentative dans le try (peut etre roulee back) ;")
              emit("  REJECTED = transaction non lineaire rejetee ; STOP fait autorite")
              emit("  (iterations officielles) ; STOP ABSENT = sortie par exception (throw).")
              emit("solves = " + str(len(solves)) + " | exception '" + EXCEPTION
                   + "' dans le log : " + str(bool(exc_idx)))
              for s in solves:
                  emit()
                  emit("== Solve " + str(s["solve"]) + " (n_cells=" + str(s["n_cells"]) + ") ==")
                  le = last_exec(s["iters"])
                  emit("ITER rows (tentatives) = " + str(len(s["iters"]))
                       + " | derniere iteration reellement executee = " + str(le))
                  emit("transactions non lineaires rejetees = " + str(len(s["rejected"])))
                  for d in s["rejected"]:
                      emit("  REJECTED iter=" + str(d.get("iteration", "?"))
                           + " retries=" + str(d.get("retries", "?"))
                           + " reason=" + str(d.get("reason", "?"))[:160])
                  if s["stop"] is not None:
                      st = s["stop"]
                      emit("STOP OFFICIEL : iterations=" + str(st.get("iterations"))
                           + " converged=" + str(st.get("converged"))
                           + " status=" + str(st.get("status"))
                           + " reason=" + str(st.get("reason")))
                  else:
                      emit("STOP ABSENT : sortie par EXCEPTION (throw) — le solveur n'a")
                      emit("  pas atteint la fin normale ; iterations officielles indisponibles")
                      if s["rejected"]:
                          emit("  dernier REJECTED reason="
                               + str(s["rejected"][-1].get("reason", "?"))[:200])
                  emit("trajectoire (TOUTES les iterations executees, instrumentation) :")
                  emit("iteration\tmom_eq_rel\tcont_norm\tmismatch\talpha_u\talpha_p")
                  for d in s["iters"]:
                      emit("%s\t%s\t%s\t%s\t%s\t%s" % (
                          d.get("iteration", "?"),
                          d.get("momentum_equation_residual_relative", "n/a"),
                          d.get("continuity_normalized", "n/a"),
                          d.get("flux_velocity_mismatch_linf", "n/a"),
                          d.get("effective_alpha_u", "n/a"),
                          d.get("effective_alpha_p", "n/a")))
                  emit("champ par champ de la DERNIERE tentative (ITER) :")
                  if s["iters"]:
                      for k in sorted(s["iters"][-1].keys()):
                          emit("  " + k + "=" + str(s["iters"][-1][k]))

              # ---- cross-check avec la capture brute (elements v1 conserves) --
              emit()
              emit("== Cross-check log brut ==")
              traces = [(i, parse_kv(l)) for i, l in enumerate(lines) if TRACE_PREFIX in l]
              lti = None
              for _, d in traces:
                  v = d.get("iter")
                  if v is not None:
                      lti = int(float(v))
              emit("traces " + TRACE_PREFIX + " (freq 200) = " + str(len(traces))
                   + " | derniere trace iter=" + str(lti)
                   + " (granularite 200 : a confronter aux ITER rows ci-dessus)")
              stderr_rej = [l for l in lines if STDERR_REJECT in l and "rejected" in l]
              emit("lignes stderr '" + STDERR_REJECT + " ... rejected' = "
                   + str(len(stderr_rej)))
              for l in stderr_rej[:10]:
                  emit("  | " + l.strip()[:200])
              n_rej_rows = sum(len(s["rejected"]) for s in solves)
              if len(stderr_rej) != n_rej_rows:
                  emit("NOTE : stderr rejets=" + str(len(stderr_rej))
                       + " != dump REJECTED=" + str(n_rej_rows) + " (a examiner)")
              if exc_idx:
                  emit("exception ligne " + str(exc_idx[0]) + " : " + EXCEPTION)
                  emit("== Contexte brut : 30 dernieres lignes avant l'exception ==")
                  for l in lines[max(0, exc_idx[0] - 30):exc_idx[0] + 3]:
                      emit("  | " + l)
              else:
                  emit("exception '" + EXCEPTION + "' ABSENTE du log capture")
              marker_re = re.compile(
                  r"STAGNATED|stagnat|DIVERG|diverg|MAX_ITERATIONS|\bnan\b|NaN|\binf\b")
              markers = []
              for i, l in enumerate(lines):
                  if TRACE_PREFIX in l:
                      continue
                  m = marker_re.search(l)
                  if m:
                      markers.append((i, m.group(0), l.strip()[:160]))
              if markers:
                  emit("marqueurs hors traces :")
                  for i, pat, l in markers[:20]:
                      emit("  ligne " + str(i) + " [" + pat + "] " + l)
              else:
                  emit("aucun marqueur STAGNATED/DIVERG/MAX_ITERATIONS/nan/inf explicite hors traces")

              # ---- audit cisaillement (best-effort, echec en cascade attendu) --
              emit()
              emit("== Audit cisaillement parietal (best-effort, echec en cascade attendu) ==")
              shear_state = "ABSENT"
              if os.path.exists(shear_log):
                  slines = read_stripped_lines(shear_log)
                  sexc = [i for i, l in enumerate(slines) if "did not converge" in l]
                  emit("log present : " + str(len(slines)) + " lignes, exceptions="
                       + str(len(sexc)))
                  if sexc:
                      emit("exception audit ligne " + str(sexc[0]) + " : "
                           + slines[sexc[0]].strip()[:200])
                  ctx = [l for l in slines if "NACA0012" in l or "WALL_SHEAR" in l]
                  for l in ctx[:15]:
                      emit("  | " + l.strip()[:160])
                  shear_state = "CAPTURED" if slines else "EMPTY"
              else:
                  emit("log absent (cible absente ou non executee)")
              emit("audit_state=" + shear_state)
              emit("(les solves de l'audit, s'il a tourne, sont dans le meme dump TSV)")

              # ---- synthese : reponse OFFICIELLE a la question P1-b -----------
              emit()
              emit("== Synthese (statuts OFFICIELS du solveur, aucune inference) ==")
              n_stop = sum(1 for s in solves if s["stop"] is not None)
              n_thrown = len(solves) - n_stop
              emit("solves=" + str(len(solves)) + " avec_STOP=" + str(n_stop)
                   + " sans_STOP(exception)=" + str(n_thrown))
              for s in solves:
                  if s["stop"] is not None:
                      st = s["stop"]
                      emit("  solve " + str(s["solve"]) + " n_cells=" + str(s["n_cells"])
                           + " : status=" + str(st.get("status"))
                           + " converged=" + str(st.get("converged"))
                           + " iterations=" + str(st.get("iterations"))
                           + " reason=" + str(st.get("reason")))
                  else:
                      emit("  solve " + str(s["solve"]) + " n_cells=" + str(s["n_cells"])
                           + " : EXCEPTION, derniere iteration tentee=" + str(last_exec(s["iters"]))
                           + ", dernier REJECTED reason="
                           + (str(s["rejected"][-1].get("reason")) if s["rejected"] else "aucun"))

              if n_stop == 0 and not exc_idx:
                  write_all("INCONCLUSIVE_NO_STOP_ROW",
                            ["no STOP row and no exception — stop reason not classifiable"])
                  sys.exit(0)

              write_all("EVIDENCE_COMPLETE", [
                  "solves=" + str(len(solves)),
                  "solves_with_stop=" + str(n_stop),
                  "solves_thrown=" + str(n_thrown),
                  "exception_in_log=" + str(bool(exc_idx)),
                  "audit_state=" + shear_state,
                  "interpretation: EVIDENCE_COMPLETE = capture instrumentee auto-coherente ;",
                  "les statuts rapportes sont les statuts OFFICIELS du solveur, PAS une inference ;",
                  "ceci est un DIAGNOSTIC de la raison d'arret, PAS un verdict de correction numerique.",
              ])
          except Exception:
              emit("ANALYZER CRASH:")
              emit(traceback.format_exc())
              write_all("INCONCLUSIVE_ANALYZER_CRASH", ["analyzer crashed — see report"])
          PY

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: PR 929 NACA0012 stop-reason v2 run $GITHUB_RUN_ID (#929 P1-b) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Post verdict comment to PR #929 (best effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "## NACA0012 — raison d'arrêt officielle du solveur (P1-b v2) — run $GITHUB_RUN_ID — verdict : $(sed -n 's/^VERDICT: //p' "$E/pr929x_nacastop_verdict_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo UNKNOWN)"
            echo
            echo "Réf épinglée : \`$HEAD_SHA_PIN\` (head #929 actuel ; instrumentation env-gated du solveur dans le worktree du runner UNIQUEMENT, sémantique inchangée, no-op sans \`CFDX_NACA_STOP_DUMP_DIR\`)."
            echo "Évidence : \`diag-evidence/logs/pr929x_nacastop_*_run$GITHUB_RUN_ID.*\` — dont \`pr929x_nacastop_dumps_run$GITHUB_RUN_ID.tsv\` (START / ITER / REJECTED / STOP par solve : convergence_status, convergence_reason, rejets de transactions non linéaires, dernière itération réellement exécutée) — sur \`ci/long-campaign-diagnostics\`."
            echo
            echo "Règle d'interprétation (Steven) : \`EVIDENCE_COMPLETE\` = capture instrumentée auto-cohérente — PAS un PASS/FAIL numérique. Les statuts rapportés sont les statuts OFFICIELS du solveur, pas une inference. Le test NACA reste attendu en échec tant que la non-convergence pré-existante n'est pas résolue."
            echo
            echo '~~~'
            cat "$E/pr929x_nacastop_analysis_run$GITHUB_RUN_ID.txt" 2>/dev/null || cat "$E/pr929x_nacastop_verdict_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo "(analyse indisponible)"
            echo '~~~'
          } > /tmp/comment.md 2>/dev/null || true
          if [ ! -s /tmp/comment.md ]; then echo "(comment vide)" > /tmp/comment.md; fi
          jq -n --rawfile body /tmp/comment.md '{body: $body}' > /tmp/payload.json
          http=$(curl -sS --fail-with-body -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/929/comments" \
            -d @/tmp/payload.json) || http=failed
          echo "POST to #929: $http"
          exit 0

      - name: Final verdict (green only for EVIDENCE_COMPLETE)
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          if grep -q "^VERDICT: EVIDENCE_COMPLETE" "$E/pr929x_nacastop_verdict_run$GITHUB_RUN_ID.txt" 2>/dev/null; then
            echo "verdict: EVIDENCE_COMPLETE — trace d'arrêt capturée et analysée (diagnostic de localisation, PAS un PASS numérique)"
          else
            v=$(sed -n 's/^VERDICT: //p' "$E/pr929x_nacastop_verdict_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo "MISSING_VERDICT_FILE")
            echo "::error::verdict=$v — voir diag-evidence/logs/pr929x_nacastop_verdict_run$GITHUB_RUN_ID.txt"
            exit 1
          fi
