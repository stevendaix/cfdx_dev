name: NACA0012 additive-region culprit probes (round 9b)

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 9b): identify the culprit set of solver-diff regions at the
# finest BUILDABLE region granularity, with a production-grade 3-level
# confirmation of a fixing revert. Locked context:
#   round 7 (run 39663748207) IN_TRIO_CULPRIT: v1_green_trio PASS_3_LEVELS
#     (N64 433 / N128 995 / N256 3989 it), v0 FAIL_DIVERGED.
#   round 8 (run 39672681948) COMBINATION_OR_COUPLED: test (v0b) and
#     convergence_history (vC) proven behavior-neutral; each of the 5
#     individually-revertable regions r2/r4/r5/r8/r9 still FAIL_DIVERGED
#     when reverted ALONE (no single one is the culprit); the 4 coupled
#     regions r1/r3/r6/r7 are INCONCLUSIVE_BUILD when reverted alone.
#   round 9 (run 39722433948) A9_ANCHOR_ANOMALY - INVALID, mechanical:
#     the N128-only invocation passed ONE mesh file to a binary that
#     requires THREE (usage: ... mesh_n64.h5 mesh_n128.h5 mesh_n256.h5),
#     so every built variant died in 0 s with FAIL_OTHER. Additionally
#     its leave-one-out hybrids k2/k4..k9 do not compile.
#
# Compile-coupling map (proven by the round-9 build logs, same pins):
#   master r2 -> r1 (cell_turbulent_viscosity)
#   master r4 -> r3 (pressure_face_orthogonal_coefficient / _nonorthogonal_flux)
#   master r5 -> r1 (coupled_assembly_callback / CoupledAssemblySnapshot)
#   master r6 -> r1 (cell_turbulent_viscosity)
#   master r7 -> r3 (pressure_face_orthogonal_coefficient / _nonorthogonal_flux)
#   master r8 -> r1 (IncompressibleIteration momentum_rhs_scale* members)
#   master r9 -> r3 and -> r6 (pressure_face_* ; mu_eff double* vs vector*)
#   green  r7 -> green r6 (assemble_momentum_component signature)
#   r1 and r3 are self-contained (k1 and k3 built cleanly in round 9).
# A revert set S is buildable iff every KEPT master region has all its
# dependencies kept master, and no green-form region needs a green-only
# symbol from a kept-master region.
#
# Method: ADDITIVE probes over buildable revert sets. Revert S to green
# fixes the N128 divergence iff culprit C is a subset of S (monotone).
# Phase A (fixed): a0 (master anchor, expect FAIL_DIVERGED), a9 (all-9
# revert = green, expect PASS), k1/k3 (leave-one-out roots, buildable),
# d4 = revert {r2,r4,r5,r8}, b1 = revert {r1,r2,r5,r6,r7,r8,r9} (keep
# r3,r4), b3 = revert {r3,r4,r6,r7,r9} (keep r1,r2,r5,r8).
# Phase B (adaptive, pre-coded):
#   k1 FAIL -> culprit = {r1} exactly (r1 alone reproduces); confirm
#     with c_b1 (3 levels).
#   k3 FAIL -> culprit = {r3} exactly; confirm with c_b3.
#   d4 PASS -> culprit within {r2,r4,r5,r8}: pair hunt p24/p25/p28/
#     p45/p48/p58 then triple hunt t245/t248/t258/t458; the first
#     passing set is EXACTLY the culprit (each single already FAIL in
#     round 8, so no strict subset can contain C); 3-level confirm.
#   b1+b3 PASS -> culprit within b1 ∩ b3 = {r6,r7,r9}; these are
#     mutually compile-coupled, so the trio is the finest region
#     resolution; confirm c_b679 (3 levels).
#   b1 PASS + b3 FAIL -> culprit intersects {r2,r5,r8}: sr1 = revert
#     {r2,r5,r6,r7,r8,r9} tests r1; PASS -> pair hunt p25/p28/p58 then
#     t258 then conservative sr1; FAIL -> r1 necessary -> conservative
#     b1, 3-level confirm.
#   b1 FAIL + b3 PASS -> culprit intersects {r3,r4}: s149 = revert
#     {r4,r6,r7,r9} tests r3; PASS -> b679 narrows to the trio or r4 is
#     necessary (conservative s149); FAIL -> r3 necessary -> b679-free
#     conservative b3, 3-level confirm.
#   b1 FAIL + b3 FAIL -> joint culprit across both sides; sr1 adds the
#     r1/r3/r4-side information; region granularity exhausted.
# All Phase B sets were build-verified against the coupling map above;
# a build failure is still recorded fail-closed as INCONCLUSIVE_BUILD
# and never interpreted as behavior.
#
# Levels: every variant runs the SAME binary with ALL THREE meshes
# (the round-9 lesson: the test requires 3 mesh arguments). The N128
# discriminator uses timeout 600 s: green reaches the N128 level marker
# (~995 it) well inside the window, then the run is killed inside N256;
# rc=124 + "level=128 Cd=" marker => PASS_128. Divergence at N128
# after a completed N64 marker => FAIL_DIVERGED (the known signature).
# Divergence before N64 (FAIL_DIVERGED_64), at N256 (FAIL_DIVERGED_256),
# timeouts without the N128 marker (INCONCLUSIVE_TIMEOUT) and any other
# failure (FAIL_OTHER) are recorded but never interpreted as behavior.
# Confirmations (c_*) run the full 3 levels with timeout 3600 s and
# require rc=0 => PASS_3_LEVELS for a production-grade verdict.
#
# Interpretation guide (round 9b) - valid only if a0 FAIL_DIVERGED and
# a9 PASS (else A0_/A9_ANCHOR_ANOMALY, repeat):
#   REGION_CULPRIT_R1 / _R3: single-region culprit proven (k_i FAIL =
#     only region i in master form already diverges at N128), plus the
#     3-level pass of the closure revert -> production PR = revert the
#     culprit region's hunks AND the dependent hunks that consume their
#     master-only symbols (decision Steven); round 10 hunk-level can
#     narrow inside the region if wanted.
#   REGION_SET_CULPRIT <set>: exact set (first passing pair/triple in
#     {r2,r4,r5,r8} with all singles FAIL in round 8, or {r2,r5,8}
#     variants, or the d4 quad) + 3-level confirmation.
#   REGION_SET_CULPRIT_TRIO {r6,r7,r9}: finest region resolution for a
#     culprit inside the mutually-coupled trio.
#   REGION_SET_CULPRIT_CONSERVATIVE <set> with proven-necessary members:
#     the set provably fixes (3-level), but the exact subset needs
#     hunk-level analysis (round 10) - production can revert the whole
#     conservative set as-is (decision Steven).
#   JOINT_CROSS_BLOCK: culprit members on both sides of the block;
#     production fallback = full green solver swap (proven PASS_3_LEVELS
#     in round 7 v1 at these pins) or round 10 hunk-level bisect.
#   MONOTONICITY_VIOLATION / CONFIRM_ANOMALY / INCOMPLETE_* / unknown
#     outcomes -> repeat before concluding; never interpret.
#
# NOTE: the green test has the OLD #926 Cd_pressure sign convention
# (Fxp+=-pp): compare iterations/convergence behaviour, NEVER raw Cd
# signs.
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is changed
# (hybrids live only in throwaway worktrees on the diagnostics branch
# runner); evidence is committed per variant so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-r9b-additive
  cancel-in-progress: false

jobs:
  naca-r9b-variants:
    name: NACA additive-region probes at pinned master commit (round 9b)
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    env:
      MASTER_PIN: 28e4d183b258997c5b923b2e05569263e900f2ff
      GREEN_PIN: a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1
      GREEN_MD5: 63db7905347576beec20993919d6015e
      MASTER_MD5: af085014acfc35a0e9ab4946c3f46381
      MD5_K1: 24f2a8ec8cd6d89245732e49b094e917
      MD5_K3: 58c8c3aa54723f1676ff088fb16e9877
      MD5_D4: e7a7ee2ce2a0e964f9bfedbec27f6206
      MD5_B1: ab94ccd5a05cf77c9af17865be46bfcc
      MD5_B3: 8017990b8e187232a9f4995f0d7e6cec
      MD5_B679: 630a0dedb4cb77e0ff68a9c3a6c7eeca
      MD5_SR1: 59fcd2d5f94034f86620716212a89613
      MD5_S149: e8832b24ab49de703162137ab75d96f2
      MD5_P24: 9d85d5b47d3dc40e65ce262e2a997350
      MD5_P25: dd76bd608cb58c160fe290f23dee4e93
      MD5_P28: 25c70898b67d24f39680bf343ef349aa
      MD5_P45: 0c99172f8b8563ae577bd310818c1ef2
      MD5_P48: bcd6afaa4e52b8520c466e57336b68d7
      MD5_P58: f01c363e00d2bef4e0a1d7d94f44bfa6
      MD5_T245: bb2a3c250e103ddb23c81cf67ed85b64
      MD5_T248: 5dd72beead6e75d88330921ec5cfca98
      MD5_T258: a11cd4880561bc1b38d7f1f2c307c166
      MD5_T458: 3a242af84fe39f1b911963b68ef242d9
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (pinned master + green commits reachable)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          git cat-file -e "${MASTER_PIN}^{commit}"
          git merge-base --is-ancestor "${MASTER_PIN}" FETCH_HEAD
          echo "pin_ok ${MASTER_PIN} $(git log -1 --format='%ci %s' "${MASTER_PIN}")"
          echo "origin_master_head_at_start $(git rev-parse FETCH_HEAD)"
          if [ "${MASTER_PIN}" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "NOTE: origin/master has moved past the pinned commit; this campaign answers for the pin only."
          fi
          git fetch --no-tags --unshallow origin ci/long-campaign-diagnostics 2>/dev/null \
            || git fetch --no-tags origin ci/long-campaign-diagnostics
          git cat-file -e "${GREEN_PIN}^{commit}"
          git merge-base --is-ancestor "${GREEN_PIN}" FETCH_HEAD
          echo "green_pin_ok ${GREEN_PIN} $(git log -1 --format='%ci %s' "${GREEN_PIN}")"

      - name: Fail-closed green-reference guards
        run: |
          set -euo pipefail
          git cat-file -e "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git show "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp" | grep -q 'Fxp+=-pp'
          if git show "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h" | grep -q 'momentum_rhs_scale'; then
            echo "::error::green convergence_history.h unexpectedly contains momentum_rhs_scale"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'deferred_boundary'; then
            echo "::error::green solver unexpectedly contains deferred_boundary"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'dAU_boundary'; then
            echo "::error::green solver unexpectedly contains dAU_boundary"
            exit 1
          fi
          git cat-file -e "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${MASTER_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${MASTER_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- scripts/generate_2d_validation_meshes.py
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- tests/validation/qualification_boundary_helpers.h
          echo "green_guards_ok"

      - name: Generate additive-region hybrids (fail-closed, md5-verified)
        run: |
          set -euo pipefail
          mkdir -p diag-hybrids
          git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_green.h
          git show "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_master.h
          gm5=$(md5sum diag-hybrids/solver_green.h | awk '{print $1}')
          mm5=$(md5sum diag-hybrids/solver_master.h | awk '{print $1}')
          if [ "${gm5}" != "${GREEN_MD5}" ]; then echo "::error::green solver md5 mismatch: ${gm5} != ${GREEN_MD5}"; exit 1; fi
          if [ "${mm5}" != "${MASTER_MD5}" ]; then echo "::error::master solver md5 mismatch: ${mm5} != ${MASTER_MD5}"; exit 1; fi
          # diff exits 1 when files differ (expected here); 0 identical-pins or
          # 2 error are both fail-closed anomalies.
          set +e
          diff -u diag-hybrids/solver_green.h diag-hybrids/solver_master.h > diag-hybrids/gm.diff
          drc=$?
          set -e
          if [ "$drc" -ne 1 ]; then echo "::error::green-vs-master diff exited ${drc} (expected 1: the pinned solvers must differ)"; exit 1; fi
          echo "solver green-vs-master diff hunks: $(grep -c '^@@' diag-hybrids/gm.diff)"
          cat > diag-hybrids/revert9.awk <<'AWKEOF'
          BEGIN {
            nr = split(ranges, RG, ",")
            for (i = 1; i <= nr; i++) {
              split(RG[i], E, "-")
              LO[i] = E[1] + 0
              HI[i] = E[2] + 0
            }
          }
          FNR == NR {
            if ($0 ~ /^@@/) {
              h++
              line = $0
              gi = index(line, "-")
              grest = substr(line, gi + 1)
              gc = index(grest, ",")
              if (gc > 0) gs = substr(grest, 1, gc - 1); else gs = grest
              gstart[h] = gs + 0
              pi = index(line, "+")
              prest = substr(line, pi + 1)
              pc = index(prest, ",")
              if (pc > 0) ps = substr(prest, 1, pc - 1); else ps = prest
              start_master[h] = ps + 0
              sel[h] = 0
              for (i = 1; i <= nr; i++) {
                if (gstart[h] >= LO[i] && gstart[h] <= HI[i]) { sel[h] = 1; break }
              }
              j = 0
              next
            }
            if (h > 0 && $0 !~ /^\+\+\+/ && $0 !~ /^---/) {
              t = substr($0, 1, 1)
              if (t != "+" && t != "-" && t != " ") { bad = 1; exit 3 }
              j++
              type[h "," j] = t
              body[h "," j] = substr($0, 2)
            }
            next
          }
          {
            ml[++m] = $0
          }
          END {
            if (bad) exit 3
            p = 1
            for (hh = 1; hh <= h; hh++) {
              while (p < start_master[hh]) { print ml[p]; p++ }
              k = 0
              while ((hh "," (++k)) in type) {
                t = type[hh "," k]; b = body[hh "," k]
                if (t == " ") {
                  if (ml[p] != b) { exit 2 }
                  print ml[p]; p++
                } else if (t == "+") {
                  if (!sel[hh]) print ml[p]
                  p++
                } else {
                  if (sel[hh]) print b
                }
              }
            }
            while (p <= m) { print ml[p]; p++ }
          }
          AWKEOF
          # Region table (green-file line ranges, disjoint, covering ALL hunks:
          # r1=6 r2=1 r3=7 r4=7 r5=4 r6=2 r7=12 r8=8 r9=4 of 51 hunks).
          declare -a RANGES
          RANGES[1]="140-224"
          RANGES[2]="399-399"
          RANGES[3]="548-773"
          RANGES[4]="1345-1499"
          RANGES[5]="1582-2095"
          RANGES[6]="2181-2200"
          RANGES[7]="2322-3205"
          RANGES[8]="3276-3411"
          RANGES[9]="3731-3918"
          ALL9="140-224,399-399,548-773,1345-1499,1582-2095,2181-2200,2322-3205,3276-3411,3731-3918"
          # Validation 1: reverting ALL 9 regions must reproduce the green solver.
          awk -v ranges="${ALL9}" -f diag-hybrids/revert9.awk \
            diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/all9.h
          cmp -s diag-hybrids/all9.h diag-hybrids/solver_green.h \
            || { echo "::error::all-9-regions revert is not byte-identical to the green solver"; exit 1; }
          echo "all-9-regions validation OK (byte-identical to green solver)"
          # Validation 2: an empty ranges string selects no hunk and must
          # reproduce the master solver byte-identically.
          awk -v ranges="" -f diag-hybrids/revert9.awk \
            diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/empty9.h
          cmp -s diag-hybrids/empty9.h diag-hybrids/solver_master.h \
            || { echo "::error::empty-ranges generation is not byte-identical to the master solver"; exit 1; }
          echo "empty-ranges validation OK (byte-identical to master solver)"
          # Hybrid table: name -> reverted region indices (buildable sets,
          # verified against the compile-coupling map in the header).
          declare -A HSET
          HSET[k1]="2 3 4 5 6 7 8 9"
          HSET[k3]="1 2 4 5 6 7 8 9"
          HSET[d4]="2 4 5 8"
          HSET[b1]="1 2 5 6 7 8 9"
          HSET[b3]="3 4 6 7 9"
          HSET[b679]="6 7 9"
          HSET[sr1]="2 5 6 7 8 9"
          HSET[s149]="4 6 7 9"
          HSET[p24]="2 4"
          HSET[p25]="2 5"
          HSET[p28]="2 8"
          HSET[p45]="4 5"
          HSET[p48]="4 8"
          HSET[p58]="5 8"
          HSET[t245]="2 4 5"
          HSET[t248]="2 4 8"
          HSET[t258]="2 5 8"
          HSET[t458]="4 5 8"
          declare -A HMD5
          HMD5[k1]="${MD5_K1}"
          HMD5[k3]="${MD5_K3}"
          HMD5[d4]="${MD5_D4}"
          HMD5[b1]="${MD5_B1}"
          HMD5[b3]="${MD5_B3}"
          HMD5[b679]="${MD5_B679}"
          HMD5[sr1]="${MD5_SR1}"
          HMD5[s149]="${MD5_S149}"
          HMD5[p24]="${MD5_P24}"
          HMD5[p25]="${MD5_P25}"
          HMD5[p28]="${MD5_P28}"
          HMD5[p45]="${MD5_P45}"
          HMD5[p48]="${MD5_P48}"
          HMD5[p58]="${MD5_P58}"
          HMD5[t245]="${MD5_T245}"
          HMD5[t248]="${MD5_T248}"
          HMD5[t258]="${MD5_T258}"
          HMD5[t458]="${MD5_T458}"
          gen_h() {
            local name="$1"
            local ranges=""
            local i
            for i in ${HSET[$name]}; do
              if [ -z "$ranges" ]; then ranges="${RANGES[$i]}"; else ranges="${ranges},${RANGES[$i]}"; fi
            done
            awk -v ranges="${ranges}" -f diag-hybrids/revert9.awk \
              diag-hybrids/gm.diff diag-hybrids/solver_master.h > "diag-hybrids/${name}.h" \
              || { echo "::error::generation failed for ${name}"; exit 1; }
            local actual
            local expected
            actual=$(md5sum "diag-hybrids/${name}.h" | awk '{print $1}')
            expected="${HMD5[$name]}"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::${name} md5 mismatch: ${actual} != ${expected}"
              exit 1
            fi
            echo "hybrid ${name} OK md5=${actual} bytes=$(stat -c%s "diag-hybrids/${name}.h")"
          }
          for h in k1 k3 d4 b1 b3 b679 sr1 s149 p24 p25 p28 p45 p48 p58 t245 t248 t258 t458; do
            gen_h "$h"
          done
          echo "additive_hybrids_ok"

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Variant loop (anchors, roots, additive probes, adaptive refinement)
        timeout-minutes: 235
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          declare -A RAN
          declare -A HMD5
          HMD5[k1]="${MD5_K1}"
          HMD5[k3]="${MD5_K3}"
          HMD5[d4]="${MD5_D4}"
          HMD5[b1]="${MD5_B1}"
          HMD5[b3]="${MD5_B3}"
          HMD5[b679]="${MD5_B679}"
          HMD5[sr1]="${MD5_SR1}"
          HMD5[s149]="${MD5_S149}"
          HMD5[p24]="${MD5_P24}"
          HMD5[p25]="${MD5_P25}"
          HMD5[p28]="${MD5_P28}"
          HMD5[p45]="${MD5_P45}"
          HMD5[p48]="${MD5_P48}"
          HMD5[p58]="${MD5_P58}"
          HMD5[t245]="${MD5_T245}"
          HMD5[t248]="${MD5_T248}"
          HMD5[t258]="${MD5_T258}"
          HMD5[t458]="${MD5_T458}"
          is_pass() {
            case "$1" in
              PASS_128|PASS_3_LEVELS) return 0 ;;
              *) return 1 ;;
            esac
          }
          run_variant() {
            local VARIANT="$1"
            local LEVELS="$2"
            local WT_REF="${MASTER_PIN}"
            local SHORT="$VARIANT"
            local BASE="$VARIANT"
            case "$VARIANT" in
              c_*) BASE="${VARIANT#c_}" ;;
            esac
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar9b_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar9b_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== VARIANT ${VARIANT} levels=${LEVELS} at ${WT_REF} : $(git log -1 --format='%ci %s' "${WT_REF}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            local HYB="none"
            local EXPECT_MD5=""
            case "$BASE" in
              a0_master_anchor)
                HYB="none"
                EXPECT_MD5="${MASTER_MD5}"
                ;;
              a9_all9_anchor)
                HYB="diag-hybrids/all9.h"
                EXPECT_MD5="${GREEN_MD5}"
                ;;
              *)
                HYB="diag-hybrids/${BASE}.h"
                EXPECT_MD5="${HMD5[$BASE]}"
                ;;
            esac
            git worktree add --detach "$SRC" "$WT_REF" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              git -C "$SRC" checkout "${GREEN_PIN}" -- \
                src/cfdx/io/runtime/convergence_history.h \
                tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ] && [ "$HYB" != "none" ]; then
              cp "$HYB" "$SRC/src/cfdx/physics/steady_incompressible_solver.h" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ]; then
              grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ]; then
              if grep -q "momentum_rhs_scale" "$SRC/src/cfdx/io/runtime/convergence_history.h"; then
                outcome="INCONCLUSIVE_VARIANT_COPY"
              fi
            fi
            if [ -z "$outcome" ]; then
              local actual_md5
              actual_md5=$(md5sum "$SRC/src/cfdx/physics/steady_incompressible_solver.h" | awk '{print $1}')
              if [ "$actual_md5" != "$EXPECT_MD5" ]; then
                echo "=== solver md5 mismatch: ${actual_md5} != ${EXPECT_MD5} ===" >> "$LOG"
                outcome="INCONCLUSIVE_VARIANT_COPY"
              fi
              echo "=== solver md5=${actual_md5} (expected ${EXPECT_MD5}) ===" >> "$LOG"
              echo "=== worktree delta ===" >> "$LOG"
              git -C "$SRC" status --porcelain >> "$LOG" 2>&1
            fi
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                if [ ! -s "$BUILD/validation_meshes/${m}.h5" ]; then outcome="INCONCLUSIVE_MESHGEN"; fi
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification variant=${VARIANT} levels=${LEVELS} ===" >> "$LOG"
              t0=$(date +%s)
              if [ "$LEVELS" = "3" ]; then
                timeout 3600 "$BUILD/test_naca0012_qualification" \
                  "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
                rc=$?
              else
                timeout 600 "$BUILD/test_naca0012_qualification" \
                  "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
                rc=$?
              fi
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                if [ "$LEVELS" = "3" ]; then
                  outcome="TIMEOUT_3600S"
                elif grep -q "NACA0012_RE1000_A0 level=128 Cd=" "$LOG"; then
                  outcome="PASS_128"
                else
                  outcome="INCONCLUSIVE_TIMEOUT"
                fi
              elif grep -q "did not converge" "$LOG"; then
                if ! grep -q "NACA0012_RE1000_A0 level=64 Cd=" "$LOG"; then
                  outcome="FAIL_DIVERGED_64"
                elif grep -q "NACA0012_RE1000_A0 level=128 Cd=" "$LOG"; then
                  outcome="FAIL_DIVERGED_256"
                else
                  outcome="FAIL_DIVERGED"
                fi
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "variant=${VARIANT}"
              echo "levels=${LEVELS}"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
              echo ""
              echo "--- level markers reached ---"
              grep -E "NACA0012_RE1000_A0 level=" "$LOG" || echo "no_level_marker"
              echo "--- failure line (if any) ---"
              grep -E "what\(\):" "$LOG" | tail -1 || echo "no_failure_line"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar9b_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r9b ${SHORT} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$VARIANT"]="${outcome:-MISSING}"
          }

          {
            run_variant a0_master_anchor 128
            echo "a0_master_anchor=${RAN[a0_master_anchor]}"
            run_variant a9_all9_anchor 128
            echo "a9_all9_anchor=${RAN[a9_all9_anchor]}"
            run_variant k1 128
            echo "k1=${RAN[k1]}"
            run_variant k3 128
            echo "k3=${RAN[k3]}"
            run_variant d4 128
            echo "d4=${RAN[d4]}"
            run_variant b1 128
            echo "b1=${RAN[b1]}"
            run_variant b3 128
            echo "b3=${RAN[b3]}"
            K1F=0
            if [ "${RAN[k1]}" = "FAIL_DIVERGED" ]; then K1F=1; fi
            K3F=0
            if [ "${RAN[k3]}" = "FAIL_DIVERGED" ]; then K3F=1; fi
            D4P=0
            if is_pass "${RAN[d4]}"; then D4P=1; fi
            B1P=0
            if is_pass "${RAN[b1]}"; then B1P=1; fi
            B1F=0
            if [ "${RAN[b1]}" = "FAIL_DIVERGED" ]; then B1F=1; fi
            B3P=0
            if is_pass "${RAN[b3]}"; then B3P=1; fi
            B3F=0
            if [ "${RAN[b3]}" = "FAIL_DIVERGED" ]; then B3F=1; fi
            FOUND=""
            if [ "$K1F" = "1" ]; then
              run_variant c_b1 3
              echo "branch=R1_CULPRIT c_b1=${RAN[c_b1]}"
            elif [ "$K3F" = "1" ]; then
              run_variant c_b3 3
              echo "branch=R3_CULPRIT c_b3=${RAN[c_b3]}"
            elif [ "$D4P" = "1" ]; then
              for pair in p24 p25 p28 p45 p48 p58; do
                run_variant "$pair" 128
                echo "pair_${pair}=${RAN[$pair]}"
                if is_pass "${RAN[$pair]}"; then FOUND="$pair"; break; fi
              done
              if [ -z "$FOUND" ]; then
                for tri in t245 t248 t258 t458; do
                  run_variant "$tri" 128
                  echo "tri_${tri}=${RAN[$tri]}"
                  if is_pass "${RAN[$tri]}"; then FOUND="$tri"; break; fi
                done
              fi
              if [ -n "$FOUND" ]; then
                run_variant "c_${FOUND}" 3
                CONFVAR="c_${FOUND}"
                echo "branch=D4_SET found=$FOUND confirm=${RAN[$CONFVAR]}"
              else
                run_variant c_d4 3
                echo "branch=D4_QUAD confirm_d4=${RAN[c_d4]}"
              fi
            elif [ "$B1P" = "1" ] && [ "$B3P" = "1" ]; then
              run_variant c_b679 3
              echo "branch=TRIO_679 c_b679=${RAN[c_b679]}"
            elif [ "$B1P" = "1" ] && [ "$B3F" = "1" ]; then
              run_variant sr1 128
              echo "sr1=${RAN[sr1]}"
              if is_pass "${RAN[sr1]}"; then
                for pair in p25 p28 p58; do
                  run_variant "$pair" 128
                  echo "pair_${pair}=${RAN[$pair]}"
                  if is_pass "${RAN[$pair]}"; then FOUND="$pair"; break; fi
                done
                if [ -n "$FOUND" ]; then
                  run_variant "c_${FOUND}" 3
                  CONFVAR="c_${FOUND}"
                  echo "branch=SR1_PAIR found=$FOUND confirm=${RAN[$CONFVAR]}"
                else
                  run_variant t258 128
                  echo "t258=${RAN[t258]}"
                  if is_pass "${RAN[t258]}"; then
                    run_variant c_t258 3
                    echo "branch=SR1_TRIPLE confirm=${RAN[c_t258]}"
                  else
                    run_variant c_sr1 3
                    echo "branch=SR1_CONSERVATIVE confirm=${RAN[c_sr1]}"
                  fi
                fi
              else
                run_variant c_b1 3
                echo "branch=B1_CONSERVATIVE_R1NEC c_b1=${RAN[c_b1]}"
              fi
            elif [ "$B1F" = "1" ] && [ "$B3P" = "1" ]; then
              run_variant s149 128
              echo "s149=${RAN[s149]}"
              if is_pass "${RAN[s149]}"; then
                run_variant b679 128
                echo "b679=${RAN[b679]}"
                if is_pass "${RAN[b679]}"; then
                  run_variant c_b679 3
                  echo "branch=TRIO_679_VIA_S149 c_b679=${RAN[c_b679]}"
                else
                  run_variant c_s149 3
                  echo "branch=S149_CONSERVATIVE_R4NEC c_s149=${RAN[c_s149]}"
                fi
              else
                run_variant c_b3 3
                echo "branch=B3_CONSERVATIVE_R3NEC c_b3=${RAN[c_b3]}"
              fi
            elif [ "$B1F" = "1" ] && [ "$B3F" = "1" ]; then
              run_variant sr1 128
              echo "sr1_joint=${RAN[sr1]}"
              echo "branch=JOINT_CROSS_BLOCK"
            else
              echo "branch=NO_DEFINITE_BRANCH k1=${RAN[k1]} k3=${RAN[k3]} d4=${RAN[d4]} b1=${RAN[b1]} b3=${RAN[b3]}"
            fi
          } >> "$E/nacar9b_sequence_run${RUN_ID}.txt"
          git add "$E"/nacar9b_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r9b sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose round-9b verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          ALL_VARIANTS="a0_master_anchor a9_all9_anchor k1 k3 d4 b1 b3 b679 sr1 s149 p24 p25 p28 p45 p48 p58 t245 t248 t258 t458 c_b1 c_b3 c_b679 c_d4 c_sr1 c_s149 c_t258 c_p24 c_p25 c_p28 c_p45 c_p48 c_p58 c_t245 c_t248 c_t458"
          for short in $ALL_VARIANTS; do
            eval "oc_${short}=NOT_RUN"
          done
          for short in $ALL_VARIANTS; do
            f="$E/nacar9b_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            eval "oc_${short}=\"\${oc:-MISSING}\""
          done
          passp() {
            case "$1" in
              PASS_128|PASS_3_LEVELS) return 0 ;;
              *) return 1 ;;
            esac
          }
          faild() {
            [ "$1" = "FAIL_DIVERGED" ]
          }
          K1F=0
          if faild "${oc_k1}"; then K1F=1; fi
          K3F=0
          if faild "${oc_k3}"; then K3F=1; fi
          D4P=0
          if passp "${oc_d4}"; then D4P=1; fi
          B1P=0
          if passp "${oc_b1}"; then B1P=1; fi
          B1F=0
          if faild "${oc_b1}"; then B1F=1; fi
          B3P=0
          if passp "${oc_b3}"; then B3P=1; fi
          B3F=0
          if faild "${oc_b3}"; then B3F=1; fi
          verdict_line=""
          verdict_extra=""
          ok=0
          if [ "${oc_a0_master_anchor}" != "FAIL_DIVERGED" ]; then
            verdict_line="A0_ANCHOR_ANOMALY: master + green conv + green test expected FAIL_DIVERGED at N128, got ${oc_a0_master_anchor} -> repeat before concluding"
          elif ! passp "${oc_a9_all9_anchor}"; then
            verdict_line="A9_ANCHOR_ANOMALY: all-9-regions revert (= green trio) expected PASS at N128, got ${oc_a9_all9_anchor} -> repeat before concluding"
          elif [ "$K1F" = "1" ]; then
            if ! passp "${oc_b1}"; then
              verdict_line="MONOTONICITY_VIOLATION: k1 FAIL_DIVERGED (culprit within {r1}) but b1=${oc_b1} (the closure revert must pass) -> repeat before concluding"
            elif [ "${oc_c_b1}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_CULPRIT_R1: r1_api_fields alone reproduces the N128 divergence (k1: only r1 in master form, everything else green, FAIL_DIVERGED at N128); reverting the r1-closure {r1,r2,r5,r6,r7,r8,r9} (b1) restores N128 and the full 3-level run passes (c_b1) -> production PR = revert r1_api_fields hunks AND the dependent hunks that consume its master-only symbols (decision Steven); optional round 10 hunk-level inside r1"
              ok=1
            else
              verdict_line="CONFIRM_ANOMALY: k1 FAIL and b1 PASS but the 3-level confirmation c_b1=${oc_c_b1} -> escalate, do not conclude production"
            fi
          elif [ "$K3F" = "1" ]; then
            if ! passp "${oc_b3}"; then
              verdict_line="MONOTONICITY_VIOLATION: k3 FAIL_DIVERGED (culprit within {r3}) but b3=${oc_b3} (the closure revert must pass) -> repeat before concluding"
            elif [ "${oc_c_b3}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_CULPRIT_R3: r3_rhie_chow_coef alone reproduces the N128 divergence (k3: only r3 in master form, everything else green, FAIL_DIVERGED at N128); reverting the r3-closure {r3,r4,r6,r7,r9} (b3) restores N128 and the full 3-level run passes (c_b3) -> production PR = revert r3_rhie_chow_coef hunks AND the dependent hunks that consume its master-only symbols (decision Steven); optional round 10 hunk-level inside r3"
              ok=1
            else
              verdict_line="CONFIRM_ANOMALY: k3 FAIL and b3 PASS but the 3-level confirmation c_b3=${oc_c_b3} -> escalate, do not conclude production"
            fi
          elif [ "$D4P" = "1" ]; then
            FOUNDC=""
            for pair in p24 p25 p28 p45 p48 p58; do
              if passp "$(eval echo \${oc_${pair}})"; then FOUNDC="$pair"; break; fi
            done
            if [ -z "$FOUNDC" ]; then
              for tri in t245 t248 t258 t458; do
                if passp "$(eval echo \${oc_${tri}})"; then FOUNDC="$tri"; break; fi
              done
            fi
