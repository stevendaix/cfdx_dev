name: NACA0012 solver-diff region attribution (round 8)

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 8): attribute the N128 hard-divergence culprit to ONE REGION of
# the green-vs-master solver diff. Round 7 (run 39663748207) proved
# v0_master_pristine FAIL_DIVERGED and v1_green_trio PASS_3_LEVELS (N64 433 it
# / N128 995 it / N256 3989 it, identical to the green reference) on master pin
# 28e4d183: swapping the green trio (steady_incompressible_solver.h +
# convergence_history.h + test_naca0012_geometry.cpp) restores the pass, so the
# culprit lives in that trio. Round 6 (run 39630570236) proved the boundary
# block alone is NOT it. Compile coupling (verified 2026-10-21): the history
# entry struct IncompressibleIteration (with the momentum_rhs_scale fields) is
# defined IN THE SOLVER HEADER, so master convergence_history.h cannot compile
# against the green solver (and the master test cannot either). The
# convergence_history.h file is serialization-only I/O and is compile-entangled
# with the solver, so this round keeps master convergence_history.h everywhere
# (except the green control) and attributes inside the solver.
#
# The solver diff green(a1a62dc1) <-> master(28e4d183) has 51 hunks (~832
# lines). This round partitions them into 9 REGIONS by green-file line ranges
# and builds, for each region, a HYBRID solver = master solver with that one
# region reverted to the green form (whole-file generation, fail-closed:
# the reverse-apply algorithm is validated at run time by reverting ALL
# hunks and byte-comparing to the green solver; each region hybrid is
# md5-verified against the expected hash recorded in this workflow).
#
# Variants (all always run, worktree of the pinned master commit unless
# stated; the GREEN TEST is swapped in everywhere because the master test
# does not compile against green-region-reverted solvers - the green test
# uses only the old API and carries the OLD #926 Cd sign convention):
#   v0b_master_greentest   : master tree + green test ONLY. Expected
#                            FAIL_DIVERGED like round-7 v0 (the test swap is
#                            behavior-neutral: identical solver controls).
#                            Canary: proves the green test compiles against
#                            the master solver for all region variants.
#   vC_convhist_neutral    : master tree + green convergence_history.h +
#                            green test. Expected FAIL_DIVERGED (green conv
#                            compiles against the master entry struct; it is
#                            serialization-only and nothing here consumes
#                            it) -> conv_history exonerated as inert.
#   r1_api_fields          : region green 140-224 (struct/API/evidence-hook
#   r2_validation            fields, 6 hunks). WARNING: r1 reverts the
#   r3_rhie_chow_coef        IncompressibleIteration fields that master
#   r4_boundary_operator     convergence_history.h serializes -> r1 is
#   r5_evidence_aliases      expected INCONCLUSIVE_BUILD (compile-coupled,
#   r6_monitor_controls       informative, not a behavior verdict).
#   r7_flux_audit_forms    : ... each region reverted to green, see the
#   r8_momentum_rhs_scale    generation step for the exact ranges.
#   r9_wall_distance_guards
#   v3_green_pristine      : the green tree itself (control, expected
#                            PASS_3_LEVELS; round-7 v3 covers the same pin
#                            pair, this re-runs it for self-containment).
#
# Interpretation guide (round 8) - region attribution is valid only if
# v0b FAIL_DIVERGED and v3 PASS_3_LEVELS:
#   exactly one r* PASS_3_LEVELS -> REGION_CULPRIT: that region's master
#        form is the defect -> round 9 = bisect hunks within the region,
#        then production PR (decision Steven)
#   two or more r* PASS_3_LEVELS -> MULTIPLE_INDEPENDENT_CULPRITS (list)
#   no r* PASS and no INCONCLUSIVE_BUILD -> COMBINATION_REQUIRED: the
#        failure needs >= 2 regions green jointly -> round 9 = cumulative
#   no r* PASS with some INCONCLUSIVE_BUILD -> COMBINATION_OR_COUPLED:
#        compile-coupled regions could not be tested alone -> round 9 =
#        cumulative reverts including the coupled regions
#   v0b PASS_3_LEVELS -> TEST_CULPRIT_ANOMALY: the green test swap alone
#        would restore the pass (not expected - the solve controls are
#        identical) -> repeat before concluding
#   vC PASS_3_LEVELS -> CONV_HIST_ANOMALY (serialization-only file cannot
#        change the solve) -> repeat before concluding
#   v3 not PASS_3_LEVELS -> GREEN_ANCHOR_ANOMALY -> repeat
#   INCONCLUSIVE_{WORKTREE,VARIANT_COPY,CONFIGURE,MESHGEN} -> incomplete,
#        re-run
#
# NOTE: the green test has the OLD #926 Cd_pressure sign convention
# (Fxp+=-pp): compare iterations/convergence behaviour, NEVER raw Cd signs.
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is changed
# (hybrids live only in throwaway worktrees on the diagnostics branch
# runner); evidence is committed per variant so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-r8-region-attribution
  cancel-in-progress: false

jobs:
  naca-r8-variants:
    name: NACA solver-diff region-attribution variants at pinned master commit (round 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    env:
      MASTER_PIN: 28e4d183b258997c5b923b2e05569263e900f2ff
      GREEN_PIN: a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1
      GREEN_MD5: 63db7905347576beec20993919d6015e
      MASTER_MD5: af085014acfc35a0e9ab4946c3f46381
      M_R1: 3ae10ec46395555273025dad2045acee
      M_R2: 2078d7d48157c557d381b968794b70f9
      M_R3: f9ceb08451af889c4b3c8e0dc56d1cdf
      M_R4: 70fb192898db0240cc3c238c826d864e
      M_R5: 357ad9221d0232bf94eef779c05ec22d
      M_R6: 7c9b20ff8ef00d0671d9252246508e46
      M_R7: 5a23d069719768ad429a2e48d2f4bac9
      M_R8: dabdfc6179dfeb20a86cc482d3b69f29
      M_R9: e9b268054338aeff45f82fb43ce33dcf
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (pinned master + green commits reachable)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          git cat-file -e "${MASTER_PIN}^{commit}"
          git merge-base --is-ancestor "${MASTER_PIN}" FETCH_HEAD
          echo "pin_ok ${MASTER_PIN} $(git log -1 --format='%ci %s' "${MASTER_PIN}")"
          echo "origin_master_head_at_start $(git rev-parse FETCH_HEAD)"
          if [ "${MASTER_PIN}" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "NOTE: origin/master has moved past the pinned commit; this campaign answers for the pin only."
          fi
          git fetch --no-tags --unshallow origin ci/long-campaign-diagnostics 2>/dev/null \
            || git fetch --no-tags origin ci/long-campaign-diagnostics
          git cat-file -e "${GREEN_PIN}^{commit}"
          git merge-base --is-ancestor "${GREEN_PIN}" FETCH_HEAD
          echo "green_pin_ok ${GREEN_PIN} $(git log -1 --format='%ci %s' "${GREEN_PIN}")"

      - name: Fail-closed green-reference guards
        run: |
          set -euo pipefail
          # Trio files exist at the green pin with the expected green content.
          git cat-file -e "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git show "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp" | grep -q 'Fxp+=-pp'
          if git show "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h" | grep -q 'momentum_rhs_scale'; then
            echo "::error::green convergence_history.h unexpectedly contains momentum_rhs_scale"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'deferred_boundary'; then
            echo "::error::green solver unexpectedly contains deferred_boundary"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'dAU_boundary'; then
            echo "::error::green solver unexpectedly contains dAU_boundary"
            exit 1
          fi
          # The same trio files exist at the master pin (swap targets).
          git cat-file -e "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${MASTER_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${MASTER_PIN}:tests/validation/test_naca0012_geometry.cpp"
          # Mesh generator must be identical between the pins (round 6: blob 29c737fc207a).
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- scripts/generate_2d_validation_meshes.py
          # Test-local helper must be identical between the pins (verified 2026-10-21).
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- tests/validation/qualification_boundary_helpers.h
          echo "green_guards_ok"

      - name: Generate region-revert hybrids (fail-closed, md5-verified)
        run: |
          set -euo pipefail
          mkdir -p diag-hybrids
          git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_green.h
          git show "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_master.h
          gm5=$(md5sum diag-hybrids/solver_green.h | awk '{print $1}')
          mm5=$(md5sum diag-hybrids/solver_master.h | awk '{print $1}')
          if [ "${gm5}" != "${GREEN_MD5}" ]; then echo "::error::green solver md5 mismatch: ${gm5} != ${GREEN_MD5}"; exit 1; fi
          if [ "${mm5}" != "${MASTER_MD5}" ]; then echo "::error::master solver md5 mismatch: ${mm5} != ${MASTER_MD5}"; exit 1; fi
          diff -u diag-hybrids/solver_green.h diag-hybrids/solver_master.h > diag-hybrids/gm.diff
          echo "solver green-vs-master diff hunks: $(grep -c '^@@' diag-hybrids/gm.diff)"
          REVERT_AWK='
          BEGIN { LO = lo + 0; HI = hi + 0 }
          FNR == NR {
            if ($0 ~ /^@@/) {
              h++
              line = $0
              gi = index(line, "-")
              grest = substr(line, gi + 1)
              gc = index(grest, ",")
              if (gc > 0) gs = substr(grest, 1, gc - 1); else gs = grest
              gstart[h] = gs + 0
              pi = index(line, "+")
              prest = substr(line, pi + 1)
              pc = index(prest, ",")
              if (pc > 0) ps = substr(prest, 1, pc - 1); else ps = prest
              start_master[h] = ps + 0
              sel[h] = (gstart[h] >= LO && gstart[h] <= HI) ? 1 : 0
              j = 0
              next
            }
            if (h > 0 && $0 !~ /^\+\+\+/ && $0 !~ /^---/) {
              t = substr($0, 1, 1)
              if (t != "+" && t != "-" && t != " ") { bad = 1; exit 3 }
              j++
              type[h "," j] = t
              body[h "," j] = substr($0, 2)
            }
            next
          }
          {
            ml[++m] = $0
          }
          END {
            if (bad) exit 3
            p = 1
            for (hh = 1; hh <= h; hh++) {
              while (p < start_master[hh]) { print ml[p]; p++ }
              k = 0
              while ((hh "," (++k)) in type) {
                t = type[hh "," k]; b = body[hh "," k]
                if (t == " ") {
                  if (ml[p] != b) { exit 2 }
                  print ml[p]; p++
                } else if (t == "+") {
                  if (!sel[hh]) print ml[p]
                  p++
                } else {
                  if (sel[hh]) print b
                }
              }
            }
            while (p <= m) { print ml[p]; p++ }
          }
          '
          # Validation: reverting ALL hunks must reproduce the green solver byte-identically.
          awk -v lo=0 -v hi=999999 "${REVERT_AWK}" diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/all_revert.h
          cmp -s diag-hybrids/all_revert.h diag-hybrids/solver_green.h \
            || { echo "::error::all-revert validation failed (algorithm or pin content changed)"; exit 1; }
          echo "all-revert validation OK (byte-identical to green solver)"
          # Validation: selecting nothing must reproduce the master solver byte-identically.
          awk -v lo=0 -v hi=0 "${REVERT_AWK}" diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/none_revert.h
          cmp -s diag-hybrids/none_revert.h diag-hybrids/solver_master.h \
            || { echo "::error::empty-range validation failed"; exit 1; }
          echo "empty-range validation OK (byte-identical to master solver)"
          gen_region() {
            awk -v lo="$2" -v hi="$3" "${REVERT_AWK}" diag-hybrids/gm.diff diag-hybrids/solver_master.h > "diag-hybrids/$1.h" \
              || { echo "::error::hybrid generation failed for $1"; exit 1; }
            actual=$(md5sum "diag-hybrids/$1.h" | awk '{print $1}')
            if [ "${actual}" != "$4" ]; then echo "::error::$1 md5 mismatch: ${actual} != $4"; exit 1; fi
            echo "hybrid $1 OK md5=${actual} bytes=$(stat -c%s "diag-hybrids/$1.h")"
          }
          gen_region r1_api_fields 140 224 "${M_R1}"
          gen_region r2_validation 399 399 "${M_R2}"
          gen_region r3_rhie_chow_coef 548 773 "${M_R3}"
          gen_region r4_boundary_operator 1345 1499 "${M_R4}"
          gen_region r5_evidence_aliases 1582 2095 "${M_R5}"
          gen_region r6_monitor_controls 2181 2200 "${M_R6}"
          gen_region r7_flux_audit_forms 2322 3205 "${M_R7}"
          gen_region r8_momentum_rhs_scale 3276 3411 "${M_R8}"
          gen_region r9_wall_distance_guards 3731 3918 "${M_R9}"
          echo "region_hybrids_ok"

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Variant loop (v0b, vC, r1-r9 region hybrids, v3 green control - all always run)
        timeout-minutes: 235
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          declare -A RAN
          LAST_OUTCOME=""

          run_variant() {
            local VARIANT="$1"
            local SHORT="$VARIANT"
            local WT_REF="${MASTER_PIN}"
            if [ "$VARIANT" = "v3_green_pristine" ]; then
              WT_REF="${GREEN_PIN}"
            fi
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar8_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar8_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== VARIANT ${VARIANT} at ref ${WT_REF} : $(git log -1 --format='%ci %s' "${WT_REF}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            git worktree add --detach "$SRC" "$WT_REF" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              case "$VARIANT" in
                v0b_master_greentest)
                  git -C "$SRC" checkout "${GREEN_PIN}" -- \
                    tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                    || outcome="INCONCLUSIVE_VARIANT_COPY"
                  if [ -z "$outcome" ]; then
                    grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                      || outcome="INCONCLUSIVE_VARIANT_COPY"
                    diff -q "$SRC/src/cfdx/physics/steady_incompressible_solver.h" diag-hybrids/solver_master.h >/dev/null \
                      || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                    echo "=== pristine master solver + green test verified ===" >> "$LOG"
                    git -C "$SRC" status --porcelain >> "$LOG" 2>&1
                  fi
                  ;;
                vC_convhist_neutral)
                  git -C "$SRC" checkout "${GREEN_PIN}" -- \
                    src/cfdx/io/runtime/convergence_history.h \
                    tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                    || outcome="INCONCLUSIVE_VARIANT_COPY"
                  if [ -z "$outcome" ]; then
                    grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                      || outcome="INCONCLUSIVE_VARIANT_COPY"
                    if grep -q "momentum_rhs_scale" "$SRC/src/cfdx/io/runtime/convergence_history.h"; then
                      outcome="INCONCLUSIVE_VARIANT_COPY"
                    fi
                    diff -q "$SRC/src/cfdx/physics/steady_incompressible_solver.h" diag-hybrids/solver_master.h >/dev/null \
                      || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                    echo "=== pristine master solver + green conv_history + green test verified ===" >> "$LOG"
                    git -C "$SRC" status --porcelain >> "$LOG" 2>&1
                  fi
                  ;;
                r1_api_fields|r2_validation|r3_rhie_chow_coef|r4_boundary_operator|r5_evidence_aliases|r6_monitor_controls|r7_flux_audit_forms|r8_momentum_rhs_scale|r9_wall_distance_guards)
                  cp "diag-hybrids/${VARIANT}.h" \
                    "$SRC/src/cfdx/physics/steady_incompressible_solver.h" \
                    || outcome="INCONCLUSIVE_VARIANT_COPY"
                  git -C "$SRC" checkout "${GREEN_PIN}" -- \
                    tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                    || outcome="INCONCLUSIVE_VARIANT_COPY"
                  if [ -z "$outcome" ]; then
                    local actual_md5=$(md5sum "$SRC/src/cfdx/physics/steady_incompressible_solver.h" | awk '{print $1}')
                    local expect_md5=$(md5sum "diag-hybrids/${VARIANT}.h" | awk '{print $1}')
                    [ "${actual_md5}" = "${expect_md5}" ] \
                      || outcome="INCONCLUSIVE_VARIANT_COPY"
                    grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                      || outcome="INCONCLUSIVE_VARIANT_COPY"
                    echo "=== hybrid ${VARIANT} (md5 ${actual_md5}) + green test verified ===" >> "$LOG"
                    echo "=== worktree delta ===" >> "$LOG"
                    git -C "$SRC" status --porcelain >> "$LOG" 2>&1
                    git -C "$SRC" diff HEAD --stat >> "$LOG" 2>&1
                  fi
                  ;;
                v3_green_pristine)
                  grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                    || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  if grep -q "momentum_rhs_scale" "$SRC/src/cfdx/io/runtime/convergence_history.h"; then
                    outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  fi
                  if grep -q "deferred_boundary" "$SRC/src/cfdx/physics/steady_incompressible_solver.h"; then
                    outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  fi
                  echo "=== pristine green tree verified (old #926 test convention, no momentum_rhs_scale, no deferred_boundary) ===" >> "$LOG"
                  ;;
              esac
            fi
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                [ -s "$BUILD/validation_meshes/${m}.h5" ] || outcome="INCONCLUSIVE_MESHGEN"
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification variant=${VARIANT} ===" >> "$LOG"
              t0=$(date +%s)
              timeout 3600 "$BUILD/test_naca0012_qualification" \
                "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
              rc=$?
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                outcome="TIMEOUT_3600S"
              elif grep -q "did not converge" "$LOG"; then
                outcome="FAIL_DIVERGED"
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "variant=${VARIANT}"
              echo "wt_ref=${WT_REF}"
              echo "pin_subject=$(git log -1 --format='%s' "${WT_REF}")"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
              echo ""
              echo "--- level markers reached ---"
              grep -E "NACA0012_RE1000_A0 level=" "$LOG" || echo "no_level_marker"
              echo "--- failure line (if any) ---"
              grep -E "what\(\):" "$LOG" | tail -1 || echo "no_failure_line"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar8_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r8 ${SHORT} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$VARIANT"]="${outcome:-MISSING}"
            LAST_OUTCOME="${outcome:-MISSING}"
          }

          {
            run_variant "v0b_master_greentest"
            echo "v0b_master_greentest=${LAST_OUTCOME}"
            run_variant "vC_convhist_neutral"
            echo "vC_convhist_neutral=${LAST_OUTCOME}"
            run_variant "r8_momentum_rhs_scale"
            echo "r8_momentum_rhs_scale=${LAST_OUTCOME}"
            run_variant "r7_flux_audit_forms"
            echo "r7_flux_audit_forms=${LAST_OUTCOME}"
            run_variant "r3_rhie_chow_coef"
            echo "r3_rhie_chow_coef=${LAST_OUTCOME}"
            run_variant "r4_boundary_operator"
            echo "r4_boundary_operator=${LAST_OUTCOME}"
            run_variant "r9_wall_distance_guards"
            echo "r9_wall_distance_guards=${LAST_OUTCOME}"
            run_variant "r6_monitor_controls"
            echo "r6_monitor_controls=${LAST_OUTCOME}"
            run_variant "r1_api_fields"
            echo "r1_api_fields=${LAST_OUTCOME}"
            run_variant "r2_validation"
            echo "r2_validation=${LAST_OUTCOME}"
            run_variant "r5_evidence_aliases"
            echo "r5_evidence_aliases=${LAST_OUTCOME}"
            run_variant "v3_green_pristine"
            echo "v3_green_pristine=${LAST_OUTCOME}"
          } >> "$E/nacar8_sequence_run${RUN_ID}.txt"
          git add "$E"/nacar8_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r8 sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose round-8 verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          ALL_VARIANTS="v0b_master_greentest vC_convhist_neutral r1_api_fields r2_validation r3_rhie_chow_coef r4_boundary_operator r5_evidence_aliases r6_monitor_controls r7_flux_audit_forms r8_momentum_rhs_scale r9_wall_distance_guards v3_green_pristine"
          for short in $ALL_VARIANTS; do
            eval "oc_${short}=NOT_RUN"
          done
          for short in $ALL_VARIANTS; do
            f="$E/nacar8_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            eval "oc_${short}=\"\${oc:-MISSING}\""
          done
          is_final() {
            case "$1" in
              PASS_3_LEVELS|FAIL_DIVERGED|TIMEOUT_3600S|FAIL_OTHER|INCONCLUSIVE_BUILD) return 0 ;;
              *) return 1 ;;
            esac
          }
          verdict_line="INCOMPLETE"
          complete=0
          all_final=1
          for short in $ALL_VARIANTS; do
            eval "v=\${oc_${short}}"
            is_final "$v" || all_final=0
          done
          if [ "$all_final" = "1" ]; then
            complete=1
            valid=1
            if [ "${oc_v3_green_pristine}" != "PASS_3_LEVELS" ]; then
              verdict_line="GREEN_ANCHOR_ANOMALY: green pristine tree expected PASS_3_LEVELS (round 4/7: N64 433 / N128 995 / N256 3989 it), got ${oc_v3_green_pristine} -> runner/build drift, repeat before concluding"
              valid=0
            fi
            if [ "${oc_v0b_master_greentest}" = "PASS_3_LEVELS" ]; then
              verdict_line="TEST_CULPRIT_ANOMALY: the green test swap ALONE restores the 3-level pass on the pristine master tree (not expected - solve controls are identical) -> repeat before concluding"
              valid=0
            elif [ "${oc_v0b_master_greentest}" != "FAIL_DIVERGED" ]; then
              verdict_line="V0B_ANCHOR_ANOMALY: master + green test expected FAIL_DIVERGED, got ${oc_v0b_master_greentest} -> repeat before concluding"
              valid=0
            fi
            if [ "${oc_vC_convhist_neutral}" = "PASS_3_LEVELS" ]; then
              verdict_line="CONV_HIST_ANOMALY: green convergence_history.h swap alone restores the pass (serialization-only file cannot change the solve) -> repeat before concluding"
              valid=0
            fi
            if [ "$valid" = "1" ]; then
              pass_regions=""
              npass=0
              coupled_regions=""
              for short in r1_api_fields r2_validation r3_rhie_chow_coef r4_boundary_operator r5_evidence_aliases r6_monitor_controls r7_flux_audit_forms r8_momentum_rhs_scale r9_wall_distance_guards; do
                eval "v=\${oc_${short}}"
                if [ "$v" = "PASS_3_LEVELS" ]; then
                  pass_regions="${pass_regions}${short} "
                  npass=$((npass + 1))
                fi
                if [ "$v" = "INCONCLUSIVE_BUILD" ]; then
                  coupled_regions="${coupled_regions}${short} "
                fi
              done
              if [ "$npass" = "1" ]; then
                verdict_line="REGION_CULPRIT: ${pass_regions} is the region whose master form breaks N128 (reverting it to green restores the 3-level pass on the master tree) -> round 9 = bisect hunks within the region; production PR only once the exact culprit is proven (decision Steven)"
              elif [ "$npass" -ge 2 ]; then
                verdict_line="MULTIPLE_INDEPENDENT_CULPRITS: ${pass_regions}-> round 9 = bisect each region independently"
              elif [ -z "${coupled_regions// /}" ]; then
                verdict_line="COMBINATION_REQUIRED: every single-region revert still FAILS like v0 while the full trio swap passes (round 7 v1) -> the defect needs >= 2 regions green jointly -> round 9 = cumulative-prefix reverts"
              else
                verdict_line="COMBINATION_OR_COUPLED: no single-region revert passes; compile-coupled regions [${coupled_regions}] could not be tested alone (expected for r1: master conv_history serializes the reverted struct fields) -> round 9 = cumulative reverts including the coupled regions"
              fi
            fi
          else
            verdict_line="INCOMPLETE: some variants did not reach a final outcome (NOT_RUN/INCONCLUSIVE upstream stages) -> re-run"
          fi
          VER="$E/nacar8_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "master_pin=${MASTER_PIN}"
            echo "green_pin=${GREEN_PIN}"
            echo "round7_context=v1_green_trio PASS_3_LEVELS (N64 433 / N128 995 / N256 3989 it) on this master pin; round6 NOT_THE_BOUNDARY_BLOCK"
            echo "v0b_master_greentest=${oc_v0b_master_greentest} (expected FAIL_DIVERGED: test swap is behavior-neutral)"
            echo "vC_convhist_neutral=${oc_vC_convhist_neutral} (expected FAIL_DIVERGED: conv_history is serialization-only)"
            for short in r1_api_fields r2_validation r3_rhie_chow_coef r4_boundary_operator r5_evidence_aliases r6_monitor_controls r7_flux_audit_forms r8_momentum_rhs_scale r9_wall_distance_guards; do
              eval "echo \"${short}=\${oc_${short}}\""
            done
            echo "v3_green_pristine=${oc_v3_green_pristine} (expected PASS_3_LEVELS)"
            echo "sign_note=green test carries the OLD #926 Cd_pressure convention (Fxp+=-pp): compare iterations/convergence, never raw Cd signs"
            echo ""
            echo "--- per-variant NACA digest (level markers + failure) ---"
            for short in $ALL_VARIANTS; do
              L="$E/nacar8_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0 level=|NACA0012_QUALIFICATION|did not converge|what\(\):|Cd=" "$L" | tail -14
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r8 verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$complete" = "1" ]; then
            echo "round-8 variant campaign: ${verdict_line}"
          else
            echo "::error::round-8 incomplete: ${verdict_line}"
            exit 1
          fi
