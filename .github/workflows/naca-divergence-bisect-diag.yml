name: NACA0012 region-necessity leave-one-out (round 9)

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 9): identify the MINIMAL set of solver-diff regions whose
# revert to green restores the N128 pass, i.e. the culprit set at region
# granularity. Locked context: round 7 (run 39663748207) IN_TRIO_CULPRIT
# (v1_green_trio + v2_green_trio_monitor PASS_3_LEVELS with green-identical
# iterations, v0 FAIL_DIVERGED); round 8 (run 39672681948)
# COMBINATION_OR_COUPLED: test exonerated (v0b FAIL as expected),
# convergence_history exonerated (vC FAIL as expected), the 5 individually
# testable regions r2/r4/r5/r8/r9 each still FAIL when reverted alone, and
# the 4 compile-coupled regions r1/r3/r6/r7 could not be tested alone
# (INCONCLUSIVE_BUILD: their green forms remove symbols that OTHER master
# regions of the same solver consume - intra-file coupling: r1 struct fields
# used by validation/assembly master code, r3 pressure_face_* functions used
# by boundary/assembly master code, r6 mu_eff form used by the audit call,
# r7 rhie_chow_identity_* declarations used by master code at 3680).
#
# Method: LEAVE-ONE-OUT. The green solver is self-consistent, so a hybrid
# keeping exactly ONE region in master form (all 8 others reverted to green)
# compiles (master-region symbols are not referenced by green code) unless
# that one master region itself references master-only symbols from reverted
# regions. For each region i:
#   k_i = master tree + hybrid solver (all regions reverted EXCEPT i)
#         + green convergence_history.h + green test.
#   k_i FAIL_DIVERGED  -> region i's master form is NECESSARY for the defect
#   k_i PASS_128       -> region i is NOT necessary (exonerated)
#   k_i INCONCLUSIVE_* -> necessity unknown (compile/other failure)
# Necessity logic: the full revert (all 9) passes (round 7 v1), the full
# master fails (v0). M = {i : k_i FAIL} is the set of necessary regions;
# reverting exactly M must restore the pass if the culprit is exactly M.
#
# Levels: N128 ONLY (the discriminating level: master diverges at N128 it 15,
# green converges 995 it - N64 passes on both). PASS_128 ~6 min vs
# PASS_3_LEVELS ~41 min. The final culprit confirmation (mm3/mmu3) re-runs
# the FULL 3 levels (N64/N128/N256) for production-grade evidence.
#
# Variants (all on the master-pin worktree; green convergence_history.h +
# green test swapped everywhere - both proven behavior-neutral in round 8:
# v0b and vC both FAIL_DIVERGED exactly like pristine master):
#   a0_master_anchor : pristine master solver (md5 MASTER_MD5) + green conv
#                      + green test. N128-only. Expected FAIL_DIVERGED.
#   a9_all9_anchor   : all-9-regions reverted (byte-identical green solver,
#                      md5 GREEN_MD5) + green conv + green test = the round-7
#                      green trio. N128-only. Expected PASS_128.
#   k1..k9           : leave-one-out hybrids (md5-pinned MC1..MC9). N128-only.
#   mm_minimal_set   : revert exactly M = necessary set (runtime-generated,
#                      deterministic from the validated 9-range table).
#                      N128-only. PASS_128 expected if M is the culprit set.
#   mm3_minimal_set_3levels : same hybrid, full 3 levels. PASS_3_LEVELS
#                      expected - the production-grade confirmation.
#   mmu_set_plus_unknown / mmu3_... : only if mm FAILs and some k_i were
#                      INCONCLUSIVE: revert M + unknown regions.
#
# Interpretation guide (round 9) - valid only if a0 FAIL_DIVERGED and
# a9 PASS_128:
#   mm PASS_128 + mm3 PASS_3_LEVELS -> REGION_SET_CULPRIT: M is the culprit
#        set (every region in M necessary, M sufficient) -> production PR
#        reverting exactly those regions (decision Steven); unknown regions
#        (k_i INCONCLUSIVE) are proven unnecessary by mm PASS without them.
#   mmu PASS_128 + mmu3 PASS_3_LEVELS -> SET_PLUS_UNKNOWN: culprit within
#        M + unknown; exact if exactly one unknown, otherwise conservative
#        (prune candidates in round 10 if wanted).
#   mm FAIL_DIVERGED (+ mmu FAIL if run) -> COMBINATION_ESCAPE: no
#        region-granularity set explains the defect -> round 10 = hunk-level
#        bisect inside the coupled regions.
#   no k_i FAIL (all PASS_128) -> JOINT_INTERACTION: every single region's
#        master form is harmless alone, yet full master diverges -> defect
#        emerges from >= 2 master regions jointly -> round 10 = pair hunt.
#   a0 PASS_128 -> A0_ANCHOR_ANOMALY (master no longer diverges under this
#        configuration) -> repeat before concluding.
#   a9 not PASS_128 -> A9_ANCHOR_ANOMALY -> repeat before concluding.
#   INCONCLUSIVE_{WORKTREE,VARIANT_COPY,CONFIGURE,MESHGEN} anywhere ->
#        incomplete, re-run.
#
# NOTE: the green test has the OLD #926 Cd_pressure sign convention
# (Fxp+=-pp): compare iterations/convergence behaviour, NEVER raw Cd signs.
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is changed
# (hybrids live only in throwaway worktrees on the diagnostics branch
# runner); evidence is committed per variant so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-r9-leave-one-out
  cancel-in-progress: false

jobs:
  naca-r9-variants:
    name: NACA leave-one-out necessity at pinned master commit (round 9)
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    env:
      MASTER_PIN: 28e4d183b258997c5b923b2e05569263e900f2ff
      GREEN_PIN: a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1
      GREEN_MD5: 63db7905347576beec20993919d6015e
      MASTER_MD5: af085014acfc35a0e9ab4946c3f46381
      MC1: 24f2a8ec8cd6d89245732e49b094e917
      MC2: be5bbc99cd5b35c6a3efee59ce6abd02
      MC3: 58c8c3aa54723f1676ff088fb16e9877
      MC4: 32dc48057cef821149eff9d0f6cbe11e
      MC5: f01d9116e571b3e7493bd546fa9e112c
      MC6: ad45bea815d0a05ddb3efa6069019512
      MC7: db8b079541221a1be2c8321ab3761b2e
      MC8: 05ea8c8177e73e6e327a4778551ae2ca
      MC9: e442535a8d2eddebe88ce0b7912eb90f
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (pinned master + green commits reachable)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          git cat-file -e "${MASTER_PIN}^{commit}"
          git merge-base --is-ancestor "${MASTER_PIN}" FETCH_HEAD
          echo "pin_ok ${MASTER_PIN} $(git log -1 --format='%ci %s' "${MASTER_PIN}")"
          echo "origin_master_head_at_start $(git rev-parse FETCH_HEAD)"
          if [ "${MASTER_PIN}" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "NOTE: origin/master has moved past the pinned commit; this campaign answers for the pin only."
          fi
          git fetch --no-tags --unshallow origin ci/long-campaign-diagnostics 2>/dev/null \
            || git fetch --no-tags origin ci/long-campaign-diagnostics
          git cat-file -e "${GREEN_PIN}^{commit}"
          git merge-base --is-ancestor "${GREEN_PIN}" FETCH_HEAD
          echo "green_pin_ok ${GREEN_PIN} $(git log -1 --format='%ci %s' "${GREEN_PIN}")"

      - name: Fail-closed green-reference guards
        run: |
          set -euo pipefail
          git cat-file -e "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git show "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp" | grep -q 'Fxp+=-pp'
          if git show "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h" | grep -q 'momentum_rhs_scale'; then
            echo "::error::green convergence_history.h unexpectedly contains momentum_rhs_scale"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'deferred_boundary'; then
            echo "::error::green solver unexpectedly contains deferred_boundary"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'dAU_boundary'; then
            echo "::error::green solver unexpectedly contains dAU_boundary"
            exit 1
          fi
          git cat-file -e "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${MASTER_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${MASTER_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- scripts/generate_2d_validation_meshes.py
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- tests/validation/qualification_boundary_helpers.h
          echo "green_guards_ok"

      - name: Generate leave-one-out hybrids (fail-closed, md5-verified)
        run: |
          set -euo pipefail
          mkdir -p diag-hybrids
          git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_green.h
          git show "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_master.h
          gm5=$(md5sum diag-hybrids/solver_green.h | awk '{print $1}')
          mm5=$(md5sum diag-hybrids/solver_master.h | awk '{print $1}')
          if [ "${gm5}" != "${GREEN_MD5}" ]; then echo "::error::green solver md5 mismatch: ${gm5} != ${GREEN_MD5}"; exit 1; fi
          if [ "${mm5}" != "${MASTER_MD5}" ]; then echo "::error::master solver md5 mismatch: ${mm5} != ${MASTER_MD5}"; exit 1; fi
          # diff exits 1 when files differ (expected here); 0 identical-pins or
          # 2 error are both fail-closed anomalies.
          set +e
          diff -u diag-hybrids/solver_green.h diag-hybrids/solver_master.h > diag-hybrids/gm.diff
          drc=$?
          set -e
          if [ "$drc" -ne 1 ]; then echo "::error::green-vs-master diff exited ${drc} (expected 1: the pinned solvers must differ)"; exit 1; fi
          echo "solver green-vs-master diff hunks: $(grep -c '^@@' diag-hybrids/gm.diff)"
          cat > diag-hybrids/revert9.awk <<'AWKEOF'
          BEGIN {
            nr = split(ranges, RG, ",")
            for (i = 1; i <= nr; i++) {
              split(RG[i], E, "-")
              LO[i] = E[1] + 0
              HI[i] = E[2] + 0
            }
          }
          FNR == NR {
            if ($0 ~ /^@@/) {
              h++
              line = $0
              gi = index(line, "-")
              grest = substr(line, gi + 1)
              gc = index(grest, ",")
              if (gc > 0) gs = substr(grest, 1, gc - 1); else gs = grest
              gstart[h] = gs + 0
              pi = index(line, "+")
              prest = substr(line, pi + 1)
              pc = index(prest, ",")
              if (pc > 0) ps = substr(prest, 1, pc - 1); else ps = prest
              start_master[h] = ps + 0
              sel[h] = 0
              for (i = 1; i <= nr; i++) {
                if (gstart[h] >= LO[i] && gstart[h] <= HI[i]) { sel[h] = 1; break }
              }
              j = 0
              next
            }
            if (h > 0 && $0 !~ /^\+\+\+/ && $0 !~ /^---/) {
              t = substr($0, 1, 1)
              if (t != "+" && t != "-" && t != " ") { bad = 1; exit 3 }
              j++
              type[h "," j] = t
              body[h "," j] = substr($0, 2)
            }
            next
          }
          {
            ml[++m] = $0
          }
          END {
            if (bad) exit 3
            p = 1
            for (hh = 1; hh <= h; hh++) {
              while (p < start_master[hh]) { print ml[p]; p++ }
              k = 0
              while ((hh "," (++k)) in type) {
                t = type[hh "," k]; b = body[hh "," k]
                if (t == " ") {
                  if (ml[p] != b) { exit 2 }
                  print ml[p]; p++
                } else if (t == "+") {
                  if (!sel[hh]) print ml[p]
                  p++
                } else {
                  if (sel[hh]) print b
                }
              }
            }
            while (p <= m) { print ml[p]; p++ }
          }
          AWKEOF
          # Region table (green-file line ranges, disjoint, covering ALL hunks:
          # r1=6 r2=1 r3=7 r4=7 r5=4 r6=2 r7=12 r8=8 r9=4 of 51 hunks).
          declare -a RANGES
          RANGES[1]="140-224"
          RANGES[2]="399-399"
          RANGES[3]="548-773"
          RANGES[4]="1345-1499"
          RANGES[5]="1582-2095"
          RANGES[6]="2181-2200"
          RANGES[7]="2322-3205"
          RANGES[8]="3276-3411"
          RANGES[9]="3731-3918"
          ALL9="140-224,399-399,548-773,1345-1499,1582-2095,2181-2200,2322-3205,3276-3411,3731-3918"
          # Validation 1: reverting ALL 9 regions must reproduce the green solver.
          awk -v ranges="${ALL9}" -f diag-hybrids/revert9.awk \
            diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/all9.h
          cmp -s diag-hybrids/all9.h diag-hybrids/solver_green.h \
            || { echo "::error::all-9-regions revert is not byte-identical to the green solver"; exit 1; }
          echo "all-9-regions validation OK (byte-identical to green solver)"
          # Validation 2: an empty ranges string selects no hunk and must
          # reproduce the master solver byte-identically.
          awk -v ranges="" -f diag-hybrids/revert9.awk \
            diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/empty9.h
          cmp -s diag-hybrids/empty9.h diag-hybrids/solver_master.h \
            || { echo "::error::empty-ranges generation is not byte-identical to the master solver"; exit 1; }
          echo "empty-ranges validation OK (byte-identical to master solver)"
          # Leave-one-out hybrids k_i: revert 8 regions, keep region i master.
          gen_loo() {
            local idx="$1"
            local ranges=""
            local j
            for j in 1 2 3 4 5 6 7 8 9; do
              if [ "$j" = "$idx" ]; then continue; fi
              if [ -z "$ranges" ]; then ranges="${RANGES[$j]}"; else ranges="${ranges},${RANGES[$j]}"; fi
            done
            awk -v ranges="${ranges}" -f diag-hybrids/revert9.awk \
              diag-hybrids/gm.diff diag-hybrids/solver_master.h > "diag-hybrids/k${idx}.h" \
              || { echo "::error::generation failed for k${idx}"; exit 1; }
            local actual
            local expected
            actual=$(md5sum "diag-hybrids/k${idx}.h" | awk '{print $1}')
            eval "expected=\${MC${idx}}"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::k${idx} md5 mismatch: ${actual} != ${expected}"
              exit 1
            fi
            echo "hybrid k${idx} OK md5=${actual} bytes=$(stat -c%s "diag-hybrids/k${idx}.h")"
          }
          gen_loo 1
          gen_loo 2
          gen_loo 3
          gen_loo 4
          gen_loo 5
          gen_loo 6
          gen_loo 7
          gen_loo 8
          gen_loo 9
          echo "leave_one_out_hybrids_ok"

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Variant loop (a0/a9 anchors, k1-k9 leave-one-out, mm/mm3 minimal-set confirmation)
        timeout-minutes: 235
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          declare -A RAN
          LAST_OUTCOME=""
          declare -a RANGES
          RANGES[1]="140-224"
          RANGES[2]="399-399"
          RANGES[3]="548-773"
          RANGES[4]="1345-1499"
          RANGES[5]="1582-2095"
          RANGES[6]="2181-2200"
          RANGES[7]="2322-3205"
          RANGES[8]="3276-3411"
          RANGES[9]="3731-3918"
          declare -a RNAMES
          RNAMES[1]="r1_api_fields"
          RNAMES[2]="r2_validation"
          RNAMES[3]="r3_rhie_chow_coef"
          RNAMES[4]="r4_boundary_operator"
          RNAMES[5]="r5_evidence_aliases"
          RNAMES[6]="r6_monitor_controls"
          RNAMES[7]="r7_flux_audit_forms"
          RNAMES[8]="r8_momentum_rhs_scale"
          RNAMES[9]="r9_wall_distance_guards"
          build_ranges() {
            out=""
            for i in "$@"; do
              if [ -z "$out" ]; then out="${RANGES[$i]}"; else out="${out},${RANGES[$i]}"; fi
            done
            echo "$out"
          }
          EXTRA_INFO=""
          record_skipped() {
            local V="$1"
            local REASON="$2"
            local STA="$E/nacar9_${V}_test_status_run${RUN_ID}.txt"
            {
              echo "variant=${V}"
              echo "outcome=SKIPPED_${REASON}"
              echo "run_id=${RUN_ID}"
            } > "$STA"
            RAN["$V"]="SKIPPED_${REASON}"
            LAST_OUTCOME="SKIPPED_${REASON}"
          }
          run_variant() {
            local VARIANT="$1"
            local LEVELS="$2"
            local WT_REF="${MASTER_PIN}"
            local SHORT="$VARIANT"
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar9_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar9_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== VARIANT ${VARIANT} levels=${LEVELS} at ${WT_REF} : $(git log -1 --format='%ci %s' "${WT_REF}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            local HYB="none"
            local EXPECT_MD5=""
            case "$VARIANT" in
              a0_master_anchor)
                HYB="none"
                EXPECT_MD5="${MASTER_MD5}"
                ;;
              a9_all9_anchor)
                HYB="diag-hybrids/all9.h"
                EXPECT_MD5="${GREEN_MD5}"
                ;;
              k1|k2|k3|k4|k5|k6|k7|k8|k9)
                HYB="diag-hybrids/${VARIANT}.h"
                eval "EXPECT_MD5=\${MC${VARIANT#k}}"
                ;;
              mm_minimal_set|mm3_minimal_set_3levels)
                HYB="diag-hybrids/mm.h"
                EXPECT_MD5="${MM_MD5}"
                ;;
              mmu_set_plus_unknown|mmu3_set_plus_unknown_3levels)
                HYB="diag-hybrids/mmu.h"
                EXPECT_MD5="${MMU_MD5}"
                ;;
            esac
            git worktree add --detach "$SRC" "$WT_REF" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              git -C "$SRC" checkout "${GREEN_PIN}" -- \
                src/cfdx/io/runtime/convergence_history.h \
                tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ] && [ "$HYB" != "none" ]; then
              cp "$HYB" "$SRC/src/cfdx/physics/steady_incompressible_solver.h" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ]; then
              grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ]; then
              if grep -q "momentum_rhs_scale" "$SRC/src/cfdx/io/runtime/convergence_history.h"; then
                outcome="INCONCLUSIVE_VARIANT_COPY"
              fi
            fi
            if [ -z "$outcome" ]; then
              local actual_md5
              actual_md5=$(md5sum "$SRC/src/cfdx/physics/steady_incompressible_solver.h" | awk '{print $1}')
              if [ "$actual_md5" != "$EXPECT_MD5" ]; then
                echo "=== solver md5 mismatch: ${actual_md5} != ${EXPECT_MD5} ===" >> "$LOG"
                outcome="INCONCLUSIVE_VARIANT_COPY"
              fi
              echo "=== solver md5=${actual_md5} (expected ${EXPECT_MD5}) ===" >> "$LOG"
              if [ -n "$EXTRA_INFO" ]; then echo "$EXTRA_INFO" >> "$LOG"; fi
              echo "=== worktree delta ===" >> "$LOG"
              git -C "$SRC" status --porcelain >> "$LOG" 2>&1
            fi
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                if [ ! -s "$BUILD/validation_meshes/${m}.h5" ]; then outcome="INCONCLUSIVE_MESHGEN"; fi
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification variant=${VARIANT} levels=${LEVELS} ===" >> "$LOG"
              t0=$(date +%s)
              if [ "$LEVELS" = "3" ]; then
                timeout 3600 "$BUILD/test_naca0012_qualification" \
                  "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
                rc=$?
              else
                timeout 3600 "$BUILD/test_naca0012_qualification" \
                  "$BUILD/validation_meshes/naca0012_laminar_n128.h5" >>"$LOG" 2>&1
                rc=$?
              fi
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                if [ "$LEVELS" = "3" ]; then outcome="PASS_3_LEVELS"; else outcome="PASS_128"; fi
              elif [ "$rc" = "124" ]; then
                outcome="TIMEOUT_3600S"
              elif grep -q "did not converge" "$LOG"; then
                outcome="FAIL_DIVERGED"
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "variant=${VARIANT}"
              echo "levels=${LEVELS}"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
              if [ -n "${EXTRA_INFO:-}" ]; then echo "$EXTRA_INFO"; fi
              echo ""
              echo "--- level markers reached ---"
              grep -E "NACA0012_RE1000_A0 level=" "$LOG" || echo "no_level_marker"
              echo "--- failure line (if any) ---"
              grep -E "what\(\):" "$LOG" | tail -1 || echo "no_failure_line"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar9_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r9 ${SHORT} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$VARIANT"]="${outcome:-MISSING}"
            LAST_OUTCOME="${outcome:-MISSING}"
            EXTRA_INFO=""
          }

          {
            run_variant a0_master_anchor 128
            echo "a0_master_anchor=${LAST_OUTCOME}"
            run_variant a9_all9_anchor 128
            echo "a9_all9_anchor=${LAST_OUTCOME}"
            for i in 1 2 3 4 5 6 7 8 9; do
              run_variant "k$i" 128
              echo "k$i=${LAST_OUTCOME}"
            done
            M_IDX=""
            UNK_IDX=""
            for i in 1 2 3 4 5 6 7 8 9; do
              case "${RAN[k$i]}" in
                FAIL_DIVERGED) M_IDX="$M_IDX $i" ;;
                INCONCLUSIVE_*) UNK_IDX="$UNK_IDX $i" ;;
              esac
            done
            echo "necessary_region_indices=[${M_IDX}]"
            echo "unknown_region_indices=[${UNK_IDX}]"
            if [ -z "${M_IDX// /}" ]; then
              echo "NO_NECESSARY_REGION: every k_i passed or was inconclusive -> joint interaction"
              record_skipped mm_minimal_set NO_NECESSARY_REGION
              echo "mm_minimal_set=${LAST_OUTCOME}"
              record_skipped mm3_minimal_set_3levels NO_NECESSARY_REGION
              echo "mm3_minimal_set_3levels=${LAST_OUTCOME}"
              record_skipped mmu_set_plus_unknown NO_NECESSARY_REGION
              echo "mmu_set_plus_unknown=${LAST_OUTCOME}"
              record_skipped mmu3_set_plus_unknown_3levels NO_NECESSARY_REGION
              echo "mmu3_set_plus_unknown_3levels=${LAST_OUTCOME}"
            else
              MREG=""
              for i in $M_IDX; do
                if [ -z "$MREG" ]; then MREG="${RNAMES[$i]}"; else MREG="$MREG,${RNAMES[$i]}"; fi
              done
              MR=$(build_ranges $M_IDX)
              awk -v ranges="${MR}" -f diag-hybrids/revert9.awk \
                diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/mm.h
              if [ -s diag-hybrids/mm.h ]; then
                MM_MD5=$(md5sum diag-hybrids/mm.h | awk '{print $1}')
                EXTRA_INFO="mm_regions=${MREG}"
                EXTRA_INFO="${EXTRA_INFO} mm_indices=[${M_IDX}]"
                EXTRA_INFO="${EXTRA_INFO} mm_ranges=${MR}"
                run_variant mm_minimal_set 128
                echo "mm_minimal_set=${LAST_OUTCOME}"
              else
                record_skipped mm_minimal_set MM_GENERATION_EMPTY
                echo "mm_minimal_set=${LAST_OUTCOME}"
              fi
              if [ "${RAN[mm_minimal_set]}" = "PASS_128" ]; then
                EXTRA_INFO="mm_regions=${MREG}"
                EXTRA_INFO="${EXTRA_INFO} mm_indices=[${M_IDX}]"
                EXTRA_INFO="${EXTRA_INFO} mm_ranges=${MR}"
                run_variant mm3_minimal_set_3levels 3
                echo "mm3_minimal_set_3levels=${LAST_OUTCOME}"
              else
                record_skipped mm3_minimal_set_3levels MM_NOT_PASS
                echo "mm3_minimal_set_3levels=${LAST_OUTCOME}"
              fi
              if [ "${RAN[mm_minimal_set]}" != "PASS_128" ] && [ -n "${UNK_IDX// /}" ]; then
                ALLIDX="$M_IDX $UNK_IDX"
                UREG=""
                for i in $ALLIDX; do
                  if [ -z "$UREG" ]; then UREG="${RNAMES[$i]}"; else UREG="$UREG,${RNAMES[$i]}"; fi
                done
                UR=$(build_ranges $ALLIDX)
                awk -v ranges="${UR}" -f diag-hybrids/revert9.awk \
                  diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/mmu.h
                if [ -s diag-hybrids/mmu.h ]; then
                  MMU_MD5=$(md5sum diag-hybrids/mmu.h | awk '{print $1}')
                  EXTRA_INFO="mmu_regions=${UREG}"
                  EXTRA_INFO="${EXTRA_INFO} mmu_indices=[${ALLIDX}]"
                  EXTRA_INFO="${EXTRA_INFO} mmu_ranges=${UR}"
                  run_variant mmu_set_plus_unknown 128
                  echo "mmu_set_plus_unknown=${LAST_OUTCOME}"
                else
                  record_skipped mmu_set_plus_unknown MMU_GENERATION_EMPTY
                  echo "mmu_set_plus_unknown=${LAST_OUTCOME}"
                fi
                if [ "${RAN[mmu_set_plus_unknown]}" = "PASS_128" ]; then
                  EXTRA_INFO="mmu_regions=${UREG}"
                  EXTRA_INFO="${EXTRA_INFO} mmu_indices=[${ALLIDX}]"
                  EXTRA_INFO="${EXTRA_INFO} mmu_ranges=${UR}"
                  run_variant mmu3_set_plus_unknown_3levels 3
                  echo "mmu3_set_plus_unknown_3levels=${LAST_OUTCOME}"
                else
                  record_skipped mmu3_set_plus_unknown_3levels MMU_NOT_PASS
                  echo "mmu3_set_plus_unknown_3levels=${LAST_OUTCOME}"
                fi
              else
                record_skipped mmu_set_plus_unknown NOT_NEEDED
                echo "mmu_set_plus_unknown=${LAST_OUTCOME}"
                record_skipped mmu3_set_plus_unknown_3levels NOT_NEEDED
                echo "mmu3_set_plus_unknown_3levels=${LAST_OUTCOME}"
              fi
            fi
          } >> "$E/nacar9_sequence_run${RUN_ID}.txt"
          git add "$E"/nacar9_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r9 sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose round-9 verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          ALL_VARIANTS="a0_master_anchor a9_all9_anchor k1 k2 k3 k4 k5 k6 k7 k8 k9 mm_minimal_set mm3_minimal_set_3levels mmu_set_plus_unknown mmu3_set_plus_unknown_3levels"
          for short in $ALL_VARIANTS; do
            eval "oc_${short}=NOT_RUN"
          done
          for short in $ALL_VARIANTS; do
            f="$E/nacar9_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            eval "oc_${short}=\"\${oc:-MISSING}\""
          done
          declare -a RNAMES
          RNAMES[1]="r1_api_fields"
          RNAMES[2]="r2_validation"
          RNAMES[3]="r3_rhie_chow_coef"
          RNAMES[4]="r4_boundary_operator"
          RNAMES[5]="r5_evidence_aliases"
          RNAMES[6]="r6_monitor_controls"
          RNAMES[7]="r7_flux_audit_forms"
          RNAMES[8]="r8_momentum_rhs_scale"
          RNAMES[9]="r9_wall_distance_guards"
          necessary=""
          unknown=""
          exon=""
          for i in 1 2 3 4 5 6 7 8 9; do
            eval "v=\${oc_k${i}}"
            case "$v" in
              FAIL_DIVERGED) necessary="${necessary}${RNAMES[$i]} " ;;
              INCONCLUSIVE_*) unknown="${unknown}${RNAMES[$i]} " ;;
              PASS_128) exon="${exon}${RNAMES[$i]} " ;;
            esac
          done
          complete=1
          for short in $ALL_VARIANTS; do
            eval "v=\${oc_${short}}"
            case "$v" in
              NOT_RUN|MISSING) complete=0 ;;
            esac
          done
          verdict_line="INCOMPLETE: some variants have no recorded outcome -> re-run"
          if [ "$complete" = "1" ]; then
            valid=1
            if [ "${oc_a0_master_anchor}" != "FAIL_DIVERGED" ]; then
              verdict_line="A0_ANCHOR_ANOMALY: master + green conv + green test expected FAIL_DIVERGED at N128, got ${oc_a0_master_anchor} -> repeat before concluding"
              valid=0
            fi
            if [ "${oc_a9_all9_anchor}" != "PASS_128" ]; then
              verdict_line="A9_ANCHOR_ANOMALY: all-9-regions revert (= green trio) expected PASS_128, got ${oc_a9_all9_anchor} -> repeat before concluding"
              valid=0
            fi
            if [ "$valid" = "1" ]; then
              mmr=$(sed -n 's/^mm_ranges=//p' "$E/nacar9_mm_minimal_set_test_status_run${RUN_ID}.txt" 2>/dev/null | tail -1)
              if [ "${oc_mm_minimal_set}" = "SKIPPED_NO_NECESSARY_REGION" ]; then
                verdict_line="JOINT_INTERACTION: no single region is necessary (every k_i PASS_128${unknown:+; unknown: ${unknown}}) yet full master diverges -> the defect emerges from >= 2 master regions jointly -> round 10 = pair hunt at N128"
              elif [ "${oc_mm_minimal_set}" = "PASS_128" ] && [ "${oc_mm3_minimal_set_3levels}" = "PASS_3_LEVELS" ]; then
                verdict_line="REGION_SET_CULPRIT: [${necessary}] is the culprit set (every member necessary, the set sufficient; N64/N128/N256 all pass on the mm hybrid${unknown:+; unknown regions proven unnecessary: ${unknown}}) mm_ranges=${mmr} -> production PR reverting exactly these regions (decision Steven)"
              elif [ "${oc_mm_minimal_set}" = "PASS_128" ]; then
                verdict_line="N128_ONLY_FIX: mm passes N128 but the 3-level confirmation got ${oc_mm3_minimal_set_3levels} -> escalate before any production change"
              elif [ "${oc_mmu_set_plus_unknown}" = "PASS_128" ] && [ "${oc_mmu3_set_plus_unknown_3levels}" = "PASS_3_LEVELS" ]; then
                if [ "$(echo ${unknown} | wc -w)" = "1" ]; then
                  verdict_line="REGION_SET_CULPRIT_PLUS_ONE: culprit set = [${necessary}] + [${unknown}] (the single inconclusive region is required; all three levels pass) -> production PR (decision Steven)"
                else
                  verdict_line="SET_PLUS_UNKNOWN: [${necessary}] + [${unknown}] passes all levels; the set is conservative (some unknown members may be unnecessary) -> prune in round 10 if exactness matters"
                fi
              elif [ "${oc_mm_minimal_set}" = "FAIL_DIVERGED" ] && [ "${oc_mmu_set_plus_unknown}" = "FAIL_DIVERGED" ]; then
                verdict_line="COMBINATION_ESCAPE: reverting the necessary set${unknown:+ plus the unknown set} still diverges -> region-granularity attribution exhausted -> round 10 = hunk-level bisect inside the coupled regions"
              elif [ "${oc_mm_minimal_set}" = "FAIL_DIVERGED" ] && [ "${oc_mmu_set_plus_unknown}" = "SKIPPED_NOT_NEEDED" ]; then
                verdict_line="COMBINATION_ESCAPE: reverting the necessary set still diverges and no unknown regions exist -> round 10 = hunk-level bisect inside the coupled regions"
              elif [ "${oc_mm_minimal_set}" = "FAIL_DIVERGED" ]; then
                verdict_line="INCOMPLETE: mm failed and the mmu branch outcome is ${oc_mmu_set_plus_unknown} -> re-run"
              else
                verdict_line="MM_ANOMALY: mm outcome ${oc_mm_minimal_set} is not interpretable -> repeat before concluding"
              fi
            fi
          fi
          VER="$E/nacar9_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "master_pin=${MASTER_PIN}"
            echo "green_pin=${GREEN_PIN}"
            echo "round7_context=IN_TRIO_CULPRIT (run 39663748207: v1+v2 PASS_3_LEVELS green-identical, v0 FAIL)"
            echo "round8_context=COMBINATION_OR_COUPLED (run 39672681948: v0b/vC FAIL as expected, r2/r4/r5/r8/r9 not sufficient alone, r1/r3/r6/r7 INCONCLUSIVE_BUILD)"
            echo "a0_master_anchor=${oc_a0_master_anchor} (expected FAIL_DIVERGED)"
            echo "a9_all9_anchor=${oc_a9_all9_anchor} (expected PASS_128)"
            for i in 1 2 3 4 5 6 7 8 9; do
              eval "echo \"k${i}=${RNAMES[$i]}: \${oc_k${i}}\""
            done
            echo "necessary_regions=${necessary:-none}"
            echo "unknown_regions=${unknown:-none}"
            echo "exonerated_regions=${exon:-none}"
            echo "mm_minimal_set=${oc_mm_minimal_set}"
            echo "mm3_minimal_set_3levels=${oc_mm3_minimal_set_3levels}"
            echo "mmu_set_plus_unknown=${oc_mmu_set_plus_unknown}"
            echo "mmu3_set_plus_unknown_3levels=${oc_mmu3_set_plus_unknown_3levels}"
            echo "sign_note=green test carries the OLD #926 Cd_pressure convention (Fxp+=-pp): compare iterations/convergence, never raw Cd signs"
            echo ""
            echo "--- per-variant NACA digest (level markers + failure) ---"
            for short in $ALL_VARIANTS; do
              L="$E/nacar9_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0 level=|NACA0012_QUALIFICATION|did not converge|what\(\):|Cd=" "$L" | tail -14
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r9 verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$complete" = "1" ]; then
            echo "round-9 leave-one-out campaign: ${verdict_line}"
          else
            echo "::error::round-9 incomplete: ${verdict_line}"
            exit 1
          fi
