              verdict_line="MONOTONICITY_VIOLATION: b1 FAIL (culprit intersects {r3,r4}) yet sr1 PASS (culprit within {r2,r5,r6,r7,r8,r9}) -> repeat before concluding"
            elif faild "${oc_sr1}"; then
              verdict_line="JOINT_CROSS_BLOCK: the culprit has members on both sides (b1 FAIL: intersects {r3,r4}; b3 FAIL: intersects {r1,r2,r5,r8}; sr1 FAIL: intersects {r1,r3,r4}) -> region-granularity attribution exhausted; production fallback = full green solver swap (proven PASS_3_LEVELS in round 7 v1 at these pins) or round 10 hunk-level bisect (decision Steven)"
              ok=1
            else
              verdict_line="INCOMPLETE_JOINT: sr1=${oc_sr1} is neither a pass nor a divergence -> re-run"
            fi
          else
            verdict_line="INCOMPLETE_WITH_UNKNOWNS: k1=${oc_k1} k3=${oc_k3} d4=${oc_d4} b1=${oc_b1} b3=${oc_b3} -> definite outcomes missing, re-run"
          fi
          VER="$E/nacar9b_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "master_pin=${MASTER_PIN}"
            echo "green_pin=${GREEN_PIN}"
            echo "round7_context=IN_TRIO_CULPRIT (run 39663748207: v1+v2 PASS_3_LEVELS green-identical, v0 FAIL)"
            echo "round8_context=COMBINATION_OR_COUPLED (run 39672681948: v0b/vC FAIL as expected = test+conv neutral, r2/r4/r5/r8/r9 single reverts all FAIL_DIVERGED, r1/r3/r6/r7 INCONCLUSIVE_BUILD)"
            echo "round9_context=A9_ANCHOR_ANOMALY (run 39722433948: N128-only invocation passed 1 mesh to a 3-mesh binary; invalid, repeated here with fixed invocation)"
            echo "compile_coupling=master r2->r1, r4->r3, r5->r1, r6->r1, r7->r3, r8->r1, r9->r3+r6; green r7->green r6 (round-9 build logs)"
            echo "a0_master_anchor=${oc_a0_master_anchor} (expected FAIL_DIVERGED)"
            echo "a9_all9_anchor=${oc_a9_all9_anchor} (expected PASS at N128)"
            echo "k1(r1 only)=${oc_k1}"
            echo "k3(r3 only)=${oc_k3}"
            echo "d4(revert r2,r4,r5,r8)=${oc_d4}"
            echo "b1(revert r1,r2,r5,r6,r7,r8,r9)=${oc_b1}"
            echo "b3(revert r3,r4,r6,r7,r9)=${oc_b3}"
            echo "b679(revert r6,r7,r9)=${oc_b679}"
            echo "sr1(revert r2,r5,r6,r7,r8,r9)=${oc_sr1}"
            echo "s149(revert r4,r6,r7,r9)=${oc_s149}"
            for s in p24 p25 p28 p45 p48 p58; do
              eval "echo \"${s}=\${oc_${s}}\""
            done
            for s in t245 t248 t258 t458; do
              eval "echo \"${s}=\${oc_${s}}\""
            done
            echo "t258_in_sr1_branch=${oc_t258}"
            echo "c_b1=${oc_c_b1}"
            echo "c_b3=${oc_c_b3}"
            echo "c_b679=${oc_c_b679}"
            echo "c_d4=${oc_c_d4}"
            echo "c_sr1=${oc_c_sr1}"
            echo "c_s149=${oc_c_s149}"
            echo "c_t258=${oc_c_t258}"
            echo "sign_note=green test carries the OLD #926 Cd_pressure convention (Fxp+=-pp): compare iterations/convergence, never raw Cd signs"
            echo ""
            echo "--- per-variant NACA digest (level markers + failure) ---"
            for short in $ALL_VARIANTS; do
              L="$E/nacar9b_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0 level=|NACA0012_QUALIFICATION|did not converge|what\(\):|Cd=" "$L" | tail -14
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r9b verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$ok" = "1" ]; then
            echo "round-9b additive-region campaign: ${verdict_line}"
          else
            echo "::error::round-9b not conclusive: ${verdict_line}"
            exit 1
          fi
