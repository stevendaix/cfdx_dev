name: NACA0012 divergence bisect (diag-line pins) round 4

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 4): identify WHICH diag-line change made NACA0012 green.
# Reference evidence:
#   - PASS at diag f88b3700 (2026-10-16, evidence run 38809298638):
#     all 3 levels converged (N64 433 it, N128 995 it, N256 3989 it, 2943 s).
#   - FAIL at master merge-base aa806657 (round 3): stall iter=8000 cap,
#     momentum_residual_relative=1.53e-13 frozen, continuity_normalized=
#     1.28e-05, flux_velocity_mismatch_linf=0.0113323, worst_momentum_cell=
#     2473, rc=134, FAIL ~293-296 s.
# Rounds 1-3 established: master was ALREADY red at the 10-14 merge-base
# aa806657 (round 3 pin FAIL_DIVERGED), so the 10-16 diag-line PASS came
# from diag-only fixes/cherry-picks, NOT from a master regression revert.
#
# Round 4 pins (diag line, chrono order, all ancestors of this branch):
#   aa806657  control FAIL (master merge-base, round-3 FAIL_DIVERGED)
#   42679a5d  candidate 1: fix(validation) flux-form FV source-consistent
#             operator for the planar MMS closure (diag-only, verification
#             app; no production code)
#   a1a62dc1  candidate 2: #904 dAU = V*rAU cherry-pick (+ ITER channel trace)
#   a61910a7  candidate 3: #895 VMFL036 bring-up cherry-pick (gradient fix
#             b30125e + repair 3885714 + Re=100 fine band). Window before it
#             also contains harness commits 81da2f05 (#905 garde metrique),
#             d44ddd79 (#906 moniteur stagnation), 9824714c (#907 ctest
#             parsing) and diag-tools/evidence-only commits.
#   611d5c8e  candidate 4: #908 ghia nested Fp fix cherry-pick
#   f88b3700  control PASS (10-16, evidence run 38809298638)
#
# Sequence: FAIL control first, then candidates in chrono order, STOP at the
# first PASS_3_LEVELS (fail-fast attribution: pins after the first green add
# no attribution information), then run the PASS control. Every pin is
# built and run in isolation with the exact CI configuration (Release +
# LONG_VALIDATION + MPI + parallel HDF5); NACA meshes are generated per pin
# by the pin's own script (verified byte-identical across rounds 1-3 pins).
#
# Per-pin classification (log content + exit code):
#   PASS_3_LEVELS / FAIL_DIVERGED / TIMEOUT_3600S / FAIL_OTHER
#   INCONCLUSIVE_{WORKTREE,CONFIGURE,BUILD,MESHGEN} = upstream stage failed
#
# Interpretation guide (round 4):
#   first green = 42679a5d -> causal fix = flux-form FV source-consistent
#        operator (diag-only): port to current master via a clean PR
#   first green = a1a62dc1 -> 42679a5d alone insufficient; window
#        (42679a5d..a1a62dc1] = #904 dAU=V*rAU (+ possible combination)
#   first green = a61910a7 -> window (a1a62dc1..a61910a7] = {#905, #906, #907
#        harness, diag-tools only, a61910a7 #895 bring-up}; harness commits
#        do not change solver numerics -> prime suspect a61910a7, but a
#        round 5 (pins 81da2f05 / d44ddd79) must separate harness vs bring-up
#   first green = 611d5c8e -> window (a61910a7..611d5c8e] = #908 ghia Fp fix
#   no candidate green + f88b3700 PASS -> contradiction: (611d5c8e..f88b3700]
#        contains only diag-tools/evidence commits -> suspect runner
#        variance, repeat before concluding
#   aa806657 PASS or f88b3700 FAIL -> contradicts rounds 1-3 evidence ->
#        runner/harness drift, repeat before concluding
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is
# instrumented; evidence is committed per pin so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-divergence-bisect-diag
  cancel-in-progress: false

jobs:
  naca-bisect:
    name: NACA qualification at pinned diag-line commits (round 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (all pins reachable from the diagnostics branch)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin ci/long-campaign-diagnostics 2>/dev/null \
            || git fetch --no-tags origin ci/long-campaign-diagnostics
          for pin in \
            aa8066571a55ac03557148542a43b3cbbdd46371 \
            42679a5daf5857219e7d645b580d7aaf6c6efadf \
            a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1 \
            a61910a76e0da8aa06b50a276094822ca013f66b \
            611d5c8eb591b797d21443980cb16fd0a21e51db \
            f88b3700fdc8b5a2aa6c79ac0f2e9226bca7e5f1; do
            git cat-file -e "${pin}^{commit}"
            git merge-base --is-ancestor "${pin}" FETCH_HEAD
            echo "pin_ok ${pin} $(git log -1 --format='%ci %s' "${pin}")"
          done

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Bisect loop (per-pin configure/build/mesh/run, stop at first candidate PASS)
        timeout-minutes: 340
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          PIN_FAIL_CONTROL="aa8066571a55ac03557148542a43b3cbbdd46371"
          PIN_PASS_CONTROL="f88b3700fdc8b5a2aa6c79ac0f2e9226bca7e5f1"
          declare -A RAN
          FIRST_GREEN=""
          LAST_OUTCOME=""

          run_pin() {
            local PIN="$1"
            local ROLE="$2"
            local SHORT="${PIN:0:8}"
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar4_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar4_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== PIN ${PIN} role=${ROLE} : $(git log -1 --format='%ci %s' "${PIN}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            git worktree add --detach "$SRC" "$PIN" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                [ -s "$BUILD/validation_meshes/${m}.h5" ] || outcome="INCONCLUSIVE_MESHGEN"
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification at ${SHORT} ===" >> "$LOG"
              t0=$(date +%s)
              timeout 3600 "$BUILD/test_naca0012_qualification" \
                "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
              rc=$?
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                outcome="TIMEOUT_3600S"
              elif grep -q "did not converge" "$LOG"; then
                outcome="FAIL_DIVERGED"
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "pin=${PIN}"
              echo "role=${ROLE}"
              echo "subject=$(git log -1 --format='%s' "${PIN}")"
              echo "commit_date=$(git log -1 --format='%ci' "${PIN}")"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar4_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r4 ${SHORT} role=${ROLE} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$PIN"]="${outcome:-MISSING}"
            LAST_OUTCOME="${outcome:-MISSING}"
          }

          run_pin "$PIN_FAIL_CONTROL" control_fail
          for CAND in \
            42679a5daf5857219e7d645b580d7aaf6c6efadf \
            a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1 \
            a61910a76e0da8aa06b50a276094822ca013f66b \
            611d5c8eb591b797d21443980cb16fd0a21e51db; do
            run_pin "$CAND" candidate
            if [ "$LAST_OUTCOME" = "PASS_3_LEVELS" ]; then
              FIRST_GREEN="$CAND"
              echo "first_green=${CAND}" >> "$E/nacar4_sequence_run${RUN_ID}.txt"
              break
            fi
          done
          if [ -z "${RAN[$PIN_PASS_CONTROL]:-}" ]; then
            run_pin "$PIN_PASS_CONTROL" control_pass
          fi
          if [ -z "$FIRST_GREEN" ]; then
            echo "first_green=none" >> "$E/nacar4_sequence_run${RUN_ID}.txt"
          fi
          git add "$E"/nacar4_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r4 sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose bisect verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          oc_aa806657="NOT_RUN"
          oc_42679a5d="NOT_RUN"
          oc_a1a62dc1="NOT_RUN"
          oc_a61910a7="NOT_RUN"
          oc_611d5c8e="NOT_RUN"
          oc_f88b3700="NOT_RUN"
          for short in aa806657 42679a5d a1a62dc1 a61910a7 611d5c8e f88b3700; do
            f="$E/nacar4_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            case "$short" in
              aa806657) oc_aa806657="${oc:-MISSING}" ;;
              42679a5d) oc_42679a5d="${oc:-MISSING}" ;;
              a1a62dc1) oc_a1a62dc1="${oc:-MISSING}" ;;
              a61910a7) oc_a61910a7="${oc:-MISSING}" ;;
              611d5c8e) oc_611d5c8e="${oc:-MISSING}" ;;
              f88b3700) oc_f88b3700="${oc:-MISSING}" ;;
            esac
          done
          first_green="unknown"
          if [ -s "$E/nacar4_sequence_run${RUN_ID}.txt" ]; then
            first_green=$(sed -n 's/^first_green=//p' "$E/nacar4_sequence_run${RUN_ID}.txt" | tail -1)
          fi
          is_classified() {
            case "$1" in
              PASS_3_LEVELS|FAIL_DIVERGED|TIMEOUT_3600S|FAIL_OTHER) return 0 ;;
              *) return 1 ;;
            esac
          }
          controls_resolved=0
          failcls="FAIL_DIVERGED|TIMEOUT_3600S|FAIL_OTHER"
          if echo "$oc_aa806657" | grep -Eq "^(${failcls})$" && [ "$oc_f88b3700" = "PASS_3_LEVELS" ]; then
            controls_resolved=1
          fi
          verdict_line="CONTROLS_UNRESOLVED aa806657=${oc_aa806657} f88b3700=${oc_f88b3700} -> incomplete, re-run"
          if [ "$controls_resolved" = "1" ]; then
            case "$first_green" in
              42679a5daf5857219e7d645b580d7aaf6c6efadf)
                verdict_line="FIRST_GREEN=42679a5d -> causal fix = flux-form FV source-consistent operator (diag-only); port to current master via clean PR" ;;
              a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1)
                verdict_line="FIRST_GREEN=a1a62dc1 -> window (42679a5d..a1a62dc1] = #904 dAU=V*rAU; 42679a5d alone insufficient (possible combination)" ;;
              a61910a76e0da8aa06b50a276094822ca013f66b)
                verdict_line="FIRST_GREEN=a61910a7 -> window (a1a62dc1..a61910a7] = {#905,#906,#907 harness, diag-tools, a61910a7 #895 bring-up}; prime suspect a61910a7, round 5 needed to separate harness vs bring-up" ;;
              611d5c8eb591b797d21443980cb16fd0a21e51db)
                verdict_line="FIRST_GREEN=611d5c8e -> window (a61910a7..611d5c8e] = #908 ghia nested Fp fix" ;;
              none|"")
                verdict_line="NO_CANDIDATE_GREEN + f88b3700 PASS -> contradiction ((611d5c8e..f88b3700] = diag-tools/evidence only): suspect runner variance, repeat" ;;
            esac
          fi
          if [ "$oc_aa806657" = "PASS_3_LEVELS" ]; then
            verdict_line="CONTRADICTION aa806657 PASS vs round-3 FAIL_DIVERGED -> runner drift, repeat"
          fi
          if [ "$oc_f88b3700" = "FAIL_DIVERGED" ] || [ "$oc_f88b3700" = "FAIL_OTHER" ] || [ "$oc_f88b3700" = "TIMEOUT_3600S" ]; then
            verdict_line="CONTRADICTION f88b3700 FAIL vs evidence run 38809298638 PASS -> runner/harness drift, repeat"
          fi
          VER="$E/nacar4_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "pin_aa806657=${oc_aa806657} (control, expected FAIL_DIVERGED)"
            echo "pin_42679a5d=${oc_42679a5d} (candidate 1: flux-form FV operator)"
            echo "pin_a1a62dc1=${oc_a1a62dc1} (candidate 2: #904 dAU=V*rAU)"
            echo "pin_a61910a7=${oc_a61910a7} (candidate 3: #895 bring-up)"
            echo "pin_611d5c8e=${oc_611d5c8e} (candidate 4: #908 ghia Fp)"
            echo "pin_f88b3700=${oc_f88b3700} (control, expected PASS_3_LEVELS)"
            echo "first_green=${first_green}"
            echo "fail_fast=pins after the first candidate PASS are NOT_RUN by design"
            echo "reference_pass=f88b3700 (2026-10-16, 3 levels converged, 2943 s, run 38809298638)"
            echo "reference_fail=aa806657 (round 3: stall iter=8000 cap, rc=134, ~295 s)"
            echo ""
            echo "--- per-pin NACA digest (last markers) ---"
            for short in aa806657 42679a5d a1a62dc1 a61910a7 611d5c8e f88b3700; do
              L="$E/nacar4_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0|NACA0012_QUALIFICATION|did not converge|Cd=" "$L" | tail -12
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r4 verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$controls_resolved" = "1" ]; then
            echo "round-4 bisect: ${verdict_line}"
          else
            echo "::error::round-4 bisect controls unresolved: ${verdict_line}"
            exit 1
          fi
