name: NACA0012 qualification on master pins (post dAU fix) round 5

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 5): determine whether NACA0012 is GREEN on current master.
# Context: round 4 (run 39501827590) proved the diag-line fix #904
# (dAU = V*rAU, commit a1a62dc1, 2026-10-15) makes the NACA qualification
# pass (PASS_3_LEVELS, 2931 s, bit-identical Cd/Cl/Cm to the f88b3700
# reference). Master pins up to 16734e82 (rounds 1-3, <= 2026-10-16) were
# all FAIL_DIVERGED - master did not have the fix yet.
# Verified by direct file reads: master contains the consolidated
# pressure-velocity fixes (dAU_boundary with the cell-volume factor +
# pressure_face_orthogonal_coefficient) since commit 0c61c51ee8622e8019ff7
# cdb895f795f647ccecc (2026-10-18 16:41Z, "integration(numerics):
# consolidate pressure-velocity and validation fixes").
# The CFDX total validation workflow only runs on master weekly
# (cron 17 3 * * 1) or via label/dispatch: the last master run #5443
# (2026-10-19 03:17Z) FAILED but ran while test_n9_physical_matrix was red
# on master (fixed later that day), so it does not answer the NACA question.
# No master validation campaign has run on any commit containing the fix.
#
# Round 5 pins (all ancestors of origin/master, chrono order):
#   aa806657  control FAIL (master merge-base 10-14, rounds 1-4 FAIL_DIVERGED
#             ~293-296 s: stall iter=8000, continuity 1.28e-5 frozen)
#   0c61c51e  post-fix (2026-10-18 16:41Z, first master commit with the
#             consolidated dAU = V*rAU boundary operator)
#   2f5c0dce  current master head at workflow push time (2026-10-21 05:04Z,
#             includes SST #1006-#1008, #999 S2S, #989 wall-distance cache,
#             #1011 outer loop, restart fixes)
#
# All three pins are ALWAYS run (no fail-fast): the round needs the full
# map. Each pin is checked out in an isolated worktree, built with the
# exact CI configuration (Release + LONG_VALIDATION + MPI + parallel HDF5),
# meshes generated by the pin's own script, test run directly (binary, not
# ctest - parsing harness state is irrelevant).
#
# Per-pin classification (log content + exit code):
#   PASS_3_LEVELS / FAIL_DIVERGED / TIMEOUT_3600S / FAIL_OTHER
#   INCONCLUSIVE_{WORKTREE,CONFIGURE,BUILD,MESHGEN} = upstream stage failed
#
# Interpretation guide (round 5):
#   aa806657 FAIL + 0c61c51e PASS + 2f5c0dce PASS
#     -> MASTER_NACA_GREEN_SINCE_2026-10-18: the consolidated fix makes NACA
#        green on master; the NACA failures seen afterwards on the #989
#        campaign ran on a PR tree whose base (ede4f918, 10-19 ~05:35Z) did
#        NOT contain the fix. Expected action: run the CFDX total validation
#        on master (workflow_dispatch or the weekly cron 2026-10-26) for the
#        official gate; no port PR is needed.
#   aa806657 FAIL + 0c61c51e PASS + 2f5c0dce FAIL
#     -> REGRESSION_WINDOW_0c61..HEAD: NACA was green at the consolidation
#        and broke again between 0c61c51e and the current head (candidates:
#        cellwise viscosity routing 03ac6f6c, #966 PCD A/B, SST #1006-#1008,
#        #999 S2S, #989 wall-distance cache, #1011, restart fixes) -> a
#        round-6 bisect is required before any conclusion.
#   aa806657 FAIL + 0c61c51e FAIL (+ 2f5c0dce FAIL)
#     -> CONSOLIDATED_FIX_INSUFFICIENT_ON_MASTER: the evolved master form of
#        the boundary operator (pressure_face_orthogonal_coefficient
#        projection + deferred non-orthogonal term) does not reproduce the
#        diag a1a62dc1 behaviour, or another master change cancels the fix
#        -> deep diagnostic required; do NOT claim master green.
#   aa806657 PASS -> contradicts rounds 1-4 (FAIL_DIVERGED twice, including
#     round 4 on this same infra) -> runner drift, repeat before concluding.
#   any INCONCLUSIVE_* -> upstream build/mesh failure, repeat the pin.
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is
# instrumented; evidence is committed per pin so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-divergence-bisect-diag
  cancel-in-progress: false

jobs:
  naca-bisect:
    name: NACA qualification at master pins (round 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (all pins reachable from origin/master)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          for pin in \
            aa8066571a55ac03557148542a43b3cbbdd46371 \
            0c61c51ee8622e8019ff7cdb895f795f647ccecc \
            2f5c0dce18f0794ad22b25c68ddea7c19eb5ebc6; do
            git cat-file -e "${pin}^{commit}"
            git merge-base --is-ancestor "${pin}" FETCH_HEAD
            echo "pin_ok ${pin} $(git log -1 --format='%ci %s' "${pin}")"
          done

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Qualification loop (per-pin configure/build/mesh/run, all pins always run)
        timeout-minutes: 315
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          declare -A RAN
          LAST_OUTCOME=""

          run_pin() {
            local PIN="$1"
            local ROLE="$2"
            local SHORT="${PIN:0:8}"
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar5_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar5_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== PIN ${PIN} role=${ROLE} : $(git log -1 --format='%ci %s' "${PIN}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            git worktree add --detach "$SRC" "$PIN" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                [ -s "$BUILD/validation_meshes/${m}.h5" ] || outcome="INCONCLUSIVE_MESHGEN"
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification at ${SHORT} ===" >> "$LOG"
              t0=$(date +%s)
              timeout 3600 "$BUILD/test_naca0012_qualification" \
                "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
              rc=$?
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                outcome="TIMEOUT_3600S"
              elif grep -q "did not converge" "$LOG"; then
                outcome="FAIL_DIVERGED"
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "pin=${PIN}"
              echo "role=${ROLE}"
              echo "subject=$(git log -1 --format='%s' "${PIN}")"
              echo "commit_date=$(git log -1 --format='%ci' "${PIN}")"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar5_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r5 ${SHORT} role=${ROLE} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$PIN"]="${outcome:-MISSING}"
            LAST_OUTCOME="${outcome:-MISSING}"
          }

          {
            run_pin "aa8066571a55ac03557148542a43b3cbbdd46371" control_fail
            echo "pin_aa806657=${LAST_OUTCOME}"
            run_pin "0c61c51ee8622e8019ff7cdb895f795f647ccecc" post_fix
            echo "pin_0c61c51e=${LAST_OUTCOME}"
            run_pin "2f5c0dce18f0794ad22b25c68ddea7c19eb5ebc6" current_head
            echo "pin_2f5c0dce=${LAST_OUTCOME}"
          } >> "$E/nacar5_sequence_run${RUN_ID}.txt"
          git add "$E"/nacar5_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r5 sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose round-5 verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          oc_aa806657="NOT_RUN"
          oc_0c61c51e="NOT_RUN"
          oc_2f5c0dce="NOT_RUN"
          for short in aa806657 0c61c51e 2f5c0dce; do
            f="$E/nacar5_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            case "$short" in
              aa806657) oc_aa806657="${oc:-MISSING}" ;;
              0c61c51e) oc_0c61c51e="${oc:-MISSING}" ;;
              2f5c0dce) oc_2f5c0dce="${oc:-MISSING}" ;;
            esac
          done
          is_classified() {
            case "$1" in
              PASS_3_LEVELS|FAIL_DIVERGED|TIMEOUT_3600S|FAIL_OTHER) return 0 ;;
              *) return 1 ;;
            esac
          }
          verdict_line="INCOMPLETE aa806657=${oc_aa806657} 0c61c51e=${oc_0c61c51e} 2f5c0dce=${oc_2f5c0dce} -> re-run"
          complete=0
          if is_classified "$oc_aa806657" && is_classified "$oc_0c61c51e" && is_classified "$oc_2f5c0dce"; then
            complete=1
            if [ "$oc_aa806657" = "PASS_3_LEVELS" ]; then
              verdict_line="CONTRADICTION aa806657 PASS vs rounds 1-4 FAIL_DIVERGED -> runner drift, repeat"
              complete=0
            elif [ "$oc_0c61c51e" = "PASS_3_LEVELS" ] && [ "$oc_2f5c0dce" = "PASS_3_LEVELS" ]; then
              verdict_line="MASTER_NACA_GREEN_SINCE_2026-10-18: consolidated dAU fix (0c61c51e) makes NACA green on master; current head 2f5c0dce green; run the CFDX total validation on master (dispatch or weekly cron 2026-10-26) for the official gate; no port PR needed"
            elif [ "$oc_0c61c51e" = "PASS_3_LEVELS" ] && [ "$oc_2f5c0dce" != "PASS_3_LEVELS" ]; then
              verdict_line="REGRESSION_WINDOW_0c61..HEAD: NACA green at 0c61c51e (2026-10-18) but ${oc_2f5c0dce} at current head 2f5c0dce -> round-6 bisect of the window (03ac6f6c cellwise viscosity routing, #966 PCD A/B, SST #1006-#1008, #999 S2S, #989 wall-distance cache, #1011, restart fixes)"
            elif [ "$oc_0c61c51e" != "PASS_3_LEVELS" ]; then
              verdict_line="CONSOLIDATED_FIX_INSUFFICIENT_ON_MASTER: 0c61c51e outcome=${oc_0c61c51e} (evolved boundary operator form or interaction) -> deep diagnostic required, do NOT claim master green"
            fi
          fi
          VER="$E/nacar5_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "pin_aa806657=${oc_aa806657} (control, expected FAIL_DIVERGED ~295 s)"
            echo "pin_0c61c51e=${oc_0c61c51e} (post-fix 2026-10-18 16:41Z, consolidated dAU = V*rAU)"
            echo "pin_2f5c0dce=${oc_2f5c0dce} (master head at push time, 2026-10-21 05:04Z)"
            echo "reference_diag_pass=a1a62dc1 (round 4, run 39501827590, PASS_3_LEVELS 2931 s, Cd/Cl/Cm bit-identical to f88b3700)"
            echo "reference_diag_fail=aa806657 (rounds 1-4: stall iter=8000, rc=134, ~293-296 s)"
            echo "master_campaign_last=#5443 scheduled 2026-10-19 03:17Z FAILED (ran while test_n9_physical_matrix was red; n9 fixed 2026-10-19 ~21:5xZ; weekly cron next 2026-10-26)"
            echo ""
            echo "--- per-pin NACA digest (last markers) ---"
            for short in aa806657 0c61c51e 2f5c0dce; do
              L="$E/nacar5_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0|NACA0012_QUALIFICATION|did not converge|Cd=" "$L" | tail -12
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r5 verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$complete" = "1" ]; then
            echo "round-5 qualification: ${verdict_line}"
          else
            echo "::error::round-5 incomplete or contradicted: ${verdict_line}"
            exit 1
          fi
