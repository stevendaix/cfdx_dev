name: NACA0012 boundary-operator variant campaign (round 6)

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 6): isolate the N128 hard-divergence culprit on master.
# Context: round 4 (run 39501827590) proved the diag fix #904 (dAU = V*rAU,
# a1a62dc1, 2026-10-15, simple centre-line operator form) makes the NACA
# qualification pass all 3 levels (N64 433 it / N128 995 it / N256 3989 it).
# Round 5 (run 39547653053) showed master has the fix since 0c61c51e
# (2026-10-18, consolidated, EVOLVED form: pressure_face_orthogonal_coefficient
# + deferred non-orthogonal boundary term): N64 now converges (424 it,
# continuity 1.46e-10) but N128 DIVERGES HARD at iteration 15 (momentum
# residual explodes to 1.4e12 relative) - a failure mode the diag simple form
# never shows. Same signature bit-identical at master head 2f5c0dce.
# Suspicious detail: N64 Cd_pressure = +0.0343964 on master vs -0.0343963 on
# the green diag tree (same magnitude to 7 digits, sign flipped).
#
# Round 6 runs the NACA qualification at the pinned master commit with three
# variants of the fixed-pressure boundary block in
# src/cfdx/physics/steady_incompressible_solver.h:
#   v0_master_pristine : pristine master file (anchor, expected N64 PASS
#                        424 it then N128 hard divergence ~20 s)
#   v1_diag_boundary   : boundary block REPLACED by the diag a1a62dc1 form
#                        (centre-line projection Sf.e/d, single coefficient
#                        matrix+RHS, no deferred non-orthogonal term,
#                        degenerate-distance guard)
#   v2_no_deferred     : evolved form kept (pressure_face_orthogonal_
#                        coefficient) but deferred_boundary term REMOVED
#                        from the RHS (isolates the deferred term)
# Variants v1/v2 are stored in diag-tools/naca_r6_variants/*.h.txt and
# copied over the solver in an isolated worktree of the pinned master
# commit; markers are verified fail-closed before each build.
#
# Interpretation guide (round 6):
#   v1 PASS_3_LEVELS -> BOUNDARY_BLOCK_CULPRIT: the evolved boundary
#        operator form breaks N128 -> production PR = swap the fixed-
#        pressure boundary block to the centre-line diag form + align
#        fiche 15 sections 3-4 + full qualification (decision Steven)
#   v1 FAIL + v2 PASS_3_LEVELS -> DEFERRED_TERM_CULPRIT: the orthogonal
#        coefficient is fine, the deferred non-orthogonal boundary term
#        breaks N128 -> production PR = remove/repair that term
#   v1 FAIL + v2 FAIL (N128 diverges like v0) -> NOT_THE_BOUNDARY_BLOCK:
#        the culprit is elsewhere in the 0c61c51e consolidation or another
#        master piece -> next step = inspect the consolidation diff beyond
#        the boundary block (round 7), do NOT conclude
#   any variant failing at N64 -> variant build suspect (v0 proved N64
#        green on this tree) -> INCONCLUSIVE, re-check the variant
#   INCONCLUSIVE_{CONFIGURE,BUILD,MESHGEN} -> upstream stage failed, re-run
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is changed
# (variants live only on the diagnostics branch and in worktrees);
# evidence is committed per variant so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-divergence-bisect-diag
  cancel-in-progress: false

jobs:
  naca-r6-variants:
    name: NACA boundary-operator variants at pinned master commit (round 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MASTER_PIN: 28e4d183b258997c5b923b2e05569263e900f2ff
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (pinned master commit reachable)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          git cat-file -e "${MASTER_PIN}^{commit}"
          git merge-base --is-ancestor "${MASTER_PIN}" FETCH_HEAD
          echo "pin_ok ${MASTER_PIN} $(git log -1 --format='%ci %s' "${MASTER_PIN}")"
          echo "origin_master_head_at_start $(git rev-parse FETCH_HEAD)"
          if [ "${MASTER_PIN}" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "NOTE: origin/master has moved past the pinned commit; this campaign answers for the pin only."
          fi

      - name: Fail-closed variant marker guards
        run: |
          set -euo pipefail
          test -s diag-tools/naca_r6_variants/v1_diag_boundary.h.txt
          test -s diag-tools/naca_r6_variants/v2_no_deferred.h.txt
          grep -q "round-6 variant v1" diag-tools/naca_r6_variants/v1_diag_boundary.h.txt
          ! grep -q "dAU_boundary" diag-tools/naca_r6_variants/v1_diag_boundary.h.txt
          ! grep -q "deferred_boundary" diag-tools/naca_r6_variants/v1_diag_boundary.h.txt
          grep -q "round-6 variant v2" diag-tools/naca_r6_variants/v2_no_deferred.h.txt
          grep -q "dAU_boundary" diag-tools/naca_r6_variants/v2_no_deferred.h.txt
          ! grep -q "deferred_boundary" diag-tools/naca_r6_variants/v2_no_deferred.h.txt
          echo "variant_markers_ok"

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Variant loop (pristine v0, then v1, then v2 - all always run)
        timeout-minutes: 225
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          declare -A RAN
          LAST_OUTCOME=""

          run_variant() {
            local VARIANT="$1"
            local SHORT="$VARIANT"
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar6_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar6_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== VARIANT ${VARIANT} at pin ${MASTER_PIN} : $(git log -1 --format='%ci %s' "${MASTER_PIN}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            git worktree add --detach "$SRC" "$MASTER_PIN" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              if [ "$VARIANT" = "v1_diag_boundary" ] || [ "$VARIANT" = "v2_no_deferred" ]; then
                cp "diag-tools/naca_r6_variants/${VARIANT}.h.txt" \
                  "$SRC/src/cfdx/physics/steady_incompressible_solver.h" >>"$LOG" 2>&1 \
                  || outcome="INCONCLUSIVE_VARIANT_COPY"
                echo "=== variant copied: ${VARIANT} ===" >> "$LOG"
              else
                grep -q "dAU_boundary" "$SRC/src/cfdx/physics/steady_incompressible_solver.h" \
                  || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                grep -q "deferred_boundary" "$SRC/src/cfdx/physics/steady_incompressible_solver.h" \
                  || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                echo "=== pristine master solver verified (dAU_boundary + deferred_boundary present) ===" >> "$LOG"
              fi
            fi
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                [ -s "$BUILD/validation_meshes/${m}.h5" ] || outcome="INCONCLUSIVE_MESHGEN"
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification variant=${VARIANT} ===" >> "$LOG"
              t0=$(date +%s)
              timeout 3600 "$BUILD/test_naca0012_qualification" \
                "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
              rc=$?
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                outcome="TIMEOUT_3600S"
              elif grep -q "did not converge" "$LOG"; then
                outcome="FAIL_DIVERGED"
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "variant=${VARIANT}"
              echo "pin=${MASTER_PIN}"
              echo "pin_subject=$(git log -1 --format='%s' "${MASTER_PIN}")"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
              echo ""
              echo "--- level markers reached ---"
              grep -E "NACA0012_RE1000_A0 level=" "$LOG" || echo "no_level_marker"
              echo "--- failure line (if any) ---"
              grep -E "what\(\):" "$LOG" | tail -1 || echo "no_failure_line"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar6_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r6 ${SHORT} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$VARIANT"]="${outcome:-MISSING}"
            LAST_OUTCOME="${outcome:-MISSING}"
          }

          {
            run_variant "v0_master_pristine"
            echo "v0_master_pristine=${LAST_OUTCOME}"
            run_variant "v1_diag_boundary"
            echo "v1_diag_boundary=${LAST_OUTCOME}"
            run_variant "v2_no_deferred"
            echo "v2_no_deferred=${LAST_OUTCOME}"
          } >> "$E/nacar6_sequence_run${RUN_ID}.txt"
          git add "$E"/nacar6_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r6 sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose round-6 verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          oc_v0="NOT_RUN"
          oc_v1="NOT_RUN"
          oc_v2="NOT_RUN"
          for short in v0_master_pristine v1_diag_boundary v2_no_deferred; do
            f="$E/nacar6_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            case "$short" in
              v0_master_pristine) oc_v0="${oc:-MISSING}" ;;
              v1_diag_boundary) oc_v1="${oc:-MISSING}" ;;
              v2_no_deferred) oc_v2="${oc:-MISSING}" ;;
            esac
          done
          is_classified() {
            case "$1" in
              PASS_3_LEVELS|FAIL_DIVERGED|TIMEOUT_3600S|FAIL_OTHER) return 0 ;;
              *) return 1 ;;
            esac
          }
          verdict_line="INCOMPLETE v0=${oc_v0} v1=${oc_v1} v2=${oc_v2} -> re-run"
          complete=0
          if is_classified "$oc_v0" && is_classified "$oc_v1" && is_classified "$oc_v2"; then
            complete=1
            if [ "$oc_v1" = "PASS_3_LEVELS" ]; then
              verdict_line="BOUNDARY_BLOCK_CULPRIT: v1 (diag centre-line operator form) passes all 3 levels at the master pin -> the evolved boundary operator form breaks N128 -> production PR = swap the fixed-pressure boundary block to the diag form + fiche 15 sections 3-4 alignment + full qualification (decision Steven)"
            elif [ "$oc_v2" = "PASS_3_LEVELS" ]; then
              verdict_line="DEFERRED_TERM_CULPRIT: v2 (evolved form without the deferred non-orthogonal term) passes all 3 levels -> the deferred_boundary term breaks N128 -> production PR = remove/repair that term + fiche 15 alignment + full qualification (decision Steven)"
            else
              verdict_line="NOT_THE_BOUNDARY_BLOCK: v1 and v2 both fail like v0 (N128 hard divergence) -> the culprit is elsewhere in the 0c61c51e consolidation or another master piece -> inspect the consolidation diff beyond the boundary block (round 7), do NOT conclude"
            fi
            if [ "$oc_v0" != "FAIL_DIVERGED" ]; then
              verdict_line="V0_ANCHOR_ANOMALY: pristine master expected FAIL_DIVERGED (N64 PASS then N128 hard divergence ~20 s), got ${oc_v0} -> runner/build drift, repeat before concluding"
              complete=0
            fi
          fi
          VER="$E/nacar6_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "master_pin=${MASTER_PIN}"
            echo "v0_master_pristine=${oc_v0} (expected FAIL_DIVERGED ~20 s: N64 PASS 424 it then N128 divergence at it. 15)"
            echo "v1_diag_boundary=${oc_v1} (diag a1a62dc1 centre-line operator form)"
            echo "v2_no_deferred=${oc_v2} (evolved form, deferred term removed)"
            echo "reference_diag_pass=a1a62dc1 (round 4: N64 433 it / N128 995 it / N256 3989 it, Cd_pressure N64 = -0.0343963)"
            echo "reference_master_r5=0c61c51e/2f5c0dce (N64 424 it Cd_pressure = +0.0343964, N128 DIVERGED it. 15)"
            echo ""
            echo "--- per-variant NACA digest (level markers + failure) ---"
            for short in v0_master_pristine v1_diag_boundary v2_no_deferred; do
              L="$E/nacar6_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0 level=|NACA0012_QUALIFICATION|did not converge|what\(\):|Cd=" "$L" | tail -14
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r6 verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$complete" = "1" ]; then
            echo "round-6 variant campaign: ${verdict_line}"
          else
            echo "::error::round-6 incomplete or anchor anomaly: ${verdict_line}"
            exit 1
          fi
