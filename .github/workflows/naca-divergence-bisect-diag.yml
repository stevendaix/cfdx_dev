              elif [ "${oc_c_sr1}" = "PASS_3_LEVELS" ]; then
                verdict_line="REGION_SET_CULPRIT_CONSERVATIVE_SR1: reverting {r2,r5,r6,r7,r8,r9} (sr1) fixes N128 and the full 3-level run passes (c_sr1), but the exact subset is joint across {r2,r5,r8} x {r6,r7,r9} at region granularity -> production PR can revert the whole sr1 set as-is, or round 10 hunk-level narrows it (decision Steven)"
                ok=1
              else
                verdict_line="INCOMPLETE_SR1: sr1 PASS but no pair/triple passed and c_sr1=${oc_c_sr1} -> re-run"
              fi
            elif ! passp "${oc_sr1}"; then
              if [ "${oc_sr1}" = "FAIL_DIVERGED" ]; then
                if [ "${oc_c_b1}" = "PASS_3_LEVELS" ]; then
                  verdict_line="REGION_SET_CULPRIT_CONSERVATIVE_B1_R1NEC: r1_api_fields is NECESSARY (sr1 = b1 minus r1 reverts FAIL_DIVERGED) but not sufficient alone (k1 PASS_128 in this branch means r1 alone does not reproduce, or k1=${oc_k1}); the conservative fixing set is b1 = {r1,r2,r5,r6,r7,r8,r9} with 3-level confirmation c_b1 PASS_3_LEVELS -> production PR can revert b1 as-is, or round 10 hunk-level identifies the partner(s) of r1 (decision Steven)"
                  ok=1
