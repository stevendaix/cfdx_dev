name: NACA0012 divergence bisect (master pins, diag) round 2

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal: locate the master commit that introduced the NACA0012 divergence.
# Reference evidence:
#   - PASS at master f88b3700 (2026-10-16): all 3 levels converged
#     (N64 433 it, N128 995 it, N256 3989 it, 2943 s wall).
#   - FAIL at heads 979bf93d (#962) and d706846 (#979) on 2026-10-19
#     (job "Long validation campaigns", runs 39296392731 / 39299078514):
#     N128 DIVERGED at 15 iterations (residual_growth_exceeded), geometric
#     momentum-residual growth localized at airfoil wall cells. Full
#     microscope: diag-evidence/logs/pr929x_nacastop_*_run39070355557.
# Round 2 (window refined by round 1): f88b3700 (2026-10-16, PASS 3 levels)
# -> 0c61c51e (2026-10-18, FAIL_DIVERGED). Round 1 (run 39325205592): pins
# 0c61c51e / 03ac6f6c / 4056e249 ALL FAIL_DIVERGED with bit-identical metrics.
#
# Three master pins, test_naca0012_qualification run in isolation with the
# exact CI configuration (Release + LONG_VALIDATION + MPI + parallel HDF5).
# NACA meshes are generated per pin by the pin's own script (verified
# byte-identical across round-1 pins; standalone h5py+numpy, no cfdx import):
#   7684119b  2026-10-18 test(turbulence) qualification campaign + fail-closed guard
#   96b6663d  2026-10-18 feat(physics) cellwise viscosity in momentum assembly
#   406c0ff9  2026-10-18 SST transactional (#957), direct parent of 0c61c51e
#
# Per-pin classification (log content + exit code):
#   PASS_3_LEVELS / FAIL_DIVERGED / TIMEOUT_3600S / FAIL_OTHER
#   INCONCLUSIVE_{WORKTREE,CONFIGURE,BUILD,MESHGEN} = upstream stage failed
#
# Interpretation guide (round 2, inside round-1 window f88b3700..0c61c51e):
#   7684119b FAIL -> culprit at or before 7684119b (round 3 in f88b3700..7684119b:
#        9ba3d338 CUDA/GPU, merges 120070de, 2b414352, 6282a2bf)
#   7684119b PASS + 96b6663d FAIL -> culprit in (7684119b..96b6663d] =
#        {74b13b95 gui, 6cf9a78b wall distance, 96b6663d} -> very likely 96b6663d
#   96b6663d PASS + 406c0ff9 FAIL -> culprit in (96b6663d..406c0ff9]
#        (gui cluster or SST 406c0ff9 #957)
#   406c0ff9 PASS -> culprit = 0c61c51e (pressure-velocity consolidation itself)
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is
# instrumented; evidence is committed per pin so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-divergence-bisect-diag
  cancel-in-progress: false

jobs:
  naca-bisect:
    name: NACA qualification at 3 pinned master commits (round 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (all pins reachable from origin/master)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          for pin in \
            7684119bcd38a1046bbac1b049abf91da204c65e \
            96b6663d210df5527fa8c3385ad2492d7a80c439 \
            406c0ff9e855edcf7baf6b985a77a8a9efabb3fb; do
            git cat-file -e "${pin}^{commit}"
            git merge-base --is-ancestor "${pin}" FETCH_HEAD
            echo "pin_ok ${pin} $(git log -1 --format='%ci %s' "${pin}")"
          done

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Bisect loop (configure, build, mesh, run per pin)
        timeout-minutes: 225
        env:
          PINS: >-
            7684119bcd38a1046bbac1b049abf91da204c65e
            96b6663d210df5527fa8c3385ad2492d7a80c439
            406c0ff9e855edcf7baf6b985a77a8a9efabb3fb
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          for PIN in $PINS; do
            SHORT="${PIN:0:8}"
            SRC="cfdx-${SHORT}"
            BUILD="build-${SHORT}"
            LOG="$E/nacabisect_${SHORT}_main_run${RUN_ID}.log"
            STA="$E/nacabisect_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== PIN ${PIN} : $(git log -1 --format='%ci %s' "${PIN}") ===" > "$LOG"
            outcome=""
            rc=""
            t0=0
            t1=0
            git worktree add --detach "$SRC" "$PIN" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                [ -s "$BUILD/validation_meshes/${m}.h5" ] || outcome="INCONCLUSIVE_MESHGEN"
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification at ${SHORT} ===" >>"$LOG"
              t0=$(date +%s)
              timeout 3600 "$BUILD/test_naca0012_qualification" \
                "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
              rc=$?
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                outcome="TIMEOUT_3600S"
              elif grep -q "did not converge" "$LOG"; then
                outcome="FAIL_DIVERGED"
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >>"$LOG"
            fi
            {
              echo "pin=${PIN}"
              echo "subject=$(git log -1 --format='%s' "${PIN}")"
              echo "commit_date=$(git log -1 --format='%ci' "${PIN}")"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacabisect_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca bisect ${SHORT} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
          done

      - name: Compose bisect verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          oc_7684119b="NOT_RUN"
          oc_96b6663d="NOT_RUN"
          oc_406c0ff9="NOT_RUN"
          for short in 7684119b 96b6663d 406c0ff9; do
            f="$E/nacabisect_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            case "$short" in
              7684119b) oc_7684119b="${oc:-MISSING}" ;;
              96b6663d) oc_96b6663d="${oc:-MISSING}" ;;
              406c0ff9) oc_406c0ff9="${oc:-MISSING}" ;;
            esac
          done
          complete=1
          for oc in "$oc_7684119b" "$oc_96b6663d" "$oc_406c0ff9"; do
            case "$oc" in
              PASS_3_LEVELS|FAIL_DIVERGED|TIMEOUT_3600S|FAIL_OTHER) ;;
              *) complete=0 ;;
            esac
          done
          VER="$E/nacabisect_verdict_run${RUN_ID}.txt"
          {
            if [ "$complete" = "1" ]; then
              echo "VERDICT: EVIDENCE_COMPLETE (diagnostic - NOT a numerical verdict)"
            else
              echo "VERDICT: INCOMPLETE_OR_INCONCLUSIVE"
            fi
            echo "run_id=${RUN_ID}"
            echo "pin_7684119b=${oc_7684119b}"
            echo "pin_96b6663d=${oc_96b6663d}"
            echo "pin_406c0ff9=${oc_406c0ff9}"
            echo "reference_pass=f88b3700 (2026-10-16, 3 levels converged, 2943 s)"
            echo "known_fail=0c61c51e (round-1 run 39325205592: all 3 pins FAIL_DIVERGED, bit-identical metrics)"
          echo "round2_expected=406c0ff9 FAIL (direct parent of 0c61c51e; if PASS then culprit is 0c61c51e itself)"
            echo ""
            echo "Interpretation guide (round 2):"
            echo "- 7684119b FAIL -> culprit at or before 7684119b (round 3 window f88b3700..7684119b: 9ba3d338 CUDA/GPU, merges 120070de 2b414352 6282a2bf)"
            echo "- 7684119b PASS + 96b6663d FAIL -> culprit in (7684119b..96b6663d]: {74b13b95 gui, 6cf9a78b wall distance, 96b6663d} -> very likely 96b6663d"
            echo "- 96b6663d PASS + 406c0ff9 FAIL -> culprit in (96b6663d..406c0ff9] (gui cluster or SST 406c0ff9 #957)"
            echo "- 406c0ff9 PASS -> culprit = 0c61c51e (pressure-velocity consolidation itself)"
            echo ""
            echo "--- per-pin NACA digest (last markers) ---"
            for short in 7684119b 96b6663d 406c0ff9; do
              L="$E/nacabisect_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0|NACA0012_QUALIFICATION|did not converge|Cd=" "$L" | tail -12
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca bisect verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$complete" = "1" ]; then
            echo "bisect complete: 7684119b=${oc_7684119b} 96b6663d=${oc_96b6663d} 406c0ff9=${oc_406c0ff9}"
          else
            echo "::error::bisect incomplete: 7684119b=${oc_7684119b} 96b6663d=${oc_96b6663d} 406c0ff9=${oc_406c0ff9}"
            exit 1
          fi
