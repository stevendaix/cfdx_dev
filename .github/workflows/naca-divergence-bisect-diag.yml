name: NACA0012 remaining-consolidation variant campaign (round 7)

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 7): isolate the N128 hard-divergence culprit on master, step 2.
# Context: round 6 (run 39630570236, verdict nacar6_verdict_run39630570236.txt)
# returned NOT_THE_BOUNDARY_BLOCK at master pin 28e4d183: v0_master_pristine,
# v1_diag_boundary and v2_no_deferred ALL FAIL_DIVERGED (N64 PASS ~424 it,
# then N128 hard divergence at it. 15). The fixed-pressure boundary block
# (evolved operator form AND the deferred non-orthogonal term) is NOT the
# culprit; the defect is elsewhere in the 0c61c51e consolidation.
# Also established (2026-10-21): the N64 Cd_pressure sign flip
# (+0.0343964 master vs -0.0343963 green) is the intentional #926 test-level
# sign convention (green test accumulates Fxp += -pp*n.x*Sf.mag(), master
# Fxp += pp*n.x*Sf.mag() + cdp>0 gate), NOT a solver regression; and the
# mesh generator is byte-identical between the pins (blob 29c737fc207a).
# Green reference: diag commit a1a62dc1 (#904 dAU = V*rAU), round 4 run
# 39501827590: PASS_3_LEVELS (N64 433 it / N128 995 it / N256 3989 it).
#
# Round 7 swaps whole GREEN FILES into an isolated worktree of the pinned
# master commit (whole-file swap, no in-file marker surgery):
#   v0_master_pristine   : pristine master tree (anchor, expected N64 PASS
#                          424 it then N128 hard divergence ~22 s)
#   v1_green_trio        : master tree + green trio (solver
#                          src/cfdx/physics/steady_incompressible_solver.h +
#                          src/cfdx/io/runtime/convergence_history.h +
#                          tests/validation/test_naca0012_geometry.cpp).
#                          The test MUST be swapped with the solver: the
#                          master test does not compile against the green
#                          solver (#942 momentum_rhs_scale fields) and the
#                          green test carries the OLD #926 sign convention.
#   v2_green_trio_monitor: v1 + green convergence monitor
#                          (src/cfdx/cfdx/core/utils/convergence_monitor.h,
#                          double-path resolved fail-closed)
#   v3_green_pristine    : the green tree itself (control, expected
#                          PASS_3_LEVELS ~2930 s)
#
# Interpretation guide (round 7) - a variant verdict is valid only if
# v0 FAIL_DIVERGED and v3 PASS_3_LEVELS:
#   v1 and v2 PASS_3_LEVELS -> IN_TRIO_CULPRIT: the defect lives in the
#        swapped file set -> round 8 = bisect the green-vs-master solver
#        diff; production PR only once the exact culprit is proven
#   v1 PASS + v2 FAIL -> IN_TRIO_CULPRIT_GREEN_MONITOR_BREAKS: the trio
#        restores the pass and the green monitor swap breaks it (master/
#        monitor interaction) -> round 8 = bisect the trio WITHOUT the
#        monitor swap
#   v1 FAIL + v2 PASS_3_LEVELS -> MONITOR_CULPRIT: master
#        convergence_monitor.h breaks the green trio -> round 8 = swap only
#        the monitor + qualify
#   v1 FAIL + v2 FAIL -> OUTSIDE_TRIO: the defect is outside the swapped
#        file set -> round 8 = extend the whole-file swap to the remaining
#        green-vs-master src/ diff, do NOT conclude
#   v1/v2 INCONCLUSIVE_BUILD -> the green trio does not compile against the
#        remaining master tree (API drift beyond the trio) -> extend the
#        swap set (round 8), do NOT conclude
#   any variant failing at N64 -> variant build suspect (v0 proves N64
#        green on the master tree) -> INCONCLUSIVE, re-check the variant
#   INCONCLUSIVE_{CONFIGURE,BUILD,MESHGEN} -> upstream stage failed, re-run
#   v3 not PASS_3_LEVELS -> GREEN_ANCHOR_ANOMALY: do not conclude, repeat
#
# NOTE: the green test has the OLD #926 Cd_pressure sign convention: compare
# iterations/convergence behaviour between variants, NEVER raw Cd signs.
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is changed
# (swaps live only in throwaway worktrees on the diagnostics branch runner);
# evidence is committed per variant so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-divergence-bisect-diag
  cancel-in-progress: false

jobs:
  naca-r7-variants:
    name: NACA remaining-consolidation whole-file-swap variants at pinned master commit (round 7)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MASTER_PIN: 28e4d183b258997c5b923b2e05569263e900f2ff
      GREEN_PIN: a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (pinned master + green commits reachable)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          git cat-file -e "${MASTER_PIN}^{commit}"
          git merge-base --is-ancestor "${MASTER_PIN}" FETCH_HEAD
          echo "pin_ok ${MASTER_PIN} $(git log -1 --format='%ci %s' "${MASTER_PIN}")"
          echo "origin_master_head_at_start $(git rev-parse FETCH_HEAD)"
          if [ "${MASTER_PIN}" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "NOTE: origin/master has moved past the pinned commit; this campaign answers for the pin only."
          fi
          git fetch --no-tags --unshallow origin ci/long-campaign-diagnostics 2>/dev/null \
            || git fetch --no-tags origin ci/long-campaign-diagnostics
          git cat-file -e "${GREEN_PIN}^{commit}"
          git merge-base --is-ancestor "${GREEN_PIN}" FETCH_HEAD
          echo "green_pin_ok ${GREEN_PIN} $(git log -1 --format='%ci %s' "${GREEN_PIN}")"

      - name: Fail-closed green-reference guards
        run: |
          set -euo pipefail
          # Trio files exist at the green pin with the expected green content.
          git cat-file -e "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git show "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp" | grep -q 'Fxp+=-pp'
          if git show "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h" | grep -q 'momentum_rhs_scale'; then
            echo "::error::green convergence_history.h unexpectedly contains momentum_rhs_scale"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'deferred_boundary'; then
            echo "::error::green solver unexpectedly contains deferred_boundary"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'dAU_boundary'; then
            echo "::error::green solver unexpectedly contains dAU_boundary"
            exit 1
          fi
          # The same trio files exist at the master pin (swap targets).
          git cat-file -e "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${MASTER_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${MASTER_PIN}:tests/validation/test_naca0012_geometry.cpp"
          # Mesh generator must be identical between the pins (round 6: blob 29c737fc207a).
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- scripts/generate_2d_validation_meshes.py
          # Test-local helper must be identical between the pins (verified 2026-10-21).
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- tests/validation/qualification_boundary_helpers.h
          # Monitor path resolved fail-closed (double-path defensive).
          MON_PATH=""
          if git cat-file -e "${GREEN_PIN}:src/cfdx/cfdx/core/utils/convergence_monitor.h" 2>/dev/null; then
            MON_PATH="src/cfdx/cfdx/core/utils/convergence_monitor.h"
          elif git cat-file -e "${GREEN_PIN}:src/cfdx/core/utils/convergence_monitor.h" 2>/dev/null; then
            MON_PATH="src/cfdx/core/utils/convergence_monitor.h"
          else
            echo "::error::green convergence_monitor.h not found at either known path"
            exit 1
          fi
          git cat-file -e "${MASTER_PIN}:${MON_PATH}" 2>/dev/null \
            || { echo "::error::monitor path ${MON_PATH} missing at MASTER_PIN - v2 swap would be ineffective"; exit 1; }
          git cat-file -e "${GREEN_PIN}:${MON_PATH}"
          echo "green_guards_ok monitor_path=${MON_PATH}"

      - name: Record green-vs-master diff context (round 8 input)
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          {
            echo "green-vs-master diff context (round 7 run ${RUN_ID})"
            echo "green_pin=${GREEN_PIN} $(git log -1 --format='%ci %s' "${GREEN_PIN}")"
            echo "master_pin=${MASTER_PIN} $(git log -1 --format='%ci %s' "${MASTER_PIN}")"
            echo ""
            echo "--- targeted stat (physics / io/runtime / core / cfdx/core / naca test / mesh script) ---"
            git diff --stat "${GREEN_PIN}" "${MASTER_PIN}" -- \
              src/cfdx/physics src/cfdx/io/runtime src/cfdx/core src/cfdx/cfdx/core \
              tests/validation/test_naca0012_geometry.cpp \
              scripts/generate_2d_validation_meshes.py
            echo ""
            echo "--- full-tree stat ---"
            git diff --stat "${GREEN_PIN}" "${MASTER_PIN}"
          } > "$E/nacar7_diff_context_run${RUN_ID}.txt"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$E/nacar7_diff_context_run${RUN_ID}.txt"
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r7 diff context run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed diff_context"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Variant loop (v0 master pristine, v1 green trio, v2 green trio + monitor, v3 green pristine - all always run)
        timeout-minutes: 225
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          declare -A RAN
          LAST_OUTCOME=""

          resolve_monitor_path() {
            if [ -f "$1/src/cfdx/cfdx/core/utils/convergence_monitor.h" ]; then
              echo "src/cfdx/cfdx/core/utils/convergence_monitor.h"
            elif [ -f "$1/src/cfdx/core/utils/convergence_monitor.h" ]; then
              echo "src/cfdx/core/utils/convergence_monitor.h"
            else
              echo ""
            fi
          }

          run_variant() {
            local VARIANT="$1"
            local SHORT="$VARIANT"
            local WT_REF="${MASTER_PIN}"
            if [ "$VARIANT" = "v3_green_pristine" ]; then
              WT_REF="${GREEN_PIN}"
            fi
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar7_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar7_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== VARIANT ${VARIANT} at ref ${WT_REF} : $(git log -1 --format='%ci %s' "${WT_REF}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            git worktree add --detach "$SRC" "$WT_REF" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              case "$VARIANT" in
                v0_master_pristine)
                  grep -q "dAU_boundary" "$SRC/src/cfdx/physics/steady_incompressible_solver.h" \
                    || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  grep -q "deferred_boundary" "$SRC/src/cfdx/physics/steady_incompressible_solver.h" \
                    || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  echo "=== pristine master solver verified (dAU_boundary + deferred_boundary present) ===" >> "$LOG"
                  ;;
                v1_green_trio)
                  git -C "$SRC" checkout "${GREEN_PIN}" -- \
                    src/cfdx/physics/steady_incompressible_solver.h \
                    src/cfdx/io/runtime/convergence_history.h \
                    tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                    || outcome="INCONCLUSIVE_VARIANT_COPY"
                  if [ -z "$outcome" ]; then
                    grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                      || outcome="INCONCLUSIVE_VARIANT_COPY"
                    ! grep -q "momentum_rhs_scale" "$SRC/src/cfdx/io/runtime/convergence_history.h" \
                      || outcome="INCONCLUSIVE_VARIANT_COPY"
                    echo "=== green trio verified (Fxp+=-pp test, no momentum_rhs_scale) ===" >> "$LOG"
                    echo "=== worktree delta after green trio checkout ===" >> "$LOG"
                    git -C "$SRC" status --porcelain >> "$LOG" 2>&1
                    git -C "$SRC" diff HEAD --stat >> "$LOG" 2>&1
                  fi
                  ;;
                v2_green_trio_monitor)
                  git -C "$SRC" checkout "${GREEN_PIN}" -- \
                    src/cfdx/physics/steady_incompressible_solver.h \
                    src/cfdx/io/runtime/convergence_history.h \
                    tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                    || outcome="INCONCLUSIVE_VARIANT_COPY"
                  if [ -z "$outcome" ]; then
                    local MON_PATH="$(resolve_monitor_path "$SRC")"
                    if [ -z "$MON_PATH" ]; then
                      echo "=== convergence_monitor.h not found in worktree at known paths ===" >> "$LOG"
                      outcome="INCONCLUSIVE_VARIANT_COPY"
                    else
                      git -C "$SRC" checkout "${GREEN_PIN}" -- "$MON_PATH" >>"$LOG" 2>&1 \
                        || outcome="INCONCLUSIVE_VARIANT_COPY"
                      if [ -z "$outcome" ]; then
                        grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                          || outcome="INCONCLUSIVE_VARIANT_COPY"
                        echo "=== green trio + monitor (${MON_PATH}) verified ===" >> "$LOG"
                        echo "=== worktree delta after green trio + monitor checkout ===" >> "$LOG"
                        git -C "$SRC" status --porcelain >> "$LOG" 2>&1
                        git -C "$SRC" diff HEAD --stat >> "$LOG" 2>&1
                      fi
                    fi
                  fi
                  ;;
                v3_green_pristine)
                  grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                    || outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  if grep -q "momentum_rhs_scale" "$SRC/src/cfdx/io/runtime/convergence_history.h"; then
                    outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  fi
                  if grep -q "deferred_boundary" "$SRC/src/cfdx/physics/steady_incompressible_solver.h"; then
                    outcome="INCONCLUSIVE_PRISTINE_GUARD"
                  fi
                  echo "=== pristine green tree verified (old #926 test convention, no momentum_rhs_scale, no deferred_boundary) ===" >> "$LOG"
                  ;;
              esac
            fi
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                [ -s "$BUILD/validation_meshes/${m}.h5" ] || outcome="INCONCLUSIVE_MESHGEN"
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification variant=${VARIANT} ===" >> "$LOG"
              t0=$(date +%s)
              timeout 3600 "$BUILD/test_naca0012_qualification" \
                "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
              rc=$?
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                outcome="TIMEOUT_3600S"
              elif grep -q "did not converge" "$LOG"; then
                outcome="FAIL_DIVERGED"
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "variant=${VARIANT}"
              echo "wt_ref=${WT_REF}"
              echo "pin_subject=$(git log -1 --format='%s' "${WT_REF}")"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
              echo ""
              echo "--- level markers reached ---"
              grep -E "NACA0012_RE1000_A0 level=" "$LOG" || echo "no_level_marker"
              echo "--- failure line (if any) ---"
              grep -E "what\(\):" "$LOG" | tail -1 || echo "no_failure_line"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar7_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r7 ${SHORT} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$VARIANT"]="${outcome:-MISSING}"
            LAST_OUTCOME="${outcome:-MISSING}"
          }

          {
            run_variant "v0_master_pristine"
            echo "v0_master_pristine=${LAST_OUTCOME}"
            run_variant "v1_green_trio"
            echo "v1_green_trio=${LAST_OUTCOME}"
            run_variant "v2_green_trio_monitor"
            echo "v2_green_trio_monitor=${LAST_OUTCOME}"
            run_variant "v3_green_pristine"
            echo "v3_green_pristine=${LAST_OUTCOME}"
          } >> "$E/nacar7_sequence_run${RUN_ID}.txt"
          git add "$E"/nacar7_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r7 sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose round-7 verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          oc_v0="NOT_RUN"
          oc_v1="NOT_RUN"
          oc_v2="NOT_RUN"
          oc_v3="NOT_RUN"
          for short in v0_master_pristine v1_green_trio v2_green_trio_monitor v3_green_pristine; do
            f="$E/nacar7_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            case "$short" in
              v0_master_pristine) oc_v0="${oc:-MISSING}" ;;
              v1_green_trio) oc_v1="${oc:-MISSING}" ;;
              v2_green_trio_monitor) oc_v2="${oc:-MISSING}" ;;
              v3_green_pristine) oc_v3="${oc:-MISSING}" ;;
            esac
          done
          is_classified() {
            case "$1" in
              PASS_3_LEVELS|FAIL_DIVERGED|TIMEOUT_3600S|FAIL_OTHER) return 0 ;;
              *) return 1 ;;
            esac
          }
          verdict_line="INCOMPLETE v0=${oc_v0} v1=${oc_v1} v2=${oc_v2} v3=${oc_v3} -> re-run"
          complete=0
          if is_classified "$oc_v0" && is_classified "$oc_v1" && is_classified "$oc_v2" && is_classified "$oc_v3"; then
            complete=1
            if [ "$oc_v1" = "PASS_3_LEVELS" ] || [ "$oc_v2" = "PASS_3_LEVELS" ]; then
              if [ "$oc_v1" = "PASS_3_LEVELS" ] && [ "$oc_v2" = "PASS_3_LEVELS" ]; then
                verdict_line="IN_TRIO_CULPRIT: green trio (solver + convergence_history + test) restores the 3-level pass on the master tree (monitor irrelevant) -> the defect lives in the swapped file set -> round 8 = bisect the green-vs-master solver diff; production PR only once the exact culprit is proven (decision Steven)"
              elif [ "$oc_v1" = "PASS_3_LEVELS" ]; then
                verdict_line="IN_TRIO_CULPRIT_GREEN_MONITOR_BREAKS: green trio restores the 3-level pass on the master tree, adding the green convergence monitor breaks it (master/monitor interaction) -> round 8 = bisect the green-vs-master solver diff WITHOUT the monitor swap (decision Steven)"
              else
                verdict_line="MONITOR_CULPRIT: green trio fails on the master tree, adding the green convergence monitor restores the 3-level pass -> master convergence_monitor.h is the culprit -> round 8 = swap only the monitor + full qualification (decision Steven)"
              fi
            else
              verdict_line="OUTSIDE_TRIO: v1 and v2 both fail like v0 while v3 (green pristine) passes -> the defect is OUTSIDE the swapped file set (solver, convergence_history, test, monitor) -> round 8 = extend the whole-file swap to the remaining green-vs-master src/ diff, do NOT conclude"
            fi
            if [ "$oc_v3" != "PASS_3_LEVELS" ]; then
              verdict_line="GREEN_ANCHOR_ANOMALY: green pristine tree expected PASS_3_LEVELS (round 4: N64 433 / N128 995 / N256 3989 it), got ${oc_v3} -> runner/build drift or green tree change, repeat before concluding"
              complete=0
            fi
            if [ "$oc_v0" != "FAIL_DIVERGED" ]; then
              verdict_line="V0_ANCHOR_ANOMALY: pristine master expected FAIL_DIVERGED (N64 PASS 424 it then N128 hard divergence ~22 s), got ${oc_v0} -> runner/build drift, repeat before concluding"
              complete=0
            fi
          fi
          VER="$E/nacar7_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "master_pin=${MASTER_PIN}"
            echo "green_pin=${GREEN_PIN}"
            echo "v0_master_pristine=${oc_v0} (expected FAIL_DIVERGED ~22 s: N64 PASS 424 it then N128 divergence it. 15)"
            echo "v1_green_trio=${oc_v1} (master tree + green solver + green convergence_history + green test)"
            echo "v2_green_trio_monitor=${oc_v2} (v1 + green convergence_monitor)"
            echo "v3_green_pristine=${oc_v3} (expected PASS_3_LEVELS, round 4: N64 433 / N128 995 / N256 3989 it)"
            echo "round6_verdict=NOT_THE_BOUNDARY_BLOCK (run 39630570236: v0/v1/v2 all FAIL_DIVERGED at this master pin)"
            echo "sign_note=green test carries the OLD #926 Cd_pressure convention (Fxp+=-pp): compare iterations/convergence, never raw Cd signs"
            echo ""
            echo "--- per-variant NACA digest (level markers + failure) ---"
            for short in v0_master_pristine v1_green_trio v2_green_trio_monitor v3_green_pristine; do
              L="$E/nacar7_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0 level=|NACA0012_QUALIFICATION|did not converge|what\(\):|Cd=" "$L" | tail -14
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r7 verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$complete" = "1" ]; then
            echo "round-7 variant campaign: ${verdict_line}"
          else
            echo "::error::round-7 incomplete or anchor anomaly: ${verdict_line}"
            exit 1
          fi
