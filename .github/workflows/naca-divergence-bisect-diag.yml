name: NACA0012 minimal-buildable-revert probes (round 9c)

# DIAG-ONLY - diagnostics branch ci/long-campaign-diagnostics (NEVER merge).
#
# Goal (round 9c): complete the region-level attribution left INCOMPLETE by
# round 9b, using the corrected compile-coupling map. Locked context:
#   round 7 (run 39663748207) IN_TRIO_CULPRIT: v1_green_trio PASS_3_LEVELS
#     (N64 433 / N128 995 / N256 3989 it), v0 FAIL_DIVERGED.
#   round 8 (run 39672681948) COMBINATION_OR_COUPLED: test (v0b) and
#     convergence_history (vC) behavior-neutral; r2/r4/r5/r8/r9 single
#     reverts all FAIL_DIVERGED; r1/r3/r6/r7 single reverts INCONCLUSIVE_BUILD.
#   round 9 (run 39722433948) A9_ANCHOR_ANOMALY - INVALID, mechanical
#     (1-mesh invocation to a 3-mesh binary); repeated with fixed invocation.
#   round 9b (run 39735295835) INCOMPLETE_WITH_UNKNOWNS, anchors VALID
#     (a0 FAIL_DIVERGED, a9 PASS_128): k1 PASS_128 (only r1 in master form
#     is green-like: N64 433 / N128 995 it, identical to the green anchor),
#     k3 FAIL_DIVERGED_64 (only r3 in master form diverges at N64, 8000 it),
#     d4 FAIL_DIVERGED, b1 FAIL_DIVERGED_64, b3 INCONCLUSIVE_BUILD.
#
# NEW coupling edge (proven by the round-9b b3 build log, same pins):
#   master r8 -> r7 (rhie_chow_identity_evaluated and
#   rhie_chow_identity_audit_linf are declared in r7's master form at
#   master lines 2808-2809 and consumed by r8's master form at master line
#   3767; the symbols do not exist in green). The round-9 map missed it.
#
# Corrected compile-coupling map (round-9 logs + round-9b b3 log):
#   master r2 -> r1 (cell_turbulent_viscosity)
#   master r4 -> r3 (pressure_face_orthogonal_coefficient / _nonorthogonal_flux)
#   master r5 -> r1 (coupled_assembly_callback / CoupledAssemblySnapshot)
#   master r6 -> r1 (cell_turbulent_viscosity)
#   master r7 -> r3 (pressure_face_orthogonal_coefficient / _nonorthogonal_flux)
#   master r8 -> r1 (IncompressibleIteration momentum_rhs_scale* members)
#   master r8 -> r7 (rhie_chow_identity_* ; round-9b b3 build failure)
#   master r9 -> r3 and -> r6 (pressure_face_* ; mu_eff double* vs vector*)
#   green  r7 -> green r6 (assemble_momentum_component signature)
#   r1 and r3 are self-contained (k1 and k3 built cleanly in round 9).
# STRUCTURAL CONSEQUENCE (closure over the corrected map): any buildable
# revert containing r3 must also revert r4 (r4->r3), r7 (r7->r3), r9
# (r9->r3), r6 (green r7 needs green r6) and r8 (r8->r7). The MINIMAL
# buildable region-granularity revert containing r3 is therefore
#   b3x = revert {r3,r4,r6,r7,r8,r9}  (keeps r1,r2,r5 master).
# The round-9b b3 branch (b3, s149, b679) is NOT buildable on this map:
# each keeps r8 master while reverting r7.
#
# Method (round 9c): probes over buildable revert sets, monotone (revert S
# fixes iff culprit C is a subset of S). Fixed phase: a0 (master anchor,
# expect FAIL_DIVERGED), a9 (all-9 revert = green, expect PASS_128), k3
# (repro context: expect FAIL_DIVERGED_64 exactly as in round 9b at the
# same pins; deterministic), b3x (the minimal buildable r3-revert).
# Adaptive phase (pre-coded, fail-closed):
#   b3x PASS_128 -> 3-level confirm c_b3x; if the confirm is not
#     PASS_3_LEVELS, fall back to c_k1 (k1 set = revert r2..r9, proven
#     PASS_128 in round 9b).
#   b3x not passing (FAIL_DIVERGED* or INCONCLUSIVE_BUILD) -> b3x2 =
#     revert {r2,r3,r4,r6,r7,r8,r9} (keeps r1,r5; reverts r2):
#     b3x2 PASS_128 -> confirm c_b3x2 (+ c_k1 fallback on confirm failure);
#     b3x2 definite FAIL (r5 kept master: r5 implicated) or INCONCLUSIVE ->
#     b3x3 = revert {r3,r4,r5,r6,r7,r8,r9} (keeps r1,r2; reverts r5):
#     b3x3 PASS_128 -> confirm c_b3x3 (+ c_k1 fallback); b3x3 definite FAIL
#     (r2 kept master: r2 implicated) or INCONCLUSIVE -> conservative c_k1.
# A build failure is recorded fail-closed as INCONCLUSIVE_BUILD and never
# interpreted as behavior.
#
# Levels: every variant runs the SAME binary with ALL THREE meshes
# (round-9 lesson: the test requires 3 mesh arguments). The N128
# discriminator uses timeout 600 s: green reaches the N128 level marker
# (~995 it) well inside the window, then the run is killed inside N256;
# rc=124 + "level=128 Cd=" marker => PASS_128. Divergence at N128 after a
# completed N64 marker => FAIL_DIVERGED (the known master signature).
# Divergence before N64 (FAIL_DIVERGED_64, the k3/b1 signature in 9b), at
# N256 (FAIL_DIVERGED_256), timeouts without the N128 marker
# (INCONCLUSIVE_TIMEOUT) and any other failure (FAIL_OTHER) are recorded
# but never interpreted as the master signature. Confirmations (c_*) run
# the full 3 levels with timeout 3600 s and require rc=0 =>
# PASS_3_LEVELS for a production-grade verdict.
#
# Interpretation guide (round 9c) - valid only if a0 FAIL_DIVERGED,
# a9 PASS and k3 NOT passing (else anchor/repro anomaly, repeat):
#   REGION_SET_CULPRIT_B3X  : production revert = {r3,r4,r6,r7,r8,r9}
#     (keep r1,r2,r5), 3-level confirmed. Minimal buildable r3-revert.
#   REGION_SET_CULPRIT_B3X2 : production revert = {r2,r3,r4,r6,r7,r8,r9}
#     (keep r1,r5), 3-level confirmed; b3x implicated r2 (definite FAIL)
#     or r2 blocked the b3x build.
#   REGION_SET_CULPRIT_B3X3 : production revert = {r3,r4,r5,r6,r7,r8,r9}
#     (keep r1,r2), 3-level confirmed; r5 implicated or build-blocking.
#   REGION_SET_CULPRIT_K1SET: production revert = {r2,...,r9} (keep r1),
#     3-level confirmed; r2 and/or r5 are confirmed culprit members
#     (definite FAILs of the b3x2/b3x3 probes).
#   REGION_SET_CULPRIT_K1SET_BUILD_FALLBACK: the finer candidates do not
#     build (coupling map still incomplete) - k1 set is the conservative
#     production revert.
#   Round 10 (optional, decision Steven): hunk-level bisect INSIDE the
#     confirmed set to narrow the revert further.
#   CONFIRM_ANOMALY / INCOMPLETE_* / anchor anomalies -> repeat before
#   concluding; never interpret.
#
# NOTE: the green test has the OLD #926 Cd_pressure sign convention
# (Fxp+=-pp): compare iterations/convergence behaviour, NEVER raw Cd
# signs.
#
# The verdict is a DIAGNOSTIC, never a numerical PASS/FAIL. No
# tolerance/oracle/gate/budget is modified; no production code is changed
# (hybrids live only in throwaway worktrees on the diagnostics branch
# runner); evidence is committed per variant so a timeout cannot lose it.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - diag-tools/naca_bisect_marker.txt
      - .github/workflows/naca-divergence-bisect-diag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naca-r9c-additive
  cancel-in-progress: false

jobs:
  naca-r9c-variants:
    name: NACA minimal-buildable-revert probes at pinned master commit (round 9c)
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    env:
      MASTER_PIN: 28e4d183b258997c5b923b2e05569263e900f2ff
      GREEN_PIN: a1a62dc10fe253e22a716b3e98d7ca02bc45d6d1
      GREEN_MD5: 63db7905347576beec20993919d6015e
      MASTER_MD5: af085014acfc35a0e9ab4946c3f46381
      MD5_K1: 24f2a8ec8cd6d89245732e49b094e917
      MD5_B3X: b9b1eb5632fe7177e0fdda391d863d40
      MD5_B3X2: 21e34eee9f55202f0abf0ad2b5ca87cc
      MD5_B3X3: bbd58cda93d63185115f18763efa7795
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Fail-closed pin verification (pinned master + green commits reachable)
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin master 2>/dev/null \
            || git fetch --no-tags origin master
          git cat-file -e "${MASTER_PIN}^{commit}"
          git merge-base --is-ancestor "${MASTER_PIN}" FETCH_HEAD
          echo "pin_ok ${MASTER_PIN} $(git log -1 --format='%ci %s' "${MASTER_PIN}")"
          echo "origin_master_head_at_start $(git rev-parse FETCH_HEAD)"
          if [ "${MASTER_PIN}" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "NOTE: origin/master has moved past the pinned commit; this campaign answers for the pin only."
          fi
          git fetch --no-tags --unshallow origin ci/long-campaign-diagnostics 2>/dev/null \
            || git fetch --no-tags origin ci/long-campaign-diagnostics
          git cat-file -e "${GREEN_PIN}^{commit}"
          git merge-base --is-ancestor "${GREEN_PIN}" FETCH_HEAD
          echo "green_pin_ok ${GREEN_PIN} $(git log -1 --format='%ci %s' "${GREEN_PIN}")"

      - name: Fail-closed green-reference guards
        run: |
          set -euo pipefail
          git cat-file -e "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git show "${GREEN_PIN}:tests/validation/test_naca0012_geometry.cpp" | grep -q 'Fxp+=-pp'
          if git show "${GREEN_PIN}:src/cfdx/io/runtime/convergence_history.h" | grep -q 'momentum_rhs_scale'; then
            echo "::error::green convergence_history.h unexpectedly contains momentum_rhs_scale"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'deferred_boundary'; then
            echo "::error::green solver unexpectedly contains deferred_boundary"
            exit 1
          fi
          if git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" | grep -q 'dAU_boundary'; then
            echo "::error::green solver unexpectedly contains dAU_boundary"
            exit 1
          fi
          git cat-file -e "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h"
          git cat-file -e "${MASTER_PIN}:src/cfdx/io/runtime/convergence_history.h"
          git cat-file -e "${MASTER_PIN}:tests/validation/test_naca0012_geometry.cpp"
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- scripts/generate_2d_validation_meshes.py
          git diff --quiet "${GREEN_PIN}" "${MASTER_PIN}" -- tests/validation/qualification_boundary_helpers.h
          echo "green_guards_ok"

      - name: Generate minimal-buildable-revert hybrids (fail-closed, md5-verified)
        run: |
          set -euo pipefail
          mkdir -p diag-hybrids
          git show "${GREEN_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_green.h
          git show "${MASTER_PIN}:src/cfdx/physics/steady_incompressible_solver.h" > diag-hybrids/solver_master.h
          gm5=$(md5sum diag-hybrids/solver_green.h | awk '{print $1}')
          mm5=$(md5sum diag-hybrids/solver_master.h | awk '{print $1}')
          if [ "${gm5}" != "${GREEN_MD5}" ]; then echo "::error::green solver md5 mismatch: ${gm5} != ${GREEN_MD5}"; exit 1; fi
          if [ "${mm5}" != "${MASTER_MD5}" ]; then echo "::error::master solver md5 mismatch: ${mm5} != ${MASTER_MD5}"; exit 1; fi
          # diff exits 1 when files differ (expected here); 0 identical-pins or
          # 2 error are both fail-closed anomalies.
          set +e
          diff -u diag-hybrids/solver_green.h diag-hybrids/solver_master.h > diag-hybrids/gm.diff
          drc=$?
          set -e
          if [ "$drc" -ne 1 ]; then echo "::error::green-vs-master diff exited ${drc} (expected 1: the pinned solvers must differ)"; exit 1; fi
          echo "solver green-vs-master diff hunks: $(grep -c '^@@' diag-hybrids/gm.diff)"
          cat > diag-hybrids/revert9.awk <<'AWKEOF'
          BEGIN {
            nr = split(ranges, RG, ",")
            for (i = 1; i <= nr; i++) {
              split(RG[i], E, "-")
              LO[i] = E[1] + 0
              HI[i] = E[2] + 0
            }
          }
          FNR == NR {
            if ($0 ~ /^@@/) {
              h++
              line = $0
              gi = index(line, "-")
              grest = substr(line, gi + 1)
              gc = index(grest, ",")
              if (gc > 0) gs = substr(grest, 1, gc - 1); else gs = grest
              gstart[h] = gs + 0
              pi = index(line, "+")
              prest = substr(line, pi + 1)
              pc = index(prest, ",")
              if (pc > 0) ps = substr(prest, 1, pc - 1); else ps = prest
              start_master[h] = ps + 0
              sel[h] = 0
              for (i = 1; i <= nr; i++) {
                if (gstart[h] >= LO[i] && gstart[h] <= HI[i]) { sel[h] = 1; break }
              }
              j = 0
              next
            }
            if (h > 0 && $0 !~ /^\+\+\+/ && $0 !~ /^---/) {
              t = substr($0, 1, 1)
              if (t != "+" && t != "-" && t != " ") { bad = 1; exit 3 }
              j++
              type[h "," j] = t
              body[h "," j] = substr($0, 2)
            }
            next
          }
          {
            ml[++m] = $0
          }
          END {
            if (bad) exit 3
            p = 1
            for (hh = 1; hh <= h; hh++) {
              while (p < start_master[hh]) { print ml[p]; p++ }
              k = 0
              while ((hh "," (++k)) in type) {
                t = type[hh "," k]; b = body[hh "," k]
                if (t == " ") {
                  if (ml[p] != b) { exit 2 }
                  print ml[p]; p++
                } else if (t == "+") {
                  if (!sel[hh]) print ml[p]
                  p++
                } else {
                  if (sel[hh]) print b
                }
              }
            }
            while (p <= m) { print ml[p]; p++ }
          }
          AWKEOF
          # Region table (green-file line ranges, disjoint, covering ALL hunks:
          # r1=6 r2=1 r3=7 r4=7 r5=4 r6=2 r7=12 r8=8 r9=4 of 51 hunks).
          declare -a RANGES
          RANGES[1]="140-224"
          RANGES[2]="399-399"
          RANGES[3]="548-773"
          RANGES[4]="1345-1499"
          RANGES[5]="1582-2095"
          RANGES[6]="2181-2200"
          RANGES[7]="2322-3205"
          RANGES[8]="3276-3411"
          RANGES[9]="3731-3918"
          ALL9="140-224,399-399,548-773,1345-1499,1582-2095,2181-2200,2322-3205,3276-3411,3731-3918"
          # Validation 1: reverting ALL 9 regions must reproduce the green solver.
          awk -v ranges="${ALL9}" -f diag-hybrids/revert9.awk \
            diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/all9.h
          cmp -s diag-hybrids/all9.h diag-hybrids/solver_green.h \
            || { echo "::error::all-9-regions revert is not byte-identical to the green solver"; exit 1; }
          echo "all-9-regions validation OK (byte-identical to green solver)"
          # Validation 2: an empty ranges string selects no hunk and must
          # reproduce the master solver byte-identically.
          awk -v ranges="" -f diag-hybrids/revert9.awk \
            diag-hybrids/gm.diff diag-hybrids/solver_master.h > diag-hybrids/empty9.h
          cmp -s diag-hybrids/empty9.h diag-hybrids/solver_master.h \
            || { echo "::error::empty-ranges generation is not byte-identical to the master solver"; exit 1; }
          echo "empty-ranges validation OK (byte-identical to master solver)"
          # Hybrid table: name -> reverted region indices (buildable sets,
          # verified against the CORRECTED compile-coupling map above).
          declare -A HSET
          HSET[k1]="2 3 4 5 6 7 8 9"
          HSET[b3x]="3 4 6 7 8 9"
          HSET[b3x2]="2 3 4 6 7 8 9"
          HSET[b3x3]="3 4 5 6 7 8 9"
          declare -A HMD5
          HMD5[k1]="${MD5_K1}"
          HMD5[b3x]="${MD5_B3X}"
          HMD5[b3x2]="${MD5_B3X2}"
          HMD5[b3x3]="${MD5_B3X3}"
          gen_h() {
            local name="$1"
            local ranges=""
            local i
            for i in ${HSET[$name]}; do
              if [ -z "$ranges" ]; then ranges="${RANGES[$i]}"; else ranges="${ranges},${RANGES[$i]}"; fi
            done
            awk -v ranges="${ranges}" -f diag-hybrids/revert9.awk \
              diag-hybrids/gm.diff diag-hybrids/solver_master.h > "diag-hybrids/${name}.h" \
              || { echo "::error::generation failed for ${name}"; exit 1; }
            local actual
            local expected
            actual=$(md5sum "diag-hybrids/${name}.h" | awk '{print $1}')
            expected="${HMD5[$name]}"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::${name} md5 mismatch: ${actual} != ${expected}"
              exit 1
            fi
            echo "hybrid ${name} OK md5=${actual} bytes=$(stat -c%s "diag-hybrids/${name}.h")"
          }
          for h in k1 b3x b3x2 b3x3; do
            gen_h "$h"
          done
          echo "additive_hybrids_ok"

      - name: Create Python venv for mesh generation
        run: |
          set -euo pipefail
          python3 -m venv .venv-naca-bisect
          .venv-naca-bisect/bin/python -m pip install --upgrade pip
          .venv-naca-bisect/bin/python -m pip install h5py numpy

      - name: Variant loop (anchors, k3 repro, minimal buildable revert probes)
        timeout-minutes: 235
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          mkdir -p "$E"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          declare -A RAN
          declare -A HMD5
          HMD5[k1]="${MD5_K1}"
          HMD5[b3x]="${MD5_B3X}"
          HMD5[b3x2]="${MD5_B3X2}"
          HMD5[b3x3]="${MD5_B3X3}"
          is_pass() {
            case "$1" in
              PASS_128|PASS_3_LEVELS) return 0 ;;
              *) return 1 ;;
            esac
          }
          run_variant() {
            local VARIANT="$1"
            local LEVELS="$2"
            local WT_REF="${MASTER_PIN}"
            local SHORT="$VARIANT"
            local BASE="$VARIANT"
            case "$VARIANT" in
              c_*) BASE="${VARIANT#c_}" ;;
            esac
            local SRC="cfdx-${SHORT}"
            local BUILD="build-${SHORT}"
            local LOG="$E/nacar9c_${SHORT}_main_run${RUN_ID}.log"
            local STA="$E/nacar9c_${SHORT}_test_status_run${RUN_ID}.txt"
            echo "=== VARIANT ${VARIANT} levels=${LEVELS} at ${WT_REF} : $(git log -1 --format='%ci %s' "${WT_REF}") ===" > "$LOG"
            local outcome=""
            local rc=""
            local t0=0
            local t1=0
            local HYB="none"
            local EXPECT_MD5=""
            case "$BASE" in
              a0_master_anchor)
                HYB="none"
                EXPECT_MD5="${MASTER_MD5}"
                ;;
              a9_all9_anchor)
                HYB="diag-hybrids/all9.h"
                EXPECT_MD5="${GREEN_MD5}"
                ;;
              *)
                HYB="diag-hybrids/${BASE}.h"
                EXPECT_MD5="${HMD5[$BASE]}"
                ;;
            esac
            git worktree add --detach "$SRC" "$WT_REF" >>"$LOG" 2>&1 \
              || outcome="INCONCLUSIVE_WORKTREE"
            if [ -z "$outcome" ]; then
              git -C "$SRC" checkout "${GREEN_PIN}" -- \
                src/cfdx/io/runtime/convergence_history.h \
                tests/validation/test_naca0012_geometry.cpp >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ] && [ "$HYB" != "none" ]; then
              cp "$HYB" "$SRC/src/cfdx/physics/steady_incompressible_solver.h" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ]; then
              grep -q "Fxp+=-pp" "$SRC/tests/validation/test_naca0012_geometry.cpp" \
                || outcome="INCONCLUSIVE_VARIANT_COPY"
            fi
            if [ -z "$outcome" ]; then
              if grep -q "momentum_rhs_scale" "$SRC/src/cfdx/io/runtime/convergence_history.h"; then
                outcome="INCONCLUSIVE_VARIANT_COPY"
              fi
            fi
            if [ -z "$outcome" ]; then
              local actual_md5
              actual_md5=$(md5sum "$SRC/src/cfdx/physics/steady_incompressible_solver.h" | awk '{print $1}')
              if [ "$actual_md5" != "$EXPECT_MD5" ]; then
                echo "=== solver md5 mismatch: ${actual_md5} != ${EXPECT_MD5} ===" >> "$LOG"
                outcome="INCONCLUSIVE_VARIANT_COPY"
              fi
              echo "=== solver md5=${actual_md5} (expected ${EXPECT_MD5}) ===" >> "$LOG"
              echo "=== worktree delta ===" >> "$LOG"
              git -C "$SRC" status --porcelain >> "$LOG" 2>&1
            fi
            if [ -z "$outcome" ]; then
              cmake -S "$SRC" -B "$BUILD" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCFDX_BUILD_TESTS=ON \
                -DCFDX_ENABLE_LONG_VALIDATION=ON \
                -DCFDX_ENABLE_MPI=ON \
                -DCFDX_BUILD_PYTHON=OFF \
                -DCFDX_USE_HDF5_SERIAL=OFF \
                -DCFDX_ENABLE_PARALLEL_HDF5=ON \
                -DPython3_EXECUTABLE="$PWD/.venv-naca-bisect/bin/python" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_CONFIGURE"
            fi
            if [ -z "$outcome" ]; then
              cmake --build "$BUILD" --target test_naca0012_qualification --parallel 2 >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_BUILD"
            fi
            if [ -z "$outcome" ]; then
              .venv-naca-bisect/bin/python "$SRC/scripts/generate_2d_validation_meshes.py" \
                naca0012 --output-dir "$BUILD/validation_meshes" >>"$LOG" 2>&1 \
                || outcome="INCONCLUSIVE_MESHGEN"
              for m in naca0012_laminar_n64 naca0012_laminar_n128 naca0012_laminar_n256; do
                if [ ! -s "$BUILD/validation_meshes/${m}.h5" ]; then outcome="INCONCLUSIVE_MESHGEN"; fi
              done
            fi
            if [ -z "$outcome" ]; then
              echo "=== RUN test_naca0012_qualification variant=${VARIANT} levels=${LEVELS} ===" >> "$LOG"
              t0=$(date +%s)
              if [ "$LEVELS" = "3" ]; then
                timeout 3600 "$BUILD/test_naca0012_qualification" \
                  "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
                rc=$?
              else
                timeout 600 "$BUILD/test_naca0012_qualification" \
                  "$BUILD/validation_meshes/naca0012_laminar_n64.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n128.h5" \
                  "$BUILD/validation_meshes/naca0012_laminar_n256.h5" >>"$LOG" 2>&1
                rc=$?
              fi
              t1=$(date +%s)
              if [ "$rc" = "0" ]; then
                outcome="PASS_3_LEVELS"
              elif [ "$rc" = "124" ]; then
                if [ "$LEVELS" = "3" ]; then
                  outcome="TIMEOUT_3600S"
                elif grep -q "NACA0012_RE1000_A0 level=128 Cd=" "$LOG"; then
                  outcome="PASS_128"
                else
                  outcome="INCONCLUSIVE_TIMEOUT"
                fi
              elif grep -q "did not converge" "$LOG"; then
                if ! grep -q "NACA0012_RE1000_A0 level=64 Cd=" "$LOG"; then
                  outcome="FAIL_DIVERGED_64"
                elif grep -q "NACA0012_RE1000_A0 level=128 Cd=" "$LOG"; then
                  outcome="FAIL_DIVERGED_256"
                else
                  outcome="FAIL_DIVERGED"
                fi
              else
                outcome="FAIL_OTHER"
              fi
              echo "=== test rc=${rc} outcome=${outcome} duration=$((t1 - t0))s ===" >> "$LOG"
            fi
            {
              echo "variant=${VARIANT}"
              echo "levels=${LEVELS}"
              echo "outcome=${outcome:-MISSING}"
              echo "test_rc=${rc:-none}"
              if [ "$t0" != "0" ] && [ "$t1" != "0" ]; then
                echo "test_duration_s=$((t1 - t0))"
              fi
              echo "run_id=${RUN_ID}"
              echo ""
              echo "--- level markers reached ---"
              grep -E "NACA0012_RE1000_A0 level=" "$LOG" || echo "no_level_marker"
              echo "--- failure line (if any) ---"
              grep -E "what\(\):" "$LOG" | tail -1 || echo "no_failure_line"
            } > "$STA"
            if [ -s "$LOG" ] && [ "$(stat -c%s "$LOG")" -gt 1500000 ]; then
              tail -c 1500000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            git add "$E"/nacar9c_"${SHORT}"_*_run"${RUN_ID}"* >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              if git commit -m "diag: naca r9c ${SHORT} outcome=${outcome:-MISSING} run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
                if ! git push >/dev/null 2>&1; then
                  git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                  git push >/dev/null 2>&1 || echo "push_retry_failed ${SHORT}"
                fi
              fi
            else
              git reset >/dev/null 2>&1
            fi
            git worktree remove --force "$SRC" >/dev/null 2>&1 || rm -rf "$SRC"
            rm -rf "$BUILD"
            RAN["$VARIANT"]="${outcome:-MISSING}"
          }

          {
            run_variant a0_master_anchor 128
            echo "a0_master_anchor=${RAN[a0_master_anchor]}"
            run_variant a9_all9_anchor 128
            echo "a9_all9_anchor=${RAN[a9_all9_anchor]}"
            run_variant k3 128
            echo "k3=${RAN[k3]}"
            run_variant b3x 128
            echo "b3x=${RAN[b3x]}"
            if is_pass "${RAN[b3x]}"; then
              run_variant c_b3x 3
              echo "branch=B3X_DIRECT confirm=${RAN[c_b3x]}"
              if [ "${RAN[c_b3x]}" != "PASS_3_LEVELS" ]; then
                run_variant c_k1 3
                echo "branch=B3X_CONFIRM_FALLBACK c_k1=${RAN[c_k1]}"
              fi
            else
              run_variant b3x2 128
              echo "b3x2=${RAN[b3x2]}"
              if is_pass "${RAN[b3x2]}"; then
                run_variant c_b3x2 3
                echo "branch=B3X2_DIRECT confirm=${RAN[c_b3x2]}"
                if [ "${RAN[c_b3x2]}" != "PASS_3_LEVELS" ]; then
                  run_variant c_k1 3
                  echo "branch=B3X2_CONFIRM_FALLBACK c_k1=${RAN[c_k1]}"
                fi
              else
                run_variant b3x3 128
                echo "b3x3=${RAN[b3x3]}"
                if is_pass "${RAN[b3x3]}"; then
                  run_variant c_b3x3 3
                  echo "branch=B3X3_DIRECT confirm=${RAN[c_b3x3]}"
                  if [ "${RAN[c_b3x3]}" != "PASS_3_LEVELS" ]; then
                    run_variant c_k1 3
                    echo "branch=B3X3_CONFIRM_FALLBACK c_k1=${RAN[c_k1]}"
                  fi
                else
                  run_variant c_k1 3
                  echo "branch=K1_CONSERVATIVE c_k1=${RAN[c_k1]}"
                fi
              fi
            fi
          } >> "$E/nacar9c_sequence_run${RUN_ID}.txt"
          git add "$E"/nacar9c_sequence_run"${RUN_ID}".txt >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r9c sequence run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed sequence"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi

      - name: Compose round-9c verdict
        if: always()
        run: |
          set +e
          set -u
          RUN_ID="${GITHUB_RUN_ID}"
          E="diag-evidence/logs"
          ALL_VARIANTS="a0_master_anchor a9_all9_anchor k3 b3x b3x2 b3x3 c_b3x c_b3x2 c_b3x3 c_k1"
          for short in $ALL_VARIANTS; do
            eval "oc_${short}=NOT_RUN"
          done
          for short in $ALL_VARIANTS; do
            f="$E/nacar9c_${short}_test_status_run${RUN_ID}.txt"
            [ -s "$f" ] || continue
            oc=$(sed -n 's/^outcome=//p' "$f" | tail -1)
            eval "oc_${short}=\"\${oc:-MISSING}\""
          done
          passp() {
            case "$1" in
              PASS_128|PASS_3_LEVELS) return 0 ;;
              *) return 1 ;;
            esac
          }
          faild() {
            [ "$1" = "FAIL_DIVERGED" ]
          }
          faildx() {
            case "$1" in
              FAIL_DIVERGED|FAIL_DIVERGED_64|FAIL_DIVERGED_256) return 0 ;;
              *) return 1 ;;
            esac
          }
          verdict_line=""
          ok=0
          if [ "${oc_a0_master_anchor}" != "FAIL_DIVERGED" ]; then
            verdict_line="A0_ANCHOR_ANOMALY: master + green conv + green test expected FAIL_DIVERGED at N128, got ${oc_a0_master_anchor} -> repeat before concluding"
          elif ! passp "${oc_a9_all9_anchor}"; then
            verdict_line="A9_ANCHOR_ANOMALY: all-9-regions revert (= green trio) expected PASS at N128, got ${oc_a9_all9_anchor} -> repeat before concluding"
          elif passp "${oc_k3}"; then
            verdict_line="REPRO_ANOMALY_K3: k3 (only r3 in master form) PASSED here (${oc_k3}) but FAIL_DIVERGED_64 in round 9b run 39735295835 at the same md5 pins; deterministic reproducibility broken -> repeat before concluding"
          elif [ "${oc_k3}" != "FAIL_DIVERGED_64" ]; then
            verdict_line="INCOMPLETE_K3: k3=${oc_k3} is neither the round-9b FAIL_DIVERGED_64 nor a pass (expected FAIL_DIVERGED_64 repro) -> re-run"
          elif passp "${oc_b3x}"; then
            if [ "${oc_c_b3x}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_SET_CULPRIT_B3X: reverting {r3,r4,r6,r7,r8,r9} to green (keeping r1,r2,r5 master) restores N128 AND the full 3-level run passes (c_b3x PASS_3_LEVELS); this is the MINIMAL buildable region-granularity revert containing r3 (any r3 revert forces r4/r7/r9/r6/r8 by the corrected coupling map: r4->r3, r7->r3, r9->r3, green r7->green r6, r8->r7); culprit intersects r3 (k3 FAIL_DIVERGED_64) and is disjoint from r1 (k1 PASS_128 round 9b) -> production PR = revert exactly {r3,r4,r6,r7,r8,r9} on master (CI verte exact-HEAD, requals N64/N128/N256 + wall-shear, fiche a jour); optional round 10 hunk-level inside the set (decision Steven)"
              ok=1
            elif [ "${oc_c_k1}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_SET_CULPRIT_K1SET_B3X_INSUF: b3x passes at N128 but the 3-level confirm c_b3x=${oc_c_b3x} fails, while the k1 set (revert r2..r9, keep r1) passes the full 3 levels (c_k1 PASS_3_LEVELS) -> culprit has a member in {r2,r5} (or an N256-only member outside {r3,r4,r6,r7,r8,r9}); production PR = revert {r2,r3,r4,r5,r6,r7,r8,r9} on master (decision Steven); round 10 hunk-level narrows inside (decision Steven)"
              ok=1
            else
              verdict_line="CONFIRM_ANOMALY: b3x PASS_128 but the 3-level confirmation c_b3x=${oc_c_b3x} and the fallback c_k1=${oc_c_k1} both failed -> escalate, do not conclude production"
            fi
          elif passp "${oc_b3x2}"; then
            if [ "${oc_c_b3x2}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_SET_CULPRIT_B3X2: reverting {r2,r3,r4,r6,r7,r8,r9} to green (keeping r1,r5 master) restores N128 AND the full 3-level run passes (c_b3x2 PASS_3_LEVELS); b3x (keep r1,r2,r5) did not pass (${oc_b3x}): r2 is implicated (definite divergence) or r2's master form blocks the b3x build -> production PR = revert exactly {r2,r3,r4,r6,r7,r8,r9} on master (CI verte exact-HEAD, requals, fiche a jour); optional round 10 hunk-level inside the set (decision Steven)"
              ok=1
            elif [ "${oc_c_k1}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_SET_CULPRIT_K1SET_B3X2_INSUF: b3x2 passes at N128 but the 3-level confirm c_b3x2=${oc_c_b3x2} fails while the k1 set passes fully (c_k1 PASS_3_LEVELS) -> production PR = revert {r2,...,r9} on master (decision Steven); round 10 hunk-level narrows inside (decision Steven)"
              ok=1
            else
              verdict_line="CONFIRM_ANOMALY: b3x2 PASS_128 but the 3-level confirmation c_b3x2=${oc_c_b3x2} and the fallback c_k1=${oc_c_k1} both failed -> escalate, do not conclude production"
            fi
          elif passp "${oc_b3x3}"; then
            if [ "${oc_c_b3x3}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_SET_CULPRIT_B3X3: reverting {r3,r4,r5,r6,r7,r8,r9} to green (keeping r1,r2 master) restores N128 AND the full 3-level run passes (c_b3x3 PASS_3_LEVELS); b3x (keep r1,r2,r5) did not pass (${oc_b3x}): r5 is implicated (definite divergence) or r5's master form blocks the b3x build -> production PR = revert exactly {r3,r4,r5,r6,r7,r8,r9} on master (CI verte exact-HEAD, requals, fiche a jour); optional round 10 hunk-level inside the set (decision Steven)"
              ok=1
            elif [ "${oc_c_k1}" = "PASS_3_LEVELS" ]; then
              verdict_line="REGION_SET_CULPRIT_K1SET_B3X3_INSUF: b3x3 passes at N128 but the 3-level confirm c_b3x3=${oc_c_b3x3} fails while the k1 set passes fully (c_k1 PASS_3_LEVELS) -> production PR = revert {r2,...,r9} on master (decision Steven); round 10 hunk-level narrows inside (decision Steven)"
              ok=1
            else
              verdict_line="CONFIRM_ANOMALY: b3x3 PASS_128 but the 3-level confirmation c_b3x3=${oc_c_b3x3} and the fallback c_k1=${oc_c_k1} both failed -> escalate, do not conclude production"
            fi
          else
            if [ "${oc_c_k1}" = "PASS_3_LEVELS" ]; then
              if [ "${oc_b3x}" = "INCONCLUSIVE_BUILD" ] && [ "${oc_b3x2}" = "INCONCLUSIVE_BUILD" ] && [ "${oc_b3x3}" = "INCONCLUSIVE_BUILD" ]; then
                verdict_line="REGION_SET_CULPRIT_K1SET_BUILD_FALLBACK: none of the finer buildable-candidate probes compiled (b3x/b3x2/b3x3 INCONCLUSIVE_BUILD: the coupling map is still incomplete), but the k1 set (revert r2..r9, keep r1) passes the full 3-level run (c_k1 PASS_3_LEVELS) -> conservative production PR = revert {r2,...,r9} on master (decision Steven); round 10 must first complete the coupling map (compile-error triage) before hunk-level bisect"
                ok=1
              else
                verdict_line="REGION_SET_CULPRIT_K1SET: no finer probe passed (b3x=${oc_b3x} keep r1,r2,r5; b3x2=${oc_b3x2} keep r1,r5, so a definite divergence implicates r5; b3x3=${oc_b3x3} keep r1,r2, so a definite divergence implicates r2), and the k1 set (revert r2..r9, keep r1) passes the full 3-level run (c_k1 PASS_3_LEVELS) -> every implicated member (r2 and/or r5) is inside {r2,...,r9}; production PR = revert {r2,...,r9} on master (CI verte exact-HEAD, requals N64/N128/N256 + wall-shear, fiche a jour); round 10 hunk-level narrows inside the set (decision Steven)"
                ok=1
              fi
            else
              verdict_line="INCOMPLETE_WITH_UNKNOWNS: a0=${oc_a0_master_anchor} a9=${oc_a9_all9_anchor} k3=${oc_k3} b3x=${oc_b3x} b3x2=${oc_b3x2} b3x3=${oc_b3x3} c_b3x=${oc_c_b3x} c_b3x2=${oc_c_b3x2} c_b3x3=${oc_c_b3x3} c_k1=${oc_c_k1} -> definite outcomes missing, re-run"
            fi
          fi
          VER="$E/nacar9c_verdict_run${RUN_ID}.txt"
          {
            echo "VERDICT: ${verdict_line}"
            echo "run_id=${RUN_ID}"
            echo "master_pin=${MASTER_PIN}"
            echo "green_pin=${GREEN_PIN}"
            echo "round7_context=IN_TRIO_CULPRIT (run 39663748207: v1+v2 PASS_3_LEVELS green-identical, v0 FAIL)"
            echo "round8_context=COMBINATION_OR_COUPLED (run 39672681948: v0b/vC FAIL as expected = test+conv neutral, r2/r4/r5/r8/r9 single reverts all FAIL_DIVERGED, r1/r3/r6/r7 INCONCLUSIVE_BUILD)"
            echo "round9_context=A9_ANCHOR_ANOMALY (run 39722433948: N128-only invocation passed 1 mesh to a 3-mesh binary; invalid, fixed since)"
            echo "round9b_context=INCOMPLETE_WITH_UNKNOWNS (run 39735295835: a0 FAIL_DIVERGED, a9 PASS_128, k1 PASS_128 (r1 exonerated), k3 FAIL_DIVERGED_64 (r3 implicated), d4 FAIL_DIVERGED, b1 FAIL_DIVERGED_64, b3 INCONCLUSIVE_BUILD)"
            echo "compile_coupling=master r2->r1, r4->r3, r5->r1, r6->r1, r7->r3, r8->r1, r8->r7 (NEW: rhie_chow_identity_* declared in r7 master, consumed by r8 master; proven by round-9b b3 build log), r9->r3+r6; green r7->green r6"
            echo "minimal_buildable_r3_revert={r3,r4,r6,r7,r8,r9} (closure over the corrected map)"
            echo "a0_master_anchor=${oc_a0_master_anchor} (expected FAIL_DIVERGED)"
            echo "a9_all9_anchor=${oc_a9_all9_anchor} (expected PASS at N128)"
            echo "k3(r3 only)=${oc_k3} (round-9b repro: expected FAIL_DIVERGED_64)"
            echo "b3x(revert r3,r4,r6,r7,r8,r9)=${oc_b3x}"
            echo "b3x2(revert r2,r3,r4,r6,r7,r8,r9)=${oc_b3x2}"
            echo "b3x3(revert r3,r4,r5,r6,r7,r8,r9)=${oc_b3x3}"
            echo "c_b3x=${oc_c_b3x}"
            echo "c_b3x2=${oc_c_b3x2}"
            echo "c_b3x3=${oc_c_b3x3}"
            echo "c_k1=${oc_c_k1}"
            echo "sign_note=green test carries the OLD #926 Cd_pressure convention (Fxp+=-pp): compare iterations/convergence, never raw Cd signs"
            echo ""
            echo "--- per-variant NACA digest (level markers + failure) ---"
            for short in $ALL_VARIANTS; do
              L="$E/nacar9c_${short}_main_run${RUN_ID}.log"
              [ -s "$L" ] || continue
              echo "### ${short}"
              grep -E "NACA0012_RE1000_A0 level=|NACA0012_QUALIFICATION|did not converge|what\(\):|Cd=" "$L" | tail -14
              echo "--- last 5 raw lines ---"
              tail -5 "$L"
              echo ""
            done
          } > "$VER"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$VER" >/dev/null 2>&1
          if ! git diff --cached --quiet; then
            if git commit -m "diag: naca r9c verdict run ${RUN_ID} [ci skip]" >/dev/null 2>&1; then
              if ! git push >/dev/null 2>&1; then
                git pull --rebase origin ci/long-campaign-diagnostics >/dev/null 2>&1
                git push >/dev/null 2>&1 || echo "push_retry_failed verdict"
              fi
            fi
          else
            git reset >/dev/null 2>&1
          fi
          if [ "$ok" = "1" ]; then
            echo "round-9c minimal-buildable-revert campaign: ${verdict_line}"
          else
            echo "::error::round-9c not conclusive: ${verdict_line}"
            exit 1
          fi
