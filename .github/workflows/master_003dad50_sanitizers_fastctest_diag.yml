name: Master 003dad50 DebugSanitizers fast-ctest capture (diag)

# DIAG-ONLY - capture-only, AUCUNE instrumentation du code.
# Replique le job "Build and test (DebugSanitizers)" de cfdx-ci.yml sur le
# master epingle 003dad50df272b1264c395938f73f3e64d96f4fd.
# Contexte : master 003dad50 DebugSanitizers "Run fast CTest" exit 8
# (job 124941941184, run 41337928434) alors que le job Release du meme
# commit est vert. exit 8 = echec d'execution CTest, PAS un nombre de tests.
# But : liste "The following tests FAILED" + rapport ASan/UBSan complet.

on:
  pull_request:
    branches: [master]
    paths:
      - 'diag-tools/master_003dad50_sani_marker.txt'
      - '.github/workflows/master_003dad50_sanitizers_fastctest_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-003dad50-sani-diag
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs

jobs:
  sanitizers-fastctest-diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      HEAD_SHA_PIN: 003dad50df272b1264c395938f73f3e64d96f4fd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pinned ref and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          SHORT="${HEAD_SHA_PIN:0:7}"
          git fetch origin master
          git cat-file -e "$HEAD_SHA_PIN^{commit}" \
            || { echo "::error::pinned head SHA not resolvable: $HEAD_SHA_PIN"; exit 1; }
          git merge-base --is-ancestor "$HEAD_SHA_PIN" origin/master \
            || { echo "::error::pinned head is not an ancestor of master: $HEAD_SHA_PIN"; exit 1; }
          git worktree add "$RUNNER_TEMP/head" "$HEAD_SHA_PIN"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ref_pin=$HEAD_SHA_PIN"
            echo "scope=replica of CI DebugSanitizers 'Run fast CTest' (-LE 'long|benchmark|campaign|sanitizer-slow' --parallel 6, ASAN detect_leaks=1:halt_on_error=1, UBSAN halt_on_error=1) + rerun-failed full sanitizer report"
            echo "context=master 003dad50 DebugSanitizers fast CTest exit 8 (run 41337928434 job 124941941184); Release PASSED on the same commit"
            echo "rule=EVIDENCE_COMPLETE is a diagnostic evidence verdict, never a numerical PASS/FAIL"
          } > "$GITHUB_WORKSPACE/$EVID/master_003dad50_sani_meta_${SHORT}_run$GITHUB_RUN_ID.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin libglu1-mesa

      - name: Configure (DebugSanitizers, replica of CI)
        run: |
          cmake -S "$RUNNER_TEMP/head" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=DebugSanitizers \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_UNITY_BUILD=ON

      - name: Build
        run: |
          SHORT="${HEAD_SHA_PIN:0:7}"
          set +e
          cmake --build build --parallel 8 > /tmp/build_raw.log 2>&1
          rc=$?
          {
            echo "build_exit=$rc"
            echo "--- build log (tail 300) ---"
            tail -n 300 /tmp/build_raw.log
            echo "--- build errors (if any) ---"
            grep -E -B2 -A4 'error:|fatal error:|undefined reference|collect2: error|FAILED:' /tmp/build_raw.log | tail -n 120 || true
          } > "$GITHUB_WORKSPACE/$EVID/master_003dad50_sani_build_${SHORT}_run$GITHUB_RUN_ID.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::build failed on pinned head - see evidence log"
            exit 1
          fi

      - name: Run fast CTest (replica of the CI DebugSanitizers step)
        run: |
          SHORT="${HEAD_SHA_PIN:0:7}"
          set +e
          ctest --test-dir build -LE 'long|benchmark|campaign|sanitizer-slow' --output-on-failure --no-tests=error --parallel 6 \
            > "$GITHUB_WORKSPACE/$EVID/master_003dad50_sani_ctest_${SHORT}_run$GITHUB_RUN_ID.log" 2>&1
          rc=$?
          set -e
          echo "ctest_exit=$rc" > "$GITHUB_WORKSPACE/$EVID/master_003dad50_sani_status_${SHORT}_run$GITHUB_RUN_ID.txt"
          echo "ctest_exit=$rc"
          tail -n 60 "$GITHUB_WORKSPACE/$EVID/master_003dad50_sani_ctest_${SHORT}_run$GITHUB_RUN_ID.log"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1

      - name: Rerun failed tests with full sanitizer report
        if: always()
        run: |
          SHORT="${HEAD_SHA_PIN:0:7}"
          set +e
          ctest --test-dir build --rerun-failed --output-on-failure \
            > "$GITHUB_WORKSPACE/$EVID/master_003dad50_sani_rerun_${SHORT}_run$GITHUB_RUN_ID.log" 2>&1
          rc=$?
          set -e
          echo "rerun_exit=$rc" >> "$GITHUB_WORKSPACE/$EVID/master_003dad50_sani_status_${SHORT}_run$GITHUB_RUN_ID.txt"
          echo "rerun_exit=$rc"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1

      - name: Extract the CTest FAILED list
        if: always()
        run: |
          SHORT="${HEAD_SHA_PIN:0:7}"
          E="$GITHUB_WORKSPACE/$EVID"
          L="$E/master_003dad50_sani_ctest_${SHORT}_run$GITHUB_RUN_ID.log"
          {
            grep -A 60 "The following tests FAILED:" "$L" || echo "(no FAILED section found)"
            echo "=== LastTestsFailed.log (if present) ==="
            cat build/Testing/Temporary/LastTestsFailed.log 2>/dev/null || echo "(no LastTestsFailed.log)"
          } > "$E/master_003dad50_sani_failedlist_${SHORT}_run$GITHUB_RUN_ID.txt"
          cat "$E/master_003dad50_sani_failedlist_${SHORT}_run$GITHUB_RUN_ID.txt"

      - name: Sanitizer report signatures
        if: always()
        run: |
          SHORT="${HEAD_SHA_PIN:0:7}"
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "=== unique sanitizer signatures (rerun + ctest logs) ==="
            cat "$E/master_003dad50_sani_rerun_${SHORT}_run$GITHUB_RUN_ID.log" "$E/master_003dad50_sani_ctest_${SHORT}_run$GITHUB_RUN_ID.log" 2>/dev/null \
              | grep -E "runtime error:|ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|SUMMARY: UndefinedBehaviorSanitizer|LeakSanitizer" \
              | sort -u | head -n 200 || true
          } > "$E/master_003dad50_sani_sanreport_${SHORT}_run$GITHUB_RUN_ID.txt"
          cat "$E/master_003dad50_sani_sanreport_${SHORT}_run$GITHUB_RUN_ID.txt"

      - name: Publish evidence to dedicated branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: master 003dad50 DebugSanitizers fast-ctest capture run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            git push --force origin HEAD:refs/heads/diag-evidence/master-003dad50-sanitizers
          fi
