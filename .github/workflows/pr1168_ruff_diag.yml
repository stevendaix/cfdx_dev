name: PR 1168 ruff pre-commit oracle (diag)

# DIAG-ONLY - branche ci/long-campaign-diagnostics (PR #903, JAMAIS merger).
# Evidence-only : relever les findings Ruff exacts derriere l'echec du job
# "Pre-commit" (exit 1 a 22:23:42Z) sur le head PR #1168 d7838830.
on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - '.github/workflows/pr1168_ruff_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1168-ruff-diag
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs
  PR1168_HEAD: d78388304f053d668a0265eebe1a7269108646c8
  PR1168_BASE: 1c8343d7d155b754422e385d759e38c5a59e0ce3

jobs:
  oracle:
    name: ruff check + format + cfdx-fast replica on PR1168 head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WDIR: /tmp/pr1168_wt
      FILES: scripts/validate_thermohydraulic_reference.py tests/python/test_thermohydraulic_reference_contracts.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pins and worktree PR head
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "pr1168_head=$PR1168_HEAD"
            echo "purpose=exact ruff findings behind Pre-commit exit 1 at 22:23:42Z on PR #1168 head d7838830"
          } > "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_meta_run$GITHUB_RUN_ID.txt"
          git cat-file -e "$PR1168_HEAD^{commit}" || { echo "::error::PR1168 head unresolvable"; exit 1; }
          git worktree add "$WDIR" "$PR1168_HEAD"

      - name: Install ruff and pre-commit
        run: python3 -m pip install --upgrade ruff pre-commit

      - name: Ruff check replica
        run: |
          set +e
          cd "$WDIR"
          ruff --version > "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_version_run$GITHUB_RUN_ID.txt"
          ruff check $FILES > "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_check_run$GITHUB_RUN_ID.txt" 2>&1
          rc=$?
          set -e
          echo "ruff_check_exit=$rc" | tee -a "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_status_run$GITHUB_RUN_ID.txt"
          cat "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_check_run$GITHUB_RUN_ID.txt"

      - name: Ruff format check replica
        run: |
          set +e
          cd "$WDIR"
          ruff format --check $FILES > "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_fmt_run$GITHUB_RUN_ID.txt" 2>&1
          rc=$?
          ruff format --diff $FILES >> "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_fmt_run$GITHUB_RUN_ID.txt" 2>&1 || true
          set -e
          echo "ruff_format_exit=$rc" | tee -a "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_status_run$GITHUB_RUN_ID.txt"
          cat "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_fmt_run$GITHUB_RUN_ID.txt"

      - name: cfdx-fast guard replica
        run: |
          set +e
          cd "$WDIR"
          CFDX_PRECOMMIT_RANGE="$PR1168_BASE...$PR1168_HEAD" python3 tools/precommit/cfdx_precommit.py > "$GITHUB_WORKSPACE/$EVID/pr1168_cfdxfast_run$GITHUB_RUN_ID.txt" 2>&1
          rc=$?
          set -e
          echo "cfdx_fast_exit=$rc" | tee -a "$GITHUB_WORKSPACE/$EVID/pr1168_ruff_status_run$GITHUB_RUN_ID.txt"
          cat "$GITHUB_WORKSPACE/$EVID/pr1168_cfdxfast_run$GITHUB_RUN_ID.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: pr1168 ruff oracle run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Final gate
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/$EVID/pr1168_ruff_status_run$GITHUB_RUN_ID.txt"
          if [ ! -f "$f" ]; then
            echo "::error::no status recorded - read oracle evidence"
            exit 1
          fi
          cat "$f"
