name: CFDX build and tests

on:
  push:
    branches:
      - master
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
      - "validation/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cfdx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3-venv

      - name: Install Python mesh I/O stack
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCFDX_BUILD_TESTS=ON             -DCFDX_ENABLE_MPI=ON             -DCFDX_USE_HDF5_SERIAL=OFF             -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --verbose 2>&1 | tee build.log

      - name: Diagnose compilation failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "=== Compiler/linker diagnostics ==="
          grep -E -B2 -A4 'error:|fatal error:|undefined reference|collect2: error|FAILED:' build.log | tail -n 250 || true
          echo
          echo "=== Failed build commands ==="
          grep -E 'FAILED:|ninja: build stopped|g\+\+|c\+\+|clang\+\+|nvcc' build.log | tail -n 120 || true

      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit build/ctest-results.xml

      - name: Upload CTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-diagnostics
          path: |
            build/ctest-results.xml
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
