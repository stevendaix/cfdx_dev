name: CFDX build and tests

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-dev libopenmpi-dev python3-venv latexmk texlive-latex-base texlive-latex-recommended
      - name: Install Python mesh I/O stack
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_MPI=ON -DCFDX_USE_HDF5_SERIAL=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test and generate validation report
        run: |
          set +e
          ctest --test-dir build --output-on-failure
          test_rc=$?
          set -e
          python3 scripts/validation_report.py --build-dir build --output-dir build/validation-report
          exit $test_rc
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-report
          path: build/validation-report/
