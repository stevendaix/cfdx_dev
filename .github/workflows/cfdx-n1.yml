name: CFDX N1 numerical-method CI

on:
  push:
    paths:
      - ".github/workflows/cfdx-n1.yml"
      - "CMakeLists.txt"
      - "apps/production_solver/main.cpp"
      - "src/cfdx/core/numerics/**"
      - "src/cfdx/io/cfdx_io/case_schema.h"
      - "src/cfdx/io/hdf5/case_hdf5_io.cpp"
      - "src/cfdx/python/cfdx/io/**"
      - "tests/python/**"
      - "tests/unit/test_case_hdf5_io.cpp"
      - "tests/unit/test_case_numerics_report.cpp"
      - "tests/unit/test_spatial_scheme_contract.cpp"
      - "docs/development/NUMERICAL_METHOD_CONTRACTS.md"
      - "docs/validation/NUMERICAL_METHOD_MATURITY_AUDIT.json"
      - "docs/validation/NUMERICAL_METHOD_REQUIREMENTS_AUDIT.json"
      - "tests/validation/test_n7_convergence_qualification.cpp"
      - "src/cfdx/core/utils/convergence_monitor.h"
      - "src/cfdx/physics/continuation.h"
      - "src/cfdx/physics/steady_incompressible_solver.h"
      - "src/cfdx/physics/pressure_velocity_algorithms.h"
      - "tests/unit/test_initialization.cpp"
      - "src/cfdx/core/numerics/numerical_method_contract.h"
  pull_request:
    branches: [master, main, develop]
    paths:
      - ".github/workflows/cfdx-n1.yml"
      - "CMakeLists.txt"
      - "apps/production_solver/main.cpp"
      - "src/cfdx/core/numerics/**"
      - "src/cfdx/io/cfdx_io/case_schema.h"
      - "src/cfdx/io/hdf5/case_hdf5_io.cpp"
      - "src/cfdx/python/cfdx/io/**"
      - "tests/python/test_numerical_selection.py"
      - "tests/python/test_production_solver_e2e.py"
      - "tests/python/test_production_solver_numerics_e2e.py"
      - "tests/python/test_su2_adapter.py"
      - "tests/unit/test_case_hdf5_io.cpp"
      - "tests/unit/test_case_numerics_report.cpp"
      - "tests/unit/test_spatial_scheme_contract.cpp"
      - "docs/development/NUMERICAL_METHOD_CONTRACTS.md"
      - "docs/validation/NUMERICAL_METHOD_MATURITY_AUDIT.json"
      - "docs/validation/NUMERICAL_METHOD_REQUIREMENTS_AUDIT.json"
      - "tests/validation/test_n7_convergence_qualification.cpp"
      - "src/cfdx/core/utils/convergence_monitor.h"
      - "src/cfdx/physics/continuation.h"
      - "src/cfdx/physics/steady_incompressible_solver.h"
      - "src/cfdx/physics/pressure_velocity_algorithms.h"
      - "tests/unit/test_initialization.cpp"
      - "src/cfdx/core/numerics/numerical_method_contract.h"
  workflow_dispatch:

concurrency:
  group: cfdx-n1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  n1:
    name: N1 numerical methods
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Install Python mesh/I/O stack
        run: |
          python3 -m venv .venv-n1
          .venv-n1/bin/python -m pip install --upgrade pip
          .venv-n1/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic
          echo "$PWD/.venv-n1/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build-n1 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build N1 targets
        run: |
          cmake --build build-n1 --parallel 4 --target \
            test_spatial_scheme_contract \
            test_case_numerics_report \
            test_case_hdf5_io \
            test_n7_convergence_qualification \
            cfdx_production_solver

      - name: Run N7 convergence qualification
        run: |
          ctest --test-dir build-n1 \
            -R '^test_n7_convergence_qualification$' \
            --output-on-failure \
            --no-tests=error

      - name: Run native N1 contract and case-I/O tests
        run: |
          ctest --test-dir build-n1 \
            -R '^(test_spatial_scheme_contract|test_case_numerics_report|test_case_hdf5_io)$' \
            --output-on-failure \
            --no-tests=error

      - name: Run canonical Python numerical-selection tests
        run: |
          python -m pytest -q tests/python/test_numerical_selection.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src/cfdx/python

      - name: Run SU2 adapter regression
        run: |
          python -m pytest -q tests/python/test_su2_adapter.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src/cfdx/python

      - name: Run production numerical-selection E2E
        run: |
          ctest --test-dir build-n1 \
            -R '^test_production_solver_numerics_e2e$' \
            --output-on-failure \
            --no-tests=error

      - name: Final N1 gate
        run: echo "CFDX N1 CI: PASS"
