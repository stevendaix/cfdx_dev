name: PR923 targeted campaign comparison (diag)

# Comparaison base/head fiabilisee pour #923 (audit 2026-10-16, plan Steven) :
#  - refs resolues au lancement (PR 923 head + merge-base master) et epinglees
#    dans la meta de CE run (noms d'evidence suffixes $GITHUB_RUN_ID : plus
#    aucun ecrasement de preuves entre runs, traconbilite complete) ;
#  - rapport structure par test (TSV : ref, test, statut, duree) + junit
#    archive, pas seulement des listes d'echecs extraites du texte ;
#  - fail-closed : build/pip/meshgen en echec, decouverte incomplete (<6
#    tests sur une ref), test sans ligne d'issue, TIMEOUT sur une ref =>
#    verdict INCONCLUSIVE_*, jamais "identique" ;
#  - fix 2026-10-17 (apres run 38970138370 INCONCLUSIVE_BUILD) : les noms
#    CTest ne sont pas des cibles CMake. Le test CTest
#    test_ghia_cavity_n8_pcd est un add_test(NAME ... COMMAND test_ghia_cavity
#    --pcd) ; on construit donc la cible executable test_ghia_cavity, apres
#    verification explicite que chaque cible demandee existe dans le build
#    Ninja (ninja -t targets all) ;
#  - le parseur des lignes d'issue ctest capture aussi ***Exception:* (crash,
#    ex. naca subprocess aborted), normalise en Failed ;
#  - cross-check junit vs parse des lignes d'issue : tout conflit ou junit
#    absent alors que le log a des issues => INCONCLUSIVE_JUNIT_CONFLICT /
#    INCONCLUSIVE_MISSING_JUNIT ;
#  - verdicts possibles : INCONCLUSIVE_BUILD / INCONCLUSIVE_DISCOVERY /
#    INCONCLUSIVE_MISSING_OUTCOME / INCONCLUSIVE_TIMEOUT / INCONCLUSIVE_NOT_RUN /
#    INCONCLUSIVE_MISSING_JUNIT / INCONCLUSIVE_JUNIT_CONFLICT /
#    REGRESSION / FAILURE_SETS_DIFFER / IDENTICAL_FAILURE_SETS ;
#  - commentaire automatique du verdict sur #923 ; job rouge sauf
#    IDENTICAL_FAILURE_SETS.
#
# Branche diag ci/long-campaign-diagnostics, jamais mergee (PR #903).

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/pr923_campaign_marker.txt'
      - '.github/workflows/pr923_campaign_comparison_diag.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pr923-campaign-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      TARGETED: '^test_(bfs_qualification|channel_qualification|naca0012_qualification|ghia_cavity_n8_pcd|n12_coupled_pressure_velocity_mms|n9_s9_rhie_chow_consistency)$'
      EVID: diag-evidence/logs
    steps:
      - uses: actions/checkout@v4

      - name: Fetch refs and create worktrees
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin master
          git fetch origin refs/pull/923/head
          PR923_SHA="$(git rev-parse FETCH_HEAD)"
          BASE_SHA="$(git merge-base origin/master "$PR923_SHA")"
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          git worktree add "$RUNNER_TEMP/pr923" "$PR923_SHA"
          echo "PR923_SHA=$PR923_SHA" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "base_sha=$BASE_SHA"
            echo "pr923_head_sha=$PR923_SHA"
            echo "targeted_tests: BFS Re=200, channel, NACA0012 laminar, Ghia PCD, N12 coupled MMS, N9-S9 RC consistency"
          } > "$GITHUB_WORKSPACE/$EVID/pr923_meta_run$GITHUB_RUN_ID.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python tooling and package
        id: pip
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip > /dev/null 2>&1
          "$RUNNER_TEMP/venv/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml > "$GITHUB_WORKSPACE/$EVID/pr923_pip_run$GITHUB_RUN_ID.log" 2>&1
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e "$RUNNER_TEMP/base" >> "$GITHUB_WORKSPACE/$EVID/pr923_pip_run$GITHUB_RUN_ID.log" 2>&1

      - name: Generate validation meshes (shared by both refs)
        id: meshes
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/base/scripts/generate_2d_validation_meshes.py" all --output-dir "$RUNNER_TEMP/validation_meshes" 2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr923_meshgen_run$GITHUB_RUN_ID.log"
          for mesh in channel_n16.h5 channel_n32.h5 channel_n64.h5 bfs_re200_n16.h5 bfs_re200_n32.h5 bfs_re200_n64.h5 naca0012_laminar_n64.h5 naca0012_laminar_n128.h5 naca0012_laminar_n256.h5; do
            test -s "$RUNNER_TEMP/validation_meshes/$mesh" || { echo "::error::missing mesh: $mesh"; exit 1; }
          done

      - name: Configure and build (merge-base)
        id: build_base
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -S "$RUNNER_TEMP/base" -B "$RUNNER_TEMP/base/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON -DCFDX_BUILD_PYTHON=OFF -DCFDX_USE_HDF5_SERIAL=OFF -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr923_base_configure_run$GITHUB_RUN_ID.log"
          # Cibles CMake reelles : test_ghia_cavity_n8_pcd est un nom CTest (add_test),
          # l'executable est test_ghia_cavity. Verification fail-closed des cibles.
          TARGETS="test_bfs_qualification test_channel_qualification test_naca0012_qualification test_ghia_cavity test_n12_coupled_pressure_velocity_mms test_n9_s9_rhie_chow_consistency"
          avail="$(ninja -C "$RUNNER_TEMP/base/build" -t targets all | awk '{print $1}' | sort -u)"
          for t in $TARGETS; do
            echo "$avail" | grep -qx "$t" || { echo "::error::missing CMake target: $t"; exit 1; }
          done
          cmake --build "$RUNNER_TEMP/base/build" --target $TARGETS --parallel 2 \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr923_base_build_run$GITHUB_RUN_ID.log"
          test -d "$RUNNER_TEMP/validation_meshes" && cp -r "$RUNNER_TEMP/validation_meshes" "$RUNNER_TEMP/base/build/validation_meshes"

      - name: Configure and build (PR 923 head)
        id: build_head
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -S "$RUNNER_TEMP/pr923" -B "$RUNNER_TEMP/pr923/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON -DCFDX_BUILD_PYTHON=OFF -DCFDX_USE_HDF5_SERIAL=OFF -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr923_head_configure_run$GITHUB_RUN_ID.log"
          # Cibles CMake reelles : test_ghia_cavity_n8_pcd est un nom CTest (add_test),
          # l'executable est test_ghia_cavity. Verification fail-closed des cibles.
          TARGETS="test_bfs_qualification test_channel_qualification test_naca0012_qualification test_ghia_cavity test_n12_coupled_pressure_velocity_mms test_n9_s9_rhie_chow_consistency"
          avail="$(ninja -C "$RUNNER_TEMP/pr923/build" -t targets all | awk '{print $1}' | sort -u)"
          for t in $TARGETS; do
            echo "$avail" | grep -qx "$t" || { echo "::error::missing CMake target: $t"; exit 1; }
          done
          cmake --build "$RUNNER_TEMP/pr923/build" --target $TARGETS --parallel 2 \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr923_head_build_run$GITHUB_RUN_ID.log"
          test -d "$RUNNER_TEMP/validation_meshes" && cp -r "$RUNNER_TEMP/validation_meshes" "$RUNNER_TEMP/pr923/build/validation_meshes"

      - name: Run targeted campaigns (merge-base)
        id: base
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir "$RUNNER_TEMP/base/build" -R "$TARGETED" -N > "$GITHUB_WORKSPACE/$EVID/pr923_base_testlist_run$GITHUB_RUN_ID.log" 2>&1
          ctest --test-dir "$RUNNER_TEMP/base/build" -R "$TARGETED" --parallel 4 --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/$EVID/pr923_base_junit_run$GITHUB_RUN_ID.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr923_base_campaign_run$GITHUB_RUN_ID.log"

      - name: Run targeted campaigns (PR 923 head)
        id: pr923
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir "$RUNNER_TEMP/pr923/build" -R "$TARGETED" -N > "$GITHUB_WORKSPACE/$EVID/pr923_head_testlist_run$GITHUB_RUN_ID.log" 2>&1
          ctest --test-dir "$RUNNER_TEMP/pr923/build" -R "$TARGETED" --parallel 4 --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/$EVID/pr923_head_junit_run$GITHUB_RUN_ID.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr923_head_campaign_run$GITHUB_RUN_ID.log"

      - name: Structured per-test report and fail-closed verdict
        if: always()
        env:
          PIP_OUTCOME: ${{ steps.pip.outcome }}
          MESHES_OUTCOME: ${{ steps.meshes.outcome }}
          BASE_BUILD: ${{ steps.build_base.outcome }}
          HEAD_BUILD: ${{ steps.build_head.outcome }}
          BASE_CTEST: ${{ steps.base.outcome }}
          HEAD_CTEST: ${{ steps.pr923.outcome }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          E = os.path.join(os.environ["GITHUB_WORKSPACE"], "diag-evidence/logs")
          RUN = os.environ["GITHUB_RUN_ID"]
          expected = ["test_bfs_qualification", "test_channel_qualification",
                      "test_naca0012_qualification", "test_ghia_cavity_n8_pcd",
                      "test_n12_coupled_pressure_velocity_mms",
                      "test_n9_s9_rhie_chow_consistency"]
          env = os.environ
          def parse_testlist(tag):
              path = os.path.join(E, "pr923_%s_testlist_run%s.log" % (tag, RUN))
              found = set()
              if os.path.exists(path):
                  txt = open(path, errors="replace").read()
                  for m in re.finditer(r"Test\s+#\d+:\s+(\S+)", txt):
                      if m.group(1) in expected:
                          found.add(m.group(1))
              return found
          def parse_campaign(tag):
              path = os.path.join(E, "pr923_%s_campaign_run%s.log" % (tag, RUN))
              st = {}
              if os.path.exists(path):
                  txt = open(path, errors="replace").read()
                  pat = re.compile(r"Test\s+#\d+:\s+(\S+)\s+\.\.\.\s*"
                                   r"(Passed|\*\*\*Failed|\*\*\*Timeout|\*\*\*Not Run"
                                   r"|\*\*\*Exception:\s*\S+)"
                                   r"\s*([0-9.]+ sec)?")
                  for m in pat.finditer(txt):
                      raw = m.group(2)
                      if raw == "Passed":
                          key = "Passed"
                      elif raw == "***Timeout":
                          key = "Timeout"
                      elif raw == "***Not Run":
                          key = "Not Run"
                      elif raw.startswith("***Exception"):
                          key = "Failed"  # crash/exception normalise en Failed
                      else:
                          key = "Failed"
                      st[m.group(1)] = (key, m.group(3) or "unknown")
              return st
          JUNIT_MAP = {"passed": "Passed", "failed": "Failed",
                        "timeout": "Timeout", "notrun": "Not Run"}
          def parse_junit(tag):
              # Cross-check fail-closed : le junit --output-junit doit concorder
              # avec le parse des lignes d'issue de la campagne.
              path = os.path.join(E, "pr923_%s_junit_run%s.xml" % (tag, RUN))
              res = {}
              if not os.path.exists(path):
                  return res
              txt = open(path, errors="replace").read()
              for m in re.finditer(r"<testcase\b([^>]*?)(/?)>", txt):
                  attrs = m.group(1)
                  if m.group(2) == "/":
                      body = ""
                  else:
                      end = txt.find("</testcase>", m.end())
                      if end < 0:
                          continue
                      body = txt[m.end():end]
                  nm = re.search(r'\bname="([^"]+)"', attrs)
                  if not nm:
                      continue
                  st_ = re.search(r'\bstatus="([^"]+)"', attrs)
                  failed = ("<failure" in body) or ("<error" in body)
                  s = (st_.group(1).lower() if st_ else "unknown")
                  key = JUNIT_MAP.get(s)
                  if key is None:
                      key = "Failed" if failed else "JUNIT_STATUS=" + s
                  elif failed and key == "Passed":
                      key = "Failed"
                  res[nm.group(1)] = key
              return res
          disc = {"base": parse_testlist("base"), "head": parse_testlist("head")}
          stat = {"base": parse_campaign("base"), "head": parse_campaign("head")}
          junit = {"base": parse_junit("base"), "head": parse_junit("head")}
          tsv_path = os.path.join(E, "pr923_per_test_run%s.tsv" % RUN)
          reasons = []
          verdict = None
          def set_verdict(v):
              global verdict
              if verdict is None:
                  verdict = v
          with open(tsv_path, "w") as f:
              f.write("ref\ttest\tstatus\tduration\n")
              for ref in ("base", "head"):
                  for t in expected:
                      s, d = stat[ref].get(t, ("MISSING", "unknown"))
                      f.write("%s\t%s\t%s\t%s\n" % (ref, t, s, d))
          if env.get("PIP_OUTCOME") not in (None, "success", ""):
              set_verdict("INCONCLUSIVE_BUILD")
              reasons.append("pip outcome=%s" % env.get("PIP_OUTCOME"))
          if env.get("MESHES_OUTCOME") not in (None, "success", ""):
              set_verdict("INCONCLUSIVE_BUILD")
              reasons.append("meshgen outcome=%s" % env.get("MESHES_OUTCOME"))
          for tag, key in (("base", "BASE_BUILD"), ("head", "HEAD_BUILD")):
              if env.get(key) not in (None, "success", ""):
                  set_verdict("INCONCLUSIVE_BUILD")
                  reasons.append("%s build outcome=%s" % (tag, env.get(key)))
          for tag in ("base", "head"):
              missing = sorted(set(expected) - disc[tag])
              extra = sorted(disc[tag] - set(expected))
              if missing or len(disc[tag]) != 6:
                  set_verdict("INCONCLUSIVE_DISCOVERY")
                  reasons.append("%s discovery=%d/6 missing=%s extra=%s"
                                 % (tag, len(disc[tag]), ",".join(missing) or "-",
                                    ",".join(extra) or "-"))
          for tag in ("base", "head"):
              for t in expected:
                  if t not in stat[tag]:
                      set_verdict("INCONCLUSIVE_MISSING_OUTCOME")
                      reasons.append("%s no outcome line for %s" % (tag, t))
          for tag in ("base", "head"):
              for t in expected:
                  s = stat[tag].get(t, ("", ""))[0]
                  if s == "Timeout":
                      set_verdict("INCONCLUSIVE_TIMEOUT")
                      reasons.append("%s %s TIMEOUT (not a comparable outcome)" % (tag, t))
                  if s == "Not Run":
                      set_verdict("INCONCLUSIVE_NOT_RUN")
                      reasons.append("%s %s NOT RUN" % (tag, t))
          for tag in ("base", "head"):
              ju = junit[tag]
              if not ju:
                  if stat[tag]:
                      set_verdict("INCONCLUSIVE_MISSING_JUNIT")
                      reasons.append("%s junit missing/unreadable while campaign log has outcomes" % tag)
              else:
                  for t in expected:
                      js = ju.get(t)
                      if js is None:
                          set_verdict("INCONCLUSIVE_MISSING_JUNIT")
                          reasons.append("%s junit has no entry for %s" % (tag, t))
                      else:
                          ls = stat[tag].get(t, ("", ""))[0]
                          if ls and js != ls:
                              set_verdict("INCONCLUSIVE_JUNIT_CONFLICT")
                              reasons.append("%s %s junit=%s log=%s" % (tag, t, js, ls))
          if verdict is None:
              reg = [t for t in expected
                     if stat["base"][t][0] == "Passed" and stat["head"][t][0] != "Passed"]
              diff = [t for t in expected if stat["base"][t][0] != stat["head"][t][0]]
              if reg:
                  set_verdict("REGRESSION")
                  reasons.append("head fails where base passes: %s" % ",".join(reg))
              elif diff:
                  set_verdict("FAILURE_SETS_DIFFER")
                  reasons.append("outcome changes: %s" % ",".join(diff))
              else:
                  set_verdict("IDENTICAL_FAILURE_SETS")
                  reasons.append("per-test outcomes identical on both refs "
                                 "(failures identical to base, if any)")
          comp_path = os.path.join(E, "pr923_comparison_run%s.txt" % RUN)
          with open(comp_path, "w") as f:
              f.write("VERDICT: %s\n" % verdict)
              f.write("base_sha=%s\npr923_head_sha=%s\n" % (env.get("BASE_SHA"), env.get("PR923_SHA")))
              for r in reasons:
                  f.write("%s\n" % r)
              f.write("\n--- per-test report ---\n")
              with open(tsv_path) as t:
                  f.write(t.read())
          meta_path = os.path.join(E, "pr923_meta_run%s.txt" % RUN)
          with open(meta_path, "a") as f:
              f.write("base_ctest_outcome=%s\n" % env.get("BASE_CTEST"))
              f.write("head_ctest_outcome=%s\n" % env.get("HEAD_CTEST"))
              f.write("verdict=%s\n" % verdict)
          print(open(comp_path).read())
          PY

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: PR 923 campaign comparison run $GITHUB_RUN_ID — fail-closed structured verdict (#923) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Post verdict comment to PR #923 (best effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "## Comparaison campagne ciblée base/head — run $GITHUB_RUN_ID — verdict : $(sed -n 's/^VERDICT: //p' "$E/pr923_comparison_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo UNKNOWN)"
            echo
            echo "Base : \`$BASE_SHA\` (merge-base master) — HEAD : \`$PR923_SHA\`"
            echo "Evidence : \`diag-evidence/logs/pr923_*_run$GITHUB_RUN_ID.*\` sur \`ci/long-campaign-diagnostics\`"
            echo
            echo '~~~'
            cat "$E/pr923_comparison_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo "(verdict indisponible)"
            echo '~~~'
          } > /tmp/comment.md 2>/dev/null || true
          if [ ! -s /tmp/comment.md ]; then echo "(comment vide)" > /tmp/comment.md; fi
          jq -n --rawfile body /tmp/comment.md '{body: $body}' > /tmp/payload.json
          http=$(curl -sS --fail-with-body -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/923/comments" \
            -d @/tmp/payload.json) || http=failed
          echo "POST to #923: $http"
          exit 0

      - name: Final verdict (green only for IDENTICAL_FAILURE_SETS)
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          if grep -q "^VERDICT: IDENTICAL_FAILURE_SETS" "$E/pr923_comparison_run$GITHUB_RUN_ID.txt" 2>/dev/null; then
            echo "verdict: IDENTICAL_FAILURE_SETS — comparaison concluante"
          else
            v=$(sed -n 's/^VERDICT: //p' "$E/pr923_comparison_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo "MISSING_VERDICT_FILE")
            echo "::error::verdict=$v — preuve non concluante ou régression, voir diag-evidence/logs/pr923_comparison_run$GITHUB_RUN_ID.txt"
            exit 1
          fi
