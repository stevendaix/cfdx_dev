name: Lot 3 G1a editable pipeline candidate oracle (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/lot3g1a_marker.txt'
      - '.github/workflows/lot3g1a-oracle.yml'

permissions:
  contents: write

concurrency:
  group: lot3g1a-oracle
  cancel-in-progress: false

env:
  PR_HEAD_SHA: "71858a20fbfc67006824936d0646b3dd1cb79394"
  STAMP: "2026-10-25-lot3g1a-r2"

jobs:
  g1a-candidate-verify:
    name: G1a candidate verify (ruff, GUI pytest, no-Qt)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout diag branch
        uses: actions/checkout@v4
        with:
          ref: ci/long-campaign-diagnostics

      - name: Pin the master base into a worktree (fail-closed)
        run: |
          git fetch --depth=1 origin "$PR_HEAD_SHA"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$PR_HEAD_SHA" || { echo "base unreachable: $PR_HEAD_SHA"; exit 1; }
          git worktree add /tmp/prhead "$PR_HEAD_SHA"

      - name: Overlay the G1a candidates
        run: |
          cp "diag-tools/lot3g1a_candidates/visualization_pipeline.py" \
             "/tmp/prhead/src/cfdx/python/cfdx/visualization_pipeline.py"
          cp "diag-tools/lot3g1a_candidates/gui_3d.py" \
             "/tmp/prhead/src/cfdx/python/cfdx/gui_3d.py"
          cp "diag-tools/lot3g1a_candidates/workbench.py" \
             "/tmp/prhead/src/cfdx/python/cfdx/workbench.py"
          cp "diag-tools/lot3g1a_candidates/test_visualization_pipeline.py" \
             "/tmp/prhead/tests/python/test_visualization_pipeline.py"
          cp "diag-tools/lot3g1a_candidates/test_workbench.py" \
             "/tmp/prhead/tests/python/test_workbench.py"
          cp "diag-tools/lot3g1a_candidates/PHASE0_AUDIT.md" \
             "/tmp/prhead/docs/gui/PHASE0_AUDIT.md"
          git -C /tmp/prhead diff --stat

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libglu1-mesa \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CFDX with GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "/tmp/prhead[gui]"
          python -m pip install pytest ruff

      - name: Ruff check and format on the modified Python files
        working-directory: /tmp/prhead
        run: |
          set +e
          {
            echo "=== ruff check ==="
            ruff check \
              src/cfdx/python/cfdx/visualization_pipeline.py \
              src/cfdx/python/cfdx/gui_3d.py \
              src/cfdx/python/cfdx/workbench.py \
              tests/python/test_visualization_pipeline.py \
              tests/python/test_workbench.py
            echo "ruff_check_exit=$?"
            echo "=== ruff format --check ==="
            ruff format --check \
              src/cfdx/python/cfdx/visualization_pipeline.py \
              src/cfdx/python/cfdx/gui_3d.py \
              src/cfdx/python/cfdx/workbench.py \
              tests/python/test_visualization_pipeline.py \
              tests/python/test_workbench.py
            echo "ruff_format_exit=$?"
          } > "$GITHUB_WORKSPACE/diag-evidence/logs/lot3g1a_ruff_2026-10-25-lot3g1a-r2.log" 2>&1
          exit 0

      - name: Run the CI GUI regression list plus pipeline tests (long tracebacks)
        working-directory: /tmp/prhead
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest -q \
              tests/python/test_specialized_setup.py \
              tests/python/test_workbench.py \
              tests/python/test_gui_browser_widgets.py \
              tests/python/test_renderer.py \
              tests/python/test_renderer_headless_contract.py \
              tests/python/test_renderer_pyvista.py \
              tests/python/test_gui_3d.py \
              tests/python/test_visualization_pipeline.py \
              --tb=long -rA \
              > "$GITHUB_WORKSPACE/diag-evidence/logs/lot3g1a_gui_2026-10-25-lot3g1a-r2.log" 2>&1
          echo "exit_code=$?" >> "$GITHUB_WORKSPACE/diag-evidence/logs/lot3g1a_gui_2026-10-25-lot3g1a-r2.log"
          exit 0

      - name: No-Qt path check (Release job import path)
        working-directory: /tmp/prhead
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/diag-evidence/logs/lot3g1a_noqt_2026-10-25-lot3g1a-r2.log"
          python -m pip uninstall -y PySide6 PySide6_Essentials PySide6_Addons shiboken6 pyvistaqt pyvista pyqtgraph > /dev/null 2>&1
          if PYTHONPATH=src/cfdx/python python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('PySide6') is None else 1)"; then
            echo "PySide6 fully removed: yes" >> "$LOG"
          else
            echo "PySide6 fully removed: NO (uninstall incomplete)" >> "$LOG"
          fi
          PYTHONPATH=src/cfdx/python python - <<'PY' > "$LOG" 2>&1
          import cfdx.workbench
          from cfdx.workbench import CFDXWorkbenchWindow
          print("no-qt import: OK", CFDXWorkbenchWindow)
          PY
          echo "noqt_import_exit=$?" >> "$LOG"
          PYTHONPATH=src/cfdx/python python -m pytest -q --tb=long -rA \
            tests/python/test_workbench.py \
            tests/python/test_visualization_pipeline.py \
            >> "$LOG" 2>&1
          echo "noqt_pytest_exit=$?" >> "$LOG"
          exit 0

      - name: Meta (pinned refs)
        run: |
          {
            echo "pr_head=$PR_HEAD_SHA"
            echo "stamp=$STAMP"
            echo "overlay=6 G1a candidate files from diag-tools/lot3g1a_candidates/"
            echo "purpose=verify ruff, GUI pytest (7 CI GUI files + test_visualization_pipeline.py) and the no-Qt path before pushing feat/gui-lot3-editable-pipeline"
          } > "diag-evidence/logs/lot3g1a_meta_2026-10-25-lot3g1a-r2.txt"

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "diag-evidence/logs/lot3g1a_ruff_2026-10-25-lot3g1a-r2.log" \
                  "diag-evidence/logs/lot3g1a_gui_2026-10-25-lot3g1a-r2.log" \
                  "diag-evidence/logs/lot3g1a_noqt_2026-10-25-lot3g1a-r2.log" \
                  "diag-evidence/logs/lot3g1a_meta_2026-10-25-lot3g1a-r2.txt"
          git commit -m "diag: lot3 g1a candidate oracle evidence (2026-10-25-lot3g1a-r2) [ci skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/stevendaix/cfdx_dev.git" HEAD:ci/long-campaign-diagnostics
