name: PR942 fast ctest failure capture (diag)

# DIAG-ONLY — branche ci/long-campaign-diagnostics (PR #903 fermee, JAMAIS merger).
# Capture-only : AUCUNE instrumentation du code. Replique le step "Run fast CTest"
# du job "Build and test (Release)" de cfdx-ci.yml sur le head epingle de la branche
# d'integration e0fa902ad03340c17ad25909a1271f0d9777bf4c (2026-10-18 06:34Z, CONTIENT le fix stimulus 54de03db
# alpha_u=0.005) — la CI de CE head echoue encore sur test_n9_negative_diagnostics
# (annotation "Annotate failing tests" du job Fast regression, run 39104527241) :
# v2 pour capturer la sortie complete du test sur ce head :
#   configure Release + build + ctest -LE long --output-on-failure --parallel 4,
#   puis ctest --rerun-failed --output-on-failure pour la sortie COMPLETE des tests
#   en echec (messages d'assertion).
# But : identifier QUELS tests quick echouent sur le head epingle.
# Verdicts fail-closed : EVIDENCE_COMPLETE (seul vert — diagnostic, PAS un
# PASS/FAIL numerique), INCONCLUSIVE_BUILD / NO_FAILURES_REPRODUCED /
# INCONCLUSIVE_NO_FAILED_LIST / INCONCLUSIVE_RERUN_NO_OUTPUT.
# Evidence suffixee $GITHUB_RUN_ID, commitee sur la branche diag par le bot.

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/pr942_fastctest_marker.txt'
      - '.github/workflows/pr942_fastctest_failure_diag.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pr942-fastctest-diag
  cancel-in-progress: false

env:
  HEAD_SHA_PIN: e0fa902ad03340c17ad25909a1271f0d9777bf4c
  EVID: diag-evidence/logs

jobs:
  fast-ctest-diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned ref and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin integration/numerics-2026-10
          git cat-file -e "$HEAD_SHA_PIN^{commit}" \
            || { echo "::error::pinned head SHA not resolvable: $HEAD_SHA_PIN"; exit 1; }
          git merge-base --is-ancestor "$HEAD_SHA_PIN" origin/integration/numerics-2026-10 \
            || { echo "::error::pinned head is not on the integration branch: $HEAD_SHA_PIN"; exit 1; }
          git worktree add "$RUNNER_TEMP/head" "$HEAD_SHA_PIN"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "head_sha=$HEAD_SHA_PIN (pinned head of integration/numerics-2026-10, capture-only, no instrumentation)"
            echo "note: pyyaml added to the diag venv (deviation from run 1 where test_n10_qualification failed on the missing PyYAML artifact only)"
            echo "scope: replicate CI Release 'Run fast CTest' (-LE long) + rerun-failed full output"
            echo "rule: EVIDENCE_COMPLETE is a diagnostic evidence verdict, never a numerical PASS/FAIL"
          } > "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_meta_run$GITHUB_RUN_ID.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Install Python mesh/I/O stack
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic pyyaml > "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_pip_run$GITHUB_RUN_ID.log" 2>&1
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure (Release)
        run: |
          cmake -S "$RUNNER_TEMP/head" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 8 > /tmp/build_raw.log 2>&1
          rc=$?
          {
            echo "build_exit=$rc"
            echo "--- build log (tail 400) ---"
            tail -n 400 /tmp/build_raw.log
            echo "--- build errors (if any) ---"
            grep -E -B2 -A4 'error:|fatal error:|undefined reference|collect2: error|FAILED:' /tmp/build_raw.log | tail -n 120 || true
          } > "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_build_run$GITHUB_RUN_ID.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::build failed on pinned head — see evidence log"
            exit 1
          fi

      - name: Run fast CTest (replica of the CI step)
        run: |
          set +e
          ctest --test-dir build -LE long --output-on-failure --no-tests=error --parallel 4 \
            > "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_ctest_run$GITHUB_RUN_ID.log" 2>&1
          rc=$?
          set -e
          echo "ctest_exit=$rc" > "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_status_run$GITHUB_RUN_ID.txt"
          echo "ctest_exit=$rc"
          tail -n 40 "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_ctest_run$GITHUB_RUN_ID.log"

      - name: Rerun failed tests with full output
        run: |
          set +e
          ctest --test-dir build --rerun-failed --output-on-failure \
            > "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_rerun_run$GITHUB_RUN_ID.log" 2>&1
          rc=$?
          set -e
          echo "rerun_exit=$rc" >> "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_status_run$GITHUB_RUN_ID.txt"
          echo "rerun_exit=$rc"

      - name: Analyze and classify
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import sys

          run_id = os.environ["GITHUB_RUN_ID"]
          evid = os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["EVID"])
          ctest_log = os.path.join(evid, "pr942x_fastctest_ctest_run" + run_id + ".log")
          rerun_log = os.path.join(evid, "pr942x_fastctest_rerun_run" + run_id + ".log")
          status = os.path.join(evid, "pr942x_fastctest_status_run" + run_id + ".txt")

          def write_verdict(v, lines):
              path = os.path.join(evid, "pr942x_fastctest_verdict_run" + run_id + ".txt")
              with open(path, "w") as fh:
                  fh.write("verdict=" + v + "\n")
                  for line in lines:
                      fh.write(line + "\n")
              print("verdict=" + v)

          if not os.path.exists(ctest_log):
              write_verdict("INCONCLUSIVE_BUILD", ["ctest log absent (build or ctest step did not run)"])
              sys.exit(0)

          with open(ctest_log, errors="replace") as fh:
              lines = fh.read().splitlines()

          failed = []
          in_failed = False
          for line in lines:
              if line.strip().startswith("The following tests FAILED:"):
                  in_failed = True
                  continue
              if in_failed:
                  stripped = line.strip()
                  if not stripped:
                      if failed:
                          break
                      continue
                  if stripped.startswith("- "):
                      failed.append(stripped[2:].strip())

          with open(os.path.join(evid, "pr942x_fastctest_failedlist_run" + run_id + ".txt"), "w") as fh:
              for t in failed:
                  fh.write(t + "\n")

          ctest_exit = None
          if os.path.exists(status):
              with open(status) as fh:
                  for line in fh:
                      if line.startswith("ctest_exit="):
                          ctest_exit = int(line.split("=", 1)[1].strip())
                          break

          if ctest_exit == 0 and not failed:
              write_verdict("NO_FAILURES_REPRODUCED",
                            ["fast ctest PASSED on the pinned head alone —",
                             "the CI failure likely involves the merge with a moved base; rerun on refs/pull/942/merge"])
              sys.exit(0)
          if not failed:
              write_verdict("INCONCLUSIVE_NO_FAILED_LIST",
                            ["ctest_exit=" + str(ctest_exit) + " but failed list not parsed — read the raw ctest log"])
              sys.exit(0)

          rerun_text = ""
          if os.path.exists(rerun_log):
              with open(rerun_log, errors="replace") as fh:
                  rerun_text = fh.read()
          if not rerun_text.strip():
              write_verdict("INCONCLUSIVE_RERUN_NO_OUTPUT", ["rerun log empty"])
              sys.exit(0)

          write_verdict("EVIDENCE_COMPLETE", ["failed_tests=" + str(len(failed))] + failed)
          PY

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: fast ctest failure capture on integration head e0fa902a run $GITHUB_RUN_ID (evidence-only) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Post comment to PR #942 (best effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Diagnostic fast-ctest capture-only (head epingle \`$HEAD_SHA_PIN\`) : verdict \`$(cat "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_verdict_run$GITHUB_RUN_ID.txt" 2>/dev/null | head -n 1 || echo MISSING)\`."
            echo ""
            echo "\`\`\`"
            cat "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_failedlist_run$GITHUB_RUN_ID.txt" 2>/dev/null || true
            echo "\`\`\`"
            echo ""
            echo "Evidence : \`diag-evidence/logs/pr942x_fastctest_*_run$GITHUB_RUN_ID.*\` — tests quick en echec + sortie complete (rerun-failed --output-on-failure) — sur \`ci/long-campaign-diagnostics\`. DIAG-ONLY, pas un verdict numerique."
          } > /tmp/comment.txt
          gh pr comment 942 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.txt || echo "comment post failed (best effort)"

      - name: Final gate
        if: always()
        run: |
          v=$(head -n 1 "$GITHUB_WORKSPACE/$EVID/pr942x_fastctest_verdict_run$GITHUB_RUN_ID.txt" 2>/dev/null || echo "verdict=MISSING")
          echo "Final gate: $v"
          if [ "$v" != "verdict=EVIDENCE_COMPLETE" ]; then
            echo "::error::$v — see diag-evidence/logs/pr942x_fastctest_*_run$GITHUB_RUN_ID.*"
            exit 1
          fi
