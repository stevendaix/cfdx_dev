name: CFDX documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check executable theory syntax
        run: python -m compileall -q docs/theory docs/developer docs/vv
      - name: Check Jupytext percent sources
        run: |
          find docs/theory docs/developer docs/vv -name 'chapter.py' -print0 | xargs -0 -n1 python -m jupytext --test --to py:percent
      - name: Run N2 reference self-check
        working-directory: docs/theory/04-gradients-reconstruction/experiments
        run: python self_check.py
      - name: Run N2 reference study
        working-directory: docs/theory/04-gradients-reconstruction/experiments
        run: python run_gradient_study.py
      - name: Build Sphinx documentation
        run: sphinx-build -W -b html docs docs/_build/html
