name: TEMP PR1191 Ruff autofix artifact
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/tmp-pr1191-ruff-fix.yml"
permissions:
  contents: read
  actions: read
jobs:
  ruff-autofix:
    if: github.event.pull_request.number == 1191
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Format and apply safe fixes to changed Python files
        shell: bash
        run: |
          git fetch origin master
          mkdir -p /tmp/ruff-fixed
          mapfile -t files < <(git diff --name-only origin/master...HEAD -- '*.py')
          if (( ${#files[@]} == 0 )); then
            echo "No changed Python files"
            exit 0
          fi
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
          for f in "${files[@]}"; do
            mkdir -p "/tmp/ruff-fixed/$(dirname "$f")"
            cp "$f" "/tmp/ruff-fixed/$f"
          done
          ruff check "${files[@]}" > /tmp/ruff-fixed/ruff-check.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: pr1191-ruff-fixed
          path: /tmp/ruff-fixed/
          if-no-files-found: error
