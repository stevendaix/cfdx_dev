name: Ruff diagnostics (temporary)

on:
  pull_request:

jobs:
  diag:
    name: Ruff diag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: Emit findings
        run: |
          ruff --version
          files="scripts/qualify_mesh_series.py scripts/aggregate_validation_runs.py scripts/reproducibility_manifest.py tests/python/test_qualify_mesh_series.py"
          for f in $files; do
            out=$(ruff format --diff "$f" 2>&1 || true)
            size=${#out}
            if [ -n "$out" ] && ! printf '%s' "$out" | grep -q "already formatted"; then
              echo "::error title=FMT $f size=$size::$(printf '%s' "$out" | cut -c 1-700 | tr '\n' '|')"
              i=1
              while [ $i -le 7 ]; do
                chunk=$(printf '%s' "$out" | cut -c $((i*700+1))-$((i*700+700)))
                if [ -n "$chunk" ]; then
                  echo "::error title=FMT $f part $((i+1))::$(printf '%s' "$chunk" | tr '\n' '|')"
                fi
                i=$((i+1))
              done
            else
              echo "::notice title=FMT $f::formatted"
            fi
            out2=$(ruff check "$f" 2>&1 || true)
            if printf '%s' "$out2" | grep -q "All checks passed"; then
              echo "::notice title=CHECK $f::clean"
            else
              echo "::error title=CHECK $f::$(printf '%s' "$out2" | head -c 1400 | tr '\n' '|')"
            fi
          done
