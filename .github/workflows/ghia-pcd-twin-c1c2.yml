name: Ghia PCD twin C1/C2

# Jumeau #914 etape 2 : comparaison des actions PCD a flux non nul.
# Branche jamais mergee ci/long-campaign-diagnostics (PR #903).
#
# Rejoue le FGMRES externe PRODUCTION exact (solve_fgmres, restart 4096,
# budget 5000, tol 1e-10, warm x0) sur les dumps %a bit-exacts de
# diag-evidence/ghia-pcd-audit/ (run 38865832905, iteration non-lineaire 2 =
# premier regime a flux Rhie-Chow non nul), avec les VRAIS headers
# production (PcdSchurApproximation, CoupledBlockSchurAMGPreconditioner,
# ILU0Preconditioner, solve_fgmres) — zero miroir TS, budget complet 5000
# (pas de troncature a 150 comme le jumeau sandbox).
#
# Quatre actions de pression, dans l'ordre protocole :
#   Fp  : z_p = -Fp^-1 r_p          (action PROVISIONALE production)
#   C1  : z_p = -Mp^-1 Kp Fp^-1 r_p (inverse exact de S ~= -Fp Kp^-1 Mp)
#   C2  : z_p = -Mp^-1 Fp Kp^-1 r_p (ordre miroir)
#   KP1 : z_p = -Kp^-1 r_p          (inverse unique alternatif)
#
# Fail-closed : FNV-1a des 6 dumps verifie contre meta.txt avant tout solve
# (exit 3 si mismatch) ; aucun MAX_ITER imbrique accepte silencieusement
# comme converge (mirror nested_schur_pressure_solve_usable, log
# COUPLED_NESTED_PCD_BEST_EFFORT) ; ecart documente : le solve imbrique Kp
# des variantes utilise FGMRES/ILU0 512/200/1e-8 (production : GMRES/
# NativeAMG 40/100/1e-8) afin que KP1/C1/C2 partagent une seule config
# interne.
#
# Evidence commit [ci skip] : ne re-trigger ni la campagne 3 h
# (long-campaign-diagnostics.yml paths-ignore .github/workflows/** et
# diag-evidence/**) ni les autres workflows de la branche (paths filters).

on:
  push:
    branches:
      - ci/long-campaign-diagnostics
    paths:
      - '.github/workflows/ghia-pcd-twin-c1c2.yml'
      - '.github/workflows/ghia_pcd_twin_c1c2.cpp'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ghia-pcd-twin-c1c2
  cancel-in-progress: true

jobs:
  ghia-pcd-twin-c1c2:
    name: Replay iter-2 outer FGMRES with PCD actions Fp/C1/C2/KP1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libhdf5-openmpi-dev libopenmpi-dev

      - name: Compile the twin tool (production flags)
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          SRCS="src/cfdx/core/mesh/point.cpp src/cfdx/core/mesh/face.cpp src/cfdx/core/mesh/ownership.cpp src/cfdx/core/mesh/cell.cpp src/cfdx/core/mesh/mesh.cpp src/cfdx/core/mesh/boundary.cpp src/cfdx/core/geometry/face_geometry.cpp src/cfdx/core/geometry/cell_geometry.cpp src/cfdx/core/field/field.cpp src/cfdx/core/field/storage.cpp src/cfdx/core/linalg/hypre_amg.cpp"
          if ! g++ -std=c++17 -O2 -DNDEBUG -I src .github/workflows/ghia_pcd_twin_c1c2.cpp $SRCS -o /tmp/ghia_twin 2> /tmp/ghia-twin-build.log; then
            echo "::group::first build attempt log"
            cat /tmp/ghia-twin-build.log
            echo "::endgroup::"
            EXTRA=""
            for f in memory_planner gpu_kernels; do
              found=$(find src -name "${f}.cpp" 2>/dev/null | head -n 1 || true)
              [ -n "$found" ] && EXTRA="$EXTRA $found"
            done
            echo "retry with extra sources:${EXTRA:-none}"
            g++ -std=c++17 -O2 -DNDEBUG -I src .github/workflows/ghia_pcd_twin_c1c2.cpp $SRCS $EXTRA -o /tmp/ghia_twin 2>> /tmp/ghia-twin-build.log
          fi
          echo "build ok"

      - name: Run the twin (4 PCD actions, production outer solve)
        continue-on-error: true
        shell: bash
        run: |
          set -u
          set +e
          /tmp/ghia_twin diag-evidence/ghia-pcd-audit 2>&1 | tee /tmp/ghia-twin.log
          code=${PIPESTATUS[0]}
          set -e
          echo "TWIN_RUN_EXIT_CODE=$code"
          echo "TWIN_RUN_EXIT_CODE=$code" >> /tmp/ghia-twin.log
          echo "--- build log ---"
          cat /tmp/ghia-twin-build.log 2>/dev/null || true
          exit 0

      - name: Commit evidence (log) to the diagnostic branch
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diag-evidence/ghia-pcd-twin-c1c2
          cp /tmp/ghia-twin.log "diag-evidence/ghia-pcd-twin-c1c2/run-$GITHUB_RUN_ID.log" 2>/dev/null || true
          cp /tmp/ghia-twin-build.log "diag-evidence/ghia-pcd-twin-c1c2/build-$GITHUB_RUN_ID.log" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-evidence 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no evidence change to commit"
          else
            git commit -m "diag(evidence): ghia PCD twin C1/C2 run $GITHUB_RUN_ID (#914) [ci skip]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME" 2>&1; then
              echo "::warning::push failed — pulling and retrying"
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
          exit 0

      - name: Upload twin artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghia-pcd-twin-c1c2-${{ github.run_id }}
          path: |
            /tmp/ghia-twin.log
            /tmp/ghia-twin-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Post twin summary to issue #914 (best effort)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          {
            echo "## Jumeau C1/C2 — actions PCD a flux non nul (iter 2) — run $GITHUB_RUN_ID"
            echo
            echo "HEAD diagnostic : $GITHUB_SHA"
            echo "Outil : .github/workflows/ghia_pcd_twin_c1c2.cpp (headers production, flags g++ -std=c++17 -O2 -DNDEBUG, outer FGMRES 4096/5000/1e-10 warm x0, budget complet — pas de troncature)"
            echo "Dumps : diag-evidence/ghia-pcd-audit/ (run 38865832905, FNV verifies avant solve)"
            echo "Actions : Fp = -Fp^-1 (production) ; C1 = -Mp^-1 Kp Fp^-1 ; C2 = -Mp^-1 Fp Kp^-1 ; KP1 = -Kp^-1"
            echo
            echo '~~~'
            grep -E 'TWIN_CHECKSUM|TWIN_DIMS|TWIN_GAUGE|TWIN_MP_DIAG|TWIN_VARIANT|TWIN_INNER|TWIN_SUMMARY|TWIN_EXIT_CODE|TWIN_RUN_EXIT_CODE|TWIN_PARSE_FAIL|TWIN_SETUP_FAIL' /tmp/ghia-twin.log 2>/dev/null || true
            echo "--- COUPLED_NESTED_PCD_BEST_EFFORT (max 60 lignes) ---"
            grep -E 'COUPLED_NESTED_PCD_BEST_EFFORT' /tmp/ghia-twin.log 2>/dev/null | head -n 60 || true
            echo '~~~'
          } > /tmp/comment.md 2>/dev/null || true
          if [ ! -s /tmp/comment.md ]; then echo "(log vide)" > /tmp/comment.md; fi
          jq -n --rawfile body /tmp/comment.md '{body: $body}' > /tmp/payload.json 2>/dev/null || true
          http=$(curl -sS --fail-with-body -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/914/comments" \
            -d @/tmp/payload.json) || http=failed
          echo "POST to #914: $http"
          exit 0

      - name: Verdict (red if a checksum mismatched or a variant did not complete)
        if: always()
        shell: bash
        run: |
          set -u
          fail=""
          if ! grep -q "TWIN_RUN_EXIT_CODE=0" /tmp/ghia-twin.log 2>/dev/null; then
            fail="run exit code"
          fi
          if ! grep -q "TWIN_SUMMARY variants=4 all_completed=1" /tmp/ghia-twin.log 2>/dev/null; then
            fail="$fail incomplete-variants"
          fi
          n_ok=$(grep -c "TWIN_CHECKSUM .* ok=1" /tmp/ghia-twin.log 2>/dev/null); n_ok=${n_ok:-0}
          if [ "$n_ok" -ne 6 ] || grep -q "TWIN_CHECKSUM .* ok=0" /tmp/ghia-twin.log 2>/dev/null; then
            fail="$fail checksum"
          fi
          if [ -n "$fail" ]; then
            echo "::error::twin FAILED ($fail) — see diag-evidence/ghia-pcd-twin-c1c2/run-$GITHUB_RUN_ID.log"
            exit 1
          fi
          echo "twin PASS: 4 variantes completees, checksums 6/6"
