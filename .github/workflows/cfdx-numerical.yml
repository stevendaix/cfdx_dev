name: CFDX numerical maturity

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: cfdx-numerical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  numerical:
    name: ${{ matrix.level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { level: N1, regex: '^(test_spatial_scheme_contract|test_case_numerics_report|test_case_hdf5_io|test_production_solver_numerics_e2e)$' }
          - { level: N2, regex: '^(test_gradient|test_gradient_verification|test_polyhedral_gradient_campaign)$' }
          - { level: N3, regex: '^(test_laplacian|test_diffusion_diagnostics|test_nonorthogonal_skew_campaign|test_nonorthogonal_laplacian_campaign|test_polyhedral_laplacian_campaign)$' }
          - { level: N4, regex: '^(test_convection_scheme_verification|test_convection_3d_verification|test_convection_blending|test_convection_polyhedral_campaign|test_convection_solver_qualification)$' }
          - { level: N5, regex: '^(test_temporal_physics|test_temporal_history|test_temporal_order_matrix|test_transient_mms|test_transient_mms_closure)$' }
          - { level: N6, regex: '^(test_adaptive_cfl|test_timestep_control|test_local_time_stepping)$' }
          - { level: N7, regex: '^(test_solver_control|test_simulation_controller|test_newton_field)$' }
          - { level: N8, regex: '^(test_cg_solver|test_bicgstab_solver|test_gmres_solver|test_krylov_preconditioning|test_amg_chebyshev|test_amg_preconditioner_qualification|test_advanced_preconditioners|test_schur_preconditioner|test_schur_infrastructure|test_exact_schur|test_simplerc_schur|test_mgr_preconditioner|test_coupled_block_schur_amg)$' }
          - { level: N9, regex: '^(test_phase9_acceptance|test_couette_quick|test_level_c_coupled_verification|test_m2_m4_solver_validation)$' }
          - { level: N10, regex: '^(test_mesh_quality|test_mesh_family_volumes|test_geometry_invariants|test_nonorthogonal_skew_campaign|test_convection_polyhedral_campaign)$' }
          - { level: N11, regex: '^(test_conservation_boundedness|test_transport_conservation|test_conservation_assembly)$' }
          - { level: N12, regex: '^(test_mms_scalar_diffusion|test_discretization_verification|test_transient_mms|test_transient_mms_closure)$' }
          - { level: N13, regex: '^(test_mpi_deterministic|test_matrix_free_fv_operator|test_restart_mapping|test_phase8_mpi_poisson)$' }
          - { level: N14, regex: '^(test_fluent_vmfl_reference|test_benchmark_matrix|test_cross_import_equivalence)$' }
          - { level: N15, regex: '^(test_performance_foundations|test_performance_runtime|test_phase6_memory_benchmark)$' }
          - { level: N16, regex: '^$' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCFDX_BUILD_TESTS=ON             -DCFDX_ENABLE_LONG_VALIDATION=OFF             -DCFDX_ENABLE_MPI=ON             -DCFDX_USE_HDF5_SERIAL=OFF

      - name: Build numerical test suite
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --parallel 4 --verbose 2>&1 | tee build.log

      - name: Run ${{ matrix.level }} tests
        id: level_tests
        if: steps.build.outcome == 'success' && matrix.level != 'N16'
        continue-on-error: true
        run: |
          ctest --test-dir build             -R '${{ matrix.regex }}'             --output-on-failure             --no-tests=error

      - name: Validate deferred N16 scope
        id: n16_scope
        if: steps.build.outcome == 'success' && matrix.level == 'N16'
        run: |
          python3 scripts/validate_numerical_maturity_audit.py             docs/validation/NUMERICAL_METHOD_MATURITY_AUDIT.json             docs/validation/NUMERICAL_METHOD_REQUIREMENTS_AUDIT.json
          echo "N16 has no mandatory executable gate: advanced methods remain explicitly deferred by the maturity audit."

      - name: Diagnostics
        if: always()
        run: |
          echo "level=${{ matrix.level }}"
          echo "build=${{ steps.build.outcome }}"
          echo "tests=${{ steps.level_tests.outcome }}"
          echo "n16_scope=${{ steps.n16_scope.outcome }}"
          if [[ -f build.log ]]; then
            grep -E -B2 -A4 'error:|fatal error:|undefined reference|collect2: error|FAILED:' build.log | tail -n 150 || true
          fi
          if [[ -f build/Testing/Temporary/LastTest.log ]]; then
            tail -n 350 build/Testing/Temporary/LastTest.log
          fi

      - name: Upload ${{ matrix.level }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-${{ matrix.level }}-evidence
          path: |
            build/Testing/
            build/**/*.log
            build.log
          if-no-files-found: ignore

      - name: Final ${{ matrix.level }} gate
        if: always()
        run: |
          if [[ "${{ steps.build.outcome }}" != "success" ]]; then
            echo "${{ matrix.level }}: FAIL (build)"
            exit 1
          fi
          if [[ "${{ matrix.level }}" == "N16" ]]; then
            [[ "${{ steps.n16_scope.outcome }}" == "success" ]] || exit 1
          else
            [[ "${{ steps.level_tests.outcome }}" == "success" ]] || exit 1
          fi
          echo "${{ matrix.level }}: PASS"
