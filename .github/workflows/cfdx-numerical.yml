          echo "N16 has no mandatory executable gate: advanced methods remain explicitly deferred by the maturity audit."

      - name: Final N16 gate
        if: always()
        run: |
          [[ "${{ steps.n16_scope.outcome }}" == "success" ]] || exit 1
          echo "N16: PASS"
|test_n8_amg_anisotropy_scaling)
          - { level: N9, regex: '^(test_n9_schur_oracle|test_steady_incompressible_solver|test_phase9_acceptance|test_couette_quick|test_level_c_coupled_verification|test_m2_m4_solver_validation)$' }
