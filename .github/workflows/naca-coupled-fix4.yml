name: NACA0012 COUPLED operator observability (fix4)

# DIAG (temporary branch, never merged): fourth COUPLED round. fix3 PROVED
# the stall is a PLATEAU, not a crawl: with a 5000-iteration stagnation
# window the baseline freezes at momentum_residual_relative ~1.11569e-7
# (0.6/0.25) / 2.71784e-7 (1.0/1.0) over 5000+ iterations while fields sit
# at machine-level changes (dU ~1e-15) and continuity passes at 8.4e-14;
# deferred non-orthogonal sweeps change NOTHING, so the lag hypothesis is
# refuted. What fix3 could NOT tell us is WHICH criterion actually fails and
# whether the assembled coupled pressure-gradient operator matches the
# independent Gauss gradient of the final momentum audit. fix4 is strictly
# observability, per the review directive: NO equation, NO gate, NO
# tolerance is touched.
#   * P1 trace: INCOMPRESSIBLE_ITER now prints all three momentum metrics
#     (rhs-normalized momentum_residual, absolute
#     momentum_equation_residual, iteration-1-relative
#     momentum_residual_relative), the reference and rhs scales, the worst
#     residual component, and the per-criterion gate verdicts
#     gates=mom:?,momrel:?,pres:?,dU:?,dp:?. The previously displayed metric
#     was only the iteration-1-relative one, which cannot distinguish an
#     absolute plateau from a reference-scale effect.
#   * P2 operator probe (--opprobe 1): COUPLED_OPERATOR_PROBE compares, per
#     momentum row, the pressure force the coupled system actually assembled
#     (A*p + recorded Dirichlet boundary displacements) with the INDEPENDENT
#     gauss_gradient_with_boundary on the same solved pressure, and reports
#     the true block residual max|Ax-b| before and after Picard relaxation.
#   * P2 unit gate: tests/validation/test_coupled_pressure_operator_equivalence.cpp
#     fails loudly unless the operator identity holds at round-off level
#     (tolerance tied to eps and the force scale, never calibrated) on a
#     deliberately skewed two-cell mesh with Dirichlet, zero-gradient and
#     interior faces all exercised.
#   * P3 diagnostic fix: worst_momentum_patch no longer attributes the worst
#     residual to EMPTY 2D patches ('front'/'back' voids); the dominant
#     component is printed instead.
# Matrix (n64 only): baseline-probe (0.6/0.25) and undamped-probe (1.0/1.0)
# both run with the default stagnation window, so they stop at the ~74
# iteration plateau and the probe reports the FROZEN fixed point. They fail
# the strict convergence guard BY DESIGN (documented behavioural anchor:
# STAGNATED is not CONVERGED). The operator-equivalence unit job must PASS.
# Gates unchanged.

on:
  workflow_dispatch:
  push:
    branches: [diag/naca-coupled-fix4]
    # DIAG (fix4): ignore pushes that only touch diagnostic bookkeeping
    # (committed logs, summaries, or this workflow file itself). Code
    # pushes (src/tests/scripts/cmake) still trigger the full matrix.
    # No gate, tolerance or matrix entry is affected by this filter.
    paths-ignore:
      - 'naca-coupled-fix4-output.log'
      - 'naca-coupled-fix4-summary.log'
      - '.github/workflows/naca-coupled-fix4.yml'
      - '.github/workflows/naca-coupled-fix4-summary.yml'

permissions:
  contents: write

jobs:
  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: coupled-baseline-probe, model: COUPLED_BLOCKLOCAL, au: "0.6", ap: "0.25", levels: "1", trace: "1", cd: "1", op: "1" }
          - { name: coupled-undamped-probe, model: COUPLED_BLOCKLOCAL, au: "1.0", ap: "1.0",  levels: "1", trace: "1", cd: "1", op: "1" }
          - { name: simple-anchor-control,  model: SIMPLE,             au: "0.6", ap: "0.25", levels: "1", trace: "1", cd: "0", op: "0" }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-naca
          .venv-naca/bin/python -m pip install --upgrade pip
          .venv-naca/bin/python -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh

      - name: Generate NACA0012 O-grid meshes (n64/n128/n256)
        run: |
          mkdir -p build-naca/validation_meshes
          .venv-naca/bin/python scripts/generate_2d_validation_meshes.py naca0012 \
            --output-dir build-naca/validation_meshes

      - name: Configure (Release, long validation ON)
        run: |
          cmake -S . -B build-naca -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/.venv-naca/bin/python"

      - name: Build test_naca0012_qualification
        run: cmake --build build-naca --target test_naca0012_qualification --parallel 2

      - name: Run variant ${{ matrix.name }}
        run: |
          set -o pipefail
          ./build-naca/test_naca0012_qualification \
            --model ${{ matrix.model }} \
            --alphau ${{ matrix.au }} \
            --alphap ${{ matrix.ap }} \
            --levels ${{ matrix.levels }} \
            --trace ${{ matrix.trace }} \
            --coupleddiag ${{ matrix.cd }} \
            --opprobe ${{ matrix.op }} \
            build-naca/validation_meshes/naca0012_laminar_n64.h5 \
            build-naca/validation_meshes/naca0012_laminar_n128.h5 \
            build-naca/validation_meshes/naca0012_laminar_n256.h5 \
            2>&1 | tee naca-variant-${{ matrix.name }}.log

      - name: Enforce convergence gates
        if: success()
        env:
          EXPECTED_LEVELS: ${{ matrix.levels }}
          VARIANT_LOG: naca-variant-${{ matrix.name }}.log
        run: |
          set -euo pipefail
          awk -v expected="$EXPECTED_LEVELS" '
            /NACA_DIAG status=/ {
              count++
              if ($0 !~ /NACA_DIAG status=CONVERGED converged=1/) {
                print "NUMERICAL_GATE_FAIL: " $0 > "/dev/stderr"
                bad=1
              }
            }
            END {
              if (count != expected) {
                printf "NUMERICAL_GATE_FAIL: expected %d level verdicts, found %d\n", expected, count > "/dev/stderr"
                bad=1
              }
              exit bad
            }
          ' "$VARIANT_LOG"

      - name: Upload variant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naca-variant-logs-${{ matrix.name }}
          path: naca-variant-${{ matrix.name }}.log
          if-no-files-found: warn

  operator-equivalence:
    name: coupled pressure-operator equivalence unit gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Configure (Release)
        run: |
          cmake -S . -B build-op -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build and run test_coupled_pressure_operator_equivalence
        run: |
          set -o pipefail
          cmake --build build-op --target test_coupled_pressure_operator_equivalence --parallel 2
          ./build-op/test_coupled_pressure_operator_equivalence 2>&1 | tee operator-equivalence.log

      - name: Upload unit gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naca-variant-logs-operator-equivalence-unit
          path: operator-equivalence.log
          if-no-files-found: warn

  aggregate:
    name: Aggregate and commit combined log
    needs: [variant, operator-equivalence]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all variant logs
        uses: actions/download-artifact@v4
        with:
          path: variant-logs
          pattern: naca-variant-logs-*
          merge-multiple: true

      - name: Assemble combined log
        run: |
          : > naca-coupled-fix4-output.log
          for v in coupled-baseline-probe coupled-undamped-probe simple-anchor-control; do
            if [ -f "variant-logs/naca-variant-$v.log" ]; then
              echo "NACA_VARIANT_BEGIN $v" >> naca-coupled-fix4-output.log
              cat "variant-logs/naca-variant-$v.log" >> naca-coupled-fix4-output.log
              echo "NACA_VARIANT_END $v" >> naca-coupled-fix4-output.log
            else
              echo "NACA_VARIANT_MISSING variant=$v" >> naca-coupled-fix4-output.log
            fi
          done
          if [ -f "variant-logs/operator-equivalence.log" ]; then
            echo "NACA_VARIANT_BEGIN operator-equivalence-unit" >> naca-coupled-fix4-output.log
            cat "variant-logs/operator-equivalence.log" >> naca-coupled-fix4-output.log
            echo "NACA_VARIANT_END operator-equivalence-unit" >> naca-coupled-fix4-output.log
          else
            echo "NACA_VARIANT_MISSING variant=operator-equivalence-unit" >> naca-coupled-fix4-output.log
          fi
          echo "AGGREGATE_SECTIONS=$(grep -c 'NACA_VARIANT_BEGIN' naca-coupled-fix4-output.log)/4" >> naca-coupled-fix4-output.log

      - name: Commit combined log to diagnostic branch (fail loudly)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naca-coupled-fix4-output.log
          if git diff --cached --quiet; then
            echo "AGGREGATE_ERROR: nothing staged to commit" >&2
            exit 1
          fi
          git commit -m "diag(naca0012): capture COUPLED fix4 matrix log [skip ci]"
          git pull --rebase --autostash
          git push
          git show HEAD:naca-coupled-fix4-output.log > /dev/null
          echo "AGGREGATE_OK: log committed on $(git rev-parse HEAD)"
