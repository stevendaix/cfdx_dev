name: PR1066 round 2 candidate verify oracle (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/pr1066_round2_marker.txt'
      - '.github/workflows/pr1066-round2-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle:
    name: ruff-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVID: diag-evidence/logs
      PR_BASE: 2a5052a41d80de5fff3c43008d490d3b2fc6a418
      PR_HEAD: 38638dbebea4e1b1ed197579b061f83ae9c9e5de
      STAMP: 2026-10-23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned PR refs and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin "$PR_BASE" "$PR_HEAD"
          git worktree add "$RUNNER_TEMP/ref" "$PR_HEAD"
          cd "$RUNNER_TEMP/ref"
          git log -1 --format='%H %s' | tee "$GITHUB_WORKSPACE/$EVID/pr1066_round2_head_$STAMP.txt"

      - name: Overlay candidate files onto pinned PR head worktree
        run: |
          CAND="$GITHUB_WORKSPACE/diag-tools/pr1066_candidate"
          cp "$CAND/selection.py" "$RUNNER_TEMP/ref/src/cfdx/python/cfdx/selection.py"
          cp "$CAND/test_gui_browser_widgets.py" "$RUNNER_TEMP/ref/tests/python/test_gui_browser_widgets.py"
          cp "$CAND/test_selection.py" "$RUNNER_TEMP/ref/tests/python/test_selection.py"
          cd "$RUNNER_TEMP/ref"
          git status --short | tee "$GITHUB_WORKSPACE/$EVID/pr1066_round2_overlay_$STAMP.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff (same as CI Pre-commit job)
        run: |
          python -m pip install --upgrade pre-commit ruff
          {
            echo "ruff: $(ruff --version)"
            echo "pre-commit: $(pre-commit --version)"
            echo "python: $(python --version)"
          } | tee "$GITHUB_WORKSPACE/$EVID/pr1066_round2_versions_$STAMP.txt"

      - name: Verify candidates pass ruff and full pre-commit (CI conditions)
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/ref"
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          {
            echo "== ruff check (candidates) =="
            ruff check --no-cache $python_files 2>&1 && echo "RUFF_CHECK_GREEN" || echo "RUFF_CHECK_RED"
            echo "== ruff format --check (candidates) =="
            ruff format --check --no-cache $python_files 2>&1 && echo "RUFF_FORMAT_GREEN" || echo "RUFF_FORMAT_RED"
            echo "== full pre-commit run (candidates) =="
            pre-commit run --files $python_files 2>&1 && echo "PRECOMMIT_GREEN" || echo "PRECOMMIT_RED"
          } | tee "$GITHUB_WORKSPACE/$EVID/pr1066_round2_verify_$STAMP.log"

      - name: Write meta
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "pr=1066"
            echo "pr_head=$PR_HEAD"
            echo "pr_base=$PR_BASE"
            echo "phase=2-candidate-verify"
            echo "ci_failure_run=40026658138"
          } > "$E/pr1066_round2_meta_$STAMP.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: PR 1066 round 2 candidate verify evidence (2026-10-23) [ci skip]"
            (git push || (git pull --rebase && git push))
          fi
