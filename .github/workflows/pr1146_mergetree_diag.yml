name: PR 1146 mergetree conflict oracle v3 (diag)

# DIAG-ONLY - branche ci/long-campaign-diagnostics (PR #903, JAMAIS merger).
# Oracle evidence-only : liste EXACTE des conflits entre le head 002aa348 de la
# PR #1146 et master 2bd250ac. Steps separes + set -x : chaque etape commet son
# evidence pour rendre tout echec lisible. Aucun build, aucun push de branche PR.
on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - '.github/workflows/pr1146_mergetree_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1146-mergetree-diag
  cancel-in-progress: false

env:
  EVID: diag-evidence/logs
  PR1146_HEAD: 002aa3480306b7ca78be5d58b95334ad1eabf4ae
  PR1146_BRANCH: fix/p0-p1-physical-guards-wall-forces
  MASTER_PIN: 2bd250ac484aba637f58b2499ad4168bc01b9f63

jobs:
  mergetree:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Meta (commit early)
        run: |
          mkdir -p "$EVID"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "pr1146_head=$PR1146_HEAD"
            echo "master_pin=$MASTER_PIN"
          } > "$EVID/pr1146_mt_meta_run$GITHUB_RUN_ID.txt"

      - name: Fetch refs (trace)
        run: |
          set -x
          git remote -v
          git fetch origin master || echo "fetch master rc=$?"
          git fetch origin "$PR1146_BRANCH" || echo "fetch branch rc=$?"
          git rev-parse "$PR1146_HEAD" || echo "head unresolvable rc=$?"
          git rev-parse origin/master || echo "origin/master unresolvable rc=$?"
          git rev-parse "$PR1146_BRANCH" || echo "branch unresolvable rc=$?"
          set +x

      - name: Commit meta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          git diff --cached --quiet || (git commit -m "diag: pr1146 mergetree meta run $GITHUB_RUN_ID [ci skip]" && git push origin "HEAD:$GITHUB_REF_NAME")

      - name: Merge probe (trace, evidence)
        run: |
          set -x
          rm -rf /tmp/pr1146_wt
          git worktree add --detach /tmp/pr1146_wt "$PR1146_HEAD"
          cd /tmp/pr1146_wt
          git config user.name "oracle-diag-bot"
          git config user.email "oracle-diag-bot@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff "$MASTER_PIN" > /tmp/merge.log 2>&1
          rc=$?
          set -e
          {
            echo "merge_exit=$rc"
            echo "== conflicted files =="
            git status --porcelain | grep -E '^(UU|AA|DU|UD|AU|UA|DD)' || echo "(none)"
            echo "== merge log tail =="
            tail -n 40 /tmp/merge.log
          } > "$GITHUB_WORKSPACE/$EVID/pr1146_mt_conflicts_run$GITHUB_RUN_ID.txt"
          for f in $(git diff --name-only --diff-filter=U); do
            echo "==== $f ====" >> "$GITHUB_WORKSPACE/$EVID/pr1146_mt_conflicts_run$GITHUB_RUN_ID.txt"
            grep -n -B 2 -A 12 '^<<<<<<<' "$f" | head -n 200 >> "$GITHUB_WORKSPACE/$EVID/pr1146_mt_conflicts_run$GITHUB_RUN_ID.txt" || true
          done
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/pr1146_wt || true

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          git diff --cached --quiet || (git commit -m "diag: pr1146 mergetree run $GITHUB_RUN_ID (evidence-only) [ci skip]" && git push origin "HEAD:$GITHUB_REF_NAME")
