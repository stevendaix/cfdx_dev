name: CFDX GUI CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_opengl_smoke:
        description: "Run the controlled PyVistaQt/OpenGL smoke test"
        required: false
        default: false
        type: boolean

concurrency:
  group: cfdx-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui:
    name: GUI / Qt / PyVista (headless)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libglu1-mesa \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CFDX with GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"
          python -m pip install pytest

      - name: Verify GUI runtime imports
        run: |
          python - <<'PY'
          import PySide6
          import pyqtgraph
          import pyvista
          import pyvistaqt
          print("GUI runtime imports: OK")
          PY

      - name: Run Qt/PyVista headless regression
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest -q \
              tests/python/test_specialized_setup.py \
              tests/python/test_workbench.py \
              tests/python/test_gui_browser_widgets.py \
              tests/python/test_renderer.py \
              tests/python/test_renderer_headless_contract.py \
              tests/python/test_renderer_pyvista.py \
              tests/python/test_gui_3d.py


      - name: Run controlled OpenGL smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_opengl_smoke == true
        env:
          QT_QPA_PLATFORM: xcb
          CFDX_RUN_PYVISTA_QT_SMOKE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24"             python -m pytest -q tests/python/test_gui_3d.py -k smoke
