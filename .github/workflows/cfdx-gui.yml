name: CFDX GUI CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_opengl_smoke:
        description: "Run the controlled PyVistaQt/OpenGL smoke test"
        required: false
        default: false
        type: boolean

concurrency:
  group: cfdx-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui:
    name: GUI / Qt / PyVista (headless)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libglu1-mesa \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CFDX with GUI dependencies
        id: install_gui
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"
          python -m pip install pytest

      - name: Verify GUI runtime imports
        run: |
          python - <<'PY'
          import PySide6
          import pyqtgraph
          import pyvista
          import pyvistaqt
          print("GUI runtime imports: OK")
          PY

      - name: Verify Workbench import resolution outside repository
        run: |
          cd /tmp
          python - <<'PY'
          import os
          from pathlib import Path

          import cfdx
          from cfdx.workbench import CFDXWorkbenchWindow

          expected_package_root = (
              Path(os.environ["GITHUB_WORKSPACE"]) / "src" / "cfdx" / "python" / "cfdx"
          ).resolve()
          actual_package_file = Path(cfdx.__file__).resolve()
          try:
              actual_package_file.relative_to(expected_package_root)
          except ValueError as exc:
              raise AssertionError(
                  "Imported cfdx from an unexpected location: "
                  f"{actual_package_file}; expected package under {expected_package_root}"
              ) from exc

          assert callable(CFDXWorkbenchWindow), "Workbench class is not importable"
          print(f"Workbench import resolution: OK ({actual_package_file})")
          PY

      - name: Run Qt/PyVista headless regression
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest -q \
              tests/python/test_specialized_setup.py \
              tests/python/test_workbench.py \
              tests/python/test_gui_browser_widgets.py \
              tests/python/test_renderer.py \
              tests/python/test_renderer_headless_contract.py \
              tests/python/test_renderer_pyvista.py \
              tests/python/test_gui_3d.py

      - name: Capture Workbench screenshot
        if: always() && steps.install_gui.outcome == 'success'
        env:
          QT_QPA_PLATFORM: xcb
          PYTHONPATH: ${{ github.workspace }}/src/cfdx/python
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python scripts/capture_workbench_screenshot.py \
              --output artifacts/cfdx-workbench.png

      - name: Upload Workbench screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-workbench-screenshot
          path: artifacts/cfdx-workbench.png
          if-no-files-found: warn
          retention-days: 14

      - name: Run controlled OpenGL smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_opengl_smoke == true
        env:
          QT_QPA_PLATFORM: xcb
          CFDX_RUN_PYVISTA_QT_SMOKE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest -q tests/python/test_gui_3d.py -k smoke

  production-e2e:
    name: Production solver / Workbench E2E
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin \
            xvfb libgl1-mesa-dri libgl1-mesa-dev libglu1-mesa \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CFDX with GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"
          python -m pip install pytest h5py meshio

      - name: Build production solver
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=OFF
          cmake --build build --target cfdx_production_solver --parallel 4

      - name: Run production solver through Workbench
        env:
          QT_QPA_PLATFORM: xcb
          CFDX_PRODUCTION_SOLVER: ${{ github.workspace }}/build/cfdx_production_solver
          CFDX_PRODUCTION_MESH: ${{ github.workspace }}/tests/data/cavity_with_patches.msh
          PYTHONPATH: ${{ github.workspace }}/src/cfdx/python
        run: |
          test -x "$CFDX_PRODUCTION_SOLVER"
          test -f "$CFDX_PRODUCTION_MESH"
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest -q tests/python/test_gui_production_solver_e2e.py
