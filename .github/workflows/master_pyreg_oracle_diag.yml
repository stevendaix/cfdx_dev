name: Master 474b7c95 pyreg oracle (diag)

on:
  push:
    branches:
      - 'diag/pyreg-master-474b7c95'
    paths:
      - 'diag-tools/master_pyreg_marker.txt'
      - '.github/workflows/master_pyreg_oracle_diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle:
    name: pyreg-full-build-474b7c95
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      EVID: diag-evidence/logs
      REF_BAD: 474b7c954b6ae2ef42a030e69ccfdc517d779d33
      STAMP: 2026-11-06
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv

      - name: Set up Python stack (identical to CI Release Python regression)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "meshio[all]" h5py pytest gmsh pydantic scipy ansys-fluent-core "ansys-units>=0.12.1,<0.16"
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          "$RUNNER_TEMP/venv/bin/python" -c "import importlib.util as u; print('PySide6 installed:', u.find_spec('PySide6') is not None)" | tee "$GITHUB_WORKSPACE/$EVID/master_pyreg_env_$STAMP.txt"

      - name: Build Release binaries at pinned PR head
        run: |
          git fetch origin "$REF_BAD"
          git worktree add "$RUNNER_TEMP/ref-bad" "$REF_BAD"
          ( cd "$RUNNER_TEMP/ref-bad" && \
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=OFF -DCFDX_ENABLE_LONG_VALIDATION=OFF > "$GITHUB_WORKSPACE/$EVID/master_pyreg_configure_$STAMP.log" 2>&1 && \
            cmake --build build --target cfdx_production_solver cfdx_thermal_solver --parallel 8 > "$GITHUB_WORKSPACE/$EVID/master_pyreg_build_$STAMP.log" 2>&1 )
          ls -la "$RUNNER_TEMP/ref-bad/build/cfdx_production_solver" "$RUNNER_TEMP/ref-bad/build/cfdx_thermal_solver" | tee -a "$GITHUB_WORKSPACE/$EVID/master_pyreg_build_$STAMP.log"

      - name: Run full Python regression at PR head (CI-identical env)
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          VP="$RUNNER_TEMP/venv/bin/python"
          ( cd "$RUNNER_TEMP/ref-bad" && \
            export CFDX_PRODUCTION_SOLVER="$RUNNER_TEMP/ref-bad/build/cfdx_production_solver" && \
            export CFDX_THERMAL_SOLVER="$RUNNER_TEMP/ref-bad/build/cfdx_thermal_solver" && \
            export PYTHONPATH="$RUNNER_TEMP/ref-bad/src/cfdx/python" && \
            "$VP" -m pytest -q tests/python --tb=no > "$E/master_pyreg_full_474b7c95_$STAMP.log" 2>&1 ; \
            echo "exit_code=$?" >> "$E/master_pyreg_full_474b7c95_$STAMP.log" )
          grep -E "^(FAILED|ERROR)" "$E/master_pyreg_full_474b7c95_$STAMP.log" | sort > "$E/master_pyreg_bad_failed_$STAMP.txt" || true
          {
            echo "=== failures on $REF_BAD (master Release pyreg exit 1, job 127818993511) ==="
            cat "$E/master_pyreg_bad_failed_$STAMP.txt"
            echo "=== tail of the pytest log ==="
            tail -n 60 "$E/master_pyreg_full_474b7c95_$STAMP.log"
          } | tee "$E/master_pyreg_diff_$STAMP.txt"

      - name: Rerun failing tests with tracebacks
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          VP="$RUNNER_TEMP/venv/bin/python"
          FAILED_LIST="$E/master_pyreg_bad_failed_$STAMP.txt"
          if [ -s "$FAILED_LIST" ]; then
            TESTS=$(sed -E 's/^FAILED ([^ ]+) - .*$/\1/' "$FAILED_LIST" | sort -u | tr '\n' ' ')
            ( cd "$RUNNER_TEMP/ref-bad" && \
              export CFDX_PRODUCTION_SOLVER="$RUNNER_TEMP/ref-bad/build/cfdx_production_solver" && \
              export CFDX_THERMAL_SOLVER="$RUNNER_TEMP/ref-bad/build/cfdx_thermal_solver" && \
              export PYTHONPATH="$RUNNER_TEMP/ref-bad/src/cfdx/python" && \
              "$VP" -m pytest -q $TESTS --tb=long -vv > "$E/master_pyreg_tb_474b7c95_$STAMP.log" 2>&1 ; \
              echo "exit_code=$?" >> "$E/master_pyreg_tb_474b7c95_$STAMP.log" )
          else
            echo "no failing tests to rerun" > "$E/master_pyreg_tb_474b7c95_$STAMP.log"
          fi

      - name: Write meta
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "target=master 474b7c95 Release python regression (job 127818993511, step Run Python regression, exit 1)"
            echo "ref_bad=$REF_BAD (master head 2026-11-06, squash merge of #1166)"
            echo "env=CFDX_PRODUCTION_SOLVER + CFDX_THERMAL_SOLVER + PYTHONPATH, identical to cfdx-ci.yml Run Python regression"
            echo "pytest=-q tests/python --tb=no; traceback rerun: --tb=long -vv"
          } > "$E/master_pyreg_meta_$STAMP.txt"

      - name: Publish evidence to dedicated branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: master 474b7c95 full pyreg oracle evidence (2026-11-06) [ci skip]"
            git push --force origin HEAD:refs/heads/diag-evidence/master-474b7c95-pyreg
          fi
