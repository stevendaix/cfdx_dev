name: PR1106 GUI test failure diagnosis oracle (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/pr1106_gui_marker.txt'
      - '.github/workflows/pr1106-gui-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle:
    name: gui-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EVID: diag-evidence/logs
      PR_BASE: e9ed6f3317b90a88cfbfbb356a0cedc35c3b6d3d
      PR_HEAD: aa06b7a45dae39c9c7533c5612ccb5cc009c19e9
      STAMP: 2026-10-24-g4r1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned PR refs and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin "$PR_BASE" "$PR_HEAD"
          git worktree add "$RUNNER_TEMP/ref" "$PR_HEAD"
          cd "$RUNNER_TEMP/ref"
          git log -1 --format='%H %s' | tee "$GITHUB_WORKSPACE/$EVID/pr1106_gui_head_$STAMP.txt"

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libglu1-mesa \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CFDX with GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/ref[gui]"
          python -m pip install pytest

      - name: Run Qt/PyVista headless regression with full tracebacks
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          cd "$RUNNER_TEMP/ref"
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest -q --tb=long \
              tests/python/test_workbench.py \
              tests/python/test_capabilities.py \
              tests/python/test_edit_history.py \
              tests/python/test_application_properties.py \
              tests/python/test_specialized_setup.py \
              tests/python/test_gui_browser_widgets.py \
              tests/python/test_renderer.py \
              tests/python/test_renderer_headless_contract.py \
              tests/python/test_renderer_pyvista.py \
              tests/python/test_gui_3d.py \
              > "$GITHUB_WORKSPACE/$EVID/pr1106_gui_pytest_$STAMP.log" 2>&1
          echo "pytest exit code: $?" >> "$GITHUB_WORKSPACE/$EVID/pr1106_gui_pytest_$STAMP.log"

      - name: Write meta
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "pr=1106"
            echo "pr_head=$PR_HEAD"
            echo "pr_base=$PR_BASE"
            echo "phase=g4-gui-diagnose-round1"
            echo "ci_failure_job=GUI / Qt / PyVista (headless)"
          } > "$E/pr1106_gui_meta_$STAMP.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: PR 1106 GUI diagnosis evidence (2026-10-24) [ci skip]"
            (git push || (git pull --rebase && git push))
          fi
