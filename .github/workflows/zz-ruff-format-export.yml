name: Temporary Ruff formatter export

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Apply safe Ruff fixes and format changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "${BASE_SHA}...HEAD" -- '*.py')
          if (("${#files[@]}" == 0)); then
            echo "No changed Python files"
            exit 0
          fi
          ruff check --fix --exit-zero "${files[@]}"
          ruff format "${files[@]}"
          mkdir -p /tmp/ruff-formatted
          for file in "${files[@]}"; do
            mkdir -p "/tmp/ruff-formatted/$(dirname "$file")"
            cp "$file" "/tmp/ruff-formatted/$file"
          done
          ruff check "${files[@]}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-fixed-python
          path: /tmp/ruff-formatted/
          if-no-files-found: error
          retention-days: 1
