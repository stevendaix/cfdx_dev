name: Temporary Ruff formatter export

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Apply formatting and resolve reported Ruff findings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "${BASE_SHA}...HEAD" -- '*.py')
          if (("${#files[@]}" == 0)); then
            echo "No changed Python files"
            exit 0
          fi
          ruff check --fix --exit-zero "${files[@]}"
          ruff format "${files[@]}"
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}: {old!r}")
              file.write_text(content.replace(old, new), encoding="utf-8")

          replace_once(
              "scripts/generate_2d_validation_meshes.py",
              "                def at_base_eta(base_eta):\n",
              """                def at_base_eta(
                    base_eta,
                    *,
                    x=x,
                    y=y,
                    dx=dx,
                    dy=dy,
                    radial_length=radial_length,
                    nx=nx,
                    ny=ny,
                ):
          """.replace("          \n", ""),
          )
          replace_once(
              "scripts/naca_mesh_similarity_gate.py",
              "import argparse\nimport json\n",
              "import argparse\nimport itertools\nimport json\n",
          )
          replace_once(
              "scripts/naca_mesh_similarity_gate.py",
              "zip(items, items[1:])",
              "itertools.pairwise(items)",
          )
          replace_once(
              "scripts/naca_momentum_budget_diagnosis.py",
              "import csv\nimport json\n",
              "import csv\nimport itertools\nimport json\n",
          )
          replace_once(
              "scripts/naca_momentum_budget_diagnosis.py",
              'set(r["rank"] for r in group)',
              '{r["rank"] for r in group}',
          )
          replace_once(
              "scripts/naca_momentum_budget_diagnosis.py",
              "zip(ordered, ordered[1:])",
              "itertools.pairwise(ordered)",
          )
          replace_once(
              "scripts/naca_prolong_initial_state.py",
              "max(int(math.floor(radial)), 0)",
              "max(math.floor(radial), 0)",
          )

          test_file = Path("tests/python/test_naca_force_mesh_qualification.py")
          test_source = test_file.read_text(encoding="utf-8")
          pattern = re.compile(r"dict\(\s*case=f['\"]N\{n\}['\"],.*?cm=0,?\s*\)", re.S)
          replacement = (
              '{"case": f"N{n}", "h": 1 / n, "converged": "yes", '
              '"res_mom": 1e-11, "res_mass": 2e-11, "cd": cd, '
              '"cdp": cd * 0.4, "cdv": cd * 0.6, "cl": 0, "cm": 0}'
          )
          test_source, count = pattern.subn(replacement, test_source, count=1)
          if count != 1:
              raise SystemExit("test_naca_force_mesh_qualification.py: C408 patch anchor not found")
          test_source = test_source.replace(
              "list(csv.DictReader(stream))[0]",
              "next(iter(csv.DictReader(stream)))",
          )
          test_file.write_text(test_source, encoding="utf-8")
          PY
          chmod +x scripts/naca_convergence_diagnosis.py scripts/naca_momentum_budget_diagnosis.py
          ruff format --check "${files[@]}"
          ruff check "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git rm .github/workflows/zz-ruff-format-export.yml
          git commit -m "style(python): apply Ruff formatting and resolve lint findings"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
