name: TH-08 T-junction thermal mixing (OECD/NEA–Vattenfall) — reference contract CI

on:
  push:
    branches: [ci/thermohydraulic-independent-benchmarks]
    paths:
      - 'docs/validation/14-benchmarks/09-thermohydraulics/TH-08.json'
      - 'scripts/validate_thermohydraulic_reference.py'
      - 'scripts/qualify_thermohydraulic_benchmarks.py'
      - '.github/workflows/th08-t-junction.yml'
  pull_request:
    paths:
      - 'docs/validation/14-benchmarks/09-thermohydraulics/TH-08.json'
      - 'scripts/validate_thermohydraulic_reference.py'
      - 'scripts/qualify_thermohydraulic_benchmarks.py'
      - '.github/workflows/th08-t-junction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: th-08-reference-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-contract:
    name: TH-08 reference contract (not solver qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate frozen reference data and dimensionless groups
        run: |
          python scripts/validate_thermohydraulic_reference.py \
            --case TH-08 \
            --output build/thermohydraulic/TH-08-reference-contract.json

      - name: Audit CFDX solver evidence (separate fail-closed status)
        run: |
          python scripts/qualify_thermohydraulic_benchmarks.py \
            --case TH-08 \
            --evidence-dir build/thermohydraulic/solver-exports \
            --output build/thermohydraulic/TH-08-physical-qualification.json
          echo "TH-08: contract CI does NOT certify the CFDX solver" >> "$GITHUB_STEP_SUMMARY"
          echo "Solver evidence is INCOMPLETE unless full verified CFDX exports are provided." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reference-contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: th-08-reference-contract-${{ github.sha }}
          path: |
            build/thermohydraulic/TH-08-reference-contract.json
            build/thermohydraulic/TH-08-physical-qualification.json
          if-no-files-found: error
          retention-days: 30

      - name: Explicit qualification boundary
        run: |
          echo "TH-08: reference contract verified."
          echo "Physical CFDX validation remains BLOCKED until the production solver campaign is implemented and executed."
