name: Ruff diagnostics (temp)
# trigger: run diagnostics on the current branch head

on:
  push:
    branches:
      - ci/thermohydraulic-independent-benchmarks

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Capture exact Ruff findings
        run: |
          E="diag-evidence/ruff"
          mkdir -p "$E"
          ruff --version > "$E/ruff_version.txt"
          ruff check tests/python/test_sst_persisted_cli_restart_e2e.py > "$E/ruff_check.txt" 2>&1 || true
          ruff format --diff tests/python/test_sst_persisted_cli_restart_e2e.py > "$E/ruff_format_diff.txt" 2>&1 || true
          ruff format tests/python/test_sst_persisted_cli_restart_e2e.py
          cp tests/python/test_sst_persisted_cli_restart_e2e.py "$E/ruff_formatted.py"
      - name: Commit diagnostics evidence
        run: |
          E="diag-evidence/ruff"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$E" || true
          if git diff --cached --quiet; then
            echo "no evidence to commit"
          else
            git commit -m "diag(ruff): exact findings evidence [ci skip]"
            git push
          fi
