name: CFDX N8/N9 dedicated validation

# Dedicated numerical qualification for the active N8/N9 maturity levels.
# GitHub labels are separate from CTest labels:
#   n8 -> exact N8 CTest selection
#   n9 -> exact N9 CTest selection
# Synchronize/reopen events rerun whichever labels remain on the PR.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfdx-n8-n9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build-n8-n9

jobs:
  build:
    name: Build N8/N9 numerical suite
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'n8') || contains(github.event.pull_request.labels.*.name, 'n9')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev \
            openmpi-bin python3-venv libglu1-mesa
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-n8-n9
          .venv-n8-n9/bin/python -m pip install --upgrade pip
          .venv-n8-n9/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic
      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=OFF \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DPython3_EXECUTABLE="$PWD/.venv-n8-n9/bin/python"
      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel 4
      - name: Upload numerical build
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-n8-n9-build-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}
          retention-days: 1

  n8:
    name: N8 dedicated tests
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'n8') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev \
            openmpi-bin python3-venv libglu1-mesa
      - uses: actions/download-artifact@v4
        with:
          name: cfdx-n8-n9-build-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}
      - name: Verify restored build
        run: |
          test -d "$BUILD_DIR"
          test -f "$BUILD_DIR/CTestTestfile.cmake"
      - name: Run N8
        run: |
          ctest --test-dir "$BUILD_DIR" \
            -R '^(test_cg_solver|test_bicgstab_solver|test_gmres_solver|test_fgmres_solver|test_krylov_preconditioning|test_amg_chebyshev|test_amg_preconditioner_qualification|test_advanced_preconditioners|test_schur_preconditioner|test_schur_infrastructure|test_exact_schur|test_simplerc_schur|test_lsc_bfbt_schur|test_pcd_schur|test_lsc_bfbt_schur_null_space|test_schur_approximation_comparison|test_schur_quantitative_qualification|test_mgr_preconditioner|test_coupled_block_schur_amg|test_n8_pressure_velocity_matrix|test_n8_schur_production_benchmark|test_n8_schur_representative_cfd|test_n8_schur_complete_krylov|test_n8_amg_anisotropy_scaling)$' \
            --output-on-failure --no-tests=error --parallel 4

  n9:
    name: N9 dedicated tests
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'n9') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev \
            openmpi-bin python3-venv libglu1-mesa
      - uses: actions/download-artifact@v4
        with:
          name: cfdx-n8-n9-build-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}
      - name: Verify restored build
        run: |
          test -d "$BUILD_DIR"
          test -f "$BUILD_DIR/CTestTestfile.cmake"
      - name: Run N9
        run: |
          ctest --test-dir "$BUILD_DIR" \
            -R '^(test_n9_schur_oracle|test_n9_common_schur_qualification|test_n9_s10_pressure_reference_policies|test_n9_coupled_schur_case_selection|test_n9_s8_naca0012_contract|test_steady_incompressible_solver|test_phase9_acceptance|test_couette_quick|test_poiseuille_quick|test_level_c_coupled_verification|test_m2_m4_solver_validation)$' \
            --output-on-failure --no-tests=error --parallel 4
