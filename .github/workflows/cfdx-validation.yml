name: CFDX total validation

# Long/expensive validation is deliberately separated from the fast PR gate.
# Add the `validation-total` label to a PR to run this workflow; it can also
# be started explicitly with workflow_dispatch, or run weekly on schedule.
# Ordinary PR synchronization does not execute the expensive job unless that
# label is present.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: cfdx-total-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build-validation
  VENV_DIR: .venv-validation

jobs:
  prepare:
    name: Prepare validation build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'validation-total')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build and report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev \
            python3 python3-venv ccache
          # LaTeX is report-only: its packages belong in validation-report.

      - name: Restore validation compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: cfdx-full-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cfdx-full-ccache-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml
          "$VENV_DIR/bin/python" -m pip install -e .

      - name: Configure
        id: configure
        continue-on-error: true
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/$VENV_DIR/bin/python" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build complete validation suite
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: cmake --build "$BUILD_DIR" --parallel 2

      - name: Package validation build
        if: steps.build.outcome == 'success'
        run: tar -czf cfdx-validation-build.tar.gz "$BUILD_DIR"

      - name: Upload validation build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: cfdx-validation-build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Final prepare gate
        if: always()
        run: |
          echo "configure=${{ steps.configure.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          if [[ "${{ steps.configure.outcome }}" != "success" || "${{ steps.build.outcome }}" != "success" ]]; then
            echo "validation preparation: FAIL"
            exit 1
          fi
          echo "validation preparation: PASS"

  fast-tests:
    name: Fast regression and validation tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv
      - name: Install Python dependencies
        run: |
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml
          "$VENV_DIR/bin/python" -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: .
      - name: Restore validation build
        run: tar -xzf cfdx-validation-build.tar.gz
      - name: Run fast regression and validation tests
        id: fast_tests
        continue-on-error: true
        run: |
          # ctest resolves a relative JUnit output path against --test-dir,
          # not against the launch directory, so a relative path here would
          # land in build-validation/build-validation/ and never be found.
          # Pass an absolute path so the annotate/evidence steps see the file.
          # The previous full "fast" suite ran serially. This includes
          # hundreds of tests and must use CTest scheduling, not one-at-a-time.
          ctest --test-dir "$BUILD_DIR" \
            -LE long \
            --parallel 4 \
            --output-on-failure \
            --no-tests=error \
            --output-junit "$PWD/$BUILD_DIR/ctest-fast-results.xml"
      - name: Record slowest CTest regressions
        if: always() && steps.fast_tests.outcome != 'skipped'
        run: |
          python3 scripts/ci/ctest_timings.py \
            "$BUILD_DIR/ctest-fast-results.xml" \
            --output "$BUILD_DIR/ctest-fast-timings.json"
      - name: Annotate failing tests
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          RESULTS="$BUILD_DIR/ctest-fast-results.xml"
          if [[ ! -s "$RESULTS" ]]; then
            echo "::warning::no ctest-fast-results.xml produced; nothing to annotate"
            exit 0
          fi
          python3 - "$RESULTS" <<'PY' || echo "::warning::ctest JUnit annotation step failed (non-fatal)"
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          failures = 0
          for _, elem in ET.iterparse(path, events=("end",)):
              if elem.tag == "testcase":
                  name = elem.get("name", "<unknown>")
                  classname = elem.get("classname") or ""
                  label = (classname + "." + name) if classname else name
                  failed = (elem.find("failure") is not None
                            or elem.find("error") is not None)
                  if failed:
                      failures += 1
                      safe = label.replace("%", "%25").replace("\r", " ").replace("\n", " ")
                      print("::error title=ctest failure::" + safe)
                  elem.clear()
          print("annotated " + str(failures) + " failing test(s) from " + path)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfdx-total-validation-fast-evidence
          path: |
            ${{ env.BUILD_DIR }}/Testing/
            ${{ env.BUILD_DIR }}/**/*.log
            ${{ env.BUILD_DIR }}/ctest-fast-results.xml
            ${{ env.BUILD_DIR }}/ctest-fast-timings.json
          if-no-files-found: warn
          retention-days: 30
      - name: Final fast-test gate
        if: always()
        run: '[[ "${{ steps.fast_tests.outcome }}" == "success" ]] || exit 1'

  long-tests:
    # One serial CTest process previously combined two separate 5400-second
    # campaigns (Ghia 160 and the N9 physical matrix). RUN_SERIAL on Ghia
    # stopped the other campaigns on the same worker. Run four *independent*
    # workers with a fail-closed manifest partition and unchanged physics gates.
    name: Long validation shard ${{ matrix.shard }}/4
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv
      - name: Install Python dependencies for CTest fixtures
        run: |
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml
          "$VENV_DIR/bin/python" -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: .
      - name: Restore validation build
        run: tar -xzf cfdx-validation-build.tar.gz
      - name: Plan complete long CTest coverage (fail closed)
        id: plan
        run: |
          python3 scripts/ci/ctest_shard.py \
            --build-dir "$BUILD_DIR" \
            --label long \
            --lanes 4 \
            --output-dir "$BUILD_DIR/ci-shards" \
            --required-test test_ghia_cavity_profile_study \
            --required-test test_ghia_cavity_order \
            --required-test test_n9_physical_matrix \
            --required-test test_n9_negative_diagnostics \
            --required-test test_n9_poiseuille_body_force_production \
            --required-test test_n7_adaptive_relaxation_re400 \
            --required-test test_polyhedral_poisson_convergence \
            --required-test test_wall_distance_transport_stress65 \
            --required-test test_naca0012_qualification \
            --required-test test_natural_convection_de_vahl_davis
      - name: Run long validation shard ${{ matrix.shard }}
        id: long_tests
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          regex_file="$BUILD_DIR/ci-shards/long-shard-${{ matrix.shard }}.regex"
          test -s "$regex_file"
          CFDX_NACA_FORENSICS=1 ctest --test-dir "$BUILD_DIR" \
            -R "$(cat "$regex_file")" \
            --no-tests=error \
            --parallel 3 \
            --output-junit "$PWD/$BUILD_DIR/ctest-long-${{ matrix.shard }}.xml" \
            -V 2>&1 | tee "$BUILD_DIR/long-validation-shard-${{ matrix.shard }}.log"
      - name: Verify each planned long test executed exactly once
        id: coverage
        if: always() && steps.plan.outcome == 'success'
        run: |
          python3 scripts/ci/ctest_timings.py \
            "$BUILD_DIR/ctest-long-${{ matrix.shard }}.xml" \
            --require-names-file "$BUILD_DIR/ci-shards/long-shard-${{ matrix.shard }}.txt" \
            --output "$BUILD_DIR/ctest-long-${{ matrix.shard }}-timings.json"
      - name: Report slowest tests and failure evidence
        if: always()
        shell: bash
        run: |
          xml="$BUILD_DIR/ctest-long-${{ matrix.shard }}.xml"
          # Successful shard coverage already publishes its timing summary.
          # Re-run only for failed/incomplete coverage, to keep useful forensics.
          if [[ -s "$xml" && "${{ steps.coverage.outcome }}" != "success" ]]; then
            python3 scripts/ci/ctest_timings.py "$xml" \
              --output "$BUILD_DIR/ctest-long-${{ matrix.shard }}-timings.json" || true
          fi
          if [[ -s "$BUILD_DIR/long-validation-shard-${{ matrix.shard }}.log" ]]; then
            grep -E 'The following tests FAILED:|[0-9]+ - .*\(.*Failed\)' \
              "$BUILD_DIR/long-validation-shard-${{ matrix.shard }}.log" || true
          fi
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfdx-total-validation-long-evidence-${{ matrix.shard }}
          path: |
            ${{ env.BUILD_DIR }}/Testing/
            ${{ env.BUILD_DIR }}/**/*.log
            ${{ env.BUILD_DIR }}/long-validation-shard-${{ matrix.shard }}.log
            ${{ env.BUILD_DIR }}/ctest-long-${{ matrix.shard }}.xml
            ${{ env.BUILD_DIR }}/ctest-long-${{ matrix.shard }}-timings.json
            ${{ env.BUILD_DIR }}/ci-shards/
            ${{ env.BUILD_DIR }}/naca-pressure-*
          if-no-files-found: warn
          retention-days: 30
      - name: Final shard gate
        if: always()
        run: |
          [[ "${{ steps.plan.outcome }}" == "success" && \
             "${{ steps.long_tests.outcome }}" == "success" && \
             "${{ steps.coverage.outcome }}" == "success" ]] || exit 1

  wall-distance:
    name: Wall-distance benchmarks
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev
      - uses: actions/download-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: .
      - name: Restore validation build
        run: tar -xzf cfdx-validation-build.tar.gz
      - name: Run wall-distance benchmarks
        id: wall
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./build-validation/cfdx_wall_distance_complex_benchmark --ray-only \
            build-validation/wall_distance_ray_benchmark_only.csv
          cat build-validation/wall_distance_ray_benchmark_only.csv
          ./build-validation/cfdx_wall_distance_controlled_benchmark \
            build-validation/wall_distance_controlled_benchmark.csv 16 32 64
          ./build-validation/cfdx_wall_distance_poisson_manufactured \
            build-validation/wall_distance_poisson_manufactured.csv
          ./build-validation/cfdx_wall_distance_poisson_decomposition \
            build-validation/wall_distance_poisson_decomposition.csv
          cat build-validation/wall_distance_controlled_benchmark.csv
          cat build-validation/wall_distance_poisson_manufactured.csv
          cat build-validation/wall_distance_poisson_decomposition.csv
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfdx-total-validation-wall-evidence
          path: ${{ env.BUILD_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Final wall-distance gate
        if: always()
        run: '[[ "${{ steps.wall.outcome }}" == "success" ]] || exit 1'

  wall-distance-fine:
    name: Wall-distance fine benchmark (N=128, ${{ matrix.method }})
    # The N=128 controlled benchmark carries the O(n^2) iteration budget
    # documented in #870/#466: 1000*(128/16)^2 = 64000 pseudo-iterations per
    # method, three methods, ~2M cells. It cannot share a 60-minute job with
    # the coarse benchmarks: run 38438622597 / job 115442608769 was cancelled
    # at the 60-minute deadline despite #871. It also cannot keep running the
    # nine methods sequentially inside one job: the wall-clock is dominated
    # by the O(n^2) budget methods and one method's failure hides the evidence
    # of the others. Post-#898 the job is partitioned per method through the
    # new --method= filter of the controlled benchmark; fail-fast is disabled
    # on purpose so every method uploads its CSV even when another one fails.
    # The iteration budgets and convergence gates are NOT modified here --
    # they define the convergence verdicts; only the job partitioning
    # changes.
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        method:
          - exact_geometric
          - search_based
          - mesh_wave
          - directional_mesh_wave
          - poisson
          - eikonal
          - hamilton_jacobi
          - advection_diffusion
          - hybrid_poisson_eikonal
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev
      - uses: actions/download-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: .
      - name: Restore validation build
        run: tar -xzf cfdx-validation-build.tar.gz
      - name: Run fine wall-distance benchmark (N=128, ${{ matrix.method }})
        id: wall_fine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./build-validation/cfdx_wall_distance_controlled_benchmark \
            build-validation/wall_distance_controlled_benchmark_fine_${{ matrix.method }}.csv 128 \
            --method=${{ matrix.method }}
          cat build-validation/wall_distance_controlled_benchmark_fine_${{ matrix.method }}.csv
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfdx-total-validation-wall-fine-evidence-${{ matrix.method }}
          path: ${{ env.BUILD_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Final fine wall-distance gate
        if: always()
        run: '[[ "${{ steps.wall_fine.outcome }}" == "success" ]] || exit 1'

  thermal-radiation:
    name: Thermal and radiation regression
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv
      - name: Install Python dependencies
        run: |
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml
          "$VENV_DIR/bin/python" -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: .
      - name: Restore validation build
        run: tar -xzf cfdx-validation-build.tar.gz
      - name: Run thermal and radiation regression campaign
        id: thermal_radiation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/thermal_radiation_regression.py \
            --build-dir "$BUILD_DIR" \
            --output-dir "$BUILD_DIR/thermal-radiation-regression" \
            2>&1 | tee "$BUILD_DIR/thermal-radiation-regression.log"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfdx-total-validation-thermal-radiation
          path: |
            ${{ env.BUILD_DIR }}/thermal-radiation-regression/
            ${{ env.BUILD_DIR }}/thermal-radiation-regression.log
          if-no-files-found: warn
          retention-days: 30
      - name: Final thermal/radiation gate
        if: always()
        run: '[[ "${{ steps.thermal_radiation.outcome }}" == "success" ]] || exit 1'

  application-e2e:
    name: Application E2E regression
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv
      - name: Install Python dependencies
        run: |
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml
          "$VENV_DIR/bin/python" -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: .
      - name: Restore validation build
        run: tar -xzf cfdx-validation-build.tar.gz
      - name: Run application E2E regression
        id: application_e2e
        continue-on-error: true
        run: '"$VENV_DIR/bin/python" -m pytest -q tests/python/test_application_e2e.py'
      - name: Final application E2E gate
        if: always()
        run: '[[ "${{ steps.application_e2e.outcome }}" == "success" ]] || exit 1'

  validation-report:
    name: Validation report and metadata
    # Only build a report when the validation campaign was actually
    # prepared. `prepare` is skipped on pull_request events without the
    # `validation-total` label; `always()` alone made this job download a
    # build artifact that was never uploaded, turning every non-campaign
    # run of this workflow into a red download-artifact failure (audit of
    # the 10 last merged PRs, 2026-10-12). A skipped campaign must leave
    # this job skipped, not failed.
    if: always() && needs.prepare.result == 'success'
    needs:
      - prepare
      - long-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra libhdf5-openmpi-dev libopenmpi-dev
      - name: Install Python dependencies
        run: |
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh pyyaml
          "$VENV_DIR/bin/python" -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: cfdx-total-validation-build-${{ github.sha }}
          path: .
      - name: Restore validation build
        run: tar -xzf cfdx-validation-build.tar.gz
      - uses: actions/download-artifact@v7
        with:
          pattern: cfdx-total-validation-long-evidence-*
          path: long-evidence
      - name: Verify all four long-validation logs and combine evidence
        # A missing shard is a failure even when the remaining three have
        # passing JUnit XMLs. The report consumes the same physical records,
        # simply concatenated from independent workers.
        shell: bash
        run: |
          set -euo pipefail
          combined="$BUILD_DIR/long-validation-combined.log"
          : > "$combined"
          for shard in 0 1 2 3; do
            log="$(find "long-evidence/cfdx-total-validation-long-evidence-$shard" \
              -type f -name "long-validation-shard-$shard.log" -print -quit)"
            if [[ -z "$log" || ! -s "$log" ]]; then
              echo "::error::missing long-validation-shard-$shard.log (incomplete qualification)"
              exit 1
            fi
            cat "$log" >> "$combined"
            printf '\n' >> "$combined"
          done
          test -s "$combined"
          # Independent shard jobs guard their own CTest result sets. This
          # aggregate check also rejects a missing/duplicated test across jobs.
          python3 scripts/ci/verify_shards.py \
            --root long-evidence \
            --lanes 4 \
            --label long \
            --output "$BUILD_DIR/long-shards-coverage.json"
          echo "LONG_VALIDATION_LOG=$combined" >> "$GITHUB_ENV"
          echo "Combined four complete long-validation shard logs: $combined"

      - name: Build numerical validation report
        id: validation_report
        continue-on-error: true
        run: |
          python3 scripts/validation_report.py \
            --build-dir "$BUILD_DIR" \
            --output-dir "$BUILD_DIR/validation-report" \
            --ghia-log "$LONG_VALIDATION_LOG" \
            --vmfl036-log "$LONG_VALIDATION_LOG"
      - name: Capture validation metadata
        if: always()
        run: |
          python3 scripts/ci_capture_validation.py \
            --build-dir "$BUILD_DIR" \
            --output-dir "$BUILD_DIR/diagnostic-evidence"
      - name: Upload report evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfdx-total-validation-report
          path: |
            ${{ env.BUILD_DIR }}/validation-report/
            ${{ env.BUILD_DIR }}/diagnostic-evidence/
            ${{ env.BUILD_DIR }}/long-shards-coverage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Final report gate
        if: always()
        run: '[[ "${{ steps.validation_report.outcome }}" == "success" ]] || exit 1'

  final-gate:
    name: Total validation gate
    # A skipped campaign must stay skipped (neutral) -- never red, never
    # green. The gate only evaluates partitions when `prepare` actually
    # ran. When the campaign did run, the loop below still fails on any
    # partition whose result is not 'success', so an ignored or failed
    # partition can never be turned into a pass.
    if: always() && needs.prepare.result == 'success'
    needs:
      - prepare
      - fast-tests
      - long-tests
      - wall-distance
      - wall-distance-fine
      - thermal-radiation
      - application-e2e
      - validation-report
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate all validation partitions
        shell: bash
        run: |
          echo "prepare=${{ needs.prepare.result }}"
          echo "fast-tests=${{ needs.fast-tests.result }}"
          echo "long-tests=${{ needs.long-tests.result }}"
          echo "wall-distance=${{ needs.wall-distance.result }}"
          echo "wall-distance-fine=${{ needs.wall-distance-fine.result }}"
          echo "thermal-radiation=${{ needs.thermal-radiation.result }}"
          echo "application-e2e=${{ needs.application-e2e.result }}"
