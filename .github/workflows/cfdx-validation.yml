name: CFDX total validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cfdx-total-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  total-validation:
    name: Full numerical validation
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'validation-total')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev \
            python3 python3-venv \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-validation
          .venv-validation/bin/python -m pip install --upgrade pip
          .venv-validation/bin/python -m pip install h5py meshio pytest numpy matplotlib
          .venv-validation/bin/python -m pip install -e .
          echo "$PWD/.venv-validation/bin" >> "$GITHUB_PATH"

      - name: Configure
        id: configure
        continue-on-error: true
        run: |
          cmake -S . -B build-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE=${{ github.workspace }}/.venv-validation/bin/python

      - name: Build complete validation suite
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: cmake --build build-validation --parallel 2

      - name: Run fast regression and validation tests
        id: fast_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --test-dir build-validation \
            -LE long \
            --output-on-failure \
            --output-junit build-validation/ctest-results.xml

      - name: Run long validation campaigns
        id: long_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-validation \
            -L long \
            --no-tests=error \
            -V 2>&1 | tee build-validation/long-validation.log

      - name: Build numerical validation report
        id: validation_report
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/validation_report.py \
            --build-dir build-validation \
            --output-dir build-validation/validation-report \
            --ghia-log build-validation/long-validation.log

      - name: Run thermal and radiation regression campaign
        id: thermal_radiation
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/thermal_radiation_regression.py \
            --build-dir build-validation \
            --output-dir build-validation/thermal-radiation-regression \
            2>&1 | tee build-validation/thermal-radiation-regression.log

      - name: Run application E2E regression
        id: application_e2e
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 -m pytest -q tests/python/test_application_e2e.py

      - name: Capture validation metadata
        if: always() && steps.configure.outcome == 'success'
        run: |
          python3 scripts/ci_capture_validation.py \
            --build-dir build-validation \
            --output-dir build-validation/diagnostic-evidence

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-total-validation-evidence
          path: |
            build-validation/Testing/
            build-validation/**/*.log
            build-validation/ctest-results.xml
            build-validation/validation-report/
            build-validation/thermal-radiation-regression/
            build-validation/diagnostic-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Final validation decision
        if: always()
        shell: bash
        run: |
          echo "configure=${{ steps.configure.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          echo "fast_tests=${{ steps.fast_tests.outcome }}"
          echo "long_tests=${{ steps.long_tests.outcome }}"
          echo "validation_report=${{ steps.validation_report.outcome }}"
          echo "thermal_radiation=${{ steps.thermal_radiation.outcome }}"
          echo "application_e2e=${{ steps.application_e2e.outcome }}"
          if [[ "${{ steps.configure.outcome }}" != "success" ||
                "${{ steps.build.outcome }}" != "success" ||
                "${{ steps.fast_tests.outcome }}" != "success" ||
                "${{ steps.long_tests.outcome }}" != "success" ||
                "${{ steps.validation_report.outcome }}" != "success" ||
                "${{ steps.thermal_radiation.outcome }}" != "success" ||
                "${{ steps.application_e2e.outcome }}" != "success" ]]; then
            echo "CFDX total validation: FAIL"
            exit 1
          fi
          echo "CFDX total validation: PASS"
