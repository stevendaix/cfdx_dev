name: CFDX validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfdx-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m1-m4-validation:
    name: M1-M4 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-dev python3 python3-venv
          python3 -m venv .venv-validation
          .venv-validation/bin/python -m pip install --upgrade pip
          .venv-validation/bin/python -m pip install h5py meshio pytest
          .venv-validation/bin/python -m pip install -e .

      - name: Configure
        run: |
          cmake -S . -B build-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_MPI=OFF \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DPython3_EXECUTABLE=${{ github.workspace }}/.venv-validation/bin/python

      - name: Build validation test suite
        run: |
          # ctest -L phase13 also contains dependency/regression tests outside
          # the explicit Phase 13 target list. Building only selected targets
          # made CTest report dozens of unrelated tests as "Not Run" because
          # their executables did not exist in build-validation.
          cmake --build build-validation --parallel 2

      - name: Run Phase 13 validation tests
        run: |
          ctest --test-dir build-validation -L phase13 --output-on-failure

      - name: Run Couette residual validation
        if: always()
        run: |
          set -o pipefail
          CFDX_DEBUG_CELL=auto CFDX_DEBUG_COUPLED=1 ctest --test-dir build-validation \
            -R 'test_(phase9_acceptance|steady_incompressible_solver)' \
            -V 2>&1 | tee build-validation/couette-residuals.log

      - name: Run campaign driver
        if: always()
        run: |
          .venv-validation/bin/python scripts/run_validation.py \
            --build-dir build-validation \
            --junit build-validation/validation-junit.xml \
            --json build-validation/phase13-validation.json

      - name: Run application E2E regression
        if: always()
        run: |
          .venv-validation/bin/python -m pytest -q tests/python/test_application_e2e.py

      - name: Capture complete CTest log
        if: always()
        run: |
          ctest --test-dir build-validation -V 2>&1 | tee build-validation/ctest-full.log

      - name: Capture validation evidence metadata
        if: always()
        run: |
          .venv-validation/bin/python scripts/ci_capture_validation.py \
            --build-dir build-validation \
            --output-dir build-validation/diagnostic-evidence

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-evidence
          path: |
            build-validation/Testing/
            build-validation/**/*.log
            build-validation/validation-junit.xml
            build-validation/phase13-validation.json
            build-validation/diagnostic-evidence/
          if-no-files-found: warn
