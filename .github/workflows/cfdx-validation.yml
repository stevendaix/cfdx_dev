name: CFDX validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfdx-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m1-m4-validation:
    name: M1-M4 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv
          python3 -m venv .venv-validation
          .venv-validation/bin/python -m pip install --upgrade pip
          .venv-validation/bin/python -m pip install h5py meshio pytest
          .venv-validation/bin/python -m pip install -e .

      - name: Configure
        run: |
          cmake -S . -B build-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE=${{ github.workspace }}/.venv-validation/bin/python

      - name: Build validation test suite
        run: |
          # Build the complete CTest suite before executing validation labels.
          # This prevents missing executables from being reported as 90+ false
          # test failures when one target fails to compile.
          cmake --build build-validation --parallel 2

      - name: Run S2S BVH regression first
        run: |
          ctest --test-dir build-validation \
            -R '^test_m1_m4_physics$' \
            --output-on-failure

      - name: Run Phase 13 validation tests
        run: |
          ctest --test-dir build-validation -L phase13 --output-on-failure

      - name: Run thermal V&V with residual logs
        shell: bash
        run: |
          set -o pipefail
          ./build-validation/test_thermal_vv 2>&1 | tee build-validation/thermal-vv.log

      - name: Run radiation V&V with residual logs
        shell: bash
        run: |
          set -o pipefail
          ./build-validation/test_radiation_vv 2>&1 | tee build-validation/radiation-vv.log

      - name: Run S2S radiation V&V with residual logs
        shell: bash
        run: |
          set -o pipefail
          ./build-validation/test_s2s_radiation_vv 2>&1 | tee build-validation/s2s-radiation-vv.log

      - name: Run complete thermal/radiation model matrix
        shell: bash
        run: |
          set -o pipefail
          ./build-validation/test_thermal_radiation_model_matrix 2>&1 | tee build-validation/thermal-radiation-model-matrix.log

      - name: Run thermal/radiation regression campaign and generate report
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/thermal_radiation_regression.py \
            --build-dir build-validation \
            --output-dir build-validation/thermal-radiation-regression 2>&1 | tee build-validation/thermal-radiation-regression.log

      - name: Run thermal challenge and coupled audit
        shell: bash
        run: |
          set -o pipefail
          ./build-validation/test_thermal_challenge_vv 2>&1 | tee build-validation/thermal-challenge-vv.log

      - name: Run Couette residual validation
        if: always()
        run: |
          set -o pipefail
          CFDX_DEBUG_CELL=auto CFDX_DEBUG_COUPLED=1 ctest --test-dir build-validation \
            -R 'test_(phase9_acceptance|steady_incompressible_solver)' \
            -V 2>&1 | tee build-validation/couette-residuals.log

      - name: Run campaign driver
        id: campaign
        if: always()
        run: |
          .venv-validation/bin/python scripts/run_validation.py \
            --build-dir build-validation \
            --junit build-validation/validation-junit.xml \
            --json build-validation/phase13-validation.json

      - name: Full CTest closure gate
        id: full_ctest
        if: always()
        run: |
          ctest --test-dir build-validation --output-on-failure

      - name: Phase 9 coupled closure gate
        id: phase9_closure
        if: always()
        run: |
          set -o pipefail
          CFDX_DEBUG_CELL=auto CFDX_DEBUG_COUPLED=1 ctest --test-dir build-validation \
            -R 'test_phase9_acceptance' --output-on-failure -V 2>&1 | tee build-validation/phase9-closure.log

      - name: Run application E2E regression
        id: application_e2e
        if: always()
        run: |
          .venv-validation/bin/python -m pytest -q tests/python/test_application_e2e.py

      - name: Final validation decision
        if: always()
        run: |
          echo "campaign=${{ steps.campaign.outcome }}"
          echo "full_ctest=${{ steps.full_ctest.outcome }}"
          echo "phase9_closure=${{ steps.phase9_closure.outcome }}"
          echo "e2e=${{ steps.application_e2e.outcome }}"
          if [[ "${{ steps.campaign.outcome }}" != "success" ||
                "${{ steps.full_ctest.outcome }}" != "success" ||
                "${{ steps.phase9_closure.outcome }}" != "success" ||
                "${{ steps.application_e2e.outcome }}" != "success" ]]; then
            echo "CFDX validation closure FAILED"
            exit 1
          fi
          echo "CFDX validation closure PASSED"

      - name: Capture complete CTest log
        if: always()
        run: |
          ctest --test-dir build-validation -V 2>&1 | tee build-validation/ctest-full.log

      - name: Capture validation evidence metadata
        if: always()
        run: |
          .venv-validation/bin/python scripts/ci_capture_validation.py \
            --build-dir build-validation \
            --output-dir build-validation/diagnostic-evidence

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-evidence
          path: |
            build-validation/Testing/
            build-validation/**/*.log
            build-validation/validation-junit.xml
            build-validation/phase13-validation.json
            build-validation/diagnostic-evidence/
            build-validation/thermal-radiation-regression/*
          if-no-files-found: warn
