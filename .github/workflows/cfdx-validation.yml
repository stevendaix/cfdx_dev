name: CFDX validation

on:
  pull_request:
  push:
    branches: [master, "feature/**"]

permissions:
  contents: read

concurrency:
  group: cfdx-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m1-m4-validation:
    name: M1-M4 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-dev python3 python3-venv

      - name: Configure
        run: |
          cmake -S . -B build-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_MPI=OFF \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF

      - name: Build Phase 13 validation executables
        run: |
          cmake --build build-validation --target \
            test_analytical_benchmarks test_benchmark_matrix \
            test_level_b_reference_benchmarks test_level_c_coupled_verification \
            test_phase9_acceptance test_steady_incompressible_solver \
            test_mms_scalar_diffusion test_mesh_refinement_order \
            test_m1_m4_validation test_m2_m4_solver_validation \
            test_cht_validation test_phase10_turbulence_hardening \
            test_thermophysical_models_vv test_matrix_free_fv_operator \
            test_temporal_physics test_core_temporal --parallel 2

      - name: Run Phase 13 validation tests
        run: |
          ctest --test-dir build-validation -L phase13 --output-on-failure

      - name: Run Phase 9 validation tests and preserve full numerical log
        run: |
          set -o pipefail
          CFDX_DEBUG_CELL=auto CFDX_DEBUG_COUPLED=1 ctest --test-dir build-validation \
            -R 'test_(analytical_benchmarks|benchmark_matrix|level_b_reference_benchmarks|level_c_coupled_verification|phase9_acceptance|steady_incompressible_solver|ghia_cavity)' \
            -V 2>&1 | tee build-validation/ctest-phase9.log

      - name: Upload validation JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-junit
          path: |
            build-validation/validation-junit.xml
            build-validation/phase13-validation.json
          if-no-files-found: ignore

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-logs
          path: |
            build-validation/Testing/
            build-validation/**/*.log
          if-no-files-found: ignore

      - name: Run application E2E regression
        run: |
          python3 -m venv .venv-e2e
          .venv-e2e/bin/python -m pip install --upgrade pip
          .venv-e2e/bin/python -m pip install pytest h5py
          PYTHONPATH=python .venv-e2e/bin/python -m pytest -q tests/python/test_application_e2e.py

      - name: Capture complete CTest log
        if: always()
        run: |
          ctest --test-dir build-validation -V 2>&1 | tee build-validation/ctest-full.log

      # This step is deliberately non-gating. It runs after a failed test too,
      # so the evidence inventory and CI provenance are still uploaded.
      - name: Capture validation evidence metadata
        if: always()
        run: |
          python3 scripts/ci_capture_validation.py \
            --build-dir build-validation \
            --output-dir build-validation/diagnostic-evidence

      - name: Upload complete numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-complete-validation-evidence
          path: |
            build-validation/diagnostic-evidence/
            build-validation/ctest-full.log
          if-no-files-found: warn


      - name: Run campaign driver
        run: |
          python3 scripts/run_validation.py \
            --build-dir build-validation \
            --junit build-validation/validation-junit.xml \
            --json build-validation/phase13-validation.json

      - name: Upload validation JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-junit
          path: |
            build-validation/validation-junit.xml
            build-validation/phase13-validation.json
          if-no-files-found: ignore

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-logs
          path: |
            build-validation/Testing/
            build-validation/**/*.log
          if-no-files-found: ignore

      - name: Run application E2E regression
        run: |
          python3 -m venv .venv-e2e
          .venv-e2e/bin/python -m pip install --upgrade pip
          .venv-e2e/bin/python -m pip install pytest h5py
          PYTHONPATH=python .venv-e2e/bin/python -m pytest -q tests/python/test_application_e2e.py
