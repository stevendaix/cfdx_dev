name: CFDX total validation

# Long/expensive validation is deliberately separated from the fast PR gate.
# Add the `validation-total` label to a PR to run this workflow; it can also
# be started explicitly with workflow_dispatch, or run weekly on schedule.
# Ordinary PR synchronization does not execute the expensive job unless that
# label is present.

on:
  workflow_dispatch:
  # Weekly full campaign. The merge-gated order tripwire (test_ghia_cavity_order)
  # only covers 16/32/64; the 32/64/128 campaign, Re=400 and Re=1000 stay behind
  # this schedule so the expensive evidence is still produced, just not on
  # every commit. Monday 03:17 UTC.
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cfdx-total-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  total-validation:
    name: Full numerical validation
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'validation-total')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev \
            python3 python3-venv \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-validation
          .venv-validation/bin/python -m pip install --upgrade pip
          .venv-validation/bin/python -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh
          .venv-validation/bin/python -m pip install -e .
          echo "$PWD/.venv-validation/bin" >> "$GITHUB_PATH"

      - name: Configure
        id: configure
        continue-on-error: true
        run: |
          cmake -S . -B build-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE=${{ github.workspace }}/.venv-validation/bin/python

      - name: Build complete validation suite
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: cmake --build build-validation --parallel 2

      - name: Run fast regression and validation tests
        id: fast_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --test-dir build-validation \
            -LE long \
            --output-on-failure \
            --output-junit build-validation/ctest-results.xml

      - name: Run long validation campaigns
        id: long_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-validation \
            -L long \
            --no-tests=error \
            -V 2>&1 | tee build-validation/long-validation.log

      - name: Run wall-distance controlled benchmark (full sweep)
        id: wall_controlled
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          ./build-validation/cfdx_wall_distance_controlled_benchmark \
            build-validation/wall_distance_controlled_benchmark.csv 16 32 64
          echo "=== Wall-distance controlled benchmark, N=16..64 ==="
          cat build-validation/wall_distance_controlled_benchmark.csv

      - name: Run wall-distance controlled benchmark at high resolution
        id: wall_controlled_fine
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          ./build-validation/cfdx_wall_distance_controlled_benchmark \
            build-validation/wall_distance_controlled_benchmark_fine.csv 128
          echo "=== Wall-distance controlled benchmark, N=128 ==="
          cat build-validation/wall_distance_controlled_benchmark_fine.csv

      - name: Run wall-distance Poisson manufactured benchmark
        id: wall_manufactured
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          ./build-validation/cfdx_wall_distance_poisson_manufactured \
            build-validation/wall_distance_poisson_manufactured.csv
          echo "=== Wall-distance Poisson manufactured benchmark ==="
          cat build-validation/wall_distance_poisson_manufactured.csv

      - name: Run wall-distance Poisson error-budget decomposition
        id: wall_decomposition
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          ./build-validation/cfdx_wall_distance_poisson_decomposition \
            build-validation/wall_distance_poisson_decomposition.csv
          echo "=== Wall-distance Poisson error-budget decomposition ==="
          cat build-validation/wall_distance_poisson_decomposition.csv

      - name: Build numerical validation report
        id: validation_report
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/validation_report.py \
            --build-dir build-validation \
            --output-dir build-validation/validation-report \
            --ghia-log build-validation/long-validation.log \
            --vmfl036-log build-validation/long-validation.log

      - name: Run thermal and radiation regression campaign
        id: thermal_radiation
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/thermal_radiation_regression.py \
            --build-dir build-validation \
            --output-dir build-validation/thermal-radiation-regression \
            2>&1 | tee build-validation/thermal-radiation-regression.log

      - name: Run application E2E regression
        id: application_e2e
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 -m pytest -q tests/python/test_application_e2e.py

      - name: Capture validation metadata
        if: always() && steps.configure.outcome == 'success'
        run: |
          python3 scripts/ci_capture_validation.py \
            --build-dir build-validation \
            --output-dir build-validation/diagnostic-evidence

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-total-validation-evidence
          path: |
            build-validation/Testing/
            build-validation/**/*.log
            build-validation/**/*.csv
            build-validation/ctest-results.xml
            build-validation/validation-report/
            build-validation/thermal-radiation-regression/
            build-validation/diagnostic-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Final validation decision
        if: always()
        shell: bash
        run: |
          echo "configure=${{ steps.configure.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          echo "n1_numerics=${{ steps.n1_numerics.outcome }}"
          echo "fast_tests=${{ steps.fast_tests.outcome }}"
          echo "long_tests=${{ steps.long_tests.outcome }}"
          echo "wall_controlled=${{ steps.wall_controlled.outcome }}"
          echo "wall_controlled_fine=${{ steps.wall_controlled_fine.outcome }}"
          echo "wall_manufactured=${{ steps.wall_manufactured.outcome }}"
          echo "wall_decomposition=${{ steps.wall_decomposition.outcome }}"
          echo "validation_report=${{ steps.validation_report.outcome }}"
          echo "thermal_radiation=${{ steps.thermal_radiation.outcome }}"
          echo "application_e2e=${{ steps.application_e2e.outcome }}"
          if [[ "${{ steps.configure.outcome }}" != "success" ||
                "${{ steps.build.outcome }}" != "success" ||
                "${{ steps.n1_numerics.outcome }}" != "success" ||
                "${{ steps.fast_tests.outcome }}" != "success" ||
                "${{ steps.long_tests.outcome }}" != "success" ||
                "${{ steps.wall_controlled.outcome }}" != "success" ||
                "${{ steps.wall_controlled_fine.outcome }}" != "success" ||
                "${{ steps.wall_manufactured.outcome }}" != "success" ||
                "${{ steps.wall_decomposition.outcome }}" != "success" ||
                "${{ steps.validation_report.outcome }}" != "success" ||
                "${{ steps.thermal_radiation.outcome }}" != "success" ||
                "${{ steps.application_e2e.outcome }}" != "success" ]]; then
            echo "CFDX total validation: FAIL"
            exit 1
          fi
          echo "CFDX total validation: PASS"
