name: CFDX validation

on:
  pull_request:
  push:
    branches: [master, "feature/**"]

permissions:
  contents: read

concurrency:
  group: cfdx-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m1-m4-validation:
    name: M1-M4 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-dev python3 python3-venv

      - name: Configure
        run: |
          cmake -S . -B build-validation -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCFDX_BUILD_TESTS=ON             -DCFDX_ENABLE_MPI=OFF             -DCFDX_BUILD_PYTHON=OFF             -DCFDX_USE_HDF5_SERIAL=OFF

      - name: Build validation executables
        run: |
          cmake --build build-validation --target             test_analytical_benchmarks             test_benchmark_matrix             test_level_b_reference_benchmarks             test_level_c_coupled_verification             --parallel 2

      - name: Run validation tests
        run: |
          ctest --test-dir build-validation             -R 'test_(analytical_benchmarks|benchmark_matrix|level_b_reference_benchmarks|level_c_coupled_verification|phase9_acceptance)             --output-on-failure

      - name: Run campaign driver
        run: |
          python3 scripts/run_validation.py --build-dir build-validation --junit build-validation/validation-junit.xml

      - name: Upload validation JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-junit
          path: build-validation/validation-junit.xml
          if-no-files-found: error

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-logs
          path: |
            build-validation/Testing/
            build-validation/**/*.log
          if-no-files-found: ignore


      - name: Run application E2E regression
        run: |
          python3 -m venv .venv-e2e
          .venv-e2e/bin/python -m pip install --upgrade pip
          .venv-e2e/bin/python -m pip install pytest h5py
          PYTHONPATH=python .venv-e2e/bin/python -m pytest -q tests/python/test_application_e2e.py
             --output-on-failure

      - name: Run campaign driver
        run: |
          python3 scripts/run_validation.py --build-dir build-validation --junit build-validation/validation-junit.xml

      - name: Upload validation JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-junit
          path: build-validation/validation-junit.xml
          if-no-files-found: error

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfdx-validation-logs
          path: |
            build-validation/Testing/
            build-validation/**/*.log
          if-no-files-found: ignore


      - name: Run application E2E regression
        run: |
          python3 -m venv .venv-e2e
          .venv-e2e/bin/python -m pip install --upgrade pip
          .venv-e2e/bin/python -m pip install pytest h5py
          PYTHONPATH=python .venv-e2e/bin/python -m pytest -q tests/python/test_application_e2e.py
