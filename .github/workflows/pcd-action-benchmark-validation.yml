name: PCD Schur-action benchmark validation

# Runs the PCD Schur-action A/B benchmark (real assembled Ghia coupled
# systems, eight preconditioner action variants under identical linear-solve
# conditions). It measures; it never judges the physical case
# (test_ghia_cavity_n8_pcd keeps that responsibility) and nothing here
# modifies a production gate, tolerance, budget or oracle.
#
# Integration decision (2026-10-19, #966): the CTest registration is merged
# (the test runs only under CFDX_ENABLE_LONG_VALIDATION, so the standard CI
# is unaffected); this measurement workflow stays trigger-scoped to the
# benchmark branches plus manual workflow_dispatch - it does not run on
# master pushes and adds no job to the standard CI. Benchmark evidence
# artifacts are retained 90 days.

on:
  push:
    branches: [test/pcd-schur-action-benchmark, test/pcd-schur-action-tolerance-axis]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DIR: build-pcd-action-benchmark

jobs:
  benchmark:
    name: PCD Schur-action A/B on real Ghia stages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev

      - name: Configure (production validation configuration)
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build the benchmark target
        run: |
          cmake --build "$BUILD_DIR" --target test_pcd_schur_action_benchmark --parallel 2

      - name: Run the benchmark (registered 1200 s ctest budget)
        run: |
          ctest --test-dir "$BUILD_DIR" \
            -R '^test_pcd_schur_action_benchmark$' \
            --output-on-failure -V

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcd-action-benchmark-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/Testing/
          if-no-files-found: warn
          retention-days: 90
