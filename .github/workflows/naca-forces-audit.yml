name: NACA0012 forces audit and Cd trace

# Diagnostic branch: per-iteration Cd trace (solver iteration_output_callback),
# executed-conriteria dump (final history entries + gate thresholds), and an
# independent momentum-budget cross-check of the airfoil force integration.
# Never merged; delete after the evidence is captured.

on:
  workflow_dispatch:
  push:
    branches: [diag/naca-forces-audit]

permissions:
  contents: write

jobs:
  forces-audit:
    name: NACA0012 SIMPLE three-level with Cd trace and force audit
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-naca
          .venv-naca/bin/python -m pip install --upgrade pip
          .venv-naca/bin/python -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh

      - name: Generate NACA0012 O-grid meshes (n64/n128/n256)
        run: |
          mkdir -p build-naca/validation_meshes
          .venv-naca/bin/python scripts/generate_2d_validation_meshes.py naca0012 \
            --output-dir build-naca/validation_meshes

      - name: Configure (Release, long validation ON)
        run: |
          touch naca-forces-audit-output.log
          set -o pipefail
          cmake -S . -B build-naca -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/.venv-naca/bin/python" \
            2>&1 | tee -a naca-forces-audit-output.log

      - name: Build test_naca0012_qualification
        run: |
          set -o pipefail
          cmake --build build-naca --target test_naca0012_qualification --parallel 2 \
            2>&1 | tee -a naca-forces-audit-output.log

      - name: Run NACA0012 three-level qualification (SIMPLE, with Cd trace)
        run: |
          set -o pipefail
          ./build-naca/test_naca0012_qualification --model SIMPLE \
            build-naca/validation_meshes/naca0012_laminar_n64.h5 \
            build-naca/validation_meshes/naca0012_laminar_n128.h5 \
            build-naca/validation_meshes/naca0012_laminar_n256.h5 \
            2>&1 | tee -a naca-forces-audit-output.log

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naca-forces-audit-output
          path: naca-forces-audit-output.log
          if-no-files-found: warn

      - name: Commit run log to diagnostic branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naca-forces-audit-output.log
          git commit -m "diag(naca0012): capture forces-audit run log [skip ci]"
          git push