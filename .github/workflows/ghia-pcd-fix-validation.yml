name: Ghia PCD fix validation

# Validation of the nested Fp preconditioner change in
# tests/validation/test_ghia_cavity.cpp. This workflow exists only on the
# fix branch: it runs the REAL ctest entries with their UNCHANGED timeouts
# so the PASS evidence of test_ghia_cavity_n8_pcd (720 s ctest budget) is
# produced without waiting for the validation-total label. It proves the
# fix and must not be merged into master (remove the file, or keep it if
# the maintainer decides otherwise).
#
# Nothing here is a diagnostic capture: gates, tolerances, budgets and
# oracles are the production ones, taken from CMakeLists.txt verbatim.

on:
  push:
    branches: [fix/ghia-pcd-fp-preconditioner]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DIR: build-fixval

jobs:
  validate:
    name: Ghia PCD stages under production ctest budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev

      - name: Configure (production validation configuration)
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build the Ghia test target
        run: |
          cmake --build "$BUILD_DIR" --target test_ghia_cavity --parallel 2

      - name: Preflight 16x16 PCD (unchanged 120 s ctest budget)
        run: |
          ctest --test-dir "$BUILD_DIR" \
            -R '^test_ghia_cavity_n8_pcd_preflight$' \
            --output-on-failure -V

      - name: Qualification 32x32 PCD (unchanged 720 s ctest budget)
        run: |
          ctest --test-dir "$BUILD_DIR" \
            -R '^test_ghia_cavity_n8_pcd$' \
            --output-on-failure -V

      - name: Regression - SIMPLE quick 32x32 (always-on)
        run: |
          ctest --test-dir "$BUILD_DIR" \
            -R '^test_ghia_cavity_quick$' \
            --output-on-failure -V

      - name: Regression - observed-order gate 16/32/64 (unchanged 900 s budget)
        run: |
          ctest --test-dir "$BUILD_DIR" \
            -R '^test_ghia_cavity_order$' \
            --output-on-failure -V

      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghia-pcd-fix-validation-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/Testing/
          if-no-files-found: warn
          retention-days: 30
