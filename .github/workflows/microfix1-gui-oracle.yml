name: Microfix1 GUI palette test verification oracle (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/microfix1_gui_marker.txt'
      - '.github/workflows/microfix1-gui-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle:
    name: gui-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EVID: diag-evidence/logs
      BASE_SHA: 72ddaab9d8d5e428e2956db0e1e35954972dee88
      STAMP: 2026-10-25-mf1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create worktree at pinned master head and overlay candidates
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add "$RUNNER_TEMP/ref" "$BASE_SHA"
          cp "$GITHUB_WORKSPACE/diag-tools/microfix1_candidates/test_capabilities.py" \
             "$RUNNER_TEMP/ref/tests/python/test_capabilities.py"
          cp "$GITHUB_WORKSPACE/diag-tools/microfix1_candidates/cfdx-gui.yml" \
             "$RUNNER_TEMP/ref/.github/workflows/cfdx-gui.yml"
          cd "$RUNNER_TEMP/ref"
          git log -1 --format='%H %s' | tee "$GITHUB_WORKSPACE/$EVID/microfix1_base_head_$STAMP.txt"
          git status --porcelain | tee "$GITHUB_WORKSPACE/$EVID/microfix1_overlay_files_$STAMP.txt"
          git diff --stat | tee -a "$GITHUB_WORKSPACE/$EVID/microfix1_overlay_files_$STAMP.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run pre-commit hooks on the overlay
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit
          cd "$RUNNER_TEMP/ref"
          pre-commit run --all-files > "$GITHUB_WORKSPACE/$EVID/microfix1_precommit_$STAMP.log" 2>&1
          echo "pre-commit exit code: $?" >> "$GITHUB_WORKSPACE/$EVID/microfix1_precommit_$STAMP.log"

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libglu1-mesa \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Install CFDX with GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/ref[gui]"
          python -m pip install pytest

      - name: Run candidate test file under xvfb
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          cd "$RUNNER_TEMP/ref"
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest -q --tb=long tests/python/test_capabilities.py \
              > "$GITHUB_WORKSPACE/$EVID/microfix1_pytest_$STAMP.log" 2>&1
          echo "pytest exit code: $?" >> "$GITHUB_WORKSPACE/$EVID/microfix1_pytest_$STAMP.log"

      - name: Dump QAction inventory (overlay)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          cd "$RUNNER_TEMP/ref"
          xvfb-run -a -s "-screen 0 1280x1024x24" python - <<'PY' > "$GITHUB_WORKSPACE/$EVID/microfix1_actions_$STAMP.log" 2>&1
          from PySide6.QtGui import QAction
          from cfdx.gui import create_application
          from cfdx.workbench import CFDXWorkbenchWindow
          from cfdx import CFDXSession

          app = create_application(["cfdx-palette-test"])
          window = CFDXWorkbenchWindow(CFDXSession())
          for action in sorted(window.findChildren(QAction), key=lambda a: a.objectName()):
              parent = action.parent()
              print(repr(action.objectName()), repr(action.text()), type(action).__name__, type(parent).__name__ if parent is not None else None)
          window.close()
          app.quit()
          PY

      - name: Write meta
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "phase=microfix1-palette-test-verify"
            echo "base=$BASE_SHA"
            echo "overlay=tests/python/test_capabilities.py,.github/workflows/cfdx-gui.yml"
            echo "candidates=diag-tools/microfix1_candidates/"
            echo "purpose=verify candidate BEFORE pushing to fix branch (Lot 2 follow-up microfix)"
          } > "$E/microfix1_meta_$STAMP.txt"

      - name: Commit evidence
        if* always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: microfix1 palette test verification evidence (2026-10-25) [ci skip]"
            (git push || (git pull --rebase && git push))
          fi
