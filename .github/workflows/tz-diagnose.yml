name: TZ diagnose

# Temporary diagnostics workflow for PR #887. To be removed before merge.

on:
  pull_request:

permissions:
  contents: read

jobs:
  fast-ctest-diagnose:
    name: Fast CTest diagnose
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Install Python mesh/I/O stack
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "meshio[all]" h5py pytest gmsh pydantic ansys-fluent-core
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_LONG_VALIDATION=OFF

      - name: Build
        id: build
        run: |
          set -o pipefail
          cmake --build build --parallel 8 2>&1 | tee build.log

      - name: Run fast CTest
        id: ctest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build -LE long --output-on-failure --no-tests=error --parallel 4 2>&1 | tee ctest_stdout.log

      - name: Diag A ctest failures
        if: always()
        run: |
          {
            sed -n '/The following tests FAILED/,/^$/p' ctest_stdout.log | head -10
            echo "---TZGREP---"
            grep -nE 'THERMAL_ZONES_VV' build/Testing/Temporary/LastTest.log 2>/dev/null | head -4
          } > ann_a.txt 2>/dev/null || true
          n=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '::error::A %s\n' "${line:0:480}"
            n=$((n+1))
            [ "$n" -ge 9 ] && break
          done < ann_a.txt
          [ "${n:-0}" -gt 0 ] || echo '::notice::A nothing'

      - name: Extract TZ section
        if: always()
        run: |
          LOG="build/Testing/Temporary/LastTest.log"
          if [ -f "$LOG" ]; then
            sed -n '/Start [0-9]*: test_thermal_zones_vv/,/End [0-9]*: test_thermal_zones_vv/p' "$LOG" > tz_section.txt || true
          fi
          if [ ! -s tz_section.txt ]; then
            { echo "SECTION-NOT-IN-LOG"; ctest --test-dir build -R '^test_thermal_zones_vv$' --output-on-failure -V; } > tz_section.txt 2>&1 || true
          fi
          wc -l tz_section.txt

      - name: Diag B1 TZ section 1-9
        if: always()
        run: |
          n=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '::error::B1 %s\n' "${line:0:460}"
            n=$((n+1))
            [ "$n" -ge 9 ] && break
          done < <(sed -n '1,9p' tz_section.txt)
          [ "${n:-0}" -gt 0 ] || echo '::notice::B1 empty'

      - name: Diag B2 TZ section 10-18
        if: always()
        run: |
          n=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '::error::B2 %s\n' "${line:0:460}"
            n=$((n+1))
            [ "$n" -ge 9 ] && break
          done < <(sed -n '10,18p' tz_section.txt)
          [ "${n:-0}" -gt 0 ] || echo '::notice::B2 empty'

      - name: Diag B3 TZ section 19-27
        if: always()
        run: |
          n=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '::error::B3 %s\n' "${line:0:460}"
            n=$((n+1))
            [ "$n" -ge 9 ] && break
          done < <(sed -n '19,27p' tz_section.txt)
          [ "${n:-0}" -gt 0 ] || echo '::notice::B3 empty'

      - name: Final gate
        if: always()
        run: |
          if [ "${{ steps.ctest.outcome }}" != "success" ]; then
            echo "CFDX TZ diagnose: FAIL"
            exit 1
          fi
          echo "CFDX TZ diagnose: PASS"
