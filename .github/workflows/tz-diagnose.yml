name: TZ diagnose

# Temporary diagnostics workflow for PR #887. To be removed before merge.

on:
  pull_request:

permissions:
  contents: read

jobs:
  fast-ctest-diagnose:
    name: Fast CTest diagnose
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libhdf5-dev libopenmpi-dev openmpi-bin python3-venv libglu1-mesa

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCFDX_BUILD_TESTS=ON -DCFDX_ENABLE_LONG_VALIDATION=OFF

      - name: Build
        id: build
        run: |
          set -o pipefail
          cmake --build build --parallel 8 2>&1 | tee build.log

      - name: Run fast CTest
        id: ctest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build -LE long --output-on-failure --no-tests=error --parallel 4 2>&1 | tee ctest_stdout.log

      - name: Diag A ctest list and failures
        if: always()
        run: |
          LOG="build/Testing/Temporary/LastTest.log"
          {
            ctest --test-dir build -N -LE long 2>/dev/null | grep -iE 'Total Tests|thermal_zones' | head -5
            echo "---FAILED-LIST---"
            sed -n '/The following tests FAILED/,/^$/p' ctest_stdout.log | head -10
            echo "---TZ-IN-LOG---"
            grep -nE 'THERMAL_ZONES_VV|thermal_zones' "$LOG" 2>/dev/null | head -4
            echo "---LOG-INFO---"
            wc -l "$LOG" 2>/dev/null || echo "no LastTest.log"
          } > ann_a.txt 2>/dev/null || true
          n=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '::error::A %s\n' "${line:0:480}"
            n=$((n+1))
            [ "$n" -ge 9 ] && break
          done < ann_a.txt
          [ "${n:-0}" -gt 0 ] || echo '::notice::A nothing'

      - name: Diag B run TZ binary directly
        if: always()
        run: |
          ulimit -c 0
          BIN=$(find build -type f -name 'test_thermal_zones_vv*' | head -1)
          {
            echo "BIN=$BIN"
            if [ -n "$BIN" ]; then
              timeout 120 "$BIN" > tz_out.txt 2>&1
              code=$?
              echo "EXIT_CODE=$code"
              echo "OUTPUT_LINES=$(wc -l < tz_out.txt)"
              tail -12 tz_out.txt
            else
              echo "BIN NOT FOUND"
            fi
          } > ann_b.txt 2>/dev/null || true
          n=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '::error::B %s\n' "${line:0:480}"
            n=$((n+1))
            [ "$n" -ge 9 ] && break
          done < ann_b.txt
          [ "${n:-0}" -gt 0 ] || echo '::notice::B nothing'

      - name: Final gate
        if: always()
        run: |
          if [ "${{ steps.ctest.outcome }}" != "success" ]; then
            echo "CFDX TZ diagnose: FAIL"
            exit 1
          fi
          echo "CFDX TZ diagnose: PASS"
