name: PR 1092 merge-tree conflict oracle (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]

permissions:
  contents: write

jobs:
  merge-tree-oracle:
    if: contains(github.event.head_commit.message, 'pr1092-mergetree')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run git merge-tree oracle on pinned refs
        run: |
          set +e
          git config --global --add safe.directory "$PWD"
          git fetch origin master fix/numerical-audit-g01-g09
          MASTER_PIN=$(grep master_pin diag-tools/pr1092_mergetree_marker.txt | tail -1 | cut -d= -f2)
          BRANCH_PIN=$(grep branch_pin diag-tools/pr1092_mergetree_marker.txt | tail -1 | cut -d= -f2)
          BASE_PIN=$(git merge-base "$MASTER_PIN" "$BRANCH_PIN")
          echo "master_pin=$MASTER_PIN branch_pin=$BRANCH_PIN base=$BASE_PIN"
          mkdir -p diag-evidence/logs
          OUT="diag-evidence/logs/pr1092_mergetree_${GITHUB_RUN_ID}.txt"
          {
            git --version
            echo "master_pin=$MASTER_PIN branch_pin=$BRANCH_PIN base=$BASE_PIN"
            echo "=== merge-tree --name-only ==="
            git merge-tree --write-tree --name-only "$MASTER_PIN" "$BRANCH_PIN"
            echo "MERGE_TREE_EXIT=$?"
            for P in src/cfdx/core/linalg/gmres_solver.h src/cfdx/core/linalg/cg_solver.h tests/unit/test_cg_solver.cpp; do
              F=$(basename "$P")
              git show "$BASE_PIN:$P" > "/tmp/$F.base" 2>/dev/null
              git show "$MASTER_PIN:$P" > "/tmp/$F.master" 2>/dev/null
              git show "$BRANCH_PIN:$P" > "/tmp/$F.branch" 2>/dev/null
              echo ""
              echo "########## FILE $P ##########"
              echo "=== git merge-file (branch base master) exit + contenu diff3 ==="
              git merge-file -p --diff3 "/tmp/$F.branch" "/tmp/$F.base" "/tmp/$F.master"
              echo "MERGE_FILE_EXIT=$?"
              echo "=== git diff base master (hunks git) ==="
              git diff --no-color -U1 "$BASE_PIN" "$MASTER_PIN" -- "$P"
              echo "=== git diff base branch (hunks git) ==="
              git diff --no-color -U1 "$BASE_PIN" "$BRANCH_PIN" -- "$P"
            done
          } > "$OUT" 2>&1
          cat "$OUT"
          exit 0

      - name: Commit evidence
        run: |
          git config user.name "ci-diag-bot"
          git config user.email "actions@github.com"
          git add diag-evidence/logs/pr1092_mergetree_*.txt
          git commit -m "diag: pr1092 merge-tree oracle evidence [ci skip]"
          git push
