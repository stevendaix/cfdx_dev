name: PR 1092 merge-tree conflict oracle (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]

permissions:
  contents: write

jobs:
  merge-tree-oracle:
    if: contains(github.event.head_commit.message, 'pr1092-mergetree')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run git merge-tree oracle on pinned refs
        run: |
          set +e
          git config --global --add safe.directory "$PWD"
          git fetch origin master fix/numerical-audit-g01-g09
          MASTER_PIN=$(grep master_pin diag-tools/pr1092_mergetree_marker.txt | tail -1 | cut -d= -f2)
          BRANCH_PIN=$(grep branch_pin diag-tools/pr1092_mergetree_marker.txt | tail -1 | cut -d= -f2)
          echo "master_pin=$MASTER_PIN branch_pin=$BRANCH_PIN"
          mkdir -p diag-evidence/logs
          OUT="diag-evidence/logs/pr1092_mergetree_${GITHUB_RUN_ID}.txt"
          {
            git --version
            echo "master_pin=$MASTER_PIN branch_pin=$BRANCH_PIN"
            echo "=== 1. merge-tree actuel (attendu: conflit gmres) ==="
            TREE=$(git merge-tree --write-tree --name-only "$MASTER_PIN" "$BRANCH_PIN")
            echo "MERGE_TREE_EXIT=$?"
            echo "=== 2. fichier gmres CONFLIT (marqueurs, extrait de l arbre) ==="
            git cat-file -p "${TREE}:src/cfdx/core/linalg/gmres_solver.h"
            echo "=== 3. merge-file ordre inverse (master base branch) ==="
            git show "$(git merge-base "$MASTER_PIN" "$BRANCH_PIN"):src/cfdx/core/linalg/gmres_solver.h" > /tmp/g.base
            git show "$MASTER_PIN:src/cfdx/core/linalg/gmres_solver.h" > /tmp/g.master
            git show "$BRANCH_PIN:src/cfdx/core/linalg/gmres_solver.h" > /tmp/g.branch
            git merge-file -p --diff3 /tmp/g.master /tmp/g.base /tmp/g.branch > /tmp/g.swapped
            echo "MERGE_FILE_SWAPPED_EXIT=$?"
            grep -n "<<<<<<<\|>>>>>>>\|=======\||||||||" /tmp/g.swapped | head -30
            echo "=== 4. candidats (overlay sur branch_pin + merge-tree vs master_pin) ==="
            git config user.email "actions@github.com"; git config user.name "diag"
            for C in diag-tools/pr1092_gmres_candidate_*.h; do
              [ -f "$C" ] || continue
              git checkout -q --detach "$BRANCH_PIN"
              cp "$C" src/cfdx/core/linalg/gmres_solver.h
              git add -A && git commit -qm "candidate $C"
              echo "----- CANDIDATE $C -----"
              git merge-tree --write-tree --name-only "$MASTER_PIN" HEAD
              echo "CANDIDATE_EXIT=$?"
            done
            git checkout -q ci/long-campaign-diagnostics
          } > "$OUT" 2>&1
          cat "$OUT"
          exit 0

      - name: Commit evidence
        run: |
          git checkout -q ci/long-campaign-diagnostics
          git config user.name "ci-diag-bot"
          git config user.email "actions@github.com"
          git add diag-evidence/logs/pr1092_mergetree_*.txt
          git commit -m "diag: pr1092 merge-tree oracle evidence [ci skip]"
          git push
