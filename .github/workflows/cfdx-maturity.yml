name: CFDX numerical maturity audit

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate #461 maturity records
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate #461 audits
        run: |
          python scripts/validate_numerical_maturity_audit.py             docs/validation/NUMERICAL_METHOD_MATURITY_AUDIT.json             docs/validation/NUMERICAL_METHOD_REQUIREMENTS_AUDIT.json
