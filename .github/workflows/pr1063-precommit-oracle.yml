name: PR1063 pre-commit ruff evidence oracle (diag)

on:
  push:
    branches: [ci/long-campaign-diagnostics]
    paths:
      - 'diag-tools/pr1063_precommit_marker.txt'
      - '.github/workflows/pr1063-precommit-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle:
    name: ruff-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVID: diag-evidence/logs
      PR_BASE: 9e05370ade533632874b37d8418ea0e0aeeb502a
      PR_HEAD: 23664c79dc742d5ba50336c614f464acf8389dc5
      STAMP: 2026-10-23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned PR refs and create worktree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVID"
          git fetch origin "$PR_BASE" "$PR_HEAD"
          git worktree add "$RUNNER_TEMP/ref" "$PR_HEAD"
          cd "$RUNNER_TEMP/ref"
          git log -1 --format='%H %s' | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_head_$STAMP.txt"
          git log --oneline -1 "$PR_BASE" | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_base_$STAMP.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff (same as CI Pre-commit job)
        run: |
          python -m pip install --upgrade pre-commit ruff
          {
            echo "ruff: $(ruff --version)"
            echo "pre-commit: $(pre-commit --version)"
            echo "python: $(python --version)"
          } | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_versions_$STAMP.txt"

      - name: Changed Python files in PR range (same as CI)
        run: |
          cd "$RUNNER_TEMP/ref"
          git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py' | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_files_$STAMP.txt"

      - name: Replicate CI pre-commit run (full hook output)
        id: precommit
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/ref"
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          status=0
          pre-commit run --files $python_files --show-diff-on-failure 2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_precommit_$STAMP.log" || status=$?
          echo "precommit_exit=$status" | tee -a "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_precommit_$STAMP.log"
          exit "$status"

      - name: ruff check raw output (rule codes, lines, messages)
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/ref"
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          status=0
          ruff check --no-cache $python_files 2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_ruffcheck_$STAMP.log" || status=$?
          echo "ruff_check_exit=$status" | tee -a "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_ruffcheck_$STAMP.log"
          exit "$status"

      - name: ruff format --diff (exact reformat diff)
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/ref"
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          status=0
          ruff format --diff --no-cache $python_files 2>&1 | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_ruffformatdiff_$STAMP.log" || status=$?
          echo "ruff_format_diff_exit=$status" | tee -a "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_ruffformatdiff_$STAMP.log"
          exit "$status"

      - name: Per-hook isolation (which hook is red)
        if: always()
        run: |
          cd "$RUNNER_TEMP/ref"
          python_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- '*.py')
          {
            echo "== hook ruff-check =="
            pre-commit run ruff-check --files $python_files 2>&1 || echo "HOOK_RUFF_CHECK_FAILED"
            echo "== hook ruff-format =="
            pre-commit run ruff-format --files $python_files 2>&1 || echo "HOOK_RUFF_FORMAT_FAILED"
          } | tee "$GITHUB_WORKSPACE/$EVID/pr1063_oracle_perhook_$STAMP.log"

      - name: Write meta
        if: always()
        run: |
          E="$GITHUB_WORKSPACE/$EVID"
          {
            echo "pr=1063"
            echo "pr_head=$PR_HEAD"
            echo "pr_base=$PR_BASE"
            echo "ci_failure_run=39980441047"
            echo "ci_failure_job=120506027475"
            echo "ci_failure_step=Run Ruff/pre-commit on changed Python files"
          } > "$E/pr1063_oracle_meta_$STAMP.txt"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-evidence/logs
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "diag: PR 1063 pre-commit ruff oracle evidence (2026-10-23) [ci skip]"
            (git push || (git pull --rebase && git push))
          fi
