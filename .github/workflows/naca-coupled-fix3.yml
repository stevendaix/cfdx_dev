name: NACA0012 COUPLED crawl-vs-plateau discrimination (fix3)

# DIAG (temporary branch, never merged): third COUPLED round. The fix2 audit
# PROVED the assembled operator identity (rc_flux_identity_linf at floating-
# point round-off, rc_nonpositive_sa_faces=0), yet the COUPLED fixed point
# still stalls: momentum residual ~1e-7 (one decade above the 1e-8 gate)
# while continuity and field changes are tiny, and the default stagnation
# detector (window 10, 0.1% relative improvement) cuts the run at ~74
# iterations. Two non-exclusive explanations remain:
#   * CRAWL: the fixed point converges but too slowly for the detector. The
#     deferred non-orthogonal pressure flux lags one iteration behind the
#     pressure; on skewed farfield faces it can dominate the orthogonal
#     2-point term, which caps the contraction rate of those modes.
#   * PLATEAU: a genuine inconsistency freezes the residual.
# fix3 discriminates WITHOUT touching any qualification gate:
#   * --stagwindow N overrides ONLY the detector window length (never a
#     tolerance): a crawl then runs to max_iterations (8000) and either
#     converges or freezes at the plateau level.
#   * --sweeps N adds N in-iteration coupled re-solves refreshing ONLY the
#     deferred non-orthogonal term (and its matching undo gradient) at the
#     latest pressure; convection lag and Picard relaxation are untouched.
#     If the crawl is deferred-term lagged, the sweeps collapse it.
#   * New per-assembly instrumentation in COUPLED_MATRIX_SUMMARY:
#     rc_min_sa_over_area (most skewed internal face, Sa/|Sf|) and
#     rc_nonorth_dominance_max (max fraction of the pressure flux carried
#     by the deferred term, evaluated on p_old).
# Matrix (n64 only): baseline-crawl (0.6/0.25, window 5000), undamped-crawl
# (1.0/1.0, window 5000), baseline-sweeps2 (0.6/0.25, sweeps 2, default
# window), baseline-default (pure repro of fix2: expected STAGNATED ~74, the
# strict gate fails that job BY DESIGN as the behavioural anchor), SIMPLE
# anchor control. Gates unchanged.

on:
  workflow_dispatch:
  push:
    branches: [diag/naca-coupled-fix3]

permissions:
  contents: write

jobs:
  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: coupled-baseline-crawl,  model: COUPLED_BLOCKLOCAL, au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "1", stag: "5000", sweeps: "0" }
          - { name: coupled-undamped-crawl,  model: COUPLED_BLOCKLOCAL, au: "1.0", ap: "1.0",  levels: "1", trace: "5", cd: "1", stag: "5000", sweeps: "0" }
          - { name: coupled-baseline-sweeps2, model: COUPLED_BLOCKLOCAL, au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "1", stag: "0", sweeps: "2" }
          - { name: coupled-baseline-default, model: COUPLED_BLOCKLOCAL, au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "1", stag: "0", sweeps: "0" }
          - { name: simple-anchor-control,    model: SIMPLE,             au: "0.6", ap: "0.25", levels: "1", trace: "5", cd: "0", stag: "0", sweeps: "0" }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev python3 python3-venv

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-naca
          .venv-naca/bin/python -m pip install --upgrade pip
          .venv-naca/bin/python -m pip install h5py meshio pytest numpy matplotlib pydantic gmsh

      - name: Generate NACA0012 O-grid meshes (n64/n128/n256)
        run: |
          mkdir -p build-naca/validation_meshes
          .venv-naca/bin/python scripts/generate_2d_validation_meshes.py naca0012 \
            --output-dir build-naca/validation_meshes

      - name: Configure (Release, long validation ON)
        run: |
          cmake -S . -B build-naca -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON \
            -DPython3_EXECUTABLE="$PWD/.venv-naca/bin/python"

      - name: Build test_naca0012_qualification
        run: cmake --build build-naca --target test_naca0012_qualification --parallel 2

      - name: Run variant ${{ matrix.name }}
        run: |
          set -o pipefail
          ./build-naca/test_naca0012_qualification \
            --model ${{ matrix.model }} \
            --alphau ${{ matrix.au }} \
            --alphap ${{ matrix.ap }} \
            --levels ${{ matrix.levels }} \
            --trace ${{ matrix.trace }} \
            --coupleddiag ${{ matrix.cd }} \
            --stagwindow ${{ matrix.stag }} \
            --sweeps ${{ matrix.sweeps }} \
            build-naca/validation_meshes/naca0012_laminar_n64.h5 \
            build-naca/validation_meshes/naca0012_laminar_n128.h5 \
            build-naca/validation_meshes/naca0012_laminar_n256.h5 \
            2>&1 | tee naca-variant-${{ matrix.name }}.log

      - name: Enforce convergence gates
        if: success()
        env:
          EXPECTED_LEVELS: ${{ matrix.levels }}
          VARIANT_LOG: naca-variant-${{ matrix.name }}.log
        run: |
          set -euo pipefail
          awk -v expected="$EXPECTED_LEVELS" '
            /NACA_DIAG status=/ {
              count++
              if ($0 !~ /NACA_DIAG status=CONVERGED converged=1/) {
                print "NUMERICAL_GATE_FAIL: " $0 > "/dev/stderr"
                bad=1
              }
            }
            END {
              if (count != expected) {
                printf "NUMERICAL_GATE_FAIL: expected %d level verdicts, found %d\n", expected, count > "/dev/stderr"
                bad=1
              }
              exit bad
            }
          ' "$VARIANT_LOG"

      - name: Upload variant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naca-variant-logs-${{ matrix.name }}
          path: naca-variant-${{ matrix.name }}.log
          if-no-files-found: warn

  aggregate:
    name: Aggregate and commit combined log
    needs: [variant]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all variant logs
        uses: actions/download-artifact@v4
        with:
          path: variant-logs
          pattern: naca-variant-logs-*
          merge-multiple: true

      - name: Assemble combined log
        run: |
          : > naca-coupled-fix3-output.log
          for v in coupled-baseline-crawl coupled-undamped-crawl coupled-baseline-sweeps2 coupled-baseline-default simple-anchor-control; do
            if [ -f "variant-logs/naca-variant-$v.log" ]; then
              echo "NACA_VARIANT_BEGIN $v" >> naca-coupled-fix3-output.log
              cat "variant-logs/naca-variant-$v.log" >> naca-coupled-fix3-output.log
              echo "NACA_VARIANT_END $v" >> naca-coupled-fix3-output.log
            else
              echo "NACA_VARIANT_MISSING variant=$v" >> naca-coupled-fix3-output.log
            fi
          done
          echo "AGGREGATE_SECTIONS=$(grep -c 'NACA_VARIANT_BEGIN' naca-coupled-fix3-output.log)/5" >> naca-coupled-fix3-output.log

      - name: Commit combined log to diagnostic branch (fail loudly)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naca-coupled-fix3-output.log
          if git diff --cached --quiet; then
            echo "AGGREGATE_ERROR: nothing staged to commit" >&2
            exit 1
          fi
          git commit -m "diag(naca0012): capture COUPLED fix3 matrix log [skip ci]"
          git pull --rebase --autostash
          git push
          git show HEAD:naca-coupled-fix3-output.log > /dev/null
          echo "AGGREGATE_OK: log committed on $(git rev-parse HEAD)"
