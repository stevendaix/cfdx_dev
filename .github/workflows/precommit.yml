name: Pre-commit Fast Guards

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff
        run: python -m pip install --upgrade pre-commit ruff

      - name: Run Ruff/pre-commit on changed Python files
        shell: bash
        run: |
          set -uo pipefail

          status=0
          mapfile -t python_files < <(
            git diff --name-only "$CFDX_PRECOMMIT_RANGE" -- '*.py'
          )

          if ((${#python_files[@]} > 0)); then
            pre-commit run --files "${python_files[@]}" --show-diff-on-failure || status=$?
          else
            echo "No changed Python files in $CFDX_PRECOMMIT_RANGE; skipping Python hooks."
          fi

          exit "$status"
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}

      - name: Ruff diagnostics (annotate exact lint/format findings)
        if: failure()
        run: |
          mapfile -t changed_py < <(git diff --name-only "$CFDX_PRECOMMIT_RANGE" -- '*.py')
          for f in scripts/check_audit_gate.py scripts/n9_physical_campaign.py scripts/validation_report.py "${changed_py[@]}"; do
            [ -f "$f" ] || continue
            chk=$(ruff check --output-format concise "$f" 2>&1 | grep -v "All checks passed" || true)
            if [ -n "$chk" ]; then
              for i in 0 1 2 3 4 5; do
                chunk=$(printf '%s' "$chk" | cut -c $((i * 4500 + 1))-$((i * 4500 + 4500)))
                if [ -n "$chunk" ]; then
                  echo "::error title=ruff check ${f} (part $((i + 1)))::$(printf '%s' "$chunk" | tr '\n' '|')"
                fi
              done
            fi
            fmt=$(ruff format --diff "$f" 2>&1 | grep -v "already formatted" || true)
            if [ -n "$fmt" ]; then
              for i in 0 1 2 3; do
                chunk=$(printf '%s' "$fmt" | cut -c $((i * 4500 + 1))-$((i * 4500 + 4500)))
                if [ -n "$chunk" ]; then
                  echo "::error title=ruff format ${f} (part $((i + 1)))::$(printf '%s' "$chunk" | tr '\n' '|')"
                fi
              done
            fi
          done
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}

      - name: Run CFDX fast build/test guard
        shell: bash
        run: |
          set +e
          pre-commit run cfdx-fast --all-files > "$GITHUB_WORKSPACE/guard.log" 2>&1
          status=$?
          cat "$GITHUB_WORKSPACE/guard.log"
          exit $status
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}

      - name: Guard diagnostics (annotate guard log tail)
        if: failure()
        run: |
          log="$GITHUB_WORKSPACE/guard.log"
          [ -f "$log" ] || exit 0
          tail -c 12000 "$log" > tail.log || true
          for i in 0 1 2 3; do
            chunk=$(cut -c $((i * 3000 + 1))-$((i * 3000 + 3000)) tail.log || true)
            if [ -n "$chunk" ]; then
              echo "::error title=cfdx-fast guard tail (part $((i + 1)))::$(printf '%s' "$chunk" | tr '\n' '|')"
            fi
          done
