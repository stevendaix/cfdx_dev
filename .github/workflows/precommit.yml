name: Pre-commit Fast Guards

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff
        run: python -m pip install --upgrade pre-commit ruff

      - name: Run pre-commit on changed files
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}
