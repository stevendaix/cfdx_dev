name: Pre-commit Fast Guards

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff
        run: python -m pip install --upgrade pre-commit ruff

      # One-shot formatting repair for this PR; remove after the cleanup commit.
      - name: Apply Ruff autofixes to changed PR Python files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'physics/bfs-v6-hilo-rhie-chow-production'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.py')
          if (("${#python_files[@]}" == 0)); then
            echo "No changed Python files"
            exit 0
          fi
          ruff check --fix --unsafe-fixes "${python_files[@]}" || true
          ruff format "${python_files[@]}"
          if git diff --quiet; then
            echo "No Ruff autofixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${python_files[@]}"
          git commit -m "style: apply Ruff autofixes to PR Python files"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Run Ruff/pre-commit on changed Python files
        shell: bash
        run: |
          set -uo pipefail

          status=0
          mapfile -t python_files < <(
            git diff --name-only "$CFDX_PRECOMMIT_RANGE" -- '*.py'
          )

          if ((${#python_files[@]} > 0)); then
            pre-commit run ruff-check --files "${python_files[@]}" --show-diff-on-failure || status=$?
            pre-commit run ruff-format --files "${python_files[@]}" --show-diff-on-failure || status=$?
          else
            echo "No changed Python files in $CFDX_PRECOMMIT_RANGE; skipping Python hooks."
          fi

          exit "$status"
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}

      - name: Ruff diagnostics (annotate exact lint/format findings)
        if: failure()
        run: |
          for f in scripts/check_audit_gate.py scripts/n9_physical_campaign.py scripts/validation_report.py; do
            [ -f "$f" ] || continue
            fmt=$(ruff format --diff "$f" 2>&1 | grep -v "already formatted" || true)
            if [ -n "$fmt" ]; then
              for i in 0 1 2; do
                chunk=$(printf '%s' "$fmt" | cut -c $((i * 3500 + 1))-$((i * 3500 + 3500)))
                if [ -n "$chunk" ]; then
                  echo "::error title=ruff format ${f} (part $((i + 1)))::$(printf '%s' "$chunk" | tr '\n' '|' || true)"
                fi
              done
            fi
            chk=$(ruff check "$f" 2>&1 | grep -v "All checks passed" || true)
            if [ -n "$chk" ]; then
              echo "::error title=ruff check ${f}::$(printf '%s' "$chk" | tr '\n' '|' || true)"
            fi
          done
      - name: Check CI structure and test partitioning (fast)
        run: |
          python -m pip install pyyaml
          python scripts/ci/ci_policy.py
          python -m unittest discover -s tests/python -p 'test_ctest_*.py' -v
          python -m unittest discover -s tests/python -p 'test_ci_*.py' -v

      - name: Run CFDX fast build/test guard
        run: pre-commit run cfdx-fast --all-files
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}
