name: Pre-commit Fast Guards

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and Ruff
        run: python -m pip install --upgrade pre-commit ruff

      - name: Run Ruff/pre-commit on changed Python files
        shell: bash
        run: |
          set -uo pipefail

          status=0
          mapfile -t python_files < <(
            git diff --name-only "$CFDX_PRECOMMIT_RANGE" -- '*.py'
          )

          if ((${#python_files[@]} > 0)); then
            pre-commit run --files "${python_files[@]}" --show-diff-on-failure || status=$?
          else
            echo "No changed Python files in $CFDX_PRECOMMIT_RANGE; skipping Python hooks."
          fi

          exit "$status"
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}

      - name: Ruff diagnostics (annotate exact lint/format findings)
        if: failure()
        run: |
          for f in scripts/check_audit_gate.py scripts/n9_physical_campaign.py scripts/validation_report.py; do
            [ -f "$f" ] || continue
            fmt=$(ruff format --diff "$f" 2>&1 | grep -v "already formatted" || true)
            if [ -n "$fmt" ]; then
              for i in 0 1 2; do
                chunk=$(printf '%s' "$fmt" | cut -c $((i * 3500 + 1))-$((i * 3500 + 3500)))
                if [ -n "$chunk" ]; then
                  echo "::error title=ruff format ${f} (part $((i + 1)))::$(printf '%s' "$chunk" | tr '\n' '|' || true)"
                fi
              done
            fi
            chk=$(ruff check "$f" 2>&1 | grep -v "All checks passed" || true)
            if [ -n "$chk" ]; then
              echo "::error title=ruff check ${f}::$(printf '%s' "$chk" | tr '\n' '|' || true)"
            fi
          done
      - name: Run CFDX fast build/test guard
        run: pre-commit run cfdx-fast --all-files
        env:
          CFDX_PRECOMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}
