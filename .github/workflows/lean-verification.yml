name: Lean 4 Mathematical Verification

on:
  pull_request:
    paths:
      - "formal/lean/**"
      - "scripts/check_lean_placeholders.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches:
      - master
    paths:
      - "formal/lean/**"
      - "scripts/check_lean_placeholders.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean 4 / Mathlib
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formal/lean

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        run: lean --version

      - name: Restore Lake cache
        uses: actions/cache@v4
        with:
          path: formal/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean') }}-

      - name: Resolve pinned dependencies
        run: lake update

      - name: Restore Mathlib compiled cache
        run: lake exe cache get

      - name: Build all Lean modules
        run: lake build

      - name: Reject unproved placeholders and local axioms
        working-directory: .
        run: python3 scripts/check_lean_placeholders.py
