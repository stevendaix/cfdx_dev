name: Lean 4 Mathematical Verification

on:
  pull_request:
    paths:
      - "formal/lean/**"
      - "scripts/check_lean_placeholders.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches:
      - master
    paths:
      - "formal/lean/**"
      - "scripts/check_lean_placeholders.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    name: Lean 4 / Mathlib build
    runs-on: ubuntu-latest
    container:
      image: leanprover/lean4:v4.19.0
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formal/lean

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Lake build cache
        uses: actions/cache@v4
        with:
          path: formal/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean') }}-

      - name: Resolve pinned dependencies
        run: lake update

      - name: Restore Mathlib compiled cache
        run: lake exe cache get

      - name: Build all Lean modules
        run: lake build

  proof-policy:
    name: Lean proof policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check proof placeholders and local axioms
        run: python3 scripts/check_lean_placeholders.py
