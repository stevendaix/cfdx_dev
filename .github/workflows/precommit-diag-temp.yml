name: Pre-commit diagnostics (temp)

on:
  push:
    branches:
      - ci/thermohydraulic-independent-benchmarks

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pre-commit and Ruff
        run: python -m pip install --upgrade pre-commit ruff
      - name: Replay the exact pre-commit command
        run: |
          E="diag-evidence/precommit"
          mkdir -p "$E"
          BASE=$(git merge-base origin/master HEAD)
          echo "$BASE" > "$E/base.txt"
          git diff --name-only "$BASE"...HEAD -- "*.py" > "$E/py_files.txt"
          mapfile -t python_files < "$E/py_files.txt"
          pre-commit run --files "${python_files[@]}" --show-diff-on-failure > "$E/precommit_run.txt" 2>&1 || true
          pre-commit --version >> "$E/precommit_run.txt" 2>&1 || true
          ruff --version >> "$E/precommit_run.txt" 2>&1 || true
      - name: Commit diagnostics evidence
        run: |
          E="diag-evidence/precommit"
          git config user.name "cfdx-diag-bot"
          git config user.email "actions@github.com"
          git add "$E" || true
          if git diff --cached --quiet; then
            echo "no evidence to commit"
          else
            git commit -m "diag(precommit): exact run evidence [ci skip]"
            git push
          fi
