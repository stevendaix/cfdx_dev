name: N9 negative diagnostics trace

# Diagnostic-only workflow (pattern #894/#901): runs on the never-merged
# branch ci/long-campaign-diagnostics. Purpose (#913): capture the full
# N9_7_ITEM10 iteration trace that the auth-gated CI logs do not expose, so
# the stagnation threshold semantics of #906 can be calibrated on measured
# data. Evidence is committed to diag-evidence/n9-item10/ (the push carries
# [ci skip]) and posted to issue #913 best effort.

on:
  push:
    branches:
      - ci/long-campaign-diagnostics
    paths:
      - '.github/workflows/n9-negative-trace.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: n9-negative-trace
  cancel-in-progress: true

env:
  BUILD_DIR: build-n9-trace

jobs:
  n9-trace:
    name: Capture test_n9_negative_diagnostics item-10 trace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libhdf5-openmpi-dev libopenmpi-dev

      - name: Configure trace build
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCFDX_BUILD_TESTS=ON \
            -DCFDX_ENABLE_LONG_VALIDATION=ON \
            -DCFDX_ENABLE_MPI=ON \
            -DCFDX_BUILD_PYTHON=OFF \
            -DCFDX_USE_HDF5_SERIAL=OFF \
            -DCFDX_ENABLE_PARALLEL_HDF5=ON

      - name: Build the negative-diagnostics target
        run: |
          cmake --build "$BUILD_DIR" --target test_n9_negative_diagnostics --parallel 2

      - name: Run and capture the full trace
        continue-on-error: true
        shell: bash
        run: |
          ctest --test-dir "$BUILD_DIR" -R 'n9_negative_diagnostics' -V \
            > /tmp/n9-negative-trace.log 2>&1 || true
          echo "ctest finished; log size: $(wc -c < /tmp/n9-negative-trace.log)"
          cat /tmp/n9-negative-trace.log

      - name: Commit trace evidence to the diagnostic branch
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diag-evidence/n9-item10
          cp /tmp/n9-negative-trace.log "diag-evidence/n9-item10/run-$GITHUB_RUN_ID.log" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-evidence 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no evidence change to commit"
          else
            git commit -m "diag(evidence): N9 item10 trace run $GITHUB_RUN_ID (#913) [ci skip]"
            git push origin "HEAD:$GITHUB_REF_NAME" 2>&1 || echo "::warning::evidence push failed"
          fi
          exit 0

      - name: Upload trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n9-item10-trace
          path: /tmp/n9-negative-trace.log
          if-no-files-found: warn
          retention-days: 30

      - name: Post trace to issue #913 (best effort)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          {
            echo "## Trace N9 item 10 — run $GITHUB_RUN_ID"
            echo
            echo "HEAD diagnostic : $GITHUB_SHA"
            echo "Preuve complete : diag-evidence/n9-item10/run-$GITHUB_RUN_ID.log sur la branche ci/long-campaign-diagnostics + artefact n9-item10-trace"
            echo
            echo '~~~'
            grep -E 'N9_7_ITEM|tests passed|Failed|Passed' /tmp/n9-negative-trace.log 2>/dev/null | head -n 120 || true
            echo '~~~'
          } > /tmp/comment.md 2>/dev/null || true
          if [ ! -s /tmp/comment.md ]; then echo "(trace vide)" > /tmp/comment.md; fi
          jq -n --rawfile body /tmp/comment.md '{body: $body}' > /tmp/payload.json 2>/dev/null || true
          http=$(curl -sS --fail-with-body -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/913/comments" \
            -d @/tmp/payload.json) || http=failed
          echo "POST to #913: $http"
          exit 0