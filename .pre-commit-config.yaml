repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      - id: cfdx-fast
        name: CFDX fast build/test guards
        entry: python3 tools/precommit/cfdx_precommit.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
