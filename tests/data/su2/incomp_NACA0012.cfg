%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file
% Case description: 2D NACA 0012 Airfoil Validation Case (incompressible)
% Source: SU2 official incompressible NACA0012 tutorial
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= INC_RANS
KIND_TURB_MODEL= SA
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% Incompressible free-stream definition
INC_DENSITY_INIT= 2.13163
INC_VELOCITY_INIT= ( 51.36481493540834, 9.0570027322096198, 0.0 )
INC_NONDIM= INITIAL_VALUES
INC_DENSITY_REF= 1.0
INC_VELOCITY_REF= 1.0

% Constant viscosity
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.853e-05

REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 1.0

MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 25.0
CFL_ADAPT= NO
ITER= 99999

CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
