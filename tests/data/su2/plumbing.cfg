%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration for the unified-converter plumbing tests.
%
% This is NOT a validation case. It exists so tests/python/test_converter.py
% can exercise solver detection, the adapter entry point and HDF5
% normalisation on a case CFDX can represent exactly: every numerics setting
% below has a counterpart in the CFDX numerical registry
% (numerics.gradient.gauss, numerics.convection.tvd.vanalbada,
% linear.fgmres), so no blocking conversion gap is produced.
%
% The real SU2 cases are deliberately kept out of this path: inv_NACA0012_basic.cfg
% uses the JST centre-based reconstruction, which has no faithful CFDX
% convection registry key and must stay a blocking conversion gap.
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

MATH_PROBLEM= DIRECT

% Convection: Roe flux with a Van Albada limited MUSCL reconstruction, which is
% the CFDX numerics.convection.tvd.vanalbada key verbatim.
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
MUSCL_LIMITER= VAN_ALBADA

% Gradient: cell-based Green-Gauss.
NUM_METHOD_GRAD= GREEN_GAUSS

% Boundary markers matching mesh_NACA0012_inv.su2.
MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_ITER= 2

CFL_NUMBER= 10.0
ITER= 1000
