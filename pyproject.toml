[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdx"
version = "0.7.0"
description = "Python orchestration interface for the CFDX CFD framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "pyqtgraph>=0.13",
]

[project.scripts]
cfdx-gui = "cfdx.gui:launch"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
